h(x+dx,y+dy)) return;\n    if(dx===0&&dy===-1) ctx.fillRect(sx+7,sy,10,8);\n    if(dx===1&&dy===0)  ctx.fillRect(sx+16,sy+7,8,10);\n    if(dx===0&&dy===1)  ctx.fillRect(sx+7,sy+16,10,8);\n    if(dx===-1&&dy===0) ctx.fillRect(sx,sy+7,8,10);\n  });\n  ctx.fillStyle=EDGE;\n  arms.forEach(([dx,dy])=>{\n    if(roadish(x+dx,y+dy)) return;\n    if(dx===0&&dy===-1) ctx.fillRect(sx+7,sy+7,10,1);\n    if(dx===1&&dy===0)  ctx.fillRect(sx+16,sy+7,1,10);\n    if(dx===0&&dy===1)  ctx.fillRect(sx+7,sy+16,10,1);\n    if(dx===-1&&dy===0) ctx.fillRect(sx+7,sy+7,1,10);\n  });\n}\nfunction drawGroup(sx,sy,g){\n  const n=groupCount(g), pid=gPid(g), sel=S.selGroup===g.id||(S.multi||[]).includes(g.id);\n  const dom=Object.keys(g.units).sort((p,q)=>g.units[q]-g.units[p])[0];\n  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(sx+T/2+1,sy+T/2+1,10,0,7); ctx.fill();\n  ctx.fillStyle='#1d1812'; ctx.beginPath(); ctx.arc(sx+T/2,sy+T/2,10,0,7); ctx.fill();\n  ctx.strokeStyle=pcolor(pid); ctx.lineWidth=3; ctx.stroke();\n  if(sel){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(sx+T/2,sy+T/2,13,0,7); ctx.stroke(); }\n  if(dom) drawIcon(ctx,UNITS[dom].icon,'#f4ecd0',sx+T/2-6,sy+T/2-6,1.5);\n  ctx.font='bold 9px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';\n  ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeText(String(n),sx+T-1,sy+T-1);\n  ctx.fillStyle='#ffffff'; ctx.fillText(String(n),sx+T-1,sy+T-1);\n  const mx=groupHpMax(g), hp=g.hp==null?mx:g.hp;\n  if(hp<mx){ const f=Math.max(0,hp/mx); ctx.fillStyle='#000'; ctx.fillRect(sx+3,sy+T-4,T-6,3); ctx.fillStyle=f>0.5?'#5fbf4a':f>0.25?'#e0b84a':'#d24a3a'; ctx.fillRect(sx+3,sy+T-4,(T-6)*f,3); }\n  ctx.textAlign='start';\n}\nfunction drawTile(x,y){\n  const tile=S.grid[y][x], sx=x*T-cam.x, sy=y*T-cam.y;\n  if(!seen(x,y)){ ctx.fillStyle='#000'; ctx.fillRect(sx,sy,T,T); return; }\n  ctx.fillStyle=TILE_BASE[tile.t]; ctx.fillRect(sx,sy,T,T);\n  const tp=TERR?TERR[y*N+x]:0;\n  if(tp){\n    ctx.globalAlpha=0.16; ctx.fillStyle=pcolor(tp-1); ctx.fillRect(sx,sy,T,T); ctx.globalAlpha=1;\n    const own=(X,Y)=>(X<0||Y<0||X>=N||Y>=N)?0:TERR[Y*N+X];\n    ctx.fillStyle=pcolor(tp-1);\n    if(own(x,y-1)!==tp) ctx.fillRect(sx,sy,T,2);\n    if(own(x,y+1)!==tp) ctx.fillRect(sx,sy+T-2,T,2);\n    if(own(x-1,y)!==tp) ctx.fillRect(sx,sy,2,T);\n    if(own(x+1,y)!==tp) ctx.fillRect(sx+T-2,sy,2,T);\n  }\n  if(VALIDB && VALIDB[y*N+x]){ ctx.fillStyle='rgba(120,230,120,.22)'; ctx.fillRect(sx,sy,T,T); }\n  const r=h2(x,y);\n  if(tile.t==='planicie'&&r>0.6){ ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(sx+4,sy+6,3,3); }\n  if(tile.t==='floresta'){ ctx.fillStyle='#1d3d1c'; ctx.beginPath(); ctx.arc(sx+8,sy+9,5,0,7); ctx.arc(sx+16,sy+15,5,0,7); ctx.fill(); }\n  if(tile.t==='fruta'){ ctx.fillStyle='#d24a3a'; ctx.fillRect(sx+6,sy+7,3,3); ctx.fillRect(sx+14,sy+14,3,3); ctx.fillRect(sx+12,sy+6,2,2); }\n  if(tile.t==='animais'){ ctx.fillStyle='#4a3a1a'; ctx.fillRect(sx+7,sy+8,4,3); ctx.fillRect(sx+15,sy+14,3,2); }\n  if(tile.t==='pedra'){ ctx.fillStyle='#8a8e94'; ctx.fillRect(sx+4,sy+5,8,6); ctx.fillStyle='#4a4d52'; ctx.fillRect(sx+4,sy+11,8,2); }\n  if(tile.t==='minerio'){ ctx.fillStyle='#d8843a'; ctx.fillRect(sx+6,sy+7,3,3); ctx.fillRect(sx+14,sy+13,3,3); }\n  if(tile.t==='carvao'){ ctx.fillStyle='#111'; ctx.fillRect(sx+6,sy+7,4,3); ctx.fillRect(sx+14,sy+13,4,3); }\n  if(tile.t==='petroleo'){ ctx.fillStyle='#0a0a0a'; ctx.fillRect(sx+5,sy+6,6,4); ctx.fillRect(sx+13,sy+14,5,3); ctx.fillStyle='#5a5048'; ctx.fillRect(sx+6,sy+7,2,1); }\n  if(tile.t==='rio'){ ctx.fillStyle='#5a9ad8'; ctx.fillRect(sx+4,sy+8,16,2); ctx.fillRect(sx+2,sy+16,18,2); }\n  if(tile.b){\n    const b=tile.b, d=DEF[b.type]||{col:'#c9a24a',icon:'fire'}, pid=b.pid||0;\n    if(b.type==='ruina'){ ctx.fillStyle='#0b0b0b'; ctx.fillRect(sx+1,sy+1,T-2,T-2); ctx.fillStyle='#3a3a3a'; ctx.fillRect(sx+5,sy+6,4,3); ctx.fillRect(sx+13,sy+13,5,3); return; }\n    if(b.type==='obra'){ drawObra(sx,sy,b); }\n    else if(b.type==='estrada'){ drawRoad(sx,sy,x,y); const L=b.level||1; if(L>=2){ ctx.fillStyle='#3a3228'; ctx.fillRect(sx+10,sy+10,4,4); } if(L>=3){ ctx.fillRect(sx+4,sy+4,3,3); ctx.fillRect(sx+17,sy+17,3,3); } }\n    else {\n      let col;\n      if(b.type==='base') col=pcolor(pid);\n      else if(b.type==='casa') col=['','#b5493a','#c97a4a','#d8c8a0','#a8b8c8'][b.stage||1];\n      else col=d.col;\n      ctx.fillStyle=pcolor(pid); ctx.fillRect(sx+1,sy+1,T-2,T-2);\n      ctx.fillStyle=col; ctx.fillRect(sx+3,sy+3,T-6,T-6);\n      drawIcon(ctx,b.type==='base'?'fire':d.icon,'#ffffff',sx+(T-16)/2,sy+(T-16)/2,2);\n      if(b.level>1){ ctx.fillStyle='#ffd84a'; ctx.fillRect(sx+T-8,sy+2,6,6); }\n      if(b.type==='base'){\n        const c=cityById(b.cid);\n        if(c){\n          const label=c.name.slice(0,14)+' · '+(c.adults+c.children);\n          ctx.font='bold 10px Georgia,serif'; const bw=Math.max(T+40,ctx.measureText(label).width+22), bx=sx+T/2-bw/2, by=sy-19;\n          ctx.fillStyle='#2a1d12'; ctx.fillRect(bx,by,bw,15);\n          ctx.strokeStyle='#d4a84a'; ctx.lineWidth=1; ctx.strokeRect(bx+.5,by+.5,bw-1,14);\n          ctx.fillStyle=pcolor(pid); ctx.fillRect(bx+1,by+1,7,13);\n          ctx.fillStyle='#f3e6c4'; ctx.textAlign='left'; ctx.fillText(label,bx+12,by+11);\n          ctx.fillStyle='#d4a84a'; ctx.fillRect(sx+T/2-1,by+15,2,4); ctx.textAlign='start';\n        }\n        if(c&&c.capital){ ctx.fillStyle='#ffd84a'; ctx.font='bold 11px sans-serif'; ctx.fillText('★',sx+2,sy+11); }\n      }\n      if(pid===0 && b.type!=='base' && !isConn(x,y)){ ctx.fillStyle='#ff9a3a'; ctx.fillRect(sx+2,sy+T-6,4,4); }\n      if(pid===0 && d.elec && power.ratio<1){ ctx.fillStyle='#ff6b6b'; ctx.fillRect(sx+2,sy+2,4,4); }\n    }\n  }\n  const g=groupAt(x,y);\n  if(g) drawGroup(sx,sy,g);\n}\nfunction drawHpBar(x,y){\n  const t=S.grid[y][x], b=t.b; if(!b||b.type==='ruina'||b.hp==null||!seen(x,y)) return;\n  const mx=bMaxHp(b); if(b.hp>=mx) return;\n  const f=Math.max(0,b.hp/mx), sx=x*T-cam.x, sy=y*T-cam.y;\n  ctx.fillSt document.getElementById('grid').innerHTML=''; return; }\n  const tabs=document.getElementById('tabs'); tabs.innerHTML='';\n  for(const t of TABS){\n    if(t.era && maxLevel()<t.era) continue;\n    const btn=document.createElement('button');\n    btn.className='tab'+(S.tab===t.id?' on':'');\n    btn.appendChild(iconCanvas(t.icon,S.tab===t.id?'#ffffff':'#d8c28a',3));\n    btn.append(t.n);\n    btn.onclick=()=>{ S.tab=t.id; renderAll(); };\n    tabs.appendChild(btn);\n  }\n  const grid=document.getElementById('grid'); grid.innerHTML='';\n  if(S.tab==='urbano'){\n    const cur=S.cities.find(x=>x.id===S.curCity)||capital();\n    const sel=document.createElement('div'); sel.id='infotxt';\n    sel.innerHTML=`Cidade para casas e construções: `;\n    S.cities.forEach(c=>{\n      const bt=document.createElement('button'); bt.className='cbtn inl'+(c.id===cur.id?' on':'');\n      bt.textContent=c.name; bt.onclick=()=>act(()=>{ S.curCity=c.id; });\n      sel.appendChild(bt);\n    });\n    grid.appendChild(sel);\n    const b=document.createElement('div');\n    b.className='ic'+(canPay(DEF.casa.c)?'':' dis');\n    b.appendChild(iconCanvas('house',DEF.casa.col,4)); b.append('Casa');\n    const c=document.createElement('div'); c.className='cst'; c.textContent=costStr(DEF.casa.c); b.appendChild(c);\n    b.onclick=()=>{ buildHouse(); renderAll(); };\n    grid.appendChild(b);\n  }\n  if(S.tab==='cultura' && maxLevel()>=3){\n    const mk=(id,label,icon,col)=>{\n      const b=document.createElement('div');\n      b.className='ic'+(S.religion===id?' on':(S.religion?' dis':''));\n      b.appendChild(iconCanvas(icon,col,4)); b.append(label);\n      b.onclick=()=>{ if(!S.religion){ chooseReligion(id); renderAll(); } };\n      return b;\n    };\n    grid.appendChild(mk('sec','Secularismo Racional','book','#5f9ad0'));\n    grid.appendChild(mk('fund','Fundamentalismo Ideológico','temple','#e8d8a0'));\n  }\n  if(S.tab==='militar'){\n    const info=document.createElement('div'); info.id='infotxt' (info);\n  }\n}\n\nfunction cbtn(label,onclick,extra,disabled){\n  return `<button class=\"cbtn ${extra||''}\" ${disabled?'disabled':''} onclick=\"act(()=>{${onclick}})\">${label}<\/button>`;\n}\nfunction act(fn){ fn(); cardDirty=true; mgmtDirty=true; dipDirty=true; evDirty=true; renderAll(); }\nfunction openMgmt(cid){ S.mgmt=cid; S.sel=null; S.dip=false; S.evp=false; S.renaming=false; mgmtDirty=true; renderAll(); }\n\nfunction upgradeRoad(x,y){\n  const b=S.grid[y][x].b; if(!b||b.type!=='estrada') return;\n  const L=b.level||1; if(L>=3){ log('Estrada já está no nível máximo.'); return; }\n  const cost={asfalto:5*L};\n  if(!canPay(cost)){ log('Asfalto insuficiente.'); return; }\n  pay(cost); b.level=L+1;\n  fxAdd(x,y,'Asfaltada','#ffd84a',true);\n  log('Estrada asfaltada para o Nível '+(L+1)+'.');\n  invalidate(); computeNetwork();\n}\nfunction unitsInfoHtml(type){\n  const ks=type==='academia'?Object.keys(UNITS).filter(k=>UNITS[k].acad>=2):Object.keys(UNITS).filter(k=>(UNITS[k].req||'quartel')===type);\n  if(!ks.length) return '';\n  return `<div class=\"ptitle2\">Unidades que libera<\/div>`+ks.map(k=>{\n    const u=UNITS[k], need=[];\n    if(u.acad>1) need.push('Academia Nv '+u.acad);\n    if(u.req && u.req!==type) need.push(DEF[u.req].n);\n    return `<div class=\"frow\"><span class=\"udot\" style=\"background:${u.col}\"><\/span><span class=\"flbl\"><b>${u.n}<\/b> · ATQ ${u.atk} · DEF ${u.def||0} · espaço ${u.space}<\/span><span class=\"ustat\">${need.join(', ')||'pronta'}<\/span><\/div>`;\n  }).join('');\n}\nfunction renderCard(){\n  const card=document.getElementById('card');\n  if(!S || screen!=='game' || modal){ card.style.display='none'; return; }\n  if(!cardDirty && cardHover && card.style.display!=='none') return;\n  cardDirty=false;\n  if(!S.sel){ card.style.display='none'; return; }\n  const {x,y}=S.sel, b=S.grid[y][x].b, g=groupAt(x,y);\n  card.className=g?'unit':'';\n  if(g){\n    const owner=gPid(g), mine=owner===0, mv=S.moveMode&&S.selGroup===g.id;\n    const mx=groupHpMax(g), hp=Math.round(g.hp==null?mx:g.hp);\n    const rows=Object.keys(g.units).map(t=>{const u=UNITS[t];\n      return `<div class=\"urow\"><span class=\"udot\" style=\"background:${u.col}\"><\/span><b>${u.n}<\/b> x${g.units[t]}<div class=\"ustat\">ATQ ${u.atk} · DEF ${u.def||0}${BLD_DMG[t]?' · contra prédios '+BLD_DMG[t]:''} · espaço ${u.space}<\/div><\/div>`;}).join('');\n    const dom0=Object.keys(g.units).sort((p,q)=>g.units[q]-g.units[p])[0];\n    let html=`<h4>${iconImg(UNITS[dom0].icon,UNITS[dom0].col)} ${mine?'Seu grupo':'Grupo de '+pname(owner)}<\/h4>${rows}\n      <div class=\"ulbl\">Espaço ${groupSpace(g)} / ${GROUP_MAX}<\/div><div class=\"ubar\"><i style=\"width:${Math.min(100,groupSpace(g)/GROUP_MAX*100)}%\"><\/i><\/div>\n      <div class=\"ulbl\">Vida ${hp} / ${mx}<\/div><div class=\"ubar hp\"><i style=\"width:${Math.max(0,hp/mx*100)}%\"><\/i><\/div>\n      <div class=\"ustat\">Alcance ${moveRange(g)} tile(s) · Poder ${groupPower(g)} · Defesa ${groupDef(g)}<\/div>`;\n    if(mine){\n      html+=`<div class=\"uacts\">`+cbtn('Mover',`S.selGroup=${g.id};S.moveMode=!${mv}`,mv?'on':'')+cbtn('Agrupar',`S.selGroup=${g.id};S.moveMode=false`,(S.selGroup===g.id&&!mv)?'on':'')+`<\/div>`;\n      if(mv) html+=`<div class=\"ustat\">Clique num tile para andar. Estradas e alvos inimigos valem.<\/div>`;\n      const alvos=[];\n      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){\n        const tx=g.x+dx, ty=g.y+dy;\n        if((dx||dy)&&tx>=0&&ty>=0&&tx<N&&ty<N&&dist(g.x,g.y,tx,ty)===1){\n          const en=enemyAt(tx,ty); if(en){\n            const nome=en.kind==='bld'?(DEF[S.grid[ty][tx].b.type]?DEF[S.grid[ty][tx].b.type].n:'Construção'):'Grupo';\n            alvos.push(cbtn('Atacar '+nome.toLowerCase()+' ('+pname(en.pid)+')',`S.selGroup=${g.id};moveSelected(${tx},${ty})`,'sec2'));\n          }\n        }\n      }\n      if(alvos.length) html+=`<div class=\"uacts\">${alvos.join('')}<\/div>`;\n    } else {\n      html+=`<div class=\"uwar\">${relGet(0,owner).war?'Em guerra com você':'Não é um grupo seu'}<\/div>`;\n    }\n    card.innerHTML=html; card.style.display='block'; positionCard(); return;\n  }\n  if(!b){ card.style.display='none'; S.sel=null; return; }\n  if(b.type==='obra'){\n    const pr=Math.round(Math.min(1,(b.prog||0)/(b.need||1))*100);\n    card.innerHTML=`<h4>Em construção: ${DEF[b.of]?DEF[b.of].n:'?'}<\/h4>Turno ${b.prog||0} de ${b.need} (${pr}%)<div class=\"ubar\"><i style=\"width:${pr}%\"><\/i><\/div>`+cbtn('Cancelar obra (devolve metade)',`cancelObra(${x},${y})`,'sec2');\n    card.style.display='block'; positionCard(); return;\n  }\n  const pid=b.pid||0;\n  const d=DEF[b.type];\n  let html='';\n  if(b.type==='ruina'){\n    const od=DEF[b.orig];\n    html=`<h4>Ruína<\/h4>${od?od.n:(b.orig==='base'?'Capital':'Construção')} destruída.<br>`;\n    if(b.orig!=='base' && od && (b.pid||0)===0){ const c2={}; for(const k in od.c) c2[k]=od.c[k]*2; html+=cbtn(`Reconstruir (${costStr(c2)})`,`reconstruir(${x},${y})`); }\n    else if((b.pid||0)!==0) html+=`<div style=\"color:#666\">Ruína de ${pname(b.pid)}.<\/div>`;\n    card.innerHTML=html; card.style.display='block'; positionCard(); return;\n  }\n  if(pid!==0 && b.type==='base'){\n    const c=cityById(b.cid);\n    const r=relGet(0,pid);\n    const st=r.war?'<span style=\"color:#a0401a\">em guerra<\/span>':r.pacto?'<span style=\"color:#2a6a2a\">em paz (pacto)<\/span>':'<span>sem acordo<\/span>';\n    html=`<h4>${c.name}<\/h4>${pname(pid)} · ${st}<br>Nível ${c.level}<br>Confiança ${Math.round(r.conf)}<br>`;\n    if(r.war && S.selGroup!=null){\n      html+=cbtn(`Atacar com o grupo selecionado (poder ${Math.round(groupPower(groupById(S.selGroup)))} vs defesa ${Math.round(defensePower(c))})`,`attackWithSelected(${c.id})`,'sec2');\n    } else if(r.war) html+=`<div style=\"color:#666\">Encoste um grupo seu nesta cidade para atacar.<\/div>`;\n  } else if(pid!==0){\n    html=`<h4>${d?d.n:b.type}<\/h4>${pname(pid)}<br>`;\n  } else if(b.type==='base'){\n    const c=cityById(b.cid);\n    html=`<h4>${c.capital?'★ ':''}${c.name}<\/h4>Base Nível ${c.level}<br>Pessoas ${c.adults+c.children} / ${capPop(c.id)}<br>Felicidade ${c.happy} (tende a ${c.happyTarget??'-'})${S.turn<(c.buffEnd||0)?' · bônus de produção e crescimento até o turno '+c.buffEnd:''}<br>`;\n    html+=cbtn('Gerenciamento',`openMgmt(${c.id})`);\n  } else if(b.type==='casa'){\n    html=`<h4>${STAGE_NAME[b.stage]}<\/h4>Estágio ${b.stage} / 4<br>Capacidade 4 pessoas<br>`;\n    if(b.stage<4) html+=cbtn(`Evoluir (${['','20 madeira, Nv.2','30 pedra, Nv.3','20 tábua + 20 pedra lapidada, Nv.4'][b.stage]})`,`evolveHouse(${x},${y})`);\n  } else if(b.type==='estrada'){\n    html=`<h4>Estrada<\/h4>${isConn(x,y)?'<span style=\"color:#2a6a2a\">conectada<\/span>':'<span style=\"color:#a0401a\">sem estrada até uma base<\/span>'}<br>Liga construções às bases.<br>`;\n  } else {\n    const conTxt=isConn(x,y)?'<span style=\"color:#2a6a2a\">conectada<\/span>':'<span style=\"color:#a0401a\">sem estrada até uma base<\/span>';\n    const star=d.cap?`<span class=\"star ${b.prio?'on':''}\" title=\"Prioridade de trabalho\" onclick=\"act(()=>togglePrio(${x},${y}))\">${b.prio?'★':'☆'}<\/span>`:'';\n    html=`<h4>${d.n} ${star}<\/h4>Nível ${b.level} / ${maxLvOf(b)} · ${conTxt}<br>`;\n    if(d.cap) html+=`Trabalhadores ${b.workers} / ${d.cap}<br>`;\n    if(d.out) html+=`Produz ${Object.keys(d.out).map(r=>RES_NAME[r]).join(', ')}<br>`;\n    if(d.inp) html+=`Consome ${Object.keys(d.inp).map(r=>RES_NAME[r]).join(', ')}<br>`;\n    if(d.power) html+=`Gera ${d.power} energia com carvão<br>`;\n    if(d.need) html+=`Precisa de ${d.need==='rio'?'rio ao lado':d.need+' perto'}<br>`;\n    if(d.elec) html+=`Energia: ${Math.round(power.ratio*100)}%<br>`;\n    html+=`Vida ${Math.round(b.hp==null?bMaxHp(b):b.hp)} / ${bMaxHp(b)}<br>`;\n  }\n  if(pid===0 && d && ['quartel','academia','basearea','quartel_moderno'].includes(b.type)){\n    html+=unitsInfoHtml(b.type);\n    if(S.recruitOpen===`${x},${y}`){\n      html+=`<div style=\"margin-top:6px\"><b>Unidades desbloqueadas<\/b><\/div>`;\n      const avail=Object.keys(UNITS).filter(k=>unitUnlocked(UNITS[k]));\n      if(!avail.length) html+=`<div style=\"color:#666\">Nenhuma unidade ainda. Suba a Academia Militar.<\/div>`;\n      for(const k of avail){\n        const u=UNITS[k];\n        html+=cbtn(`${u.n}: recrutar (${(u.manut*2*cf('ucost')).toFixed(1)})`,`recruit('${k}',false)`)+cbtn(`${u.n}: rápido (${(u.manut*4*cf('ucost')).toFixed(1)})`,`recruit('${k}',true)`);\n      }\n      html+=cbtn('Fechar criação','S.recruitOpen=null');\n    } else html+=cbtn('Criar unidades',`S.recruitOpen='${x},${y}'`);\n  }\n  if(pid===0 && b.type==='estrada'){\n    const L=b.level||1, cost={asfalto:5*L};\n    html+=`<div class=\"ustat\">Estrada Nível ${L}: +${L} movimento para tropas que passam por ela e ajuda a produção das construções ligadas.<\/div>`;\n    if(L<3) html+=cbtn(`Asfaltar para Nível ${L+1} (${costStr(cost)})`,`upgradeRoad(${x},${y})`,'',!canPay(cost));\n  }\n  if(pid===0 && b.type!=='base' && b.type!=='casa' && b.type!=='estrada' && b.level<maxLvOf(b)){\n    const c={}; for(const k in d.c) c[k]=d.c[k]*b.level*2;\n    html+=cbtn(`Melhorar (${costStr(c)})`,`upgrade(${x},${y})`);\n  }\n  if(pid===0 && b.type!=='base') html+=cbtn(S.demoArm&&S.demoArm.x===x&&S.demoArm.y===y?'Confirmar demolição (30%)':'Demolir (devolve 30%)',`demolish(${x},${y})`,'sec2');\n  card.innerHTML=html;\n  card.style.display='block';\n  positionCard();\n}\nfunction positionCard(){\n  const card=document.getElementById('card');\n  if(!S||!S.sel||card.style.display==='none') return;\n  if(card.classList.contains('unit')){\n    const h=card.offsetHeight, bot=document.body.classList.contains('bp-hidden')?66:212;\n    card.style.left='12px';\n    card.style.top=Math.max(44,window.innerHeight-bot-h-12)+'px';\n    return;\n  }\n  const sx=(S.sel.x*T-cam.x+T/2)*Z, sy=(S.sel.y*T-cam.y)*Z;\n  let left=sx-card.offsetWidth/2, top=sy-card.offsetHeight-16;\n  left=Math.max(4,Math.min(window.innerWidth-card.offsetWidth-4,left));\n  top=Math.max(44,top);\n  card.style.left=left+'px'; card.style.top=top+'px';\n}\n\n// População: cartões agrupados e felicidade com fatores (+ / −).\nfunction popStatsHtml(c){\n  const connected=cityBuildings(c.id).filter(o=>o.b.type!=='base'&&o.b.type!=='estrada'&&(o.b.pid||0)===0&&isConn(o.x,o.y)).length;\n  const total=cityBuildings(c.id).filter(o=>o.b.type!=='base'&&o.b.type!=='estrada'&&(o.b.pid||0)===0).length;\n  const kv=(l,v)=>`<div class=\"krow\"><span>${l}<\/span><b>${v}<\/b><\/div>`;\n  const card=(t,rows)=>`<div class=\"pcard\"><div class=\"ptitle\">${t}<\/div>${rows.join('')}<\/div>`;\n  const pop=c.adults+c.children;\n  const fac=(c.happyFactors||[]).filter(x=>x[0]!=='Base'&&x[1]!==0);\n  const fx=fac.map(([l,v])=>`<div class=\"frow\"><span class=\"fic ${v>0?'pos':'neg'}\">${v>0?'+':'−'}<\/span><span class=\"flbl\">${l}<\/span><b class=\"${v>0?'pos':'neg'}\">${v>0?'+':''}${v}<\/b><\/div>`).join('')||'<div class=\"ustat\">Nenhum fator agora.<\/div>';\n  const rel=S.religion==='sec'?'Secularismo Racional':S.religion==='fund'?'Fundamentalismo Ideológico':'Sem religião escolhida';\n  let h=`<div class=\"pgrid\">`;\n  h+=card('Pessoas',[kv('Total',pop),kv('Capacidade',capPop(c.id)),kv('Adultos',c.adults),kv('Crianças',c.children),kv('Casas',houses(c.id))]);\n  h+=card('Serviços',[kv('Bombeiros',netCount(c.net,'bombeiro')),kv('Polícia',netCount(c.net,'policia')),kv('Mercados',`${countType('mercado')} (+${Math.round((foodMult()-1)*100)}% comida)`),kv('Escolas',netCount(c.net,'escola')),kv('Templos',netCount(c.net,'templo')),kv('Hospitais',netCount(c.net,'hospital')),kv('Estádios',countType('estadio',c.id)),kv('Refinarias',countType('refinaria'))]);\n  const infra=[kv('Construções conectadas',`${connected} / ${total}`),kv('Cidades no império',S.cities.length)];\n  if(c.level>=3) infra.push(kv('Energia',`${power.supply} / ${power.demand} (${Math.round(power.ratio*100)}%)`));\n  h+=card('Infraestrutura',infra);\n  h+=`<\/div>`;\n  h+=`<div class=\"pcard wide\"><div class=\"ptitle\">Felicidade<\/div>\n    <div class=\"hbig\"><b>${c.happy}<\/b><span>tende a ${c.happyTarget??'—'}<\/span><\/div>\n    <div class=\"ubar hp\"><i style=\"width:${c.happy}%\"><\/i><\/div>\n    <div class=\"ulbl\">${rel}<\/div>\n    ${S.turn<(c.buffEnd||0)?`<div class=\"bonus\">Bônus de produção e crescimento até o turno ${c.buffEnd}<\/div>`:''}\n    <div class=\"ptitle2\">O que influencia<\/div>${fx}<\/div>`;\n  h+=workersHtml([c]);\n  return h;\n}\n// Recursos: quanto esta cidade contribui para o império (por turno) e o estoque geral.\nfunction recursosHtml(c){\n  const emp=k=>S.cities.reduce((s,x)=>s+((x.prod&&x.prod[k])||0),0);\n  const mine=k=>(c.prod&&c.prod[k])||0;\n  const keys=ALL_RES.filter(k=>Math.abs(mine(k))>0.001||Math.abs(emp(k))>0.001);\n  const fmt=v=>(v>0?'+':'')+v.toFixed(1);\n  let rows=keys.map(k=>{\n    const v=mine(k), t=emp(k), sh=(t>0&&v>0)?Math.round(v/t*100)+'%':'—';\n    return `<tr><td>${shapeSvg(k)} ${RES_NAME[k]||k}<\/td><td class=\"${v>=0?'pos':'neg'}\">${fmt(v)}<\/td><td>${fmt(t)}<\/td><td>${sh}<\/td><\/tr>`;\n  }).join('');\n  if(!rows) rows='<tr><td colspan=\"4\" style=\"color:#6b5a3a\">Esta cidade ainda não produziu nada neste turno.<\/td><\/tr>';\n  return `<div class=\"stitle\">${c.name} · contribuição por turno<\/div>\n    <table class=\"tbl\"><tr><th>Recurso<\/th><th>${c.name}<\/th><th>Império<\/th><th>Parte<\/th><\/tr>${rows}<\/table>`;\n}\n// Império: saldo de cada recurso, de onde vem e quem perde, e o estoque.\nfunction impRecursosHtml(){\n  const keys=ALL_RES.filter(k=>S.res[k]>0||S.cities.some(c=>c.prod&&Math.abs(c.prod[k]||0)>0.001));\n  const fmt=v=>(v>0?'+':'')+v.toFixed(1);\n  const rows=keys.map(k=>{\n    const tot=S.cities.reduce((s,c)=>s+((c.prod&&c.prod[k])||0),0);\n    const parts=S.cities.map(c=>{const v=(c.prod&&c.prod[k])||0; return Math.abs(v)<0.001?null:`<span class=\"${v>=0?'pos':'neg'}\">${c.name} ${fmt(v)}<\/span>`;}).filter(Boolean).join(' · ')||'—';\n    return `<tr><td>${shapeSvg(k)} <b>${RES_NAME[k]||k}<\/b><\/td><td class=\"${tot>=0?'pos':'neg'}\">${fmt(tot)}<\/td><td>${Math.floor(S.res[k])}<\/td><\/tr>`;\n  }).join('');\n  return `<div class=\"stitle\">Império · saldo por turno e estoque<\/div>\n    <table class=\"tbl\"><tr><th>Recurso<\/th><th>Saldo<\/th><th>Estoque<\/th><\/tr>${rows||'<tr><td colspan=\"3\">Nada ainda.<\/td><\/tr>'}<\/table>\n    <div class=\"pcard\" style=\"margin-top:8px\"><div class=\"krow\"><span>Moral<\/span><b>${Math.floor(S.morale)}<\/b><\/div><\/div>`;\n}\n// População do império: felicidade média (soma ÷ número de cidades) e o que puxa para baixo.\nfunction civStats(pid){\n  const cities=pid===0?S.cities:(S.ai[pid-1]?S.ai[pid-1].cities:[]);\n  const res=pid===0?S.res:(S.ai[pid-1]?S.ai[pid-1].res:{});\n  const hap=cities.length?Math.round(cities.reduce((s,c)=>s+c.happy,0)/cities.length):0;\n  return {pop:cities.reduce((s,c)=>s+c.adults+c.children,0),cities:cities.length,hap,army:armyCount(pid),ouro:Math.floor(res.ouro||0),comida:Math.floor(res.food||0)};\n}\n// Demografia (estilo Civ 5): uma barra por povo para cada métrica, na cor do povo.\nfunction demoHtml(){\n  const pids=[0].concat(S.ai.map((p,i)=>i+1).filter(q=>!S.ai[q-1].dead));\n  const st={}; for(const q of pids) st[q]=civStats(q);\n  const M=[['Pessoas','pop'],['Cidades','cities'],['Felicidade média','hap'],['Exército','army'],['Ouro','ouro'],['Comida','comida']];\n  return `<div class=\"stitle\">Demografia · comparação entre os povos<\/div>`+M.map(([lab,k])=>{\n    const mx=Math.max(1,...pids.map(q=>st[q][k]));\n    return `<div class=\"dmrow\"><div class=\"dmlbl\">${lab}<\/div><div class=\"dmbars\">${pids.map(q=>`<div class=\"dmb\"><span class=\"dmn\">${pname(q)}<\/span><span class=\"dmt\"><i style=\"width:${Math.round(st[q][k]/mx*100)}%;background:${pcolor(q)}\"><\/i><\/span><b>${st[q][k]}<\/b><\/div>`).join('')}<\/div><\/div>`;\n  }).join('');\n}\nfunction compareHtml(){\n  const pids=[0].concat(S.ai.map((p,i)=>i+1).filter(q=>!S.ai[q-1].dead));\n  const st={}; for(const q of pids) st[q]=civStats(q);\n  const M=[['Pessoas','pop'],['Cidades','cities'],['Felicidade média','hap'],['Exército','army'],['Ouro','ouro'],['Comida','comida']];\n  const rows=M.map(([lab,k])=>{\n    const vals=pids.map(q=>[st[q][k],q]);\n    const mine=st[0][k];\n    const rank=1+vals.filter(v=>v[0]>mine).length;\n    const best=vals.reduce((a,b)=>b[0]>a[0]?b:a), worst=vals.reduce((a,b)=>b[0]<a[0]?b:a);\n    const avg=Math.round(vals.reduce((s,v)=>s+v[0],0)/vals.length);\n    return `<tr><td><b>${lab}<\/b><\/td><td>${rank}º<\/td><td><b>${mine}<\/b><\/td><td>${pname(best[1])}<br><span class=\"pos\">${best[0]}<\/span><\/td><td>${avg}<\/td><td>${pname(worst[1])}<br><span class=\"neg\">${worst[0]}<\/span><\/td><\/tr>`;\n  }).join('');\n  return `<div class=\"stitle\">Comparação entre os povos<\/div><table class=\"tbl\"><tr><th>Métrica<\/th><th>Posição<\/th><th>Você<\/th><th>Melhor<\/th><th>Média<\/th><th>Pior<\/th><\/tr>${rows}<\/table>`;\n}\n// Lista de prédios com gente trabalhando, quantos trabalhadores e quantos prédios.\nfunction workersHtml(list){\n  const agg={};\n  for(const c of list) for(const o of cityBuildings(c.id)){\n    if((o.b.pid||0)!==0) continue;\n    const d=DEF[o.b.type]; if(!d||!d.cap) continue;\n    const a=agg[o.b.type]||(agg[o.b.type]={n:0,w:0,cap:0}); a.n++; a.w+=o.b.workers||0; a.cap+=d.cap;\n  }\n  const keys=Object.keys(agg).filter(k=>agg[k].w>0).sort((a,b)=>agg[b].w-agg[a].w);\n  const rows=keys.map(k=>`<div class=\"krow\"><span>${DEF[k].n}<\/span><b>${agg[k].w} de ${agg[k].cap} · ${agg[k].n} prédio${agg[k].n>1?'s':''}<\/b><\/div>`).join('');\n  const tot=keys.reduce((s,k)=>s+agg[k].w,0);\n  return `<div class=\"pcard wide\"><div class=\"ptitle\">Quem trabalha onde<\/div>${rows||'<div class=\"ustat\">Ninguém trabalhando.<\/div>'}<div class=\"krow\"><span>Total trabalhando<\/span><b>${tot}<\/b><\/div><\/div>`;\n}\nfunction impPopHtml(){ return impPopBase()+workersHtml(S.cities); }\nfunction impPopBase(){\n  const n=S.cities.length||1;\n  const avgH=Math.round(S.cities.reduce((s,c)=>s+c.happy,0)/n);\n  const tot=S.cities.reduce((s,c)=>s+c.adults+c.children,0);\n  const cap=S.cities.reduce((s,c)=>s+capPop(c.id),0);\n  const rows=S.cities.map(c=>{\n    const worst=(c.happyFactors||[]).filter(x=>x[0]!=='Base'&&x[1]<0).sort((a,b)=>a[1]-b[1])[0];\n    return `<tr><td><b>${c.capital?'★ ':''}${c.name}<\/b><\/td><td>${c.adults+c.children}<\/td><td class=\"${c.happy>=50?'pos':'neg'}\">${c.happy}<\/td><td>${worst?`<span class=\"neg\">${worst[0]} (${worst[1]})<\/span>`:'—'}<\/td><\/tr>`;\n  }).join('');\n  return `<div class=\"pgrid\">\n    <div class=\"pcard\"><div class=\"ptitle\">Felicidade do império<\/div><div class=\"hbig\"><b>${avgH}<\/b><span>média de ${S.cities.length} cidade(s)<\/span><\/div><div class=\"ubar hp\"><i style=\"width:${avgH}%\"><\/i><\/div><\/div>\n    <div class=\"pcard\"><div class=\"ptitle\">Pessoas<\/div><div class=\"krow\"><span>Total<\/span><b>${tot}<\/b><\/div><div class=\"krow\"><span>Capacidade<\/span><b>${cap}<\/b><\/div><div class=\"krow\"><span>Cidades<\/span><b>${S.cities.length}<\/b><\/div><\/div>\n  <\/div>\n  <div class=\"stitle\">Cidades<\/div>\n  <table class=\"tbl\"><tr><th>Cidade<\/th><th>Pessoas<\/th><th>Felicidade<\/th><th>Maior perda<\/th><\/tr>${rows}<\/table>`;\n}\nfunction trajHtmlFor(c){\n  const H=(S.hist||[]).filter(e=>!c||e.t.includes(c.name)).slice().reverse().slice(0,50);\n  const title=c?'Trajetória de '+c.name:'Trajetória do império';\n  if(!H.length) return `<div class=\"stitle\">${title}<\/div><div style=\"color:#6b5a3a\">Nada relevante ainda.<\/div>`;\n  return `<div class=\"stitle\">${title}<\/div>`+H.map(e=>`<div class=\"tl\"><span class=\"tn\">Turno ${e.turn}<\/span>${e.t}<\/div>`).join('');\n}\nfunction renderMgmt(){\n  const p=document.getElementById('mgmt');\n  if(!S || S.mgmt==null || screen!=='game' || modal){ p.style.display='none'; return; }\n  if(!mgmtDirty && (mgmtHover || S.renaming) && p.style.display!=='none') return;\n  mgmtDirty=false;\n  const c=cityById(S.mgmt);\n  if(!c){ S.mgmt=null; p.style.display='none'; return; }\n  const score=cityScore(c), next=c.level+1;\n  const connected=cityBuildings(c.id).filter(o=>o.b.type!=='base'&&o.b.type!=='estrada'&&(o.b.pid||0)===0&&isConn(o.x,o.y)).length;\n  const total=cityBuildings(c.id).filter(o=>o.b.type!=='base'&&o.b.type!=='estrada'&&(o.b.pid||0)===0).length;\n  const lvl3=c.level>=3;\n  let h=`<h3>${c.capital?'★ ':''}Gerenciamento: ${c.name}<\/h3>`;\n  h+=`<div class=\"sec\">Identidade<\/div>`;\n  h+=`<input id=\"cname\" maxlength=\"24\" value=\"${c.name.replace(/\"/g,'&quot;')}\" ${S.renaming?'':'readonly'}>`;\n  h+=`<button class=\"cbtn inl\" onclick=\"act(()=>toggleRename(${c.id}))\">${S.renaming?'Confirmar':'Renomear'}<\/button>`;\n  h+=cbtn(c.capital?'Capital atual':'Tornar capital', `setCapital(${c.id})`, c.capital?'on':'', c.capital);\n  h+=`<div class=\"sec\">Evolução<\/div>`;\n  h+=`Nível ${c.level}${c.level<10?' · pontos conectados '+score+' / '+BASE_REQ[next].score+' para o Nível '+next:' · nível máximo'}`;\n  if(c.level<10) h+=cbtn(`Evoluir para Nível ${next} (${costStr(BASE_REQ[next].cost)})`,`evolveCity(${c.id})`);\n  h+=`<div class=\"sec\">Impostos<\/div>`;\n  h+=`Atual: ${TAX[c.tax].n}${lvl3?'':' · <span style=\"color:#a0401a\">disponível no Nível 3<\/span>'}`;\n  for(const k of ['baixo','padrao','alto']) h+=cbtn(TAX[k].n+` (adulto ${TAX[k].a}, criança ${TAX[k].c}, felicidade ${TAX[k].h>0?'+':''}${TAX[k].h})`,`setTax(${c.id},'${k}')`, c.tax===k?'on':'', !lvl3);\n  p.innerHTML=h; p.style.display='block';\n}\n\nfunction renderDip(){\n  const p=document.getElementById('dip');\n  if(!S || !S.dip || screen!=='game' || modal){ p.style.display='none'; return; }\n  if(!dipDirty && dipHover && p.style.display!=='none') return;\n  dipDirty=false;\n  let h=`<h3>Diplomacia<\/h3>`;\n  const others=livingPids().filter(q=>q!==0);\n  const known=others.filter(q=>contactOf(0,q));\n  const ib=(label,fn,extra)=>`<button class=\"cbtn inl ${extra||''}\" onclick=\"act(()=>{${fn}})\">${label}<\/button>`;\n  if(!known.length) h+=`<div class=\"stitle\">Nenhum povo conhecido<\/div>Expanda até ${CONTACT_DIST} tiles de uma cidade deles para conhecê-los.`;\n  else {\n    h+=`<table class=\"tbl\"><tr><th>Povo<\/th><th>Situação<\/th><th>Confiança<\/th><th>Forças<\/th><\/tr>`;\n    for(const q of known){\n      const r=relGet(0,q), ai=S.ai[q-1];\n      const st=r.war?'Em guerra':r.alianca?'Aliança':r.comercio?'Comércio':r.pacto?'Pacto':'Sem acordo';\n      const col=r.war?'#a0401a':(r.pacto||r.comercio||r.alianca)?'#2f6a3a':'#6b5a3a';\n      const traitor=r.traitorUntil>S.turn?`<div style=\"color:#a0401a;font-size:11px\">Traidor até o turno ${r.traitorUntil}<\/div>`:'';\n      let acts='';\n      if(!r.war){\n        if(!r.pacto) acts+=ib('Pacto de não-agressão',`proposeToAI(${q},'pacto')`);\n        if(r.pacto && !r.comercio) acts+=ib('Comércio',`proposeToAI(${q},'comercio')`);\n        if(r.comercio && !r.alianca) acts+=ib('Aliança',`proposeToAI(${q},'alianca')`);\n        if(r.pacto) acts+=ib('Quebrar pacto',`breakPact(${q})`,'sec2');\n        acts+=ib('Declarar guerra',`declareWar(0,${q})`,'sec2');\n      } else acts+=ib('Propor paz',`proposeToAI(${q},'paz')`,'good');\n      h+=`<tr><td><span class=\"dot\" style=\"background:${pcolor(q)}\"><\/span><b>${pname(q)}<\/b><div style=\"font-size:11px;color:#6b5a3a\">${ai?ai.diff:''}<\/div><\/td>\n        <td><span class=\"pill\" style=\"background:${col}\">${st}<\/span>${traitor}<\/td><td>${Math.round(r.conf)}<\/td><td>${armyCount(q)}<\/td><\/tr>\n        <tr><td colspan=\"4\" style=\"padding-bottom:10px\">${acts}<\/td><\/tr>`;\n    }\n    h+=`<\/table>`;\n  }\n  if(S.inbox.length){\n    h+=`<div class=\"stitle\">Propostas recebidas<\/div><table class=\"tbl\"><tr><th>De<\/th><th>Proposta<\/th><th><\/th><\/tr>`;\n    S.inbox.forEach((it,i)=>{ h+=`<tr><td>${pname(it.from)}<\/td><td>${it.type}<\/td><td style=\"white-space:nowrap\">${ib('Aceitar',`acceptInbox(${i})`,'good')}${ib('Recusar',`rejectInbox(${i})`,'sec2')}<\/td><\/tr>`; });\n    h+=`<\/table>`;\n  }\n  p.innerHTML=h; p.style.display='block';\n}\n\nfunction renderEv(){\n  const p=document.getElementById('evp');\n  if(!S || !S.evp || screen!=='game' || modal){ p.style.display='none'; return; }\n  if(!evDirty && evHover && p.style.display!=='none') return;\n  evDirty=false;\n  let h=`<h3>Eventos<\/h3>`;\n  const scopeTxt=s=>s==='global'?'Global':s==='regional'?'Regional':'Local';\n  h+=`<div class=\"stitle\">Próximo turno<\/div>`;\n  if(S.pending){\n    const ev=EVENTS.find(e=>e.id===S.pending.id);\n    h+=`<table class=\"tbl\"><tr><th>Evento<\/th><th>Alcance<\/th><th>Efeito<\/th><\/tr><tr><td><b>${ev.n}<\/b><\/td><td>${scopeTxt(ev.scope)}<\/td><td>${ev.desc}<\/td><\/tr><\/table>`;\n  } else h+=`<div>Nada previsto.<\/div>`;\n  h+=`<div class=\"stitle\">Em andamento<\/div>`;\n  if(!S.active.length) h+=`<div>Nenhum evento ativo.<\/div>`;\n  else {\n    h+=`<table class=\"tbl\"><tr><th>Evento<\/th><th>Até o turno<\/th><th>Efeito<\/th><\/tr>`;\n    for(const a of S.active){ const ev=EVENTS.find(e=>e.id===a.id); h+=`<tr><td><b>${a.n}<\/b><\/td><td>${a.end}<\/td><td>${ev.desc}<\/td><\/tr>`; }\n    h+=`<\/table>`;\n  }\n  h+=`<div class=\"stitle\">Histórico<\/div>`;\n  const hist=S.evHistory.slice(-8).reverse();\n  if(!hist.length) h+=`<div>Nenhum evento ainda.<\/div>`;\n  else {\n    h+=`<table class=\"tbl\"><tr><th>Turno<\/th><th>Evento<\/th><\/tr>`;\n    for(const e of hist){ const ev=EVENTS.find(x=>x.id===e.id); h+=`<tr><td>${e.turn}<\/td><td>${ev.n}<\/td><\/tr>`; }\n    h+=`<\/table>`;\n  }\n  h+=`<div class=\"stitle\">O que reduz o dano<\/div><div class=\"kgrid\"><div>Mercado → seca<\/div><div>Hospital → peste e epidemia<\/div><div>Bombeiros → incêndio<\/div><div>Polícia → revolta<\/div><\/div>`;\n  p.innerHTML=h; p.style.display='block';\n}\n\nfunction renderOver(){\n  const o=document.getElementById('over'), box=document.getElementById('overbox');\n  if(!S || !S.over || screen!=='game'){ o.style.display='none'; return; }\n  o.style.display='flex';\n  if(S.over==='tempo'){\n    box.innerHTML=`<h2>Fim do tempo<\/h2>Os 600 turnos terminaram.<br><br>\n      <button class=\"cbtn\" onclick=\"S.over=null;renderAll()\">Continuar observando o mundo<\/button>\n      <button class=\"cbtn sec2\" onclick=\"showTitle()\">Voltar ao menu inicial<\/button>`;\n  } else if(S.over==='victory'){\n    box.innerHTML=`<h2>Vitória<\/h2>Todas as capitais rivais foram destruídas.<br><br>\n      <button class=\"cbtn\" onclick=\"S.over=null;renderAll()\">Continuar observando o mundo<\/button>\n      <button class=\"cbtn sec2\" onclick=\"showTitle()\">Voltar ao menu inicial<\/button>`;\n  } else {\n    box.innerHTML=`<h2>Derrota<\/h2>Sua capital foi destruída. A partida terminou.<br><br>\n      <button class=\"cbtn sec2\" onclick=\"showTitle()\">Voltar ao menu inicial<\/button>`;\n  }\n}\n\nfunction renderTileInfo(){\n  const el=document.getElementById('tileinfo');\n  if(!S || screen!=='game' || !hover || hover.x<0||hover.y<0||hover.x>=N||hover.y>=N){ el.style.display='none'; return; }\n  if(!seen(hover.x,hover.y)){ el.textContent='Área não explorada'; el.style.display='block'; return; }\n  const tile=S.grid[hover.y][hover.x];\n  let txt=TILE_NAME[tile.t];\n  const g=groupAt(hover.x,hover.y);\n  if(g) txt+=` · Grupo de ${pname(gPid(g))}: ${groupCount(g)} unidade(s)`;\n  if(tile.b){\n    const b=tile.b, pid=b.pid||0;\n    const c=cityById(b.cid);\n    const nm = b.type==='base'?(c?c.name:''):(b.type==='casa'?STAGE_NAME[b.stage]:(DEF[b.type]?DEF[b.type].n:b.type));\n    txt+=` · ${nm}${pid!==0?' ('+pname(pid)+')':''}`;\n  }\n  el.textContent=txt; el.style.display='block';\n}\n\n// Fog of war: só aparece o que está a até 4 tiles de uma construção ou unidade sua.\nfunction computeVis(){\n  if(!S) return;\n  VIS=new Uint8Array(N*N);\n  const mark=(x,y)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const X=x+dx,Y=y+dy; if(X>=0&&Y>=0&&X<N&&Y<N) VIS[Y*N+X]=1; } };\n  for(const o of buildingsList()) if((o.b.pid||0)===0) mark(o.x,o.y);\n  for(const g of S.groups) if(gPid(g)===0) mark(g.x,g.y);\n  TERR=new Uint8Array(N*N);\n  for(const o of buildingsList()){\n    const c=cityById(o.b.cid); if(!c) continue;\n    const pid=o.b.pid||0, r=terrR(c);\n    for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){\n      const X=o.x+dx,Y=o.y+dy;\n      if(X>=0&&Y>=0&&X<N&&Y<N && dist(X,Y,c.x,c.y)<=r) TERR[Y*N+X]=pid+1;\n    }\n  }\n  VALIDB=null;\n  if(S.tool && S.tool!=='fundar'){\n    const NEAR=new Uint8Array(N*N);\n    for(const o of buildingsList()) if((o.b.pid||0)===0)\n      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){\n        const X=o.x+dx, Y=o.y+dy; if(X>=0&&Y>=0&&X<N&&Y<N) NEAR[Y*N+X]=1;\n      }\n    VALIDB=new Uint8Array(N*N);\n    for(let y=0;y<N;y++) for(let x=0;x<N;x++){\n      const i=y*N+x;\n      if(TERR[i]===1 && NEAR[i] && !S.grid[y][x].b && S.grid[y][x].t!=='rio' && !groupAt(x,y) && seen(x,y) && !canPlace(S.tool,x,y)) VALIDB[i]=1;\n    }\n  }\n}\nfunction seen(x,y){ return !VIS || VIS[y*N+x]===1; }\n// Ícones geométricos dos recursos (sem emojis).\nconst RES_ICON={food:'food',wood:'wood',stone:'stone',metal:'ingot',ouro:'coin',morale:'smile',carvao:'coal',tabua:'plank',lapida:'slab',aco:'bars',bens:'gift',science:'flask',petroleo:'drop',asfalto:'road',combustivel:'fuel'};\nconst RES_COL={food:'#5fbf4a',wood:'#8a5a2a',stone:'#9aa0a6',metal:'#c0c8d8',ouro:'#e8c040',morale:'#e06a8a',carvao:'#6a6a6a',tabua:'#c08a4a',lapida:'#d8d2c0',aco:'#8fa8c0',bens:'#e07a2a',science:'#5aa0e8',petroleo:'#5a5a8a',asfalto:'#8a8a8a',combustivel:'#f0a030'};\nfunction iconNode(k,icon,col,px){ return iconCanvas(icon,col,px); }\nfunction shapeSvg(k){\n  if(RES_ICON[k]) return iconImg(RES_ICON[k],RES_COL[k]||'#dddddd');\n  const MAP={food:['#5fbf4a','c'],wood:['#8a5a2a','r'],stone:['#9aa0a6','t'],metal:['#c0c8d8','d'],ouro:['#e8c040','o'],\n    morale:['#e06a8a','iv'],carvao:['#2a2a2a','e'],tabua:['#c08a4a','b'],lapida:['#d8d2c0','s'],aco:['#8fa8c0','x'],\n    bens:['#e07a2a','p'],science:['#5aa0e8','st'],petroleo:['#3a3a5a','dr'],asfalto:['#555555','h'],combustivel:['#f0a030','dm']};\n  const [c,sh]=MAP[k]||['#dddddd','r'];\n  const shapes={\n    c:`<circle cx=\"7\" cy=\"7\" r=\"5\" fill=\"${c}\"/>`,\n    r:`<rect x=\"2\" y=\"2\" width=\"10\" height=\"10\" fill=\"${c}\"/>`,\n    t:`<polygon points=\"7,1 13,13 1,13\" fill=\"${c}\"/>`,\n    d:`<polygon points=\"7,1 13,7 7,13 1,7\" fill=\"${c}\"/>`,\n    o:`<circle cx=\"7\" cy=\"7\" r=\"6\" fill=\"${c}\" stroke=\"#7a5a10\"/>`,\n    b:`<rect x=\"1\" y=\"5\" width=\"12\" height=\"4\" fill=\"${c}\"/>`,\n    e:`<ellipse cx=\"7\" cy=\"7\" rx=\"6\" ry=\"4\" fill=\"${c}\"/>`,\n    iv:`<polygon points=\"1,2 13,2 7,13\" fill=\"${c}\"/>`,\n    s:`<rect x=\"2\" y=\"2\" width=\"10\" height=\"10\" fill=\"${c}\" stroke=\"#333\" stroke-width=\"1\"/>`,\n    x:`<path d=\"M5 1h4v4h4v4h-4v4h-4v-4h-4v-4h4z\" fill=\"${c}\"/>`,\n    p:`<polygon points=\"7,1 13,5.5 11,13 3,13 1,5.5\" fill=\"${c}\"/>`,\n    st:`<polygon points=\"7,1 8.8,5 13,5.4 9.8,8.2 10.9,13 7,10.6 3.1,13 4.2,8.2 1,5.4 5.2,5\" fill=\"${c}\"/>`,\n    dr:`<path d=\"M7 1 C10 5 12 7 12 9.5 A5 5 0 0 1 2 9.5 C2 7 4 5 7 1 Z\" fill=\"${c}\"/>`,\n    h:`<polygon points=\"4,1 10,1 13,7 10,13 4,13 1,7\" fill=\"${c}\"/>`,\n    dm:`<polygon points=\"7,2 12,7 7,12 2,7\" fill=\"none\" stroke=\"${c}\" stroke-width=\"2\"/>`\n  };\n  return `<svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" style=\"vertical-align:middle\">${shapes[sh]}<\/svg>`;\n}\nfunction resChip(k){ const v=k==='morale'?S.morale:(S.res[k]||0); return `<span class=\"rc\" title=\"${RES_NAME[k]||'moral'}\">${shapeSvg(k)}<b>${Math.floor(v)}<\/b><\/span>`; }\n// Minimapa: mostra só o que está explorado; clicar move a câmera.\nconst mini=document.getElementById('mini'), mctx=mini.getContext('2d');\nfunction drawMini(){\n  if(!S||screen!=='game') return;\n  const W=150, sc=W/N;\n   <label><input type=\"radio\" name=\"size\" value=\"enorme\"> Enorme (24 sistemas, mapa bem maior)<\/label>\n    <div class=\"grp\">Povos na galáxia<\/div>\n    <label><input type=\"radio\" name=\"nations\" value=\"3\"> 3 povos<\/label>\n    <label><input type=\"radio\" name=\"nations\" value=\"5\" checked> 5 povos<\/label>\n    <div class=\"grp\">Dificuldade<\/div>\n    <label><input type=\"radio\" name=\"diff\" value=\"facil\"> Fácil<\/label>\n    <label><input type=\"radio\" name=\"diff\" value=\"normal\" checked> Normal<\/label>\n    <label><input type=\"radio\" name=\"diff\" value=\"dificil\"> Difícil<\/label>\n    <div class=\"grp\">Vitória: sistemas a conquistar<\/div>\n    <label><input type=\"radio\" name=\"goal\" value=\"4\"> 4 sistemas<\/label>\n    <label><input type=\"radio\" name=\"goal\" value=\"6\" checked> 6 sistemas<\/label>\n    <label><input type=\"radio\" name=\"goal\" value=\"8\"> 8 sistemas<\/label>\n    <button class=\"btn\" onclick=\"startGame()\" style=\"margin-top:14px\">Começar<\/button>\n    <button class=\"btn\" id=\"contbtn\" onclick=\"continueGame()\" style=\"display:none\">Continuar jogo salvo<\/button>\n  <\/div>\n<\/div>\n<script>\nconst cv=document.getElementById('c'), ctx=cv.getContext('2d');\nlet W=0,H=0;\nfunction resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }\naddEventListener('resize',resize); resize();\n\nconst WORLD={w:3000,h:2000};\nconst PTYPES={rochoso:'Rochoso',oceanico:'Oceânico',gasoso:'Gasoso',deserto:'Desértico'};\nconst PCOL={rochoso:'#9a8a7a',oceanico:'#3f7fbf',gasoso:'#c9a24a',deserto:'#d8925a'};\nconst SPECIES=['Vhar','Kelun','Ossi','Trenn','Mehr'];\nconst SPCOL=['#e07a7a','#7ae0c0','#e0d07a','#b07ae0','#7aa8e0'];\nconst BLD={\n  extrator:{n:'Extrator de matéria',cost:{materia:15},desc:'+1 matéria/s no depósito'},\n  lab:{n:'Laboratório',cost:{materia:20},desc:'+1 pesquisa/s'},\n  central:{n:'Central de diplomacia',cost:{materia:25},desc:'+50% de influência ganha nos planetas do sistema'},\n  usina:{n:'Usina solar',cost:{materia:18},desc:'+1 energia/s'},\n  bastiao:{n:'Bastião',cost:{materia:25,ferro:5},desc:'+2 de defesa do planeta'}\n};\nconst COLONIZE={materia:20,energia:5};\nconst RES_NAME={materia:'Matéria',energia:'Energia',pesquisa:'Pesquisa',creditos:'Créditos',ferro:'Ferro',cristal:'Cristal'};\nlet CARGO_CAP=30, FUEL_MAX=100;\nconst DEPOT_CAP=100;\nconst DIFF={facil:{n:'Fácil',spawn:12,hp:0.8,shop:0.9},normal:{n:'Normal',spawn:8,hp:1,shop:1},dificil:{n:'Difícil',spawn:5,hp:1.3,shop:1.15}};\nconst SIZES={pequena:{sys:8,w:2400,h:1600},media:{sys:12,w:3000,h:2000},grande:{sys:16,w:3800,h:2600},enorme:{sys:24,w:5200,h:3600}};\nconst SHOP_BASE={ferro:6,cristal:14,materia:2};\nconst KEYMAP={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};\nconst MAX_ENEMIES=10, FIRE_CD=0.3, PLAYER_BULLET_DMG=10, ENEMY_BULLET_DMG=5, MAX_METEORS=10;\nconst TECHS={\n  propulsao:{n:'Propulsão',cost:30,desc:'+30% de velocidade'},\n  armamento:{n:'Armamento',cost:50,desc:'+50% de dano'},\n  blindagem:{n:'Blindagem',cost:50,desc:'+25 de casco'},\n  expansao:{n:'Expansão',cost:80,desc:'Colonizar custa menos'}\n};\n// Estaleiro da base: melhorias caras em créditos, com pré-requisito.\nconst UPGRADES={\n  motor1:{n:'Motor de dobra I',cost:400,req:null,desc:'+25% de velocidade'},\n  motor2:{n:'Motor de dobra II',cost:1200,req:'motor1',desc:'+25% de velocidade'},\n  casco1:{n:'Casco reforçado I',cost:350,req:null,desc:'+30 de casco'},\n  casco2:{n:'Casco reforçado II',cost:1000,req:'casco1',desc:'+40 de casco'},\n  canhao1:{n:'Canhão I',cost:500,req:null,desc:'+30% de dano'},\n  canhao2:{n:'Canhão II',cost:1500,req:'canhao1',desc:'+40% de dano'},\n  carga1:{n:'Porão de carga',cost:300,req:null,desc:'+15 de carga'},\n  tanque1:{n:'Tanque extra',cost:300,req:null,desc:'+50 de combustível máximo'}\n};\nlet SPD_MUL=1, DMG_MUL=1, HULL_MAX=100;\nfunction applyUpgrades(){\n  const u=S.upg||{}, t=S.techs||{};\n  SPD_MUL=(t.propulsao?1.3:1)*(u.motor1?1.25:1)*(u.motor2?1.25:1);\n  DMG_MUL=(t.armamento?1.5:1)*(u.canhao1?1.3:1)*(u.canhao2?1.4:1);\n  HULL_MAX=100+(t.blindagem?25:0)+(u.casco1?30:0)+(u.casco2?40:0);\n  CARGO_CAP=30+(u.carga1?15:0);\n  FUEL_MAX=100+(u.tanque1?50:0);\n}\nfunction buyUpgrade(k){\n  const u=UPGRADES[k];\n  S.upg=S.upg||{};\n  if(S.upg[k]) return;\n  if(u.req && !S.upg[u.req]){ msg('Antes instale: '+UPGRADES[u.req].n+'.','ECONOMIA'); return; }\n  if(!canPay({creditos:u.cost})){ msg('Créditos insuficientes para '+u.n+'.','ECONOMIA'); return; }\n  pay({creditos:u.cost}); S.upg[k]=true; applyUpgrades();\n  msg('Melhoria instalada: '+u.n+'.','SISTEMA');\n}\nfunction upgradeHtml(){\n  const U=S.upg||{};\n  return `<div class=\"stitle\">Estaleiro da base<\/div>`+Object.keys(UPGRADES).map(k=>{\n    const u=UPGRADES[k];\n    if(U[k]) return `<div>[instalado] ${u.n} · ${u.desc}<\/div>`;\n    const lock=u.req && !U[u.req];\n    return `<button class=\"btn\" onclick=\"buyUpgrade('${k}');renderPanel()\" ${(lock||!canPay({creditos:u.cost}))?'disabled':''}>${u.n} · ${u.cost} créditos${lock?' (requer '+UPGRADES[u.req].n+')':''}<br><small>${u.desc}<\/small><\/button>`;\n  }).join('');\n}\nconst REL_MIN=-100, REL_MAX=100;\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst dist=(a,b,c,d)=>Math.hypot(a-c,b-d);\n\nlet S=null;\nlet AC=null;\n\n// ---------- Criação e início ----------\nfunction startGame(){\n  startAmbient();\n  const cfg={\n    name:(document.getElementById('cr_name').value||'Comandante').trim().slice(0,24)||'Comandante',\n    base:(document.getElementById('cr_base').value||'Lar').trim().slice(0,24)||'Lar',\n    size:document.querySelector('input[name=size]:checked').value,\n    nations:+document.querySelector('input[name=nations]:checked').value,\n    diff:document.querySelector('input[name=diff]:checked').value,\n    goal:+document.querySelector('input[name=goal]:checked').value\n  };\n  document.getElementById('create').style.display='none';\n  newGame(cfg);\n}\nfunction continueGame(){\n  startAmbient();\n  openMenu('main');\n}\nfunction showCreate(){\n  const has=listSaves().length>0;\n  document.getElementById('contbtn').style.display=has?'block':'none';\n  document.getElementById('create').style.display='flex';\n}\n\nfunction newGame(cfg){\n  const nSys=SIZES[cfg.size].sys;\n  setWorld(SIZES[cfg.size].w,SIZES[cfg.size].h);\n  const systems=[];\n  for(let i=0;i<nSys;i++){\n    let x,y,tries=0;\n    do{ x=rnd(200,WORLD.w-200); y=rnd(200,WORLD.h-200); tries++; }\n    while(tries<300 && systems.some(s=>dist(s.x,s.y,x,y)<260));\n    const n=1+Math.floor(Math.random()*3), planets=[];\n    const types=Object.keys(PTYPES);\n    for(let p=0;p<n;p++){\n      const hab=Math.random()<0.45;\n      planets.push({n:p+1,type:types[Math.floor(Math.random()*types.length)],r:70+p*50,\n        ang:rnd(0,6.283),spd:rnd(0.12,0.3)/(p+1),\n        hab, sp:hab?Math.floor(Math.random()*cfg.nations):-1, pop:hab?Math.floor(rnd(20,120)):0,\n        owner:null, lvl:0, bld:{}, inf:0, depot:{}, base:false, mis:null, misCd:0, misDone:0, saleCd:0, terra:hab?3:0});\n    }\n    systems.push({name:'Sistema '+'ABCDEFGHIJKL'[i],x,y,planets});\n  }\n  const home=systems[0];\n  home.name=cfg.base;\n  const bp=home.planets[0];\n  bp.hab=false; bp.sp=-1; bp.pop=0; bp.owner='player'; bp.lvl=1; bp.bld={extrator:1}; bp.base=true;\n  const arch=ARCHS.slice().sort(()=>Math.random()-0.5);\n  const anoms=[], kinds=['nave','buraco','ruina','nave'];\n  for(const kind of kinds){\n    let x,y,t=0;\n    do{ x=rnd(100,WORLD.w-100); y=rnd(100,WORLD.h-100); t++; }\n    while(t<100 && dist(x,y,home.x,home.y)<900);\n    anoms.push({x,y,kind});\n  }\n  const meteors=[];\n  for(let i=0;i<MAX_METEORS;i++) meteors.push(makeMeteor(systems));\n  S={cfg,t:0,acc:0,\n     res:{materia:40,energia:20,pesquisa:0,creditos:150,ferro:0,cristal:0},\n     cargo:{materia:0,ferro:0,cristal:0},\n     fuel:FUEL_MAX,hp:100,systems,meteors,anoms,arch,worldW:WORLD.w,worldH:WORLD.h,fog:new Array(FW*FH).fill(0),enemies:[],bullets:[],fx:[],\n     stars:Array.from({length:180},()=>({x:rnd(0,WORLD.w),y:rnd(0,WORLD.h),r:rnd(0.5,1.6)})),\n     rel:[0,0,0,0,0],trade:[false,false,false,false,false],hostileWarned:[false,false,false,false,false],\n     contacted:[false,false,false,false,false],war:[false,false,false,false,false],techs:{},upg:{},\n     sys:null,sel:null,shop:false,stats:false,help:false,paused:false,over:null,won:false,\n     ship:{x:home.x+90,y:home.y,vx:0,vy:0,ang:-Math.PI/2},keys:{},log:[],decision:null,\n     cd:0,spawnT:2,hurt:0,mining:false};\n  for(let i=0;i<cfg.nations;i++) spawnPatrol(i);\n  msg('Comandante '+cfg.name+' assume o controle de '+home.name+'. Objetivo: conquistar '+cfg.goal+' sistemas.','SISTEMA');\n}\nfunction makeMeteor(systems){\n  let x,y,tries=0;\n  do{ x=rnd(0,WORLD.w); y=rnd(0,WORLD.h); tries++; }\n  while(tries<100 && systems.some(s=>dist(s.x,s.y,x,y)<150));\n  // Matéria é o mais comum; ferro e cristal são mais raros. Tamanho e forma variam.\n  const roll=Math.random(), type=roll<0.5?'materia':roll<0.8?'ferro':'cristal';\n  const r=rnd(4,10);\n  return {x,y,type,amt:Math.round(r*8),r,n:5+Math.floor(Math.random()*4),seed:1+Math.floor(Math.random()*40),rot:rnd(0,6.283),spin:rnd(-0.4,0.4)};\n}\n\n// ---------- Registro de eventos ----------\nfunction msg(t,tag){\n  S.log.push({tag:tag||'GERAL',text:t});\n  if(S.log.length>8) S.log.shift();\n}\nfunction canPay(c){ return Object.keys(c).every(k=>S.res[k]>=c[k]); }\nfunction pay(c){ for(const k in c) S.res[k]-=c[k]; }\nfunction costTxt(c){ return Object.keys(c).map(k=>c[k]+' '+RES_NAME[k]).join(', '); }\nfunction planetName(si,pi){ return S.systems[si].name+' '+S.systems[si].planets[pi].n; }\nfunction owned(p){ return p.owner==='player'; }\nfunction playerPlanets(){\n  const L=[];\n  for(const s of S.systems) for(const p of s.planets) if(owned(p)) L.push(p);\n  return L;\n}\nfunction systemOwned(s){ return s.planets.filter(owned).length>=Math.ceil(s.planets.length/2); }\nfunction conqueredCount(){ return S.systems.filter(systemOwned).length; }\nfunction nearSystem(){\n  let best=-1, bd=95;\n  S.systems.forEach((s,i)=>{ const d=dist(s.x,s.y,S.ship.x,S.ship.y); if(d<bd){ bd=d; best=i; } });\n  return best;\n}\nfunction planetPos(p,cx,cy){ return [cx+Math.cos(p.ang)*p.r, cy+Math.sin(p.ang)*p.r]; }\nfunction depotSum(p){ return Object.values(p.depot||{}).reduce((a,b)=>a+b,0); }\nfunction cargoSum(){ return Object.values(S.cargo).reduce((a,b)=>a+b,0); }\nfunction cargoFree(){ return CARGO_CAP-cargoSum(); }\nfunction relName(v){ return v>=50?'Aliados':v>=20?'Amistosos':v>=0?'Neutros':v>=-50?'Tensos':'Hostis'; }\n\n// ---------- Decisões do jogador (pausam o jogo) ----------\nfunction askDecision(title,text,opts){ S.decision={title,text,opts}; }\nfunction chooseDecision(i){\n  const d=S.decision; if(!d) return;\n  S.decision=null;\n  d.opts[i].run();\n  renderUI();\n}\nfunction contactDecision(sp){\n  askDecision('Contato com os '+SPECIES[sp],'Os '+SPECIES[sp]+' avistam sua nave. Como agir?',[\n    {label:'Saudar (+15 de relação)',run:()=>{ S.rel[sp]=Math.min(REL_MAX,S.rel[sp]+15); msg('Saudação aceita pelos '+SPECIES[sp]+'.','DIPLO'); }},\n    {label:'Exigir tributo (+40 créditos, -20 de relação)',run:()=>{ S.res.creditos+=40; S.rel[sp]=Math.max(REL_MIN,S.rel[sp]-20); msg('Tributo de 40 créditos pago pelos '+SPECIES[sp]+'.','DIPLO'); }},\n    {label:'Ignorar',run:()=>{ msg('Você ignorou os '+SPECIES[sp]+'.','DIPLO'); }}\n  ]);\n}\n\n// ---------- Navegação ----------\nfunction enterSys(i){\n  S.sys=i; S.sel=null; S.shop=false; S.ship.vx=0; S.ship.vy=0; S.mining=false;\n  S.visited=S.visited||{}; S.visited[i]=true;\n  msg('Entrou em '+S.systems[i].name+'.','SISTEMA');\n  for(const p of S.systems[i].planets){\n    if(p.hab && p.sp>=0 && !S.contacted[p.sp]){ S.contacted[p.sp]=true; contactDecision(p.sp); break; }\n  }\n  renderPanel();\n}\nfunction leaveSys(){ S.sys=null; S.sel=null; S.shop=false; renderPanel(); }\n\n// ---------- Ações em planetas ----------\nfunction colCost(){ return S.techs.expansao?{materia:10,energia:3}:COLONIZE; }\nfunction colonize(si,pi){\n  const p=S.systems[si].planets[pi];\n  if((p.terra||0)<3){ msg('Complete as 3 etapas de terraformação antes de colonizar.','SISTEMA'); return; }\n  if(p.owner||p.hab){ msg('Não é possível colonizar este planeta.','ECONOMIA'); return; }\n  const cc=colCost();\n  if(!canPay(cc)){ msg('Recursos insuficientes para colonizar.','ECONOMIA'); return; }\n  pay(cc); p.owner='player'; p.lvl=1; p.hab=true; p.sp=-1; p.pop=40;\n  msg('Colônia fundada em '+planetName(si,pi)+'.','SISTEMA');\n}\n// Terraformação é requisito para construir, evoluir, usar depósito e abrir loja em colônias próprias.\nfunction needsTerra(p){ return owned(p)&&!p.base&&(p.terra||0)<3; }\nfunction build(si,pi,k){\n  const p=S.systems[si].planets[pi], d=BLD[k];\n  if(!owned(p)){ msg('Este planeta não é seu.','ECONOMIA'); return; }\n  if(needsTerra(p)){ msg('Complete as 3 etapas de terraformação primeiro.','SISTEMA'); return; }\n  if((p.bld[k]||0)>=p.lvl*2){ msg('Limite desse tipo de construção neste nível.','ECONOMIA'); return; }\n  if(!canPay(d.cost)){ msg('Recursos insuficientes: '+costTxt(d.cost)+'.','ECONOMIA'); return; }\n  pay(d.cost); p.bld[k]=(p.bld[k]||0)+1;\n  msg(d.n+' construído em '+planetName(si,pi)+'.','SISTEMA');\n}\nfunction evolve(si,pi){\n  const p=S.systems[si].planets[pi];\n  if(!owned(p)) return;\n  if(needsTerra(p)){ msg('Complete as 3 etapas de terraformação primeiro.','SISTEMA'); return; }\n  const cost={materia:30*p.lvl};\n  if(!canPay(cost)){ msg('Matéria insuficiente para evoluir.','ECONOMIA'); return; }\n  pay(cost); p.lvl++;\n  msg(planetName(si,pi)+' evoluiu para o nível '+p.lvl+'.','SISTEMA');\n}\n// Influência é relação por planeta: sobe com comércio, missões e centrais; não é moeda.\nfunction infTier(v){ return v>=100?'Dominado':v>=75?'Aliado':v>=50?'Influenciado':v>=25?'Contato':'Desconhecido'; }\nfunction sysHasCentral(si){ return S.systems[si].planets.some(p=>owned(p)&&(p.bld.central||0)>0); }\nfunction addInf(si,pi,amt,why){\n  const p=S.systems[si].planets[pi];\n  if(owned(p)) return;\n  const relMul=p.hab?1+S.rel[p.sp]/200:1;\n  const g=amt*(p.hab?1:1.5)*relMul*(sysHasCentral(si)?1.5:1)*(p.hab&&archOf(p.sp)==='Religiosos'?1.3:1);\n  const before=p.inf;\n  p.inf=Math.min(100,p.inf+g);\n  if(before<100 && p.inf>=100){\n    p.owner='player'; p.lvl=1; p.mis=null;\n    msg(planetName(si,pi)+' foi dominado. Agora evolui como colônia.','SISTEMA');\n  } else if(Math.floor(p.inf/25)>Math.floor(before/25)){\n    msg(planetName(si,pi)+': '+infTier(p.inf)+' ('+Math.floor(p.inf)+'%). '+why,'DIPLO');\n  }\n}\nfunction genMission(p){\n  const items=['ferro','cristal','materia'];\n  const item=items[Math.floor(Math.random()*items.length)];\n  const qty=3+Math.floor(Math.random()*5);\n  return {item,qty,inf:p.hab?15:25,cred:qty*4};\n}\nfunction misReward(p){ return p.mis?p.mis.inf/(1+p.misDone*0.3):0; }\nfunction updateMissions(dt){\n  for(const s of S.systems) for(const p of s.planets){\n    if(owned(p)) continue;\n    p.saleCd=Math.max(0,(p.saleCd||0)-dt);\n    p.misCd=Math.max(0,(p.misCd||0)-dt);\n    if(p.mis && p.mis.urgent){\n      p.mis.left-=dt;\n      if(p.mis.left<=0){ msg('Um pedido de socorro expirou sem resposta.','MISSAO'); p.mis=null; p.misCd=30; }\n    }\n    if(!p.mis && p.misCd<=0) p.mis=genMission(p);\n  }\n}\n// Pedidos de socorro: a cada 120 s, um planeta habitado neutro ou aliado pede ajuda por 60 s, com recompensa maior.\nfunction updateDistress(dt){\n  S.distressT=(S.distressT===undefined?120:S.distressT)-dt;\n  if(S.distressT>0) return;\n  S.distressT=120;\n  const c=[];\n  for(const s of S.systems) for(const p of s.planets) if(!owned(p)&&p.hab&&!S.war[p.sp]&&!(p.mis&&p.mis.urgent)) c.push(p);\n  if(!c.length) return;\n  const p=c[Math.floor(Math.random()*c.length)];\n  const items=['materia','ferro','cristal'], item=items[Math.floor(Math.random()*items.length)];\n  const qty=4+Math.floor(Math.random()*4);\n  p.mis={item,qty,inf:30,cred:qty*10,urgent:true,left:60};\n  const si=S.systems.findIndex(s=>s.planets.includes(p)), pi=S.systems[si].planets.indexOf(p);\n  msg('Pedido de socorro em '+planetName(si,pi)+': '+qty+' de '+RES_NAME[item]+' em 60 s.','MISSAO');\n  beep(520,0.15,'triangle');\n}\nfunction completeMission(si,pi){\n  const p=S.systems[si].planets[pi], m=p.mis;\n  if(!m || owned(p)) return;\n  if(S.cargo[m.item]<m.qty){ msg('Carga insuficiente: '+m.qty+' de '+RES_NAME[m.item]+' pedidos.','MISSAO'); return; }\n  const amt=misReward(p);\n  S.cargo[m.item]-=m.qty; S.res.creditos+=m.cred;\n  p.misDone++; p.mis=null; p.misCd=90;\n  msg('Missão concluída em '+planetName(si,pi)+': +'+m.cred+' créditos.','MISSAO');\n  addInf(si,pi,amt,'Missão cumprida.');\n}\n\n// ---------- Depósito e carga ----------\nfunction loadDepot(si,pi){\n  const p=S.systems[si].planets[pi];\n  if(!owned(p)||p.base){ msg('Não há depósito de planeta aqui.','ECONOMIA'); return; }\n  if(needsTerra(p)){ msg('Terraforme este planeta para usar o depósito.','SISTEMA'); return; }\n  let moved=0;\n  for(const k of ['materia','ferro','cristal']){\n    const free=cargoFree(); if(free<=0) break;\n    const take=Math.min(Math.floor(p.depot[k]||0),free);\n    if(take>0){ p.depot[k]-=take; S.cargo[k]+=take; moved+=take; }\n  }\n  msg(moved?'Carregados '+moved+' unidades do depósito.':'Nada para carregar, ou nave cheia.','ECONOMIA');\n}\nfunction unloadCargo(si,pi){\n  const p=S.systems[si].planets[pi];\n  if(!owned(p)){ msg('Planeta não é seu.','ECONOMIA'); return; }\n  if(needsTerra(p)){ msg('Terraforme este planeta para usar o depósito.','SISTEMA'); return; }\n  if(p.base){\n    for(const k of ['materia','ferro','cristal']){ S.res[k]=(S.res[k]||0)+S.cargo[k]; S.cargo[k]=0; }\n    msg('Carga entregue à base.','ECONOMIA');\n    return;\n  }\n  let moved=0;\n  for(const k of ['materia','ferro','cristal']){\n    const room=DEPOT_CAP-depotSum(p);\n    const put=Math.min(Math.floor(S.cargo[k]),room);\n    if(put>0){ p.depot[k]=(p.depot[k]||0)+put; S.cargo[k]-=put; moved+=put; }\n  }\n  msg(moved?'Guardados '+moved+' unidades no depósito do planeta.':'Depósito cheio ou nave vazia.','ECONOMIA');\n}\n\n// ---------- Loja e combustível ----------\n// Colônias próprias (sp = -1) não pertencem a nenhum povo: sem relação, preço neutro.\nfunction relOf(p){ return p.hab&&p.sp>=0?S.rel[p.sp]:0; }\nfunction buyFactor(p){ return (owned(p)?0.8:1)*(1-relOf(p)/400)*DIFF[S.cfg.diff].shop; }\nfunction sellFactor(p){ return (owned(p)?1.25:1)*(1+relOf(p)/200)*(p.hab&&archOf(p.sp)==='Comerciantes'?1.15:1); }\nfunction sellPrice(item,p){ return Math.max(1,Math.round(SHOP_BASE[item]*sellFactor(p))); }\nfunction fuelUnit(p){ return Math.max(0.1,+(0.4*buyFactor(p)*(p.hab&&archOf(p.sp)==='Nômades'?0.7:1)).toFixed(2)); }\nfunction refuel(si,pi){\n  const p=S.systems[si].planets[pi];\n  if(!owned(p) && !p.hab){ msg('Só há combustível em planetas seus ou em lojas de povos.','ECONOMIA'); return; }\n  const need=FUEL_MAX-S.fuel;\n  if(need<=0){ msg('Tanque cheio.','ECONOMIA'); return; }\n  const amt=Math.min(need,20), cost=Math.ceil(amt*fuelUnit(p));\n  if(S.res.creditos<cost){ msg('Créditos insuficientes para combustível.','ECONOMIA'); return; }\n  S.res.creditos-=cost; S.fuel+=amt;\n  msg('Combustível +'+Math.round(amt)+' por '+cost+' créditos.','ECONOMIA');\n}\nfunction sellItem(si,pi,item){\n  const p=S.systems[si].planets[pi];\n  if(!p.hab){ msg('Só há loja em planetas habitados.','ECONOMIA'); return; }\n  if(needsTerra(p)){ msg('Terraforme este planeta para abrir a loja.','SISTEMA'); return; }\n  const q=Math.floor(S.cargo[item]);\n  if(q<=0) return;\n  const earn=Math.round(q*sellPrice(item,p));\n  S.cargo[item]-=q; S.res.creditos+=earn;\n  msg('Vendidos '+q+' de '+RES_NAME[item]+' por '+earn+' créditos.','ECONOMIA');\n  if((p.saleCd||0)<=0 && !owned(p)){ p.saleCd=60; addInf(si,pi,Math.min(6,earn/15),'Comércio aprovado.'); }\n}\n\n// ---------- Mineração ----------\nfunction nearMeteor(r){\n  let best=null, bd=r;\n  for(const m of S.meteors){ const d=dist(m.x,m.y,S.ship.x,S.ship.y); if(d<bd){ bd=d; best=m; } }\n  return best;\n}\nfunction toggleMine(){\n  if(S.sys!==null) return;\n  if(S.mining){ S.mining=false; msg('Mineração parada.','MINERACAO'); return; }\n  if(!nearMeteor(60)){ msg('Nenhum meteoro ao alcance.','MINERACAO'); return; }\n  if(cargoFree()<=0){ msg('Carga cheia.','MINERACAO'); return; }\n  S.mining=true; msg('Mineração iniciada.','MINERACAO');\n}\nfunction updateMining(dt){\n  if(!S.mining) return;\n  const m=nearMeteor(60);\n  if(!m){ S.mining=false; msg('Meteoro fora de alcance: mineração parada.','MINERACAO'); return; }\n  if(cargoFree()<=0){ S.mining=false; msg('Carga cheia: mineração parada.','MINERACAO'); return; }\n  const got=Math.min(3*dt,m.amt,cargoFree());\n  m.amt-=got; S.cargo[m.type]+=got;\n  if(Math.random()<0.2) (S.fx=S.fx||[]).push({x:m.x+rnd(-8,8),y:m.y+rnd(-8,8),t:0.3,col:m.type==='cristal'?'#7ae0f0':'#c0c4c8'});\n  if(m.amt<=0){\n    S.meteors=S.meteors.filter(x=>x!==m); S.mining=false;\n    msg('Meteoro esgotado.','MINERACAO');\n  }\n}\n\n// ---------- Diplomacia ----------\nfunction diplo(kind,sp){\n  if(!diploAllowed(sp)) return;\n  if(kind==='embaixada'){\n    const c={creditos:30};\n    if(!canPay(c)){ msg('Créditos insuficientes para embaixada.','DIPLO'); return; }\n    pay(c); S.rel[sp]=Math.min(REL_MAX,S.rel[sp]+(archOf(sp)==='Cientistas'?25:15));\n    msg('Embaixada enviada aos '+SPECIES[sp]+'. Relação: '+relName(S.rel[sp])+'.','DIPLO');\n  } else if(kind==='comercio'){\n    if(S.trade[sp]){ msg('Comércio já ativo com os '+SPECIES[sp]+'.','DIPLO'); return; }\n    if(S.rel[sp]<20){ msg('Os '+SPECIES[sp]+' só fazem comércio com relação de pelo menos 20.','DIPLO'); return; }\n    const c={materia:15};\n    if(!canPay(c)){ msg('Matéria insuficiente para o acordo.','DIPLO'); return; }\n    pay(c); S.trade[sp]=true;\n    msg('Acordo comercial com os '+SPECIES[sp]+': +1 crédito/s.','DIPLO');\n  } else if(kind==='ameaca'){\n    S.rel[sp]=Math.max(REL_MIN,S.rel[sp]-25); S.res.creditos+=20;\n    msg('Ameaça aos '+SPECIES[sp]+': tributo de 20 créditos. Relação: '+relName(S.rel[sp])+'.','DIPLO');\n  }\n}\n// Guerra e níveis: nações em guerra (ou com relação <= -30) são hostis; as demais só patrulham.\n// Arquétipos: cada povo tem uma filosofia que altera uma regra do jogo.\nconst ARCHS=['Comerciantes','Militaristas','Cientistas','Religiosos','Nômades'];\nfunction archOf(i){ return (S.arch||[])[i]||''; }\nfunction isHostile(i){ return !!S.war[i] || S.rel[i]<=-30; }\nfunction nationSys(i){ return S.systems.findIndex(s=>s.planets.some(p=>p.hab&&p.sp===i)); }\nfunction nLevel(i){ const c=playerPlanets().filter(p=>p.hab&&p.sp===i).length; return Math.min(5,1+Math.floor(c/2)); }\nfunction askWar(sp){\n  askDecision('Declarar guerra aos '+SPECIES[sp],'Naves dos '+SPECIES[sp]+' passam a atacar você e você pode atacá-las sem custo de relação. Esta decisão pausa o jogo. Confirmar?',[\n    {label:'Declarar guerra',run:()=>{ S.war[sp]=true; S.rel[sp]=Math.max(REL_MIN,S.rel[sp]-(archOf(sp)==='Militaristas'?15:30)); S.trade[sp]=false; msg('Guerra declarada aos '+SPECIES[sp]+'. Suas naves atacarão.','ALERTA'); }},\n    {label:'Cancelar',run:()=>{}}\n  ]);\n}\nfunction makePeace(sp){\n  if(!diploAllowed(sp)) return;\n  if(S.rel[sp]<-40){ msg('Os '+SPECIES[sp]+' recusam a paz por enquanto.','DIPLO'); return; }\n  if(!canPay({creditos:40})){ msg('Créditos insuficientes para negociar a paz.','DIPLO'); return; }\n  pay({creditos:40}); S.war[sp]=false; S.rel[sp]=Math.min(REL_MAX,S.rel[sp]+10);\n  msg('Paz com os '+SPECIES[sp]+'.','DIPLO');\n}\n// Limite de negociações: 3 por nação a cada ciclo de 180 s de jogo.\nconst DIPLO_LIMIT=3, DIPLO_CYCLE=180;\nfunction diploAllowed(sp){\n  S.diploUse=S.diploUse||[0,0,0,0,0];\n  if((S.diploUse[sp]||0)>=DIPLO_LIMIT){ msg('Os '+SPECIES[sp]+' já foram negociados neste ciclo. Novo ciclo em breve.','DIPLO'); return false; }\n  S.diploUse[sp]=(S.diploUse[sp]||0)+1; return true;\n}\nfunction updateDiploCycle(dt){\n  S.diploT=(S.diploT===undefined?DIPLO_CYCLE:S.diploT)-dt;\n  if(S.diploT>0) return;\n  S.diploT=DIPLO_CYCLE; S.diploUse=[0,0,0,0,0];\n  msg('Novo ciclo diplomático: cada povo pode ser negociado de novo.','DIPLO');\n}\nfunction diploHtml(sp){\n  const v=S.rel[sp];\n  return `<div class=\"stitle\">Relações com os ${SPECIES[sp]}<\/div>\n    <div>${relName(v)} (${Math.round(v)})${S.trade[sp]?' · comércio ativo':''} · negociações ${((S.diploUse||[])[sp])||0}/${DIPLO_LIMIT} neste ciclo<\/div>\n    <button class=\"btn\" onclick=\"diplo('embaixada',${sp});renderPanel()\" ${canPay({creditos:30})?'':'disabled'}>Embaixada · 30 créditos · +15 relação<\/button>\n    <button class=\"btn\" onclick=\"diplo('comercio',${sp});renderPanel()\" ${(S.trade[sp]||v<20||!canPay({materia:15}))?'disabled':''}>Acordo comercial · 15 matéria · +1 crédito/s<\/button>\n    <button class=\"btn\" onclick=\"diplo('ameaca',${sp});renderPanel()\">Ameaçar · tributo 20 créditos · -25<\/button>\n    ${S.war[sp]?`<button class=\"btn\" onclick=\"makePeace(${sp});renderPanel()\" ${canPay({creditos:40})?'':'disabled'}>Propor paz · 40 créditos · +10 relação<\/button>`:`<button class=\"btn\" onclick=\"askWar(${sp})\">Declarar guerra · naves deles viram hostis<\/button>`}`;\n}\nfunction relHtml(){\n  return SPECIES.slice(0,S.cfg.nations).map((n,i)=>`<div>${n} (${archOf(i)}): ${relName(S.rel[i])} (${Math.round(S.rel[i])})${S.war[i]?' · GUERRA':''}${S.trade[i]?' · comércio':''} · nível ${nLevel(i)}<\/div>`).join('');\n}\nfunction diplomacyTick(){\n  for(let i=0;i<S.cfg.nations;i++){\n    const hostile=isHostile(i);\n    if(hostile && !S.hostileWarned[i]){ S.hostileWarned[i]=true; msg('Os '+SPECIES[i]+' se tornaram hostis. Naves inimigas virão.','ALERTA'); }\n    else if(!hostile && S.hostileWarned[i] && S.rel[i]>-20){ S.hostileWarned[i]=false; msg('Os '+SPECIES[i]+' deixaram de ser hostis.','DIPLO'); }\n    if(S.rel[i]>0) S.rel[i]=Math.max(0,S.rel[i]-0.2);\n    else if(S.rel[i]<0) S.rel[i]=Math.min(0,S.rel[i]+0.2);\n    if(S.trade[i]){\n      if(S.rel[i]<0){ S.trade[i]=false; msg('Comércio com os '+SPECIES[i]+' encerrado por má relação.','DIPLO'); }\n      else S.res.creditos+=1;\n    }\n  }\n}\n\n// ---------- Pesquisa ----------\nfunction maxHp(){ return HULL_MAX; }\nfunction research(id){\n  const t=TECHS[id];\n  if(S.techs[id]) return;\n  const c={pesquisa:t.cost};\n  if(!canPay(c)){ msg('Pesquisa insuficiente para '+t.n+'.','SISTEMA'); return; }\n  pay(c); S.techs[id]=true; msg('Tecnologia descoberta: '+t.n+'.','SISTEMA');\n}\nfunction techHtml(){\n  return `<div class=\"stitle\">Pesquisa<\/div>`+Object.keys(TECHS).map(id=>{\n    const t=TECHS[id];\n    if(S.techs[id]) return `<div>[concluída] ${t.n} · ${t.desc}<\/div>`;\n    return `<button class=\"btn\" onclick=\"research('${id}')\" ${canPay({pesquisa:t.cost})?'':'disabled'}>${t.n} · ${t.cost} pesquisa<br><small>${t.desc}<\/small><\/button>`;\n  }).join('');\n}\n\n// ---------- Som (sintetizado) ----------\n// Trilha ambiente sintetizada: dois tons graves com oscilação lenta. Tecla V liga e desliga o som.\nlet AMB=null;\nfunction startAmbient(){\n  try{\n    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();\n    if(AMB) return;\n    const g=AC.createGain(); g.gain.value=0; g.connect(AC.destination);\n    const o1=AC.createOscillator(), o2=AC.createOscillator(), lfo=AC.createOscillator(), lg=AC.createGain();\n    o1.type='sine'; o1.frequency.value=55; o2.type='triangle'; o2.frequency.value=82.5;\n    lfo.frequency.value=0.05; lg.gain.value=0.012;\n    lfo.connect(lg); lg.connect(g.gain);\n    o1.connect(g); o2.connect(g);\n    o1.start(); o2.start(); lfo.start();\n    g.gain.setTargetAtTime(S&&S.muted?0:0.03,AC.currentTime,2);\n    AMB={g,o1,o2,lfo};\n  }catch(e){}\n}\nfunction toggleMute(){\n  if(!S) return;\n  S.muted=!S.muted;\n  applyAudio();\n  msg(S.muted?'Som desligado.':'Som ligado.','GERAL');\n}\nfunction beep(f,d,type){\n  if(S&&S.muted) return;\n  try{\n    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();\n    const o=AC.createOscillator(), g=AC.createGain();\n    o.type=type||'square'; o.frequency.value=f; g.gain.value=0.04;\n    o.connect(g); g.connect(AC.destination);\n    o.start(); o.stop(AC.currentTime+d);\n  }catch(e){}\n}\n\n// ---------- Combate ----------\nfunction fire(){\n  if(S.sys!==null || S.cd>0) return;\n  const sh=S.ship;\n  S.cd=FIRE_CD; beep(880,0.05,'square');\n  S.bullets.push({x:sh.x,y:sh.y,vx:Math.cos(sh.ang)*500+sh.vx*0.5,vy:Math.sin(sh.ang)*500+sh.vy*0.5,life:1.2,dmg:Math.round(PLAYER_BULLET_DMG*DMG_MUL)});\n}\nfunction spawnEnemy(){\n  const sh=S.ship;\n  const hostile=[];\n  for(let i=0;i<S.cfg.nations;i++) if(isHostile(i) && nationSys(i)>=0) hostile.push(i);\n  let x,y,sp=-1;\n  if(hostile.length && Math.random()<0.7){\n    sp=hostile[Math.floor(Math.random()*hostile.length)];\n    const hs=S.systems[nationSys(sp)], a=rnd(0,6.283), d=rnd(350,650);\n    x=hs.x+Math.cos(a)*d; y=hs.y+Math.sin(a)*d;\n  } else {\n    let tries=0;\n    do{ x=rnd(0,WORLD.w); y=rnd(0,WORLD.h); tries++; }\n    while(tries<50 && dist(x,y,sh.x,sh.y)<600);\n  }\n  x=Math.max(0,Math.min(WORLD.w,x)); y=Math.max(0,Math.min(WORLD.h,y));\n  const mhp=Math.round((sp>=0?40:30)*DIFF[S.cfg.diff].hp);\n  S.enemies.push({x,y,vx:0,vy:0,ang:0,hp:mhp,maxHp:mhp,cd:rnd(0.5,1.5),sp});\n}\nfunction spawnPatrol(i){\n  const si=nationSys(i); if(si<0) return;\n  const s=S.systems[si], hp=40;\n  S.enemies.push({x:s.x,y:s.y,vx:0,vy:0,ang:0,hp,maxHp:hp,cd:1,sp:i,patrol:true,home:si,ph:rnd(0,6.283)});\n}\n// Frota aliada: naves de povos aliados (relação 50+, sem guerra), limite = 2 x nível da nação.\nfunction allyCount(i){ return (S.allies||[]).filter(a=>a.sp===i).length; }\nfunction allyLimit(i){ return nLevel(i)*2; }\nfunction removeAlly(a,text){ S.allies=S.allies.filter(x=>x!==a); msg(text,'DIPLO'); }\nfunction recruitAlly(si,pi){\n  const p=S.systems[si].planets[pi];\n  if(!owned(p)||!p.hab){ msg('Recrutar só em planetas de povos que você conquistou.','DIPLO'); return; }\n  const i=p.sp;\n  if(S.war[i]||S.rel[i]<50){ msg('Os '+SPECIES[i]+' só cedem naves com relação de Aliados (50+).','DIPLO'); return; }\n  if(allyCount(i)>=allyLimit(i)){ msg('Limite de aliadas dos '+SPECIES[i]+' atingido (nível '+nLevel(i)+').','DIPLO'); return; }\n  if(!canPay({creditos:250})){ msg('Créditos insuficientes para recrutar.','ECONOMIA'); return; }\n  pay({creditos:250});\n  S.allies=S.allies||[];\n  S.allies.push({sp:i,x:S.ship.x,y:S.ship.y,vx:0,vy:0,ang:0,hp:60,maxHp:60,cd:0,slot:S.allies.length*1.1});\n  msg('Nave aliada dos '+SPECIES[i]+' recrutada.','DIPLO');\n}\nfunction alliHtml(si,pi){\n  const i=S.systems[si].planets[pi].sp, n=allyCount(i), lim=allyLimit(i);\n  return `<div class=\"stitle\">Frota aliada<\/div>\n    <div>${SPECIES[i]}: ${n}/${lim} naves · nível ${nLevel(i)} · manutenção 0,5 créditos/s cada<\/div>\n    <button class=\"btn\" onclick=\"recruitAlly(${si},${pi});renderPanel()\" ${(S.war[i]||S.rel[i]<50||n>=lim||!canPay({creditos:250}))?'disabled':''}>Recrutar nave aliada · 250 créditos<\/button>`;\n}\nfunction updateAllies(dt){\n  S.allies=S.allies||[];\n  if(!S.allies.length) return;\n  for(const a of S.allies.slice()) if(isHostile(a.sp)) removeAlly(a,'Nave aliada dos '+SPECIES[a.sp]+' desertou com a guerra.');\n  S.res.creditos-=0.5*S.allies.length*dt;\n  if(S.res.creditos<0){ S.res.creditos=0; if(S.allies.length) removeAlly(S.allies[S.allies.length-1],'Sem créditos para manter aliadas: uma nave deixou a frota.'); }\n  for(const b of S.bullets){\n    if(!b.enemy||b.life<=0) continue;\n    for(const a of S.allies){ if(dist(b.x,b.y,a.x,a.y)<10){ b.life=0; a.hp-=b.dmg; break; } }\n  }\n  for(const a of S.allies.slice()) if(a.hp<=0) removeAlly(a,'Nave aliada dos '+SPECIES[a.sp]+' foi destruída.');\n  const sh=S.ship;\n  for(const a of S.allies){\n    a.slot+=dt*0.5;\n    const tx=sh.x+Math.cos(a.slot)*70, ty=sh.y+Math.sin(a.slot)*70;\n    const dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy)||1, sp=Math.min(d*2,220);\n    a.vx=dx/d*sp; a.vy=dy/d*sp; a.x+=a.vx*dt; a.y+=a.vy*dt; a.ang=Math.atan2(a.vy,a.vx);\n    a.cd=Math.max(0,a.cd-dt);\n    let tgt=null, bd=380;\n    for(const e of S.enemies){\n      if(e.patrol && !isHostile(e.sp)) continue;\n      const dd=dist(e.x,e.y,a.x,a.y); if(dd<bd){ bd=dd; tgt=e; }\n    }\n    if(tgt && a.cd<=0){\n      a.cd=1; const ang=Math.atan2(tgt.y-a.y,tgt.x-a.x);\n      S.bullets.push({x:a.x,y:a.y,vx:Math.cos(ang)*450,vy:Math.sin(ang)*450,life:1,dmg:12,ally:true});\n    }\n  }\n}\n// Invasão: só contra povos em guerra. Chance depende da população do planeta e da sua frota.\nfunction invadeChance(p){\n  const def=Math.max(0.5,p.pop/25);\n  let att=1+(S.allies||[]).length*0.8;\n  if(S.techs.armamento) att+=0.5;\n  if(S.upg&&S.upg.canhao1) att+=0.4;\n  if(S.upg&&S.upg.canhao2) att+=0.4;\n  return Math.max(0.1,Math.min(0.9,att/(att+def)));\n}\nfunction invade(si,pi){\n  const p=S.systems[si].planets[pi];\n  if(owned(p)||!p.hab){ msg('Nada a invadir aqui.','COMBATE'); return; }\n  if(!S.war[p.sp]){ msg('Declare guerra aos '+SPECIES[p.sp]+' antes de invadir.','COMBATE'); return; }\n  const c={creditos:150,materia:20};\n  if(!canPay(c)){ msg('Recursos insuficientes para invadir.','COMBATE'); return; }\n  pay(c);\n  if(Math.random()<invadeChance(p)){\n    p.owner='player'; p.lvl=1; p.inf=100; p.mis=null;\n    msg('Invasão bem-sucedida: '+planetName(si,pi)+' agora é seu.','COMBATE');\n  } else {\n    if(S.allies&&S.allies.length) removeAlly(S.allies[0],'Invasão falhou: uma nave aliada foi perdida.');\n    else msg('Invasão falhou em '+planetName(si,pi)+'.','COMBATE');\n  }\n}\n// Defesa: povos em guerra contra-atacam seus planetas a cada 90 s. Bastiões e aliados defendem.\nfunction defense(p){ return p.lvl + (p.terra||0)*0.5 +(p.bld.bastiao||0)*2 + (p.hab?p.pop/50:0) + allyCount(p.sp)*0.5; }\nfunction updateRaids(dt){\n  S.raidT=(S.raidT===undefined?90:S.raidT)-dt;\n  if(S.raidT<=15 && !S.raidWarned){\n    S.raidWarned=true;\n    if(playerPlanets().some(p=>!p.base&&p.hab&&S.war[p.sp])) msg('Um povo em guerra prepara um contra-ataque em até 15 segundos.','ALERTA');\n  }\n  if(S.raidT>0) return;\n  S.raidT=90; S.raidWarned=false;\n  const targets=[];\n  for(const s of S.systems) for(const p of s.planets) if(owned(p)&&!p.base&&p.hab&&S.war[p.sp]) targets.push(p);\n  if(!targets.length) return;\n  const p=targets[Math.floor(Math.random()*targets.length)];\n  const si=S.systems.findIndex(s=>s.planets.includes(p));\n  const pi=S.systems[si].planets.indexOf(p);\n  const name=planetName(si,pi);\n  const att=1+nLevel(p.sp)*0.5, def=defense(p);\n  if(Math.random()<att/(att+def)){\n    p.owner=null; p.lvl=0; p.bld={}; p.depot={}; p.inf=0; p.mis=null;\n    msg(name+' foi perdido para os '+SPECIES[p.sp]+'.','ALERTA');\n  } else msg('Ataque dos '+SPECIES[p.sp]+' a '+name+' repelido.','COMBATE');\n}\n// Habilidades ativas: Q escudo (4 s, recarga 20 s); R pulso EMP (raio 300, desativa 4 s, recarga 25 s).\nfunction activateShield(){\n  if((S.shieldCd||0)>0){ msg('Escudo recarregando.','COMBATE'); return; }\n  S.shield=4; S.shieldCd=20; beep(660,0.15,'triangle');\n  msg('Escudo de energia ativo por 4 segundos.','COMBATE');\n}\nfunction activateEmp(){\n  if((S.empCd||0)>0){ msg('Pulso EMP recarregando.','COMBATE'); return; }\n  S.empCd=25; const sh=S.ship; let n=0;\n  for(const e of S.enemies){ if(dist(e.x,e.y,sh.x,sh.y)<300){ e.stun=4; n++; } }\n  (S.fx=S.fx||[]).push({x:sh.x,y:sh.y,t:0.5,col:'#7ae0f0'});\n  beep(1200,0.2,'square');\n  msg('Pulso EMP: '+n+' nave(s) desativada(s) por 4 segundos.','COMBATE');\n}\n// Anomalias: nave abandonada, buraco negro (atalho com dano) e ruína antiga (tecnologia grátis).\nfunction checkAnoms(){\n  const sh=S.ship;\n  for(const a of (S.anoms||[]).slice()){\n    if(dist(a.x,a.y,sh.x,sh.y)>80) continue;\n    S.anoms=S.anoms.filter(x=>x!==a);\n    if(a.kind==='nave'){\n      S.res.creditos+=120;\n      const add=Math.min(10,cargoFree()); S.cargo.cristal+=add;\n      msg('Nave abandonada: +120 créditos'+(add?' e '+add+' de cristal':'')+'.','EXPLORAR');\n    } else if(a.kind==='buraco'){\n      const dest=S.systems[Math.floor(Math.random()*S.systems.length)];\n      sh.x=dest.x+120; sh.y=dest.y+40; sh.vx=0; sh.vy=0; S.hp-=10;\n      msg('Buraco negro: atalho até '+dest.name+', com 10 de dano no casco.','EXPLORAR');\n    } else {\n      const left=Object.keys(TECHS).filter(k=>!S.techs[k]);\n      if(!left.length) msg('Ruína antiga: nada novo a aprender.','EXPLORAR');\n      else { const k=left[Math.floor(Math.random()*left.length)]; S.techs[k]=true; applyUpgrades(); msg('Ruína antiga revelou: '+TECHS[k].n+'.','EXPLORAR'); }\n    }\n    beep(440,0.2,'sine');\n  }\n}\n// Terraformação: 3 etapas (Atmosfera, Temperatura, Flora) em planetas seus, não-base.\n// Cada etapa dá +0,5 de matéria/s, +0,5 de defesa e acelera o crescimento da população.\nconst TERRA_NAMES=['Atmosfera','Temperatura','Flora'];\nfunction terraCost(p){ const t=p.terra||0; return {materia:20*(t+1),energia:15*(t+1)}; }\nfunction terraform(si,pi){\n  const p=S.systems[si].planets[pi];\n  if(p.base||(p.hab&&!owned(p))){ msg('Este planeta não pode ser terraformado.','SISTEMA'); return; }\n  const t=p.terra||0;\n  if(t>=3){ msg('Terraformação completa.','SISTEMA'); return; }\n  const c=terraCost(p);\n  if(!canPay(c)){ msg('Recursos insuficientes para terraformar.','SISTEMA'); return; }\n  pay(c); p.terra=t+1;\n  if(p.terra>=3 && !owned(p)) msg(planetName(si,pi)+' totalmente terraformado. Agora pode ser colonizado.','SISTEMA');\n  msg(planetName(si,pi)+': '+TERRA_NAMES[t]+' terraformada.','SISTEMA');\n}\nfunction terraHtml(p,si,pi){\n  const t=p.terra||0, c=terraCost(p);\n  return `<button class=\"btn\" onclick=\"terraform(${si},${pi});renderPanel()\" ${(t>=3||!canPay(c))?'disabled':''}>${t>=3?'Terraformação completa':'Terraformar: '+TERRA_NAMES[t]+' · '+costTxt(c)}<\/button>`;\n}\n// Escolta: leve as naves aliadas a um sistema seu e proteja-o por 45 s, perto dele.\nfunction updateEscort(dt){\n  S.escortCd=Math.max(0,(S.escortCd||0)-dt);\n  const al=S.allies||[];\n  if(!S.escort){\n    if(al.length && S.escortCd<=0){\n      const ownedSys=[];\n      S.systems.forEach((s,i)=>{ if(s.planets.some(q=>owned(q))) ownedSys.push(i); });\n      if(ownedSys.length){\n        const sys=ownedSys[Math.floor(Math.random()*ownedSys.length)];\n        const sp=al[Math.floor(Math.random()*al.length)].sp;\n        S.escort={sys,sp,phase:'ir',t:180,prot:0};\n        msg('Pedido de escolta dos '+SPECIES[sp]+': leve as naves aliadas a '+S.systems[sys].name+' e proteja por 45 s.','MISSAO');\n      }\n    }\n    return;\n  }\n  const e=S.escort, tgt=S.systems[e.sys];\n  if(!al.length){ msg('Escolta falhou: sem naves aliadas.','MISSAO'); S.escort=null; S.escortCd=120; return; }\n  const near=dist(S.ship.x,S.ship.y,tgt.x,tgt.y)<260;\n  if(e.phase==='ir'){\n    e.t-=dt;\n    if(e.t<=0){ msg('Escolta falhou: prazo esgotado.','MISSAO'); S.escort=null; S.escortCd=120; return; }\n    if(near){ e.phase='proteger'; msg('Escolta chegou a '+tgt.name+'. Proteja por 45 s.','MISSAO'); }\n  } else {\n    if(near) e.prot+=dt;\n    if(e.prot>=45){\n      S.res.creditos+=200; S.rel[e.sp]=Math.min(REL_MAX,S.rel[e.sp]+10);\n      msg('Escolta concluída: +200 créditos e relação com os '+SPECIES[e.sp]+' melhora.','MISSAO');\n      S.escort=null; S.escortCd=180;\n    }\n  }\n}\nfunction escortTxt(){\n  const e=S.escort; if(!e) return '';\n  const t=e.phase==='ir'?'levar aliadas a '+S.systems[e.sys].name+' ('+Math.ceil(e.t)+' s)':'proteger '+S.systems[e.sys].name+' ('+Math.ceil(45-e.prot)+' s)';\n  return `<span style=\"color:#ffb06a\"><b>[ESCOLTA] ${t}<\/b><\/span>`;\n}\nfunction respawn(){\n  const home=S.systems[0], sh=S.ship;\n  sh.x=home.x+90; sh.y=home.y; sh.vx=0; sh.vy=0; S.hp=maxHp(); S.mining=false;\n  S.bullets=[];\n  S.enemies=S.enemies.filter(e=>dist(e.x,e.y,sh.x,sh.y)>400);\n  for(const k of ['materia','ferro','cristal']){ S.cargo[k]=0; }\n  msg('Nave destruída. Reconstruída n
