<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atlas - v37 PC</title>
<style>
html,body{margin:0;height:100%;background:#1b2a3a;font-family:system-ui,sans-serif;color:#eee;overflow:hidden}
#hud{position:fixed;top:0;left:0;right:0;height:38px;background:rgba(30,30,28,.94);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;z-index:5;white-space:nowrap;overflow:hidden}
#hud b{color:#ffd84a}
.sp{background:#1f3b1f;color:#ffd84a;border:1px solid #0b1a0b;padding:3px 8px;cursor:pointer;font-size:12px;border-radius:4px}
.sp:hover{background:#2a4f2a}
.sp.on{background:#ffd84a;color:#1f3b1f;font-weight:bold}
.sp:disabled{opacity:.4;cursor:not-allowed}
#game{position:fixed;top:38px;left:0;right:0;bottom:200px}
canvas{display:block;width:100%;height:100%}
#bottom{position:fixed;bottom:0;left:0;right:0;height:200px;background:#4b5040;border-top:4px solid #2a2c22;z-index:5}
#tabs{display:flex;height:56px;background:#3d4233}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:none;background:#3d4233;color:#ddd;font-size:11px;gap:2px}
.tab.on{background:#c94a3c;color:#fff}
.tab canvas{width:24px;height:24px}
#grid{display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start;height:calc(100% - 56px);overflow:auto}
.ic{width:110px;height:76px;background:#2e3127;border:2px solid #111;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;text-align:center;line-height:1.1;padding:2px;box-sizing:border-box}
.ic.on{outline:2px solid #ffd84a}
.ic canvas{width:30px;height:30px}
.ic .cst{font-size:9px;color:#d8c28a;margin-top:2px}
.ic.dis{opacity:.45}
.unit{width:210px;height:auto;cursor:default;gap:4px;padding:6px}
.unit .row{display:flex;gap:4px}
.rbtn{background:#5a4a2a;color:#ffe9b0;border:1px solid #2b2010;border-radius:4px;padding:4px 6px;cursor:pointer;font-size:11px}
.rbtn:hover{background:#7a6a3a}
#infotxt{font-size:12px;color:#ddd;padding:6px;max-width:600px}
#card,#mgmt,#dip,#evp,#pop{position:fixed;display:none;background:#f3e6c4;color:#222;border:3px solid #6b4a2a;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.55);font-size:12px;z-index:10}
#card{padding:10px 12px;width:250px}
.emo{font-size:18px;line-height:1;display:inline-block;vertical-align:middle}
#card.unit{pointer-events:none;width:230px;padding:8px 10px}
#card.unit .cbtn{pointer-events:auto}
#card.unit:after{display:none}
.urow{margin:3px 0}.udot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;border:1px solid #2a1a05;vertical-align:middle}
.ustat{color:#6b5a3a;font-size:11px}.ulbl{font-size:11px;margin-top:5px}
.ubar{height:6px;background:#d8c49a;border:1px solid #6b4a2a;border-radius:3px;margin:2px 0;overflow:hidden}
.ubar i{display:block;height:100%;background:#7a9a4a}.ubar.hp i{background:#c04a3a}
.uacts{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}.uwar{color:#a0401a;margin-top:4px}
#card:after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#6b4a2a;border-bottom:0}
#mgmt,#dip,#evp{left:50%;top:50%;transform:translate(-50%,-50%);width:580px;max-height:76vh;overflow:auto;padding:14px 16px;z-index:12}
#pop{left:50%;top:50%;transform:translate(-50%,-50%);width:440px;max-height:80vh;overflow:auto;padding:16px 18px;z-index:60}
#card h4,#mgmt h3,#dip h3,#evp h3,#pop h3{margin:0 0 6px;color:#4a2e12}
#mgmt h3,#dip h3,#evp h3,#pop h3{font-size:16px}
#mgmt .sec,#dip .sec,#evp .sec{margin:8px 0 4px;padding-top:6px;border-top:1px solid #c9b382;font-weight:bold;color:#4a2e12}
#mgmt .stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
#mgmt input{width:60%;padding:4px 6px;border:1px solid #6b4a2a;border-radius:4px;background:#fff8e6}
#mgmt input[readonly]{background:#e9dcc0;border-style:dashed}
.cbtn{display:block;width:100%;box-sizing:border-box;margin:5px 0 0;padding:6px 8px;background:#5a4a2a;color:#ffe9b0;border:1px solid #2b2010;border-radius:5px;font-size:12px;cursor:pointer;text-align:center}
.cbtn:hover{background:#7a6a3a}
.cbtn:disabled{background:#8a8170;color:#c9c0a8;cursor:not-allowed}
.cbtn.sec2{background:#8a3a2a}
.cbtn.sec2:hover{background:#a84a3a}
.cbtn.on{background:#c9a24a;color:#2b1a05}
.cbtn.inl{display:inline-block;width:auto;margin:0 0 0 4px;padding:4px 10px}
#card .star{cursor:pointer;color:#8a7a5a;font-size:17px;margin-left:4px}
#card .star.on{color:#b8860b}
.cbtn.good{background:#2f6a3a}
.cbtn.good:hover{background:#3f8a4a}
body.bp-hidden #game{bottom:56px}
body.bp-hidden #bottom{transform:translateY(calc(100% - 56px))}
body.bp-hidden #msg,body.bp-hidden #tileinfo{bottom:70px}
#bpToggle{position:fixed;right:12px;bottom:200px;z-index:6;background:#3d4233;color:#ffe9b0;border:1px solid #2b2010;border-radius:6px 6px 0 0;padding:2px 14px;cursor:pointer;font-size:12px}
body.bp-hidden #bpToggle{bottom:56px}
#mini{position:fixed;left:10px;top:46px;width:150px;height:150px;border:2px solid #2a2c22;background:#000;z-index:6;cursor:pointer}
#ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:250px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(20,38,20,.92);padding:6px 10px;border-radius:8px;border:1px solid #0b1a0b}
#ctrl .crow{display:flex;gap:6px}
#ctrl .sp{font-size:16px;padding:6px 14px}
#ctrl .turnlbl{font-size:13px;color:#ffd84a;font-weight:bold}
body.bp-hidden #ctrl{bottom:72px}
.rc{display:inline-flex;align-items:center;gap:4px}
/* --- painéis --- */
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.tbl th{text-align:left;color:#4a2e12;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #c9b382;padding:5px 4px}
.tbl td{padding:6px 4px;border-bottom:1px solid #e0d2ae;vertical-align:middle}
.tbl tr:hover td{background:#efe2bf}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;color:#fff}
.dot{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid #2b1a05;vertical-align:middle;margin-right:6px}
.pos{color:#2a6a2a;font-weight:bold}
.neg{color:#a0401a;font-weight:bold}
.stitle{display:flex;align-items:center;gap:8px;font-size:12px;color:#4a2e12;font-weight:bold;margin:12px 0 4px;padding-bottom:4px;border-bottom:2px solid #c9b382;text-transform:uppercase;letter-spacing:.03em}
.resbox{border:1px solid #c9b382;border-radius:6px;padding:6px 8px;margin:6px 0;background:#f8eed2}
.rhead{display:flex;align-items:center;gap:8px;font-weight:bold;color:#3a2a10}
.rhead .rv{margin-left:auto;font-size:14px}
.rsrc{display:flex;align-items:center;gap:8px;padding:2px 0 2px 22px;font-size:12px;color:#3a2a10}
.rsrc .v{margin-left:auto}
.tl{border-left:3px solid #c9a24a;margin:0 0 0 6px;padding:2px 0 8px 12px;position:relative;font-size:12px}
.tl::before{content:'';position:absolute;left:-7px;top:4px;width:9px;height:9px;border-radius:50%;background:#4a2e12}
.tl .tn{font-weight:bold;color:#4a2e12;margin-right:6px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:12px;color:#3a2a10}
kbd{background:#1f3b1f;color:#ffd84a;border-radius:3px;padding:1px 6px;font-size:11px;font-family:inherit}
.step{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:12px;color:#3a2a10}
.step .n{flex:0 0 22px;height:22px;border-radius:50%;background:#1f3b1f;color:#ffd84a;font-weight:bold;text-align:center;line-height:22px}
.orow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #d8c8a0}
.orow .lbl{font-weight:bold;color:#3a2a10}
.orow .lbl small{display:block;font-weight:normal;color:#6b5a3a;font-size:11px}
.orow .ctl{display:flex;align-items:center;gap:6px}
.saveform{display:flex;gap:6px;margin:8px 0;padding:8px;background:#f8eed2;border:1px solid #c9b382;border-radius:6px}
.saveform input{flex:1;padding:6px;border:1px solid #6b4a2a;border-radius:4px}
.xclose{position:absolute;top:8px;right:10px;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:#8a3a2a;color:#fff;cursor:pointer;font-weight:bold;font-size:14px;z-index:2}
.xclose:hover{background:#a84a3a}
#pop h3{padding-right:34px}
.segs{display:flex;margin:6px 0 12px;border:2px solid #6b4a2a;border-radius:8px;overflow:hidden;background:#e4d3a6}
.seg{flex:1;padding:9px 6px;background:transparent;border:0;border-right:1px solid #a08a50;cursor:pointer;font-size:12px;font-weight:bold;color:#4a2e12;letter-spacing:.03em}
.seg:last-child{border-right:0}
.segs.citys{flex-wrap:wrap}
.segs.citys .seg{flex:1 1 auto;background:#efe2bf}
.segs.citys .seg.on{background:#4a2e12;color:#ffe9b0}
.seg:hover{background:#efe2bf}
.seg.on{background:#4a2e12;color:#ffe9b0}
.stbody{min-height:260px}
#pop .cbtn.inl{width:auto;display:inline-block;margin:2px 2px 0 0;padding:4px 8px}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;background:#d8c8a0;outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff8e6;border:2px solid #6b4a2a;cursor:pointer}
input[type=checkbox]{accent-color:#c9a24a;width:16px;height:16px;vertical-align:middle}
#pop .opts{display:flex;gap:8px;margin:6px 0}
#pop .opt{padding:6px 14px;border:2px solid #a08a50;background:#e4d3a6;border-radius:5px;cursor:pointer;font-weight:bold;color:#3a2a10}
#pop .opt.on{background:#c9a24a;border-color:#4a2e12}
#pop .opt.on::before{content:'';display:inline-block;width:9px;height:9px;background:#4a2e12;margin-right:6px}
#msg{position:fixed;left:10px;bottom:210px;font-size:12px;color:#fff;text-shadow:0 1px 2px #000;z-index:4;max-width:420px;pointer-events:none}
#tileinfo{position:fixed;right:10px;bottom:210px;background:rgba(20,20,18,.88);color:#eee;font-size:12px;padding:6px 10px;border-radius:4px;z-index:4;pointer-events:none;display:none}
#over{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{background:#f3e6c4;color:#222;border:3px solid #6b4a2a;border-radius:8px;padding:24px 28px;width:420px;text-align:center}
#over h2{margin:0 0 10px;color:#4a2e12}
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(#3b5a3a,#162418);z-index:40;flex-direction:column}
#screen .panel{background:rgba(243,230,196,.97);color:#222;border:4px solid #6b4a2a;border-radius:10px;padding:26px 30px;width:520px;max-height:90vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#screen h1{margin:0 0 4px;text-align:center;color:#4a2e12;font-size:34px;letter-spacing:2px}
#screen .sub{text-align:center;color:#6b5a3a;margin-bottom:18px}
#screen .row{margin:10px 0}
#screen .lbl{font-weight:bold;color:#4a2e12;margin-bottom:4px}
#screen .opts{display:flex;flex-wrap:wrap;gap:6px}
#screen .opt{padding:6px 10px;background:#e4d3a6;border:2px solid #a08a50;border-radius:5px;cursor:pointer;font-size:12px;color:#3a2a10}
#screen .opt.on{background:#c9a24a;border-color:#4a2e12;font-weight:bold}
#screen .emb{width:44px;height:44px;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center}
#screen input[type=text]{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #6b4a2a;border-radius:4px;background:#fff8e6;font-size:14px}
.saverow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #c9b382}
.saverow .nm{flex:1}
.saverow .dt{font-size:10px;color:#6b5a3a}
.saverow button{padding:3px 8px;font-size:11px}
#emb{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border:1px solid #c9a24a;border-radius:3px;color:#ffd84a;font-weight:bold;margin-right:4px}
#pop .slider{width:100%}
.segs.citys{margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pcard{background:#efe2bf;border:1px solid #c9b382;border-radius:8px;padding:8px 10px}
.pcard.wide{grid-column:1/-1}
.ptitle{font-weight:bold;color:#4a2e12;text-transform:uppercase;font-size:11px;letter-spacing:.05em;margin-bottom:4px;border-bottom:1px solid #c9b382;padding-bottom:3px}
.ptitle2{font-weight:bold;color:#4a2e12;font-size:11px;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.krow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.krow b{color:#2b1a05}
.hbig{display:flex;align-items:baseline;gap:8px;margin:4px 0}
.hbig b{font-size:24px;color:#4a2e12}
.hbig span{font-size:12px;color:#6b5a3a}
.frow{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px dotted #c9b382}
.frow .flbl{flex:1}
.fic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:14px;line-height:1}
.fic.pos{background:#2f7a3a}
.fic.neg{background:#a0401a}
.pos{color:#2f7a3a}
.neg{color:#a0401a}
.bonus{font-size:12px;color:#2f6a3a;background:#dfeccd;border-radius:4px;padding:4px 6px;margin:6px 0}

/* ===== v31: tema cartográfico (madeira escura, dourado, azul) ===== */
:root{
  --wood:#2a1d12; --wood2:#3b2918; --wood3:#4a3620;
  --gold:#d4a84a; --gold2:#f0d28a; --gold-dim:#8a6a2e;
  --blue:#1f3f66; --blue2:#2d5a8c; --blue-ink:#16304f;
  --parch:#ecd9a8; --parch2:#dcc38a; --ink:#2b1d0e; --red:#7a2e22;
}
html,body{font-family:Georgia,'Times New Roman',serif;background:#1a140c}
#hud{background:linear-gradient(#4a3620,#2a1d12);border-bottom:2px solid var(--gold);color:#f3e6c4;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#hud b{color:var(--gold2)}
.sp{background:linear-gradient(#2d5a8c,#1f3f66);color:var(--gold2);border:1px solid var(--gold);border-radius:3px}
.sp:hover{background:linear-gradient(#3a6ca3,#2d5a8c)}
.sp.on{background:var(--gold2);color:var(--blue-ink);border-color:var(--gold-dim)}
#bottom{background:linear-gradient(#3b2918,#2a1d12);border-top:3px solid var(--gold);box-shadow:0 -2px 8px rgba(0,0,0,.5)}
#tabs{background:#2a1d12;border-bottom:1px solid var(--gold-dim)}
.tab{background:#2a1d12;color:#e8d7a8;font-family:Georgia,serif}
.tab:hover{background:#3b2918}
.tab.on{background:linear-gradient(#2d5a8c,#1f3f66);color:var(--gold2);box-shadow:inset 0 -2px 0 var(--gold)}
.ic{background:linear-gradient(#f0e2b8,#d9c08a);border:2px solid #6b4a2a;border-radius:3px;color:var(--ink);box-shadow:inset 0 0 0 1px #f7ecc8,0 1px 2px rgba(0,0,0,.4)}
.ic:hover{outline:1px solid var(--gold)}
.ic.on{outline:2px solid var(--gold);background:linear-gradient(#f7e7b0,#e3c98e)}
.ic.dis{opacity:.5;filter:grayscale(.3)}
.ic .cst{color:#5a3a10}
#infotxt{color:#e8d7a8}
#card,#mgmt,#dip,#evp,#pop{background:linear-gradient(#f3e6c4,#e6d19a);border:3px double #6b4a2a;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 0 0 1px var(--gold)}
#card h4,#mgmt h3,#dip h3,#evp h3,#pop h3{color:var(--blue-ink);font-family:Georgia,serif;letter-spacing:.02em;border-bottom:1px solid var(--gold-dim);padding-bottom:4px}
#card:after{border-top-color:#6b4a2a}
.cbtn{background:linear-gradient(#2d5a8c,#1f3f66);color:#f6e7b8;border:1px solid var(--gold-dim);border-radius:3px;font-family:Georgia,serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.cbtn:hover{background:linear-gradient(#3a6ca3,#2d5a8c)}
.cbtn.sec2{background:linear-gradient(#8a3a2a,#5e2317);border-color:#4a1a10}
.cbtn.sec2:hover{background:linear-gradient(#a84a3a,#7a2e22)}
.cbtn.on{background:linear-gradient(#f0d28a,#d4a84a);color:var(--blue-ink);border-color:var(--gold-dim)}
.cbtn.good{background:linear-gradient(#3f7a4a,#2a5a34)}
.cbtn:disabled{background:#8a7a58;color:#d8caa0}
.stitle{color:var(--blue-ink);border-bottom:2px solid var(--gold-dim)}
.tbl th{color:var(--blue-ink);border-bottom:2px solid var(--gold-dim)}
.tbl td{border-bottom:1px solid #d2b67a}
.tbl tr:hover td{background:#e6d19a}
.segs{background:var(--parch2);border:2px solid #6b4a2a;border-radius:4px;box-shadow:inset 0 0 0 1px var(--gold)}
.seg{background:transparent;color:var(--blue-ink);border-right:1px solid var(--gold-dim)}
.seg:hover{background:#efe0b4}
.seg.on{background:linear-gradient(#2d5a8c,#1f3f66);color:var(--gold2)}
.segs.citys .seg{background:#efe0b4}
.segs.citys .seg.on{background:linear-gradient(#2d5a8c,#1f3f66);color:var(--gold2)}
.xclose{background:linear-gradient(#2d5a8c,#1f3f66);border:1px solid var(--gold);color:var(--gold2)}
.xclose:hover{background:var(--blue2)}
.pcard{background:rgba(255,246,214,.55);border:1px solid var(--gold-dim);border-radius:3px}
.ptitle{color:var(--blue-ink);border-bottom:1px solid var(--gold-dim)}
.ptitle2{color:var(--blue-ink)}
.frow{border-bottom:1px dotted var(--gold-dim)}
.hbig b{color:var(--blue-ink)}
.ubar{background:#d2b67a;border-color:#6b4a2a}
.ubar i{background:linear-gradient(#8fb35a,#5d8a34)}
.ubar.hp i{background:linear-gradient(#d86a50,#a0401a)}
#mini{border:2px solid var(--gold);box-shadow:0 0 0 2px #2a1d12}
#ctrl{background:linear-gradient(#3b2918,#2a1d12);border:1px solid var(--gold-dim)}
#bpToggle{background:linear-gradient(#3b2918,#2a1d12);color:var(--gold2);border:1px solid var(--gold)}
#screen{background:radial-gradient(ellipse at center,#2d5a8c 0%,#1f3f66 45%,#120c06 100%)}
#screen .panel{background:linear-gradient(#f3e6c4,#e0c98f);border:4px double #6b4a2a;box-shadow:0 8px 30px rgba(0,0,0,.7),inset 0 0 0 2px var(--gold)}
#screen h1{color:var(--blue-ink);text-shadow:0 1px 0 #f7ecc8}
#screen .opt{background:linear-gradient(#efe0b4,#d9c08a);border-color:var(--gold-dim)}
#screen .opt.on{background:linear-gradient(#f0d28a,#d4a84a)}
.resbox{background:rgba(255,246,214,.5);border:1px solid var(--gold-dim)}
.tl{border-bottom:1px dotted var(--gold-dim)}
#alerts{position:fixed;right:10px;top:50px;display:flex;flex-direction:column;gap:8px;z-index:7}
.alt{position:relative;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e2a0,#b8862e);border:2px solid #3b2918;box-shadow:0 2px 6px rgba(0,0,0,.6);color:#7a2e22;cursor:pointer;padding:0;font-family:Georgia,serif}
.altmark{font-size:22px;font-weight:bold;line-height:36px}
.altt{display:none;position:absolute;right:50px;top:9px;white-space:nowrap;background:#2a1d12;color:#f3e6c4;border:1px solid #d4a84a;padding:5px 9px;border-radius:3px;font-size:12px;font-weight:normal}
.alt:hover .altt{display:block}
#card.unit{pointer-events:auto!important;width:260px!important;padding:10px 12px}
#card.unit h4{font-size:15px}
#rcol{position:fixed;right:10px;top:42%;z-index:6;flex-direction:column;gap:8px}

// Pesquisa gasta a ciência acumulada até o custo do nó.
function researchTick(){
  const T=S.tech; if(!T||!T.cur) return;
  const t=TECHS.find(x=>x.id===T.cur); if(!t){ T.cur=null; return; }
  const put=Math.min(S.res.science||0,techCost(t)-(T.prog||0));
  if(put>0){ S.res.science-=put; T.prog=(T.prog||0)+put; led('science','pesquisa',-put); }
  if(T.prog>=techCost(t)){
    T.known.push(t.id); T.cur=null; T.prog=0;
    log('Tecnologia descoberta: '+t.n+'.'); hist('Descoberta: '+t.n+'.');
  }
}
function researchSet(id){
  const T=S.tech=S.tech||{known:[],cur:null,prog:0};
  if(T.known.includes(id)) return;
  if(T.cur!==id){ T.cur=id; T.prog=0; }
  log('Pesquisa iniciada: '+TECHS.find(x=>x.id===id).n+'.');
}

let AC=null, mGain=null, sGain=null, tenseGain=null, relaxGain=null, chordOscs=[], tenseOsc=null, lfoOsc=null, chordTimer=null, chordIdx=0, tenseLevel=0;
const CHORDS=[[261.6,329.6,392.0],[220.0,261.6,329.6],[174.6,220.0,261.6],[196.0,246.9,293.7]];
function ensureAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx) return;
  AC=new Ctx();
  mGain=AC.createGain(); mGain.gain.value=opts.music?opts.musicVol*0.5:0; mGain.connect(AC.destination);
  sGain=AC.createGain(); sGain.gain.value=opts.sound?opts.sfxVol:0; sGain.connect(AC.destination);
  // Música relaxante: acordes suaves em loop.
  relaxGain=AC.createGain(); relaxGain.gain.value=1; relaxGain.connect(mGain);
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.connect(relaxGain);
  for(let i=0;i<3;i++){
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=CHORDS[0][i];
    const g=AC.createGain(); g.gain.value=0; o.connect(g); g.connect(lp); o.start();
    chordOscs.push(o);
  }
  // Música tensa: pulso grave com filtro modulado, só ouvido em guerra.
  tenseGain=AC.createGain(); tenseGain.gain.value=0; tenseGain.connect(mGain);
  const tlp=AC.createBiquadFilter(); tlp.type='lowpass'; tlp.frequency.value=400; tlp.Q.value=6; tlp.connect(tenseGain);
  tenseOsc=AC.createOscillator(); tenseOsc.type='sawtooth'; tenseOsc.frequency.value=55; tenseOsc.connect(tlp); tenseOsc.start();
  lfoOsc=AC.createOscillator(); lfoOsc.frequency.value=2.2; const lg=AC.createGain(); lg.gain.value=300;
  lfoOsc.connect(lg); lg.connect(tlp.frequency); lfoOsc.start();
  chordTimer=setInterval(()=>{
    if(!AC) return;
    chordIdx=(chordIdx+1)%CHORDS.length;
    CHORDS[chordIdx].forEach((f,i)=>chordOscs[i].frequency.setTargetAtTime(f,AC.currentTime,0.8));
  },4000);
  setInterval(playMelody,1000);
  updateMusic(true);
}
// Melodia: notas da escala pentatônica sobre o acorde atual. Na guerra, soma um pulso grave.
const PENT=[0,2,4,7,9];
function playMelody(){
  if(!AC||!opts.music||!relaxGain) return;
  const root=CHORDS[chordIdx][0];
  const deg=PENT[Math.floor(Math.random()*PENT.length)]+(Math.random()<0.35?12:0);
  const f=root*Math.pow(2,deg/12)*(Math.random()<0.5?1:2);
  const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='triangle'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.07,t+0.25);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.8);
  o.connect(g); g.connect(relaxGain); o.start(t); o.stop(t+1.9);
  if(false){
    const k=AC.createOscillator(), kg=AC.createGain();
    k.frequency.setValueAtTime(120,t); k.frequency.exponentialRampToValueAtTime(40,t+0.25);
    kg.gain.setValueAtTime(0.5,t); kg.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    k.connect(kg); kg.connect(tenseGain); k.start(t); k.stop(t+0.35);
  }
}
function updateMusic(immediate){
  if(!AC) return;
  const want = (S && screen==='game' && playerAtWar()) ? 1 : 0;
  tenseLevel = want;
  const t=AC.currentTime, tc=immediate?0.05:2.0;
  tenseGain.gain.setTargetAtTime(0, t, tc);
  relaxGain.gain.setTargetAtTime(want?0.25:1, t, tc);
  mGain.gain.setTargetAtTime(opts.music?opts.musicVol*0.5:0, t, 0.3);
}
function playerAtWar(){
  if(!S) return false;
  return Object.entries(S.rel).some(([k,r])=>r.war && k.split('|').includes('0'));
}
// Efeitos sonoros curtos.
function tone(freq,dur,type,vol,slide){
  if(!AC||!opts.sound) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.2,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g); g.connect(sGain); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noise(dur,vol){
  if(!AC||!opts.sound) return;
  const len=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource(); src.buffer=buf;
  const g=AC.createGain(); g.gain.value=vol||0.3; src.connect(g); g.connect(sGain); src.start();
}
function sfx(name){
  if(!AC) return;
  if(name==='click') tone(660,0.06,'sine',0.15);
  else if(name==='build'){ tone(220,0.12,'square',0.12,330); setTimeout(()=>tone(440,0.1,'square',0.1),90); }
  else if(name==='attack'){ noise(0.25,0.35); tone(160,0.25,'sawtooth',0.15,80); }
  else if(name==='alert'){ tone(880,0.15,'triangle',0.2); setTimeout(()=>tone(660,0.25,'triangle',0.2),160); }
  else if(name==='turn') tone(330,0.05,'sine',0.08);
}
document.addEventListener('click',e=>{

// ---------- Utilidades ----------
function h2(x,y){ let n=(x*374761393+y*668265263)^(x<<5); n=(n^(n>>>13))*1274126177; return ((n^(n>>>16))>>>0)%1000/1000; }

// Livro-razão do turno: quanto cada fonte produziu (+) ou consumiu (-) de cada recurso.
function led(r,src,amt){ if(!S||!amt) return; S.ledger=S.ledger||{}; const L=S.ledger[r]=S.ledger[r]||{}; L[src]=(L[src]||0)+amt; }

    c.fillRect(ox+q*px,oy+r*px,px,px);

function yearStr(turn){
  const segs=[[75,40],[135,25],[175,20],[250,4],[300,3],[385,2]];
  let y=-4000,t=0;
  for(const [end,per] of segs){
    if(turn<=end){ y+=(turn-t)*per; return fmtY(y); }
    y+=(end-t)*per; t=end;
  }
  y+=(turn-t); return fmtY(y);
}
function fmtY(y){ y=Math.floor(y); return y<0?(-y)+' a.C.':y+' d.C.'; }

  invalidate();
  log('Uma nova tribo nasceu junto à fogueira.');
  const c=S.cities[0];
  const t=nextRingTile(c); if(t) g[t.y][t.x].b={type:'casa',cid:c.id,pid:0,level:1,stage:1,workers:0};
  invalidate();
  computeNetwork(); computeContacts();
  screen='game'; modal=null;
  resize(); centerCam();
  renderAll();
}

// ---------- Cidades e pessoas ----------
function pname(pid){ return pid===0?S.tribe:S.ai[pid-1].name; }
function pcolor(pid){ return pid===0?'#c9a24a':S.ai[pid-1].color; }
function peopleCities(pid){ return pid===0?S.cities:S.ai[pid-1].cities; }
function allCities(){ return S.cities.concat(...S.ai.map(p=>p.cities)); }
function cityById(id){ return allCities().find(c=>c.id===id); }
function cityOwner(c){ return c.pid||0; }
function capital(){ return S.cities.find(c=>c.capital)||S.cities[0]; }
function nearestCity(x,y,list){
  let best=null,bd=1e9;
  for(const c of (list||S.cities)){ const d=Math.max(Math.abs(x-c.x),Math.abs(y-c.y)); if(d<bd){bd=d;best=c;} }
  return best;
}
function cityBuildings(cid){ return buildingsList().filter(o=>o.b.cid===cid); }
function countType(t,cid){ return buildingsList().filter(o=>o.b.type===t && (o.b.pid||0)===0 && (cid===undefined||o.b.cid===cid)).length; }
function houses(cid){ return countType('casa',cid); }
function totalPop(cid){ const cs=cid?[cityById(cid)]:S.cities; return cs.reduce((s,c)=>s+c.adults+c.children,0); }
function capPop(cid){ return houses(cid)*4; }
function maxHouses(c){ return HOUSE_MAX_LVL[c.level-1]; }
function terrR(c){ return 4+(c.level||1); }
function inBase(x,y,c){ return dist(x,y,c.x,c.y)<=terrR(c); }
function nearBuild(x,y,pid){ pid=pid||0; for(const o of buildingsList()) if((o.b.pid||0)===pid && dist(x,y,o.x,o.y)<=2) return true; return false; }
function dist(a,b,c,d){ return Math.max(Math.abs(a-c),Math.abs(b-d)); }
function countTerrain(x,y,r,t){
  let n=0;
  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    const X=x+dx,Y=y+dy;
    if(X>=0&&Y>=0&&X<N&&Y<N&&S.grid[Y][X].t===t) n++;
  }
  return n;
}
function depleteOne(x,y,r,t,to){
  for(let i=0;i<20;i++){
    const X=x+Math.floor(Math.random()*(2*r+1))-r, Y=y+Math.floor(Math.random()*(2*r+1))-r;
    if(X>=0&&Y>=0&&X<N&&Y<N&&S.grid[Y][X].t===t){ S.grid[Y][X].t=to; return; }
  }
}

// ---------- Rede de estradas ----------
function computeNetwork(){
  conn=new Map();
  let nid=0;
  const comp=new Map();
  for(const c of S.cities){
    const k=key(c.x,c.y);
    if(comp.has(k)){ c.net=comp.get(k); continue; }
    const id=nid++;
    comp.set(k,id);
    const q=[[c.x,c.y]];
    while(q.length){
      const [x,y]=q.shift();
      for(const [dx,dy] of DIRS){
        const nx=x+dx, ny=y+dy;
        if(nx<0||ny<0||nx>=N||ny>=N) continue;
        const nk=key(nx,ny); if(comp.has(nk)) continue;
        const t=S.grid[ny][nx].b;
        if(t && (t.type==='estrada'||t.type==='base') && (t.pid||0)===0){ comp.set(nk,id); q.push([nx,ny]); }
      }
    }
    c.net=id;
  }
  for(const [k,v] of comp) conn.set(k,v);
  for(const o of buildingsList()){
    if(o.b.type==='estrada'||o.b.type==='base') continue;
    if((o.b.pid||0)!==0) continue;
    for(const [dx,dy] of DIRS){
      const nk=key(o.x+dx,o.y+dy);
      if(comp.has(nk)){ conn.set(key(o.x,o.y),comp.get(nk)); break; }
    }
  }
}
function isConn(x,y){ return conn.has(key(x,y)); }
function netOf(x,y){ return conn.get(key(x,y)); }
function netCount(net,type){ return buildingsList().filter(o=>o.b.type===type && (o.b.pid||0)===0 && netOf(o.x,o.y)===net).length; }
function roadish(x,y){ return x>=0&&y>=0&&x<N&&y<N&&!!S.grid[y][x].b; }

// ---------- Contato e relações ----------
function relKey(a,b){ return a<b?a+'|'+b:b+'|'+a; }
function relGet(a,b){
  const k=relKey(a,b);
  if(!S.rel[k]) S.rel[k]={conf:0,war:false,pacto:false,pactTurn:-99,comercio:false,alianca:false,traitorUntil:-1};
  return S.rel[k];
}
function livingPids(){ return [0].concat(S.ai.filter(p=>!p.dead).map(p=>p.pid)); }
function computeContacts(){
  contacts=new Set(Object.keys(S.metMap||{}));
  // Povos se conhecem ao avistar construções ou unidades (dentro do alcance de visão).
  if(VIS){
    for(const o of buildingsList()){ const p=o.b.pid||0; if(p!==0 && seen(o.x,o.y)){ S.metMap=S.metMap||{}; S.metMap[relKey(0,p)]=1; contacts.add(relKey(0,p)); } }
    for(const g of S.groups){ const p=gPid(g); if(p!==0 && seen(g.x,g.y)){ S.metMap=S.metMap||{}; S.metMap[relKey(0,p)]=1; contacts.add(relKey(0,p)); } }
  }
  const pids=livingPids();
  for(let i=0;i<pids.length;i++) for(let j=i+1;j<pids.length;j++){
    const A=peopleCities(pids[i]), B=peopleCities(pids[j]);
    let hit=false;
    for(const a of A){ for(const b of B){ if(dist(a.x,a.y,b.x,b.y)<=CONTACT_DIST){ hit=true; break; } } if(hit) break; }
    if(hit) contacts.add(relKey(pids[i],pids[j]));
  }
}
function contactOf(a,b){ return a!==b && contacts.has(relKey(a,b)); }

// ---------- Unidades e grupos ----------
function gPid(g){ return g.pid||0; }
function groupsOf(pid){ return S.groups.filter(g=>gPid(g)===pid); }
function groupSpace(g){ return Object.keys(g.units).reduce((s,t)=>s+UNITS[t].space*g.units[t],0); }
function groupCount(g){ return Object.keys(g.units).reduce((s,t)=>s+g.units[t],0); }
// Fração de vida do grupo (mínimo 5%): grupo ferido combate com menos força.
function groupFrac(g){ return g.hp==null?1:Math.max(0.05,g.hp/groupHpMax(g)); }
function groupPower(g){ return Object.keys(g.units).reduce((s,t)=>s+UNITS[t].atk*g.units[t],0)*groupFrac(g); }
function groupDef(g){ return Object.keys(g.units).reduce((s,t)=>s+(UNITS[t].def||0)*g.units[t],0)*groupFrac(g); }
// Dano potencial contra construções (sem multiplicador de ataque).
function groupSiege(g){ return Object.keys(g.units).reduce((s,t)=>s+(BLD_DMG[t]||1)*g.units[t],0)*groupFrac(g); }
function groupAt(x,y){ return S.groups.find(g=>g.x===x&&g.y===y); }
function groupById(id){ return S.groups.find(g=>g.id===id); }
function armyCount(pid){ return groupsOf(pid).reduce((s,g)=>s+groupCount(g),0); }
function armyPower(pid){ return groupsOf(pid).reduce((s,g)=>s+groupPower(g),0); }
function scaleGroup(g,frac){
  for(const t of Object.keys(g.units)){ g.units[t]=Math.max(0,Math.round(g.units[t]*frac)); if(g.units[t]<=0) delete g.units[t]; }
  if(g.hp!=null) g.hp=Math.min(g.hp,groupHpMax(g));
}
function pruneGroups(){ S.groups=S.groups.filter(g=>groupCount(g)>0 && (g.hp==null||g.hp>0)); }
function loseArmy(pid,frac){
  for(const g of groupsOf(pid)) scaleGroup(g,1-frac);
  pruneGroups();
}
function ringAround(c,r){
  const out=[];
  for(let dx=-r;dx<=r;dx++) out.push({x:c.x+dx,y:c.y-r});
  for(let dy=-r+1;dy<=r;dy++) out.push({x:c.x+r,y:c.y+dy});
  for(let dx=r-1;dx>=-r;dx--) out.push({x:c.x+dx,y:c.y+r});
  for(let dy=r-1;dy>=-r+1;dy--) out.push({x:c.x-r,y:c.y+dy});
  return out.filter(p=>p.x>=0&&p.y>=0&&p.x<N&&p.y<N);
}
function freeTileNear(c){
  for(let r=1;r<=5;r++) for(const p of ringAround(c,r)){
    const tile=S.grid[p.y][p.x];
    if(!tile.b && tile.t!=='rio' && !groupAt(p.x,p.y)) return p;
  }
  return null;
}
function spawnUnit(type,pid){
  pid=pid||0;
  const c=pid===0?capital():cityById(S.ai[pid-1].cities[0].id);
  const p=freeTileNear(c); if(!p) return false;
  S.groups.push({id:S.gid++,pid,x:p.x,y:p.y,units:{[type]:1},movedTurn:-1});
  return true;
}
function mergeGroups(srcId,dstId){
  const a=groupById(srcId), b=groupById(dstId);
  if(!a||!b||a===b) return;
  if(groupSpace(a)+groupSpace(b)>GROUP_MAX){ log('Grupo passaria de '+GROUP_MAX+' de espaço.'); return; }
  for(const t of Object.keys(a.units)) b.units[t]=(b.units[t]||0)+a.units[t];
  S.groups=S.groups.filter(g=>g.id!==srcId);
  log('Grupos unidos ('+groupSpace(b)+'/'+GROUP_MAX+' de espaço).');
  S.selGroup=dstId;
}
function battle(a,b){
  const pa=groupPower(a)+groupDef(a)*0.5, pb=groupPower(b)+groupDef(b)*0.5;
  sfx('attack');
  const hi=Math.max(pa,pb,1), lo=Math.min(pa,pb);
  // Lei de Lanchester: o vencedor sai com a raiz da força que sobra.
  const left=Math.max(0.1,Math.sqrt(Math.max(0,1-(lo/hi)**2)));
  const [w,l]=pa>=pb?[a,b]:[b,a];
  scaleGroup(w,left); damageGroup(w,0.15);
  S.groups=S.groups.filter(g=>g!==l);
  log(pname(gPid(w))+' venceu uma batalha.');
  return w;
}
function bMaxHp(b){
  const d=DEF[b.type]||{};
  const base=b.type==='base'?120:(d.hp||40);
  return Math.round(base*(1+0.5*((b.level||1)-1)));
}
function ensureHp(b){ if(b.hp==null) b.hp=bMaxHp(b); }
function groupHpMax(g){ return Math.max(10,groupSpace(g)*10); }
function damageGroup(g,frac){ if(g.hp==null) g.hp=groupHpMax(g); const lost=groupHpMax(g)*frac; g.hp=Math.max(0,g.hp-lost); fxAdd(g.x,g.y,'-'+Math.round(lost),'#ff6a5a'); }
function inOwnTerritory(x,y,pid){ return peopleCities(pid).some(c=>Math.max(Math.abs(c.x-x),Math.abs(c.y-y))<=8); }
function healTick(){
  for(const o of buildingsList()){
    const b=o.b; if(b.type==='ruina'||b.hp==null) continue;
    const mx=bMaxHp(b); if(b.hp>=mx) continue;
    if(inOwnTerritory(o.x,o.y,b.pid||0)) b.hp=Math.min(mx,b.hp+mx*0.08);
  }
  for(const g of S.groups){
    const mx=groupHpMax(g), cur=g.hp==null?mx:g.hp; if(cur>=mx) continue;
    if(inOwnTerritory(g.x,g.y,gPid(g))) g.hp=Math.min(mx,cur+mx*0.1);
  }
}
function ruinTile(x,y,attackerPid){
  const t=S.grid[y][x], b=t.b; if(!b||b.type==='ruina') return;
  const d=DEF[b.type];
  if(d && d.c && attackerPid===0){
    const loot={}; for(const k in d.c) loot[k]=Math.floor(d.c[k]*0.3);
    for(const k in loot) S.res[k]=(S.res[k]||0)+loot[k];
    log('Saque: '+d.n+' rendeu '+costStr(loot)+'.');
    fxAdd(x,y,'Saque +'+Object.values(loot).reduce((a,v)=>a+v,0),'#ffd84a',false,14);
  }
  t.b={type:'ruina',orig:b.type,cid:b.cid,pid:b.pid||0};
  fxAdd(x,y,'Destruída','#ff5a4a',true);
  invalidate(); computeNetwork();
}
function damageCity(c,dmg,attackerPid){
  const list=cityBuildings(c.id).filter(o=>o.b.type!=='ruina'&&o.b.type!=='base'&&o.b.type!=='estrada');
  list.sort((a,b)=>(b.b.type==='muralha')-(a.b.type==='muralha'));
  for(const o of list){
    if(dmg<=0) break;
    const b=o.b; ensureHp(b);
    const take=Math.min(b.hp,dmg); b.hp-=take; dmg-=take; fxAdd(o.x,o.y,'-'+Math.round(take),'#ffb05a');
    if(b.hp<=0){ log(DEF[b.type].n+' de '+c.name+' foi destruída.'); ruinTile(o.x,o.y,attackerPid); }
  }
}
function enemyAt(x,y){
  const eg=groupAt(x,y); if(eg && gPid(eg)!==0) return {pid:gPid(eg),kind:'move'};
  const b=S.grid[y][x].b;
  if(b && (b.pid||0)!==0 && b.type!=='estrada' && b.type!=='ruina') return {pid:b.pid,kind:'bld'};
  return null;
}
function canEnter(x,y){
  const t=S.grid[y][x];
  if(t.t==='rio') return false;
  return !t.b || t.b.type==='estrada' || t.b.type==='ruina';
}
function defensePower(c){
  const owner=cityOwner(c);
  let wall=0;
  for(const o of cityBuildings(c.id)){
    const b=o.b; if(b.type==='ruina'||b.type==='estrada') continue;
    const hp=b.hp==null?bMaxHp(b):b.hp;
    wall+= b.type==='muralha'? hp/25 : hp/120;
  }
  return armyCount(owner)*2.5 + c.level*4 + (c.capital?4:0) + wall;
}
function attackGroupOnCity(g,c){
  const owner=cityOwner(c), r=relGet(gPid(g),owner);
  const atk=groupPower(g), def=defensePower(c);
  g.movedTurn=S.turn;
  sfx('attack');
  if(atk>def){
    scaleGroup(g,0.8); loseArmy(owner,0.3); r.conf-=40;
    destroyCity(c,'por '+pname(gPid(g)),gPid(g));
    pruneGroups();
    return true;
  }
  damageCity(c,atk*0.6,gPid(g));
  damageGroup(g,0.2);
  scaleGroup(g,0.6); loseArmy(owner,0.1); pruneGroups();
  log(pname(gPid(g))+' foi repelido em '+c.name+'.');
  fxAdd(g.x,g.y,'Repelido','#ff8a5a',true);
  return false;
}
function attackBuilding(g,x,y){
  const b=S.grid[y][x].b;
  if(!b || (b.pid||0)===0 || dist(g.x,g.y,x,y)!==1){ log('Precisa estar encostado no alvo.'); return; }
  if(b.type==='base'){ const c=cityById(b.cid); if(c) attackGroupOnCity(g,c); return; }
  if(g.movedTurn===S.turn){ log('Este grupo já agiu neste turno.'); return; }
  ensureHp(b);
  const dmgB=groupSiege(g)*2; b.hp-=dmgB; fxAdd(x,y,'-'+Math.round(dmgB),'#ffb05a');
  g.movedTurn=S.turn; scaleGroup(g,0.85); damageGroup(g,0.05); pruneGroups(); sfx('attack');
  if(b.hp<=0){ log((DEF[b.type]?DEF[b.type].n:'Construção')+' de '+pname(b.pid)+' foi destruída.'); ruinTile(x,y,0); }
  else log('Construção de '+pname(b.pid)+' sofreu dano.');
}
function reconstruir(x,y){
  const t=S.grid[y][x], b=t.b;
  if(!b || b.type!=='ruina' || b.orig==='base' || (b.pid||0)!==0) return;
  const od=DEF[b.orig]; if(!od) return;
  if(groupAt(x,y)){ log('Há tropas neste tile.'); return; }
  const c2={}; for(const k in od.c) c2[k]=od.c[k]*2;
  if(!canPay(c2)){ log('Recursos insuficientes para reconstruir.'); return; }
  pay(c2);
  t.b={type:b.orig,level:1,workers:0,cid:b.cid,pid:0,hp:bMaxHp({type:b.orig,level:1})};
  log(od.n+' reconstruída pelo dobro do custo.');
  invalidate(); computeNetwork();
}
function runPending(){
  const pm=pendingMove; pendingMove=null; modal=null;
  const g=pm && groupById(pm.gid);
  if(g){
    if(pm.declare) declareWar(0,pm.pid);
    if(pm.kind==='bld') attackBuilding(g,pm.x,pm.y); else moveNow(g,pm.x,pm.y);
  }
  renderAll();
}
function moveNow(g,x,y){
  const res=tryStep(g,x,y);
  if(res==='longe') log('Só dá para andar 1 tile por turno.');
  else if(res==='ja') log('Este grupo já se moveu neste turno.');
  else if(res==='bloqueado') log('O terreno ou uma construção bloqueia o caminho.');
  else if(res==='ocupado') log('Já há suas unidades neste tile.');
  else if(res==='paz') log('Vocês não estão em guerra. Não é possível entrar no tile.');
  S.sel={x:g.x,y:g.y};
}
function moveSelected(x,y){
  const g=groupById(S.selGroup); if(!g) return;
  const en=enemyAt(x,y);
  if(en && dist(g.x,g.y,x,y)===1){
    const war=relGet(0,en.pid).war;
    const isB=en.kind==='bld';
    pendingMove={gid:g.id,x,y,kind:en.kind,pid:en.pid,declare:!war,
      title: war?(isB?'Atacar construção?':'Atacar?'):'Declarar guerra?',
      text: (isB?'Construção de ':'Grupo de ')+pname(en.pid)+(war?'.':'. Vocês não estão em guerra; confirmar declara guerra.'),
      ok: war?'Atacar':'Declarar guerra e atacar'};
    modal='confirm'; renderAll(); return;
  }
  moveNow(g,x,y);
}
// Alcance de movimento: tropas avançadas andam mais; estrada dá +1.
function moveRange(g){
  let r=1;
  const types=Object.keys(g.units);
  if(types.some(t=>UNITS[t].acad>=3)) r=2;
  if(types.some(t=>UNITS[t].acad>=4)) r=3;
  const b=S.grid[g.y][g.x].b;
  if(b && b.type==='estrada') r+=(b.level||1)+(hasTech('estp')?1:0);
  return r;
}
function tryStep(g,x,y){
  if(dist(g.x,g.y,x,y)>moveRange(g)||dist(g.x,g.y,x,y)<1) return 'longe';
  if(g.movedTurn===S.turn) return 'ja';
  if(!canEnter(x,y)) return 'bloqueado';
  const other=groupAt(x,y);
  if(other){
    if(gPid(other)===gPid(g)) return 'ocupado';
    const r=relGet(gPid(g),gPid(other));
    if(!r.war) return 'paz';
    const w=battle(g,other);
    g.movedTurn=S.turn;
    if(w===g){ g.x=x; g.y=y; }
    pruneGroups();
    return 'batalha';
  }
  g.x=x; g.y=y; g.movedTurn=S.turn;
  return 'ok';
}
function attackWithSelected(cid){
  const g=groupById(S.selGroup); const c=cityById(cid);
  if(!g||!c){ log('Selecione um grupo para atacar.'); return; }
  if(dist(g.x,g.y,c.x,c.y)>1){ log('O grupo precisa estar encostado na cidade para atacar.'); return; }
  const r=relGet(0,cityOwner(c));
  if(!r.war){ log('Sem guerra com '+pname(cityOwner(c))+'.'); return; }
  attackGroupOnCity(g,c);
  S.selGroup=null;
}
function armySpace(){
  let s=0;
  for(const g of groupsOf(0)) s+=groupSpace(g);
  for(const q of S.queue) s+=UNITS[q.type].space;
  return s;
}

// ---------- IAs: exército, movimento e decisões ----------
function aiGroupsTurn(){
  for(const p of S.ai){
    if(p.dead) continue;
    const cap=p.cities.find(c=>c.capital)||p.cities[0];
    for(const g of groupsOf(p.pid).slice()){
      if(!S.groups.includes(g)) continue;
      if(g.movedTurn===S.turn) continue;
      let target=null, best=1e9;
      for(const q of livingPids()){
        if(q===p.pid||!relGet(p.pid,q).war) continue;
        for(const c of peopleCities(q)){
          const d=dist(g.x,g.y,c.x,c.y);
          if(d<best && d<=15){ best=d; target={kind:'city',c}; }
        }
      }
      if(!target){
        for(const eg of S.groups){
          if(gPid(eg)===p.pid) continue;
          if(!relGet(p.pid,gPid(eg)).war) continue;
          const d=dist(g.x,g.y,eg.x,eg.y);
          if(d<best && d<=6){ best=d; target={kind:'group',eg}; }
        }
      }
      if(target && target.kind==='city' && dist(g.x,g.y,target.c.x,target.c.y)<=1){
        attackGroupOnCity(g,target.c);
        continue;
      }
      if(target && target.kind==='group' && dist(g.x,g.y,target.eg.x,target.eg.y)<=1){
        tryStep(g,target.eg.x,target.eg.y);
        continue;
      }
      let gx=cap.x, gy=cap.y;
      if(target){ gx = target.kind==='city'?target.c.x:target.eg.x; gy = target.kind==='city'?target.c.y:target.eg.y; }
      else if(dist(g.x,g.y,cap.x,cap.y)<=3) continue;
      let bestStep=null, bestD=dist(g.x,g.y,gx,gy);
      for(const [dx,dy] of DIRS8){
        const nx=g.x+dx, ny=g.y+dy;
        if(nx<0||ny<0||nx>=N||ny>=N) continue;
        const d=dist(nx,ny,gx,gy);
        if(d<bestD){ bestD=d; bestStep=[nx,ny]; }
      }
      if(bestStep) tryStep(g,bestStep[0],bestStep[1]);
    }
  }
  pruneGroups();
}
function aiTrain(p){
  if(p.dead) return;
  if(S.turn-p.lastTrain<3) return;
  p.lastTrain=S.turn;
  const cap=p.cities.find(c=>c.capital)||p.cities[0];
  const level=cap.level;
  const limit=p.cities.length*4+4;
  if(armyCount(p.pid)>=limit) return;
  const type = level>=3?'infantaria':level>=2?pick(['lanceiro','arqueiro']):'cacador';
  const cost=UNITS[type].manut*2;
  if(p.res.ouro<cost) return;
  const fc=freeTileNear(cap); if(!fc) return;
  p.res.ouro-=cost;
  S.groups.push({id:S.gid++,pid:p.pid,x:fc.x,y:fc.y,units:{[type]:1},movedTurn:-1});
}
function aiUpkeep(p){
  let up=0;
  for(const g of groupsOf(p.pid)) for(const t of Object.keys(g.units)) up+=UNITS[t].manut*g.units[t];
  p.res.ouro-=up*0.5;
  if(p.res.ouro<0) p.res.ouro=0;
}

// ---------- Construção do jogador ----------
function canPay(c){ for(const k in c) if((S.res[k]||0)<c[k]) return false; return true; }
function pay(c){ for(const k in c) S.res[k]-=c[k]; }
function costStr(c){ return Object.entries(c).map(([k,v])=>v+' '+(RES_NAME[k]||k)).join(', '); }
function maxLevel(){ return Math.max(...S.cities.map(c=>c.level)); }
function unlocked(d){ return (!d.era || maxLevel()>=d.era) && (!d.tech || hasTech(d.tech)); }
// Texto da dica de item bloqueado: diz como desbloquear.
function lockTip(d){
  if(d.tech&&!hasTech(d.tech)) return d.n+' precisa da tecnologia '+((TECHS.find(t=>t.id===d.tech)||{n:d.tech}).n)+'.';
  const r=BASE_REQ[d.era];
  return d.n+' está bloqueado. Para desbloquear, eleve a base ao Nível '+d.era+': '+(r?r.score+' pontos de construção conectados à base e '+costStr(r.cost)+'.':'')+' Construções conectadas por estrada e melhoradas valem mais pontos.';
}
function unitUnlocked(u){ return acadLevel()>=u.acad && countType(u.req||'quartel')>=1; }

function nextRingTile(c){
  for(let r=1;r<=8;r++) for(const p of ringAround(c,r)){
    const tile=S.grid[p.y][p.x];
    if(!tile.b && tile.t!=='rio') return p;
  }
  return null;
}
function canPlace(type,x,y){
  const tile=S.grid[y][x], d=DEF[type];
  if(!seen(x,y)) return 'Área não explorada.';
  if(tile.b) return 'Tile ocupado.';
  if(groupAt(x,y)) return 'Há unidades neste tile.';
  if(tile.t==='rio') return 'Não construa no rio.';
  const c=nearestCity(x,y,S.cities);
  if(!inBase(x,y,c)) return 'Fora do território da cidade (cresce com o nível da base).';
  if(!nearBuild(x,y)) return 'Construa a até 2 tiles de outra construção sua.';
  if(!unlocked(d)) return 'Requer Base Nível '+d.era+'.';
  if(d.need){
    const n = d.need==='rio' ? countTerrain(x,y,1,'rio') : countTerrain(x,y,d.r,d.need);
    if(n<1) return `Precisa de ${d.need==='rio'?'rio ao lado':d.need+' por perto'}.`;
  }
  if(d.unique && countType(type)>=1) return 'Só um(a) '+d.n+' no império.';
  if(type==='templo' && countType('templo')>=1) return 'Só um Templo no império.';
  if(type==='usina' && countType('usina')>=2) return 'No máximo 2 usinas.';
  if(!canPay(d.c)) return 'Recursos insuficientes.';
  return null;
}
// Tempo de construção pelo custo total: 1 turno a cada 25 de custo, entre 2 e 12.
function buildTurns(k){
  const v=Object.values(DEF[k].c||{}).reduce((a,b)=>a+b,0);
  return Math.max(2,Math.min(12,Math.ceil(v/25)));
}
function advanceObras(){
  for(const o of buildingsList()){
    const b=o.b; if(b.type!=='obra'||(b.pid||0)!==0) continue;
    b.prog=(b.prog||0)+1;
    if(b.prog>=b.need){
      const k=b.of, c=cityById(b.cid), nome=(c||{name:'?'}).name;
      S.grid[o.y][o.x].b={type:k,cid:b.cid,pid:0,level:1,workers:0};
      log(DEF[k].n+' concluída em '+nome+'.');
      hist(DEF[k].n+' concluída em '+nome+'.');
      fxAdd(o.x,o.y,'Concluída','#7aff8a',true);
    }
  }
  invalidate(); computeNetwork();
}
// Manutenção: cada casa custa ouro por turno, cada rua também (mais se asfaltada).
function maintain(){
  let casas=0, ruas=0;
  for(const o of buildingsList()){
    if((o.b.pid||0)!==0) continue;
    if(o.b.type==='casa') casas++;
    else if(o.b.type==='estrada') ruas+=(o.b.level||1);
  }
  const custo=casas*0.1+ruas*0.03*(hasTech('urb')?0.5:1);
  if(custo>0){ S.res.ouro-=custo; led('ouro','manutencao',-custo); }
  if(S.res.ouro<0) log('Ouro negativo: manutenção de casas e ruas está acima da arrecadação.');
}
function cancelObra(x,y){
  const b=S.grid[y][x].b; if(!b||b.type!=='obra') return;
  const d=DEF[b.of];
  if(d) for(const k in d.c) S.res[k]=(S.res[k]||0)+Math.floor(d.c[k]*0.5);
  S.grid[y][x].b=null; S.sel=null;
  invalidate(); computeNetwork(); log('Obra cancelada: metade do custo devolvida.');
}
function place(type,x,y){
  if(type==='fundar'){ foundCity(x,y); return; }
  const err=canPlace(type,x,y);
  if(err){ log(err); return; }
  pay(DEF[type].c);
  const cid=nearestCity(x,y,S.cities).id;
  S.grid[y][x].b={type:'obra',of:type,prog:0,need:buildTurns(type),cid,pid:0,level:1,workers:0};
  invalidate();
  log('Obra iniciada: '+DEF[type].n+' ('+S.grid[y][x].b.need+' turnos).');
  fxAdd(x,y,'Obra','#f0d28a',false);
  sfx('build');
  S.tool=null;
  computeNetwork();
}
function farFromAllCities(x,y){
  for(const c of allCities()) if(dist(x,y,c.x,c.y)<FOUND_MIN_DIST) return false;
  return true;
}
function foundCity(x,y){
  const cap=capital();
  if(cap.level<2){ log('Fundar cidade exige a capital no Nível 2.'); return; }
  const tile=S.grid[y][x];
  if(tile.b||tile.t==='rio'||groupAt(x,y)){ log('Escolha um tile livre.'); return; }
  if(!farFromAllCities(x,y)){ log('Muito perto de outra cidade (mínimo '+FOUND_MIN_DIST+' tiles).'); return; }
  if(!canPay(DEF.fundar.c)){ log('Recursos insuficientes para fundar cidade.'); return; }
  if(cap.adults<FOUND_POP+1){ log('A capital precisa de pelo menos '+(FOUND_POP+1)+' adultos.'); return; }
  pay(DEF.fundar.c);
  cap.adults-=FOUND_POP;
  const id=S.nextId++;
  const c={id,pid:0,name:'Cidade '+id,x,y,level:1,capital:false,adults:FOUND_POP,children:0,happy:50,tax:'padrao',starve:0};
  S.cities.push(c);
  tile.b={type:'base',cid:id,pid:0,level:1,workers:0};
  const r=nextRingTile(c); if(r) S.grid[r.y][r.x].b={type:'casa',cid:id,pid:0,level:1,stage:1,workers:0};
  invalidate();
  S.tool=null; S.curCity=id;
  log(c.name+' fundada com '+FOUND_POP+' pessoas.');
  hist('Fundou '+c.name+' com '+FOUND_POP+' pessoas.');
  sfx('build');
  computeNetwork(); computeContacts();
}
function buildHouse(){
  const c=S.cities.find(x=>x.id===S.curCity)||capital();
  if(!canPay(DEF.casa.c)){ log('Madeira insuficiente para casa.'); return; }
  const p=nextRingTile(c);
  if(!p){ log(c.name+': sem espaço para casas perto da base.'); return; }
  pay(DEF.casa.c);
  S.grid[p.y][p.x].b={type:'casa',cid:c.id,pid:0,level:1,stage:1,workers:0};
  invalidate();
  sfx('build');
  log('Casa construída em '+c.name+'.');
  computeNetwork();
}
const STAGE_NAME=['','Cabana','Casa de Madeira','Casa de Pedra','Sobrado'];
function evolveHouse(x,y){
  const b=S.grid[y][x].b; if(!b||b.type!=='casa') return;
  const c=cityById(b.cid);
  const next=b.stage+1; if(next>4) return;
  if(c.level<next){ log('A cidade precisa estar no Nível '+next+'.'); return; }
  const cost = next===2?{wood:20}:next===3?{stone:30}:{tabua:20,lapida:20};
  if(!canPay(cost)){ log('Recursos insuficientes para evoluir a casa.'); return; }
  pay(cost); b.stage=next; log('Casa evoluiu para o estágio '+next+'.');
}
function upgrade(x,y){
  const b=S.grid[y][x].b; if(!b||b.type==='base'||b.type==='casa'||b.type==='estrada'||b.level>=maxLvOf(b)) return;
  const c={}; for(const k in DEF[b.type].c) c[k]=DEF[b.type].c[k]*b.level*2;
  if(!canPay(c)){ log('Recursos insuficientes para melhorar.'); return; }
  pay(c); b.level++; log(DEF[b.type].n+' melhorada para Nível '+b.level+'.');
}
function demolish(x,y){
  const tile=S.grid[y][x], b=tile.b; if(!b||b.type==='base') return;
  // Demolir pede um segundo clique no mesmo botão para confirmar.
  if(!(S.demoArm && S.demoArm.x===x && S.demoArm.y===y)){ S.demoArm={x,y}; log('Clique de novo em Confirmar demolição.'); return; }
  S.demoArm=null;
  if((b.pid||0)!==0) return;
  const c=DEF[b.type]?DEF[b.type].c:{};
  for(const k in c) S.res[k]+=Math.floor(c[k]*0.3);
  tile.b=null; S.sel=null; invalidate(); log('Construção demolida. Parte do material voltou.');
  hist('Demoliu '+((DEF[b.type]&&DEF[b.type].n)||'uma construção')+'.');
  computeNetwork();
}
function chooseReligion(r){
  if(S.religion){ log('A religião já foi escolhida.'); return; }
  S.religion=r; log(r==='sec'?'A tribo escolheu o Secularismo Racional.':'A tribo escolheu o Fundamentalismo Ideológico.');
  hist('Escolheu '+(r==='sec'?'Secularismo Racional':'Fundamentalismo Ideológico')+'.');
}

// ---------- Gerenciamento de cidades ----------
function setTax(cid,k){
  const c=cityById(cid);
  if(c.level<3){ log('Impostos só podem ser alterados no Nível 3.'); return; }
  c.tax=k; log(c.name+': impostos '+TAX[k].n+'.');
  hist(c.name+': impostos definidos como '+TAX[k].n+'.');
}
function toggleRename(cid){
  if(!S.renaming){ S.renaming=true; log('Digite o novo nome e clique em Confirmar.'); return; }
  const el=document.getElementById('cname');
  const val=el?el.value:'';
  S.renaming=false;
  renameCity(cid,val);
}
function renameCity(cid,name){
  const c=cityById(cid);
  if(relWarAny()){ log('Não é possível renomear cidades em guerra.'); return; }
  name=(name||'').trim().slice(0,24);
  if(!name){ log('O nome não pode ficar vazio.'); return; }
  c.name=name; log('A cidade agora se chama '+name+'.');
}
function setCapital(cid){
  if(relWarAny()){ log('Não é possível mudar a capital em guerra.'); return; }
  S.cities.forEach(c=>c.capital=(c.id===cid));
  log(cityById(cid).name+' é agora a capital.');
}
function relWarAny(){ return Object.entries(S.rel).some(([k,r])=>r.war && k.split('|').includes('0')); }
function cityScore(c){
  return cityBuildings(c.id).filter(o=>o.b.type!=='base'&&o.b.type!=='casa'&&o.b.type!=='estrada'&&(o.b.pid||0)===0&&inBase(o.x,o.y,c)&&isConn(o.x,o.y)).reduce((s,o)=>s+o.b.level,0);
}
function evolveCity(cid){
  const c=cityById(cid);
  const next=c.level+1; if(next>4) return;
  const r=BASE_REQ[next];
  if(cityScore(c)<r.score){ log(c.name+': faltam pontos de construção conectados para o Nível '+next+'.'); return; }
  if(!canPay(r.cost)){ log('Recursos insuficientes para evoluir a cidade.'); return; }
  pay(r.cost); c.level=next; log(c.name+' evoluiu para o Nível '+next+'.');
  hist(c.name+' subiu para o Nível '+next+'.');
}

// Trabalhadores: a cada turno, as construções com prioridade (★) são preenchidas primeiro;
// só depois as demais. Quem está num trabalho sem prioridade é realocado se houver vaga prioritária.
function assignWorkers(){
  for(const c of S.cities){
    const list=cityBuildings(c.id).filter(o=>(o.b.pid||0)===0 && DEF[o.b.type] && DEF[o.b.type].cap);
    for(const o of list) o.b.workers=0;
    const ordered=[...list.filter(o=>o.b.prio), ...list.filter(o=>!o.b.prio)];
    let idle=c.adults;
    for(const o of ordered){
      if(idle<=0) break;
      const take=Math.min(DEF[o.b.type].cap, idle);
      o.b.workers=take; idle-=take;
    }
  }
}
function togglePrio(x,y){
  const b=S.grid[y][x].b;
  if(b && DEF[b.type] && DEF[b.type].cap) b.prio=!b.prio;
}

// ---------- Eventos ----------
function inScope(ev,x,y,cityId){
  if(ev.scope==='global') return true;
  if(ev.scope==='regional') return dist(x,y,ev.cx,ev.cy)<=10;
  return ev.cityId===cityId;
}
function evMul(b,x,y,kind){
  let m=1;
  for(const ev of S.active){
    if(!inScope(ev,x,y,b.cid)) continue;
    const d=DEF[b.type]||{};
    if(ev.id==='seca' && kind==='food'){ const merc=Math.min(3,countType('mercado')); m*=Math.min(1,0.7+0.1*merc); }
    if(ev.id==='migracao' && b.type==='caca') m*=0.4;
    if(ev.id==='tempestade' && ev.cityId===b.cid) m*=0.5;
    if(ev.id==='revolta' && ev.cityId===b.cid) m*=(countType('policia',b.cid)?0.85:0.7);
    if(ev.id==='festival' && ev.cityId===b.cid && kind==='food') m*=1.2;
    if(ev.id==='greve' && ev.cityId===b.cid && (d.cat==='industria'||d.cat==='recursos')) m*=0.5;
  }
  return m;
}
function hasHospitalNear(c){ return countType('hospital',c.id)>0; }
function evApplyInstant(p){
  const ev=EVENTS.find(e=>e.id===p.id);
  const target=cityById(p.cityId)||capital();
  const cx=p.cx!==undefined?p.cx:target.x, cy=p.cy!==undefined?p.cy:target.y;
  if(ev.id==='enchente'){
    const rivers=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(S.grid[y][x].t==='rio') rivers.push([x,y]);
    const cand=[];
    for(const o of buildingsList()){
      if((o.b.pid||0)!==0||o.b.type==='base'||o.b.type==='estrada') continue;
      if(rivers.some(([rx,ry])=>dist(o.x,o.y,rx,ry)<=2)) cand.push(o);
    }
    if(!cand.length){ log('Enchente: o rio não atingiu nenhuma construção.'); return; }
    const o=pick(cand); S.grid[o.y][o.x].b=null; invalidate(); log('Enchente destruiu '+(DEF[o.b.type]||{n:'uma construção'}).n+'.');
    computeNetwork();
  }
  if(ev.id==='deposito'){
    let placed=0;
    for(let i=0;i<60&&placed<5;i++){
      const x=target.x+Math.floor(Math.random()*9)-4, y=target.y+Math.floor(Math.random()*9)-4;
      if(x<0||y<0||x>=N||y>=N) continue;
      const t=S.grid[y][x]; if(t.b||t.t!=='planicie') continue;
      t.t='minerio'; placed++;
    }
    log('Descoberta de minério perto de '+target.name+'.');
  }
  if(ev.id==='incendio'){
    const bombeiros=countType('bombeiro');
    let burned=0;
    for(let y=cy-5;y<=cy+5;y++) for(let x=cx-5;x<=cx+5;x++){
      if(x<0||y<0||x>=N||y>=N) continue;
      if(S.grid[y][x].t==='floresta'){ S.grid[y][x].t='planicie'; burned++; }
    }
    for(const o of buildingsList()){
      if(dist(o.x,o.y,cx,cy)>2||o.b.type==='base'||(o.b.pid||0)!==0) continue;
      if(rnd()<(bombeiros?0.1:0.3)) S.grid[o.y][o.x].b=null;
    }
    invalidate();
    log('Incêndio florestal: '+burned+' tiles de floresta queimaram.');
    computeNetwork();
  }
  if(ev.id==='incendio_fab'){
    const inds=buildingsList().filter(o=>(o.b.pid||0)===0&&DEF[o.b.type]&&DEF[o.b.type].cat==='industria'&&o.b.level<=1);
    if(!inds.length){ log('Incêndio em fábrica: nenhuma construção industrial de nível baixo.'); return; }
    if(countType('bombeiro')&&rnd()<0.5){ log('Os bombeiros apagaram o incêndio na fábrica.'); return; }
    const o=pick(inds); S.grid[o.y][o.x].b=null; invalidate(); log('Incêndio destruiu '+DEF[o.b.type].n+'.');
    computeNetwork();
  }
  if(ev.id==='terremoto'){
    const cand=buildingsList().filter(o=>(o.b.pid||0)===0&&o.b.type!=='base'&&dist(o.x,o.y,cx,cy)<=8);
    let n=0;
    while(cand.length&&n<3){ const i=Math.floor(Math.random()*cand.length); const o=cand.splice(i,1)[0]; S.grid[o.y][o.x].b=null; n++; }
    invalidate();
    log('Terremoto: '+n+' construções foram destruídas.');
    computeNetwork();
  }
}
function scheduleEvent(){
  const lvl=maxLevel();
  const pool=EVENTS.filter(e=>e.lvl<=lvl);
  const ev=pick(pool);
  const cityC=pick(S.cities);
  const p={id:ev.id,at:S.turn+1,cityId:cityC.id,cx:cityC.x,cy:cityC.y};
  if(ev.id==='incendio'||ev.id==='epidemia'||ev.id==='terremoto'){ p.cx=cityC.x+Math.floor(Math.random()*7)-3; p.cy=cityC.y+Math.floor(Math.random()*7)-3; }
  S.pending=p;
  log('Aviso: '+ev.n+' pode acontecer no próximo turno.');
  sfx('alert');
}
function applyPending(){
  const p=S.pending; if(!p || p.at>S.turn) return;
  S.pending=null;
  const ev=EVENTS.find(e=>e.id===p.id);
  S.evHistory.push({turn:S.turn,id:ev.id});
  hist('Evento: '+ev.n+'.');
  if(ev.dur===0){ evApplyInstant(p); return; }
  const a={id:ev.id,n:ev.n,start:S.turn,end:S.turn+ev.dur,scope:ev.scope,cityId:p.cityId,cx:p.cx,cy:p.cy};
  S.active.push(a);
  log('Evento: '+ev.n+'. '+ev.desc);
  if(ev.id==='incendio') evApplyInstant(p);
}
function eventsTick(){
  S.active=S.active.filter(e=>e.end>S.turn);
  if(!S.pending && S.turn%EV_EVERY===0 && rnd()<EV_CHANCE && S.turn>=5) scheduleEvent();
  applyPending();
  for(const e of S.active){
    if(e.id==='peste'){
      const c=cityById(e.cityId); if(c && c.adults>0 && rnd()<(hasHospitalNear(c)?0.02:0.05)){ c.adults--; log('A peste matou um adulto em '+c.name+'.'); }
    }
    if(e.id==='epidemia'){
      for(const c of S.cities){
        if(dist(c.x,c.y,e.cx,e.cy)>10||c.adults<=0) continue;
        if(rnd()<(hasHospitalNear(c)?0.02:0.06)){ c.adults--; log('A epidemia matou um adulto em '+c.name+'.'); }
      }
    }
  }
}

// ---------- Economia ----------
function foodMult(){ return 1+0.2*Math.min(2,countType('mercado')); }

function computePower(){
  let supply=0;
  const acidente=S.active.some(e=>e.id==='acidente');
  const crise=S.active.some(e=>e.id==='crise_energia');
  for(const o of buildingsList()){
    const d=DEF[o.b.type]; if(!d||!d.power||o.b.workers<=0) continue;
    const f=o.b.workers/d.cap;
    if(S.res.carvao>=d.inp.carvao*f){ S.res.carvao-=d.inp.carvao*f; supply+=d.power*f*(acidente?0.5:1)*(crise?0.7:1); }
  }
  let demand=0;
  for(const o of buildingsList()){ const d=DEF[o.b.type]; if(d&&d.elec) demand+=1; }
  power={supply:Math.round(supply),demand,ratio: demand===0?1:Math.min(1,supply/demand)};
}

function addCityProd(cid,r,amt){ const c=cityById(cid); if(!c) return; c.prod=c.prod||{}; c.prod[r]=(c.prod[r]||0)+amt; }
function produce(){
  computePower();
  for(const c of S.cities) c.prod={};
  const roadLv={}; for(const o of buildingsList()) if(o.b.type==='estrada') roadLv[o.b.cid]=(roadLv[o.b.cid]||0)+(o.b.level||1);
  const boom=S.active.some(e=>e.id==='boom');
  for(const o of buildingsList()){
    if((o.b.pid||0)!==0) continue;
    const d=DEF[o.b.type]; if(!d||!d.cap) continue;
    let f=o.b.workers/d.cap; if(S.mutirao>S.turn) f*=2; if(f<=0) continue;
    if(d.power) continue;
    const mult=1+0.5*(o.b.level-1);
    let eff=f*mult;
    if(!isConn(o.x,o.y)) eff*=0.5;
    else eff*=1+Math.min(0.10,0.01*(roadLv[o.b.cid]||0));
    if(d.elec) eff*=power.ratio;
    eff*=evMul(o.b,o.x,o.y,d.out&&d.out.food?'food':'other');
    eff*=cityMood(o.b.cid);
    if(d.inp){
      let ratio=1;
      for(const r in d.inp){ const need=d.inp[r]*f; if(need>0) ratio=Math.min(ratio,S.res[r]/need); }
      ratio=Math.max(0,Math.min(1,ratio));
      if(ratio<=0) continue;
      for(const r in d.inp){ S.res[r]-=d.inp[r]*f*ratio; led(r,o.b.type,-d.inp[r]*f*ratio); addCityProd(o.b.cid,r,-d.inp[r]*f*ratio); }
      eff*=ratio;
    }
    if(d.need){
      const n=d.need==='rio'?countTerrain(o.x,o.y,1,'rio'):countTerrain(o.x,o.y,d.r,d.need);
      if(n<=0) continue;
      eff*=Math.min(1,n/4);
      if(o.b.type==='caca' && Math.random()<0.03) depleteOne(o.x,o.y,d.r,'animais','planicie');
      if(o.b.type==='mina' && Math.random()<0.01) depleteOne(o.x,o.y,d.r,'minerio','planicie');
      if(o.b.type==='mina_carvao' && Math.random()<0.01) depleteOne(o.x,o.y,d.r,'carvao','planicie');
      if(o.b.type==='poco' && Math.random()<0.01) depleteOne(o.x,o.y,d.r,'petroleo','planicie');
    }
    if(d.out){
      for(const r in d.out){
        let amt=d.out[r]*eff;
        if(r==='food') amt*=foodMult();
        if(r==='food' && hasTech('agri')) amt*=1.1;
        if(r==='science' && boom) amt*=1.25;
        S.res[r]=(S.res[r]||0)+amt; led(r,o.b.type,amt); addCityProd(o.b.cid,r,amt);
        S.gained=S.gained||{}; S.gained[r]=(S.gained[r]||0)+amt;
      }
    }
    if(o.b.type==='escola' && S.religion==='sec'){ S.res.science+=2*eff; led('science',o.b.type,2*eff); addCityProd(o.b.cid,'science',2*eff); }
    for(const tb of TECH_BONUS){
      if(o.b.type===tb.type && hasTech(tb.tech)){ const q=tb.amt*eff; S.res[tb.res]=(S.res[tb.res]||0)+q; led(tb.res,o.b.type,q); addCityProd(o.b.cid,tb.res,q); }
    }
  }
}

function consumption(){ return S.cities.reduce((s,c)=>s+c.adults*0.25+c.children*0.125,0); }
function consume(){
  S.res.food-=consumption(); led('food','pop',-consumption());
  if(S.res.food<0){
    S.res.food=0;
    for(const c of S.cities) c.starve=(c.starve||0)+1;
    const worst=S.cities.reduce((a,b)=>((a.starve||0)>=(b.starve||0)?a:b));
    if(worst.starve%5===0 && worst.adults>0){ worst.adults--; log('A fome matou um adulto em '+worst.name+'.'); }
  } else S.cities.forEach(c=>c.starve=0);
}
function births(){
  for(const c of S.cities){
    if((S.turn%2===0 || S.turn<(c.buffEnd||0)) && S.res.food>20 && c.happy>=55 && c.adults+c.children<capPop(c.id)){ c.children++; log('Nasceu uma criança em '+c.name+'.'); }
    if(S.turn%30===0 && c.children>0){ c.children--; c.adults++; }
  }
}

function acadLevel(){ let m=0; for(const o of buildingsList()) if((o.b.pid||0)===0 && o.b.type==='academia') m=Math.max(m,o.b.level); return m; }
function armyLimit(){ return Math.min(1000,(capital().level+acadLevel())*100); }
function cityMult(){ return [1,1.2,1.5,1.8][capital().level-1]; }
function recruit(type,fast){
  // (a checagem de desbloqueio fica em unitUnlocked)
  const u=UNITS[type];
  if(countType('quartel')<1 && !u.req){ log('Construa um Quartel primeiro.'); return; }
  if(u.req && countType(u.req)<1){ log('Construa '+DEF[u.req].n+' primeiro.'); return; }
  if(acadLevel()<u.acad){ log('Academia Militar Nível '+u.acad+' necessária.'); return; }
  const c=capital();
  if(c.adults<=0){ log('Sem adultos disponíveis na capital.'); return; }
  if(armySpace()+u.space>armyLimit()){ log('Limite do exército atingido ('+armyLimit()+').'); return; }
  const cost=u.manut*(fast?4:2);
  if(S.res.ouro<cost){ log('Ouro insuficiente.'); return; }
  S.res.ouro-=cost; c.adults--;
  S.queue.push({type,left:fast?1:2});
  log(u.n+' em treinamento'+(fast?' (rápido).':'.'));
}
function militaryTick(){
  const colapso=S.active.some(e=>e.id==='colapso');
  for(const c of S.cities){
    const tx=TAX[c.tax];
    const tax=(c.adults*tx.a+c.children*tx.c)*(1+0.15*(c.level-1))*(colapso?0.8:1);
    S.res.ouro+=tax; led('ouro','impostos',tax);
  }
  let upkeep=0;
  for(const g of groupsOf(0)) for(const t of Object.keys(g.units)) upkeep+=UNITS[t].manut*g.units[t];
  S.res.ouro-=upkeep*cityMult(); led('ouro','exercito',-upkeep*cityMult());
  if(S.res.ouro<0){ S.morale=Math.max(0,S.morale-10); }
  else S.morale=Math.min(100,S.morale+5);
  if(S.morale<10){
    let deserters=0;
    for(const g of groupsOf(0)){
      for(const t of Object.keys(g.units)){
        let lost=0;
        for(let i=0;i<g.units[t];i++) if(Math.random()<0.5) lost++;
        g.units[t]-=lost; deserters+=lost;
        if(g.units[t]<=0) delete g.units[t];
      }
    }
    pruneGroups();
    if(deserters){ capital().adults+=deserters; log(deserters+' unidade(s) debandou(aram).'); }
  }
  const rest=[];
  for(const q of S.queue){
    q.left--;
    if(q.left<=0){
      if(spawnUnit(q.type,0)) log(UNITS[q.type].n+' pronto no mapa.');
      else { q.left=0; rest.push(q); }
    }
    else rest.push(q);
  }
  S.queue=rest;
}

function enemyNear(c,r){
  return S.groups.some(g=>(g.pid||0)!==(c.pid||0) && Math.abs(g.x-c.x)<=r && Math.abs(g.y-c.y)<=r);
}
function cityMood(cid){
  const c=S.cities.find(x=>x.id===cid); if(!c) return 1;
  let m=1;
  if(S.turn<(c.buffEnd||0)) m*=1.15;
  if(c.happy<40) m*=0.9;
  return m;
}
function happinessAll(){
  for(const c of S.cities){
    const pop=c.adults+c.children, cap=capPop(c.id);
    const over=Math.max(0,pop-cap);
    const F=[['Base',55],['Impostos '+TAX[c.tax].n.toLowerCase(),TAX[c.tax].h]];
    if(S.active.some(e=>e.id==='festival'&&e.cityId===c.id)) F.push(['Festival',10]);
    for(const o of cityBuildings(c.id)){
      const b=o.b;
      if(b.type==='altar') F.push(['Altar',5*b.level]);
      for(const th of TECH_HAPPY_B) if(b.type===th.type && hasTech(th.tech)) F.push([th.n,th.amt]);
      if(b.type==='escola') F.push(['Escola',3*b.level]);
      if(b.type==='templo'){
        if(S.religion==='fund') F.push(['Templo (fundamentalismo)',10*b.level+10]);
        else if(S.religion!=='sec') F.push(['Templo',10*b.level]);
      }
      if(b.type==='hospital') F.push(['Hospital',4*b.level]);
      if(b.type==='estadio') F.push(['Estádio',10]);
      if(b.type==='monumento') F.push(['Monumento',8*b.level]);
      if(b.type==='forum') F.push(['Fórum',6]);
      if(b.type==='casa') F.push(['Casas evoluídas',(b.stage-1)*2]);
    }
    for(const g of TECH_HAPPY_G) if(hasTech(g.tech)) F.push([g.n,g.amt]);
    if(hasTech('culto') && countType('templo',c.id)>0) F.push(['Culto',5]);
    if(houses(c.id)>0){
      if(netCount(c.net,'bombeiro')===0) F.push(['Sem bombeiros',-5]);
      if(netCount(c.net,'policia')===0) F.push(['Sem polícia',-5]);
    }
    if(S.res.food<=0) F.push(['Fome (sem comida)',-20]);
    if(over>0) F.push(['Casas lotadas',-Math.min(10,over*2)]);
    if(S.religion==='fund' && countType('templo',c.id)===0) F.push(['Fundamentalismo sem templo',-5]);
    const pen=Math.min(15,Math.floor(Math.max(0,pop-8)/3));
    if(pen) F.push(['População grande',-pen]);
    if(S.res.food<30) F.push(['Comida baixa',-5]);
    if(c.starve>0) F.push(['Passando fome',-8]);
    if(enemyNear(c,6)) F.push(['Inimigos por perto',-10]);
    const agg=[];
    for(const [l,v] of F){ const e=agg.find(x=>x[0]===l); if(e) e[1]+=v; else agg.push([l,v]); }
    c.happyFactors=agg;
    const t=agg.reduce((s,x)=>s+x[1],0);
    if(c.happy===undefined) c.happy=50;
    c.happyTarget=Math.max(0,Math.min(100,Math.round(t)));
    const d=c.happyTarget-c.happy;
    c.happy+= d>0 ? Math.min(2,d) : Math.max(-4,d);
    if(pop>cap*0.9 && pop>10 && rnd()<0.25) c.happy-=1;
    c.happy=Math.max(0,Math.min(100,Math.round(c.happy)));
    if(c.happy<50) c.buffEnd=0;
    if(c.happy>=75 && S.turn>=(c.buffCd||0)){
      c.buffEnd=S.turn+8; c.buffCd=S.turn+20;
      log(c.name+': povo animado, produção e crescimento +15% por 8 turnos.');
      hist(c.name+': povo animado, bônus de produção por 8 turnos.');
    }
  }
}

// ---------- Destruição de cidades ----------
function destroyCity(c,reason,attackerPid){
  const owner=cityOwner(c);
  ruinTile(c.x,c.y,attackerPid);
  for(let y=Math.max(0,c.y-8);y<=Math.min(N-1,c.y+8);y++)
    for(let x=Math.max(0,c.x-8);x<=Math.min(N-1,c.x+8);x++){
      const b=S.grid[y][x].b; if(b && b.cid===c.id) ruinTile(x,y,attackerPid);
    }
  invalidate();
  if(owner===0) S.cities=S.cities.filter(x=>x.id!==c.id);
  else { const p=S.ai[owner-1]; p.cities=p.cities.filter(x=>x.id!==c.id); }
  log(c.name+' foi destruída'+(reason?' '+reason:'')+'.');
  if(owner===0) hist('Perdeu '+c.name+(reason?' ('+reason+')':'')+'.');
  sfx('alert');
  if(c.capital){
    if(owner===0){ S.over='defeat'; log('Sua capital foi destruída.'); }
    else eliminate(owner);
  } else if(owner===0 && S.cities.length===0){ S.over='defeat'; }
  computeNetwork(); computeContacts();
}
function eliminate(pid){
  const p=S.ai[pid-1];
  if(p.dead) return;
  p.dead=true;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const b=S.grid[y][x].b; if(b && b.pid===pid) S.grid[y][x].b=null; }
  S.groups=S.groups.filter(g=>gPid(g)!==pid);
  p.cities=[];
  invalidate();
  log(p.name+' foi derrotada.');
}

// ---------- Guerra e acordos ----------
function declareWar(a,b){
  const r=relGet(a,b);
  if(r.war) return;
  r.war=true; r.pacto=false; r.comercio=false; r.alianca=false; r.conf=Math.min(r.conf,-30);
  log(pname(a)+' declarou guerra a '+pname(b)+'.');
  if(a===0||b===0) hist('Declarou guerra a '+pname(a===0?b:a)+'.');
  sfx('alert');
}
function makePeace(a,b){
  const r=relGet(a,b);
  r.war=false; r.conf=Math.max(r.conf,-20);
  log(pname(a)+' e '+pname(b)+' firmaram a paz.');
  if(a===0||b===0) hist('Fez paz com '+pname(a===0?b:a)+'.');
}
function wouldAccept(aiPid,fromPid,type){
  const r=relGet(aiPid,fromPid);
  if(r.traitorUntil>S.turn) return false;
  if(type==='pacto') return r.conf>=0 && !r.war;
  if(type==='comercio') return r.pacto && r.conf>=25 && !r.war;
  if(type==='alianca') return r.comercio && r.conf>=60 && !r.war;
  if(type==='paz') return r.war && r.conf>-30;
  return false;
}
function applyDeal(a,b,type){
  if(a===0||b===0 && type!=='paz') hist('Acordo com '+pname(a===0?b:a)+': '+({pacto:'pacto de não-agressão',comercio:'comércio',alianca:'aliança'}[type]||type)+'.');
  const r=relGet(a,b);
  if(type==='pacto'){ r.pacto=true; r.pactTurn=S.turn; log(pname(a)+' e '+pname(b)+' assinaram pacto de não-agressão.'); }
  if(type==='comercio'){ r.comercio=true; log(pname(a)+' e '+pname(b)+' fecharam comércio.'); }
  if(type==='alianca'){ r.alianca=true; log(pname(a)+' e '+pname(b)+' formaram aliança.'); }
  if(type==='paz'){ makePeace(a,b); }
}
function breakPact(pid){
  const r=relGet(0,pid);
  if(!r.pacto){ log('Não há pacto para quebrar.'); return; }
  const recent = S.turn - r.pactTurn <= 10;
  r.pacto=false; r.comercio=false; r.alianca=false;
  if(recent){ r.conf-=50; r.traitorUntil=S.turn+20; log('Pacto quebrado logo após assinado: '+pname(pid)+' marcou sua tribo como traidora.'); }
  else { r.conf-=30; log('Pacto com '+pname(pid)+' quebrado.'); }
  hist('Quebrou o pacto com '+pname(pid)+'.');
}
function proposeToAI(pid,type){
  if(!wouldAccept(pid,0,type)){ log(pname(pid)+' recusou a proposta de '+type+'.'); return; }
  applyDeal(0,pid,type);
}
function sendInbox(from,type){
  S.inbox.push({from,type,turn:S.turn});
  log(pname(from)+' propõe '+type+' a você. Veja a diplomacia.');
}
function acceptInbox(i){
  const it=S.inbox[i]; if(!it) return;
  if(!wouldAccept(it.from,0,it.type)){ log('A proposta não é mais válida.'); }
  else applyDeal(0,it.from,it.type);
  S.inbox.splice(i,1);
}
function rejectInbox(i){ S.inbox.splice(i,1); }

// ---------- IA: economia, expansão e decisões ----------
function aiEconomyTickOld(p){
  const r=p.res;
  for(const c of p.cities){
    r.food+=1.5*c.level; r.wood+=1.0*c.level; r.stone+=0.8*c.level; r.metal+=0.3*c.level; r.ouro+=c.adults*0.3;
  }
  const adults=p.cities.reduce((s,c)=>s+c.adults,0);
  r.food-=adults*0.25;
  if(r.food<0){ r.food=0; if(adults>0 && S.turn%6===0){ const c=p.cities.find(x=>x.adults>0); if(c) c.adults--; } }
  if(S.turn%6===0) for(const c of p.cities){ if(r.food>15 && c.adults<8+c.level*6) c.adults++; }
  if(S.turn%30===0) for(const c of p.cities){ if(c.level<3 && c.adults>=8 && r.wood>=40 && r.stone>=40){ r.wood-=40; r.stone-=40; c.level++; log(c.name+' evoluiu para o Nível '+c.level+'.'); break; } }
  aiUpkeep(p);
}
function aiTryFound(p){
  if(p.cities.length>=4) return;
  if(p.res.wood<60||p.res.stone<30) return;
  const cap=p.cities.find(c=>c.capital)||p.cities[0];
  const cand=p.cities.filter(c=>c.adults>=FOUND_POP+2);
  if(!cand.length) return;
  for(let i=0;i<40;i++){
    const x=cap.x+Math.floor(Math.random()*25)-12, y=cap.y+Math.floor(Math.random()*25)-12;
    if(x<1||y<1||x>=N-1||y>=N-1) continue;
    const tile=S.grid[y][x];
    if(tile.b||tile.t==='rio') continue;
    if(!farFromAllCities(x,y)) continue;
    const from=cand[0];
    p.res.wood-=60; p.res.stone-=30;
    from.adults-=FOUND_POP;
    const id=S.nextId++;
    const nc={id,pid:p.pid,name:p.name.split(' ')[0]+' '+id,x,y,level:1,capital:false,adults:FOUND_POP,children:0,happy:50,tax:'padrao',starve:0};
    p.cities.push(nc);
    tile.b={type:'base',cid:id,pid:p.pid,level:1,workers:0};
    invalidate();
    log(p.name+' fundou '+nc.name+'.');
    return;
  }
}
function aiDecide(p){
  for(const q of livingPids()){
    if(q===p.pid || !contactOf(p.pid,q)) continue;
    const r=relGet(p.pid,q);
    if(r.war){
      if(p.diff!=='pacifista' && r.conf>-30 && rnd()<0.25){ makePeace(p.pid,q); continue; }
      continue;
    }
    if(p.diff==='agressiva' && r.conf<-20 && armyCount(p.pid)>=6 && rnd()<0.4){ declareWar(p.pid,q); continue; }
    if(p.diff==='normal' && r.conf<=-50 && armyCount(p.pid)>=8){ declareWar(p.pid,q); continue; }
    if(r.pacto && p.diff==='agressiva' && r.conf<-30 && S.turn-r.pactTurn>10){ r.pacto=false; r.comercio=false; r.conf-=20; log(pname(p.pid)+' quebrou o pacto com '+pname(q)+'.'); continue; }
    if(!r.pacto && r.conf>=0 && rnd()<0.4){
      if(q===0) sendInbox(p.pid,'pacto');
      else if(wouldAccept(q,p.pid,'pacto')) applyDeal(p.pid,q,'pacto');
    } else if(r.pacto && !r.comercio && r.conf>=25 && rnd()<0.3){
      if(q===0) sendInbox(p.pid,'comercio');
      else if(wouldAccept(q,p.pid,'comercio')) applyDeal(p.pid,q,'comercio');
    } else if(r.comercio && !r.alianca && r.conf>=60 && rnd()<0.2){
      if(q===0) sendInbox(p.pid,'alianca');
      else if(wouldAccept(q,p.pid,'alianca')) applyDeal(p.pid,q,'alianca');
    }
  }
}
// ---------- IA: economia e construção ----------
const AI_STAGES=[
  {t:0,list:['casa','coleta','caca','lenhador','pedreira','altar','pesca']},
  {t:120,list:['escola','mercado','bombeiro','policia','serraria','marmoraria','mina','quartel','academia','templo']},
  {t:250,list:['fabrica','mina_carvao','usina','universidade','hospital','fundicao']},
  {t:400,list:['poco','refinaria','estadio','basearea','quartel_moderno']}
];
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function aiCount(c,type){ return buildingsList().filter(o=>o.b.cid===c.id && (type===undefined || o.b.type===type)).length; }
function aiCityScore(c){
  return buildingsList().filter(o=>o.b.cid===c.id && (o.b.pid||0)===c.pid && o.b.type!=='base' && o.b.type!=='casa' && o.b.type!=='estrada' && o.b.type!=='ruina' && inBase(o.x,o.y,c)).reduce((s,o)=>s+(o.b.level||1),0);
}
function aiCanPay(p,c){ for(const k in c) if((p.res[k]||0)<c[k]) return false; return true; }
function aiPay(p,c){ for(const k in c) p.res[k]-=c[k]; }
function aiBuildable(p){
  const lvl=Math.max(...p.cities.map(c=>c.level));
  const out=[];
  for(const st of AI_STAGES){
    if(S.turn<st.t) continue;
    for(const k of st.list){ const d=DEF[k]; if(!d) continue; if(d.era && d.era>lvl) continue; out.push(k); }
  }
  return out;
}
function aiSpot(c,k){
  const d=DEF[k];
  for(let r=1;r<=6;r++){
    for(const p of shuffleArr(ringAround(c,r))){
      const t=S.grid[p.y][p.x];
      if(t.b||t.t==='rio'||groupAt(p.x,p.y)) continue;
      if(!inBase(p.x,p.y,c)||!nearBuild(p.x,p.y,c.pid)) continue;
      if(d.need){ const n=d.need==='rio'?countTerrain(p.x,p.y,1,'rio'):countTerrain(p.x,p.y,d.r,d.need); if(n<1) continue; }
      return p;
    }
  }
  return null;
}
function aiEconomyTick(p){
  const r=p.res;
  const adultsSum=p.cities.reduce((s,c)=>s+c.adults,0);
  for(const c of p.cities){
    r.food+=1.5+c.level*0.8; r.wood+=0.5+c.level*0.8; r.stone+=0.3+c.level*0.6; r.metal+=c.level*0.3;
    r.ouro+=c.adults*0.3;
    r.tabua=(r.tabua||0)+0.4*c.level; r.lapida=(r.lapida||0)+0.3*c.level; r.aco=(r.aco||0)+0.2*c.level;
    r.carvao=(r.carvao||0)+0.2*c.level; r.bens=(r.bens||0)+0.2*c.level;
  }
  for(const o of buildingsList()){
    if((o.b.pid||0)!==p.pid) continue;
    const d=DEF[o.b.type]; if(!d||!d.out) continue;
    for(const k in d.out) r[k]=(r[k]||0)+d.out[k]*0.25*(o.b.level||1);
  }
  r.food-=adultsSum*0.25;
  if(r.food<0) r.food=0;
  if(S.turn%6===0) for(const c of p.cities){
    const cap=Math.max(4,aiCount(c,'casa')*4);
    if(r.food>15 && c.adults+c.children<cap) c.adults++;
  }
  aiUpkeep(p);
}
function aiBuildTick(p){
  if(p.dead||!p.cities.length) return;
  for(const c of p.cities){
    if(c.level<4){
      const next=c.level+1, rq=BASE_REQ[next];
      if(aiCityScore(c)>=rq.score && aiCanPay(p,rq.cost)){ aiPay(p,rq.cost); c.level=next; log(c.name+' evoluiu para o Nível '+next+'.'); }
    }
  }
  if(S.turn%2===0){
    for(const o of buildingsList()){
      const b=o.b; if(b.type!=='casa'||(b.pid||0)!==p.pid) continue;
      const c=p.cities.find(x=>x.id===b.cid); if(!c) continue;
      if((b.stage||1)>=Math.min(c.level,4)) continue;
      const next=(b.stage||1)+1, cost=next===2?{wood:20}:next===3?{stone:30}:{tabua:20,lapida:20};
      if(aiCanPay(p,cost)){ aiPay(p,cost); b.stage=next; break; }
    }
  }
  const every=p.diff==='agressiva'?3:p.diff==='normal'?4:6;
  if(S.turn%every!==0) return;
  const city=p.cities.slice().sort((a,b)=>aiCount(a)-aiCount(b))[0];
  let kinds;
  if(rnd()<0.5) kinds=['casa'];
  else kinds=shuffleArr(aiBuildable(p).filter(k=>k!=='casa'));
  for(const k of kinds.slice(0,6)){
    const d=DEF[k]; if(!d||!aiCanPay(p,d.c)) continue;
    const spot=aiSpot(city,k); if(!spot) continue;
    aiPay(p,d.c);
    S.grid[spot.y][spot.x].b={type:k,cid:city.id,pid:p.pid,level:1,workers:0,stage:1};
    invalidate();
    return;
  }
}
function aiTick(){
  for(const p of S.ai){
    if(p.dead) continue;
    aiEconomyTick(p);
    aiBuildTick(p);
    if(S.turn%5===0) aiTryFound(p);
    aiTrain(p);
    if(S.turn-p.lastDec>=DIFF_INTERVAL[p.diff]){ p.lastDec=S.turn; aiDecide(p); }
  }
  aiGroupsTurn();
}

function diplomacyTick(){
  for(const k in S.rel){
    const r=S.rel[k];
    if(r.war) r.conf=Math.max(-100,r.conf-0.5);
    else if(r.conf>0) r.conf=Math.max(0,r.conf-0.2);
    else if(r.conf<0) r.conf=Math.min(0,r.conf+0.2);
    if(r.comercio) r.conf=Math.min(100,r.conf+0.3);
  }
  for(const k in S.rel){
    const r=S.rel[k];
    if(r.comercio && k.split('|').includes('0')){
      const colapso=S.active.some(e=>e.id==='colapso');
      S.res.ouro+=5*(colapso?0.8:1);
    }
  }
  S.inbox=S.inbox.filter(i=>S.turn-i.turn<=5);
}
function checkEnd(){
  if(S.over==='defeat') return;
  const aiAlive=S.ai.some(p=>!p.dead);
  if(!S.victoryShown && !aiAlive && S.cities.length>0){ S.over='victory'; S.victoryShown=true; }
}

function tick(){
  if(!S || S.over==='defeat') return;
  S.turn++;
  const pr={...S.res}; S.prevRes=pr; S.ledger={};
  invalidate();
  healTick();
  computeNetwork();
  eventsTick();
  advanceObras(); researchTick(); assignWorkers(); produce(); consume(); maintain(); births(); militaryTick(); happinessAll(); computeAlerts();
  diplomacyTick();
  aiTick();
  S.delta={}; for(const k in S.res) S.delta[k]=(S.res[k]||0)-(pr[k]||0);
  popMilestones();
  computeContacts(); checkEnd();
  if(opts.autosave) autosave();
  updateMusic(false);
  renderAll();
}
function loop(){
  if(S && screen==='game' && S.speed>0 && !S.over && !modal) tick();
  setTimeout(loop,(S&&S.speed===1)?1400:1000/Math.max(1,S?S.speed:1));
}

function getSaves(){ try{ return JSON.parse(localStorage.getItem('atlas_saves')||'[]'); }catch(e){ return []; } }
function setSaves(a){ localStorage.setItem('atlas_saves',JSON.stringify(a)); }
