a base. A carga foi perdida.','COMBATE');\n}\nfunction updateCombat(dt){\n  const sh=S.ship;\n  S.cd=Math.max(0,S.cd-dt);\n  S.shield=Math.max(0,(S.shield||0)-dt); S.shieldCd=Math.max(0,(S.shieldCd||0)-dt); S.empCd=Math.max(0,(S.empCd||0)-dt);\n  checkAnoms();\n  S.hurt=Math.max(0,S.hurt-dt);\n  S.shake=Math.max(0,(S.shake||0)-dt*12);\n  S.fx=(S.fx||[]).filter(f=>(f.t-=dt)>0);\n  S.spawnT-=dt;\n  S.patrolT=(S.patrolT===undefined?30:S.patrolT)-dt;\n  if(S.patrolT<=0){ S.patrolT=60; for(let i=0;i<S.cfg.nations;i++) if(!S.enemies.some(e=>e.patrol&&e.sp===i)) spawnPatrol(i); }\n  if(S.spawnT<=0 && S.enemies.length<MAX_ENEMIES){ spawnEnemy(); S.spawnT=DIFF[S.cfg.diff].spawn; }\n  if(S.meteors.length<MAX_METEORS && Math.random()<0.02*dt) S.meteors.push(makeMeteor(S.systems));\n  for(const b of S.bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; }\n  for(const e of S.enemies){\n    if(e.patrol && !isHostile(e.sp)){\n      const hs=S.systems[e.home], a=S.t*0.3+e.ph;\n      e.x=hs.x+Math.cos(a)*220; e.y=hs.y+Math.sin(a)*220; e.ang=a+Math.PI/2;\n      continue;\n    }\n    if((e.stun||0)>0){ e.stun-=dt; continue; }\n    const d=dist(e.x,e.y,sh.x,sh.y);\n    if(d<450){\n      const a=Math.atan2(sh.y-e.y,sh.x-e.x); e.ang=a;\n      e.vx+=Math.cos(a)*120*dt; e.vy+=Math.sin(a)*120*dt;\n      e.cd-=dt;\n      if(e.cd<=0 && d<300){\n        e.cd=1.2;\n        S.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*350,vy:Math.sin(a)*350,life:1.5,dmg:ENEMY_BULLET_DMG*(DIFF[S.cfg.diff].hp),enemy:true});\n      }\n    }\n    const sp=Math.hypot(e.vx,e.vy); if(sp>110){ e.vx*=110/sp; e.vy*=110/sp; }\n    e.x+=e.vx*dt; e.y+=e.vy*dt;\n    e.vx*=Math.pow(0.5,dt); e.vy*=Math.pow(0.5,dt);\n  }\n  for(const b of S.bullets){\n    if(b.life<=0) continue;\n    if(b.enemy){\n      if(dist(b.x,b.y,sh.x,sh.y)<12){ b.life=0; if((S.shield||0)>0){ beep(600,0.05,'triangle'); } else { S.hp-=b.dmg; S.hurt=0.3; S.shake=6; beep(180,0.12,'sawtooth'); } }\n    } else {\n      for(const e of S.enemies){\n        if(e.dead) continue;\n        if(dist(b.x,b.y,e.x,e.y)<14){\n          b.life=0; e.hp-=b.dmg;\n          if(e.hp<=0){\n            e.dead=true; S.res.creditos+=8;\n            (S.fx=S.fx||[]).push({x:e.x,y:e.y,t:0.5,col:e.sp>=0?SPCOL[e.sp]:'#e05a5a'});\n            beep(120,0.3,'sawtooth'); S.shake=3;\n            if(e.sp>=0){ S.rel[e.sp]=Math.max(REL_MIN,S.rel[e.sp]-5); msg('Nave dos '+SPECIES[e.sp]+' destruída: +8 créditos, relação piora.','COMBATE'); }\n            else msg('Pirata destruído: +8 créditos.','COMBATE');\n          }\n          break;\n        }\n      }\n    }\n  }\n  S.bullets=S.bullets.filter(b=>b.life>0);\n  S.enemies=S.enemies.filter(e=>!e.dead);\n  if(S.hp<=0){ respawn(); return; }\n  S.hp=Math.min(maxHp(),S.hp+dt);\n}\n\n// ---------- Produção ----------\nfunction produce(){\n  for(const s of S.systems) for(const p of s.planets){\n    if(!owned(p)) continue;\n    const m=p.lvl;\n    S.res.energia+=0.5+(p.bld.usina||0)*m;\n    if(!p.base) S.res.materia+=0.5*(p.terra||0);\n    S.res.pesquisa+=(p.bld.lab||0)*m;\n    if(p.hab){\n      S.res.energia+=p.pop/100; S.res.creditos+=0.2;\n      p.pop=Math.min(500,p.pop*(1+0.01*(1+(p.terra||0))));\n    }\n    if(!p.base){\n      const room=DEPOT_CAP-depotSum(p);\n      const add=Math.min(room,(p.bld.extrator||0)*m);\n      if(add>0) p.depot.materia=(p.depot.materia||0)+add;\n    }\n  }\n  diplomacyTick();\n}\n\n// ---------- Atualização ----------\nfunction update(dt){\n  S.t+=dt;\n  applyUpgrades();\n  revealAt(S.ship.x,S.ship.y,260);\n  checkDiscovery();\n  const sh=S.ship, k=S.keys;\n  if(S.sys===null){\n    if(k.left) sh.ang-=2.8*dt;\n    if(k.right) sh.ang+=2.8*dt;\n    if(k.up && S.fuel>0){\n      sh.vx+=Math.cos(sh.ang)*220*dt*SPD_MUL;\n      sh.vy+=Math.sin(sh.ang)*220*dt*SPD_MUL;\n      S.fuel=Math.max(0,S.fuel-2*dt);\n      if(S.fuel===0) msg('Combustível esgotado: volte a um planeta seu ou a uma loja.','ALERTA');\n    }\n    if(k.down){ sh.vx*=Math.pow(0.2,dt); sh.vy*=Math.pow(0.2,dt); }\n    const sp=Math.hypot(sh.vx,sh.vy), max=200*SPD_MUL;\n    if(sp>max){ sh.vx*=max/sp; sh.vy*=max/sp; }\n    sh.x=Math.max(0,Math.min(WORLD.w,sh.x+sh.vx*dt));\n    sh.y=Math.max(0,Math.min(WORLD.h,sh.y+sh.vy*dt));\n    sh.vx*=Math.pow(0.7,dt); sh.vy*=Math.pow(0.7,dt);\n    updateCombat(dt);\n    updateMining(dt);\n    updateAllies(dt);\n  }\n  for(const s of S.systems) for(const p of s.planets) p.ang+=p.spd*dt;\n  updateMissions(dt);\n  updateRaids(dt);\n  updateDistress(dt);\n  updateDiploCycle(dt);\n  updateEscort(dt);\n  S.acc+=dt;\n  while(S.acc>=1){ S.acc-=1; produce(); }\n  if(!S.won && conqueredCount()>=S.cfg.goal){ S.won=true; S.over='win'; msg('Vitória: '+S.cfg.goal+' sistemas conquistados.','SISTEMA'); }\n}\n\n// ---------- Desenho ----------\n// Naves: casco quadrado com cabine, asas e motor; a cor é a da nação (ou dourada para o jogador).\nfunction drawHull(col){\n  ctx.strokeStyle='#0a0f20'; ctx.lineWidth=1;\n  ctx.fillStyle='#4a5470'; ctx.fillRect(-13,-8,6,5); ctx.fillRect(-13,3,6,5);\n  ctx.strokeRect(-13,-8,6,5); ctx.strokeRect(-13,3,6,5);\n  ctx.fillStyle=col; ctx.fillRect(-10,-7,20,14); ctx.strokeRect(-10,-7,20,14);\n  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(-10,-7,20,3); ctx.fillRect(-10,4,20,3);\n  ctx.fillStyle='#9fd8ff'; ctx.fillRect(3,-3,5,6); ctx.strokeRect(3,-3,5,6);\n  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(-7,-1,8,1);\n  ctx.fillStyle='#ffd27a'; ctx.fillRect(-12,-2,2,4);\n}\n// Descoberta: um ping quando a névoa revela um sistema ou uma anomalia pela primeira vez.\nfunction pingSound(){ beep(1320,0.25,'sine'); setTimeout(()=>beep(1760,0.3,'sine'),120); }\nfunction checkDiscovery(){\n  if(!S.fog || S.t<1) return;\n  S.seenSys=S.seenSys||[];\n  S.systems.forEach((s,i)=>{\n    if(!S.seenSys[i] && isRev(s.x,s.y)){\n      S.seenSys[i]=true; pingSound();\n      msg('Novo sistema revelado: '+s.name+'.','EXPLORAR');\n    }\n  });\n  for(const a of (S.anoms||[])){\n    if(!a.seen && isRev(a.x,a.y)){ a.seen=true; pingSound(); msg('Anomalia detectada a '+Math.round(dist(a.x,a.y,S.ship.x,S.ship.y))+' unidades.','EXPLORAR'); }\n  }\n}\n// Névoa de guerra: células de 60 unidades, reveladas pela nave e salvas no jogo.\nconst FOG_CELL=60;\nlet FW=0, FH=0;\nfunction setWorld(w,h){ WORLD.w=w; WORLD.h=h; FW=Math.ceil(w/FOG_CELL); FH=Math.ceil(h/FOG_CELL); }\nsetWorld(3000,2000);\nfunction fogIdx(x,y){ return Math.floor(y/FOG_CELL)*FW+Math.floor(x/FOG_CELL); }\nfunction isRev(x,y){ if(!S||!S.fog) return true; return S.fog[fogIdx(x,y)]===1; }\nfunction revealAt(x,y,r){\n  if(!S.fog) S.fog=new Array(FW*FH).fill(0);\n  const x0=Math.max(0,Math.floor((x-r)/FOG_CELL)), x1=Math.min(FW-1,Math.floor((x+r)/FOG_CELL));\n  const y0=Math.max(0,Math.floor((y-r)/FOG_CELL)), y1=Math.min(FH-1,Math.floor((y+r)/FOG_CELL));\n  for(let gy=y0;gy<=y1;gy++) for(let gx=x0;gx<=x1;gx++){\n    if(Math.hypot(gx*FOG_CELL+FOG_CELL/2-x,gy*FOG_CELL+FOG_CELL/2-y)<=r) S.fog[gy*FW+gx]=1;\n  }\n}\nfunction drawFog(cx,cy){\n  if(!S.fog) return;\n  const Z=OPT.zoom||1, ex=W/Z+60, ey=H/Z+60;\n  const vx0=cx-ex, vx1=cx+W+ex, vy0=cy-ey, vy1=cy+H+ey;\n  ctx.fillStyle='rgba(3,5,12,0.94)';\n  // fora dos limites do mapa: tudo é névoa\n  if(vy0<0) ctx.fillRect(vx0-cx,vy0-cy,vx1-vx0,-vy0);\n  if(vy1>WORLD.h) ctx.fillRect(vx0-cx,WORLD.h-cy,vx1-vx0,vy1-WORLD.h);\n  const yA=Math.max(0,vy0), yB=Math.min(WORLD.h,vy1);\n  if(vx0<0) ctx.fillRect(vx0-cx,yA-cy,-vx0,yB-yA);\n  if(vx1>WORLD.w) ctx.fillRect(WORLD.w-cx,yA-cy,vx1-WORLD.w,yB-yA);\n  // dentro do mapa: células ainda não reveladas\n  const x0=Math.max(0,Math.floor(vx0/FOG_CELL)), x1=Math.min(FW-1,Math.floor(vx1/FOG_CELL));\n  const y0=Math.max(0,Math.floor(vy0/FOG_CELL)), y1=Math.min(FH-1,Math.floor(vy1/FOG_CELL));\n  for(let gy=y0;gy<=y1;gy++) for(let gx=x0;gx<=x1;gx++){\n    if(S.fog[gy*FW+gx]===1) continue;\n    ctx.fillRect(gx*FOG_CELL-cx,gy*FOG_CELL-cy,FOG_CELL+1,FOG_CELL+1);\n  }\n}\n// Meteoros: formas irregulares com tamanho próprio e giro lento; cor e detalhe por tipo.\nconst METEOR_COL={materia:'#c9a06a', ferro:'#8a909a', cristal:'#7ae0f0'};\nfunction drawMeteor(m,x,y){\n  const r=m.r||5, n=m.n||6, seed=m.seed||3;\n  ctx.save(); ctx.translate(x,y); ctx.rotate((m.rot||0)+S.t*(m.spin||0));\n  ctx.beginPath();\n  for(let k=0;k<n;k++){\n    const a=k*2*Math.PI/n, rr=r*(0.72+0.28*(((seed*(k+3))%7)/6));\n    if(k) ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); else ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);\n  }\n  ctx.closePath();\n  ctx.fillStyle=METEOR_COL[m.type]||'#9aa0a6'; ctx.fill();\n  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1; ctx.stroke();\n  if(m.type==='cristal'){ ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fillRect(-1,-r*0.6,2,r*1.2); ctx.fillRect(-r*0.6,-1,r*1.2,2); }\n  if(m.type==='materia'){ ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(r*0.3,-r*0.2,r*0.3,0,6.283); ctx.fill(); }\n  ctx.restore();\n}\n// Marca de cada povo no sistema natal: forma diferente, na cor da nação.\nfunction nationAt(si){ for(let i=0;i<S.cfg.nations;i++) if(nationSys(i)===si) return i; return -1; }\nfunction drawSpeciesMark(i,x,y,col){\n  const r=6, cy=y-26, n=[3,4,4,6,5][i]||4, rot=i===1?Math.PI/4:-Math.PI/2;\n  ctx.save(); ctx.fillStyle=col; ctx.strokeStyle='#0a0f20'; ctx.lineWidth=1;\n  ctx.beginPath();\n  for(let k=0;k<n;k++){ const a=rot+k*2*Math.PI/n, px=x+Math.cos(a)*r, py=cy+Math.sin(a)*r; if(k) ctx.lineTo(px,py); else ctx.moveTo(px,py); }\n  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();\n}\n// Tooltip do sistema sob o mouse, no mapa estelar.\nconst MOUSE={x:-1,y:-1};\n// Caixa de tooltip com título e linhas, colocada ao lado do mouse e sempre dentro da tela.\nfunction tipBox(title,lines,x,y){\n  ctx.save();\n  ctx.font='bold 13px Georgia';\n  let w=ctx.measureText(title).width;\n  ctx.font='12px Georgia';\n  for(const l of lines) w=Math.max(w,ctx.measureText(l).width);\n  const pad=10, lh=16;\n  w+=pad*2; const h=pad*2+16+lh*lines.length;\n  let bx=x+16, by=y+12;\n  if(bx+w>W-8) bx=x-w-16;\n  if(by+h>H-8) by=H-h-8;\n  ctx.fillStyle='rgba(8,12,28,.94)'; ctx.strokeStyle='#d4a84a'; ctx.lineWidth=1;\n  ctx.fillRect(bx,by,w,h); ctx.strokeRect(bx,by,w,h);\n  ctx.textAlign='left';\n  ctx.font='bold 13px Georgia'; ctx.fillStyle='#f0d28a'; ctx.fillText(title,bx+pad,by+pad+12);\n  ctx.font='12px Georgia'; ctx.fillStyle='#dfe8ff';\n  lines.forEach((l,i)=>ctx.fillText(l,bx+pad,by+pad+28+lh*i));\n  ctx.restore();\n}\nfunction planetTip(p,si,pi){\n  const own=owned(p), lines=[`Tipo: ${PTYPES[p.type]}`];\n  if(own) lines.push(p.base?'Situação: base principal':`Situação: colônia sua · nível ${p.lvl} · defesa ${defense(p).toFixed(1)}`);\n  else lines.push(p.hab?'Situação: habitado (não é seu)':'Situação: inabitado');\n  if(p.hab && p.sp>=0){\n    lines.push(`Povo: ${SPECIES[p.sp]} (${archOf(p.sp)})`);\n    lines.push(`Relação: ${relName(S.rel[p.sp])} (${Math.round(S.rel[p.sp])})${S.war[p.sp]?' · EM GUERRA':''}`);\n  }\n  if(p.hab) lines.push(`População: ${Math.floor(p.pop)}`);\n  if(!own && p.hab && p.sp>=0) lines.push(`Influência: ${infTier(p.inf)} (${Math.floor(p.inf)}%)`);\n  if(!p.base) lines.push(`Terraformação: ${p.terra||0}/3${!own&&!p.hab&&(p.terra||0)>=3?' · pronto para colonizar':''}`);\n  if(own && needsTerra(p)) lines.push('Bloqueado: complete a terraformação');\n  if(!own && p.mis) lines.push(`Missão: entregar ${p.mis.qty} de ${RES_NAME[p.mis.item]}`);\n  return {title:S.systems[si].name+' · planeta '+p.n, lines};\n}\nfunction systemTip(i){\n  const s=S.systems[i];\n  const st=systemOwned(s)?'conquistado':(S.visited&&S.visited[i]?'visitado':'não explorado');\n  const mine=s.planets.filter(owned).length, hab=s.planets.filter(p=>p.hab).length;\n  const lines=[`Situação: ${st}`,`Planetas: ${s.planets.length} · habitados ${hab} · seus ${mine}`];\n  const nat=nationAt(i);\n  if(nat>=0) lines.push(`Povo natal: ${SPECIES[nat]} · ${relName(S.rel[nat])}${S.war[nat]?' · EM GUERRA':''}`);\n  if(S.escort && S.escort.sys===i) lines.push('Alvo de escolta');\n  return {title:s.name, lines};\n}\nfunction shipTip(o,kind){\n  if(kind==='aliada'){\n    return {title:'Nave aliada dos '+SPECIES[o.sp], lines:[\n      'Situação: aliada',\n      `Casco: ${Math.max(0,Math.floor(o.hp))}/${o.maxHp}`,\n      `Relação: ${relName(S.rel[o.sp])}`]};\n  }\n  const sp=o.sp;\n  let sit;\n  if(sp<0) sit='hostil (pirata)';\n  else if(o.patrol && !isHostile(sp)) sit='patrulha · não ataca';\n  else if(S.war[sp]) sit='HOSTIL · em guerra';\n  else if(isHostile(sp)) sit='hostil · relação baixa';\n  else sit='neutra';\n  const lines=[`Situação: ${sit}`,`Casco: ${Math.max(0,Math.floor(o.hp))}/${o.maxHp}`];\n  if(sp>=0) lines.push(`Relação: ${relName(S.rel[sp])} (${Math.round(S.rel[sp])})`);\n  if((o.stun||0)>0) lines.push('Desativada pelo EMP');\n  return {title: sp<0?'Nave pirata':'Nave dos '+SPECIES[sp]+' ('+archOf(sp)+')', lines};\n}\nfunction drawTooltip(){\n  if(MOUSE.x<0) return;\n  if(S.sys!==null){\n    let hit=null, hi=-1;\n    S.systems[S.sys].planets.forEach((p,i)=>{ const [px,py]=planetPos(p,W/2,H/2); if(dist(px,py,MOUSE.x,MOUSE.y)<18){ hit=p; hi=i; } });\n    if(hit){ const t=planetTip(hit,S.sys,hi); tipBox(t.title,t.lines,MOUSE.x,MOUSE.y); }\n    return;\n  }\n  const Z=OPT.zoom||1, cx=S.ship.x-W/2, cy=S.ship.y-H/2;\n  const wx=(MOUSE.x-W/2)/Z+W/2+cx, wy=(MOUSE.y-H/2)/Z+H/2+cy, rr=18/Z;\n  let t=null;\n  for(const e of S.enemies){ if(dist(e.x,e.y,wx,wy)<rr && isRev(e.x,e.y)){ t=shipTip(e,'inimiga'); break; } }\n  if(!t) for(const m of S.meteors){\n    if(dist(m.x,m.y,wx,wy)<rr+m.r){ t={title:'Meteoro de '+RES_NAME[m.type], lines:[`Restante: ${Math.floor(m.amt)}`,'Aproxime a nave e pressione M para minerar']}; break; }\n  }\n  if(!t) for(const a of (S.allies||[])){ if(dist(a.x,a.y,wx,wy)<rr){ t=shipTip(a,'aliada'); break; } }\n  if(!t){\n    let best=null, bd=14/Z;\n    S.systems.forEach((s,i)=>{ const d=dist(s.x,s.y,wx,wy); if(d<bd && isRev(s.x,s.y)){ bd=d; best=i; } });\n    if(best!==null) t=systemTip(best);\n  }\n  if(t) tipBox(t.title,t.lines,MOUSE.x,MOUSE.y);\n}\nfunction drawGalaxy(){\n  const cx=S.ship.x-W/2, cy=S.ship.y-H/2;\n  ctx.fillStyle='#050812'; ctx.fillRect(0,0,W,H);\n  ctx.fillStyle='#dfe8ff';\n  for(const st of S.stars){\n    const sx=((st.x-cx*0.4)%W+W)%W, sy=((st.y-cy*0.4)%H+H)%H;\n    ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(sx,sy,st.r,0,6.283); ctx.fill();\n  }\n  ctx.globalAlpha=1;\n  drawFog(cx,cy);\n  ctx.font='12px Georgia';\n  for(const s of S.systems){\n    const sx=s.x-cx, sy=s.y-cy;\n    if(!inView(sx,sy,60)) continue;\n    if(!isRev(s.x,s.y)) continue;\n    const mine=s.planets.some(owned);\n    ctx.fillStyle=mine?'#f0d28a':'#8fc0ec';\n    ctx.beginPath(); ctx.arc(sx,sy,9,0,6.283); ctx.fill();\n    const hsp=nationAt(S.systems.indexOf(s));\n    if(hsp>=0) drawSpeciesMark(hsp,sx,sy,SPCOL[hsp]);\n    if(S.escort && S.systems.indexOf(s)===S.escort.sys){ ctx.strokeStyle='#ffb06a'; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.arc(sx,sy,22,0,6.283); ctx.stroke(); ctx.setLineDash([]); }\n    if(systemOwned(s)){ ctx.strokeStyle='#d4a84a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy,15,0,6.283); ctx.stroke(); ctx.lineWidth=1; }\n    ctx.fillStyle='#dfe8ff'; ctx.fillText(s.name,sx+18,sy+4);\n  }\n  for(const m of S.meteors){\n    const mx=m.x-cx, my=m.y-cy;\n    if(!inView(mx,my,20)) continue;\n    drawMeteor(m,mx,my);\n  }\n  for(const a of (S.anoms||[])){\n    const ax=a.x-cx, ay=a.y-cy;\n    if(!inView(ax,ay,20)) continue;\n    if(!isRev(a.x,a.y)) continue;\n    const pr=11+3*Math.sin(S.t*4);\n    ctx.strokeStyle='#c08aff'; ctx.lineWidth=2; ctx.globalAlpha=0.5+0.5*Math.sin(S.t*4);\n    ctx.beginPath(); ctx.arc(ax,ay,pr,0,6.283); ctx.stroke(); ctx.globalAlpha=1; ctx.lineWidth=1;\n    ctx.fillStyle='#c08aff'; ctx.fillText(a.kind==='buraco'?'o':'?',ax-4,ay+4);\n  }\n  if(S.mining){\n    const m=nearMeteor(60);\n    if(m){ ctx.strokeStyle='rgba(122,224,240,.7)'; ctx.beginPath(); ctx.moveTo(S.ship.x-cx,S.ship.y-cy); ctx.lineTo(m.x-cx,m.y-cy); ctx.stroke(); }\n  }\n  for(const e of S.enemies){\n    const ex=e.x-cx, ey=e.y-cy;\n    if(!inView(ex,ey,40)) continue;\n    const ec=e.sp>=0?SPCOL[e.sp]:'#e05a5a';\n    ctx.save(); ctx.translate(ex,ey); ctx.rotate(e.ang);\n    drawHull(ec);\n    ctx.restore();\n    ctx.fillStyle='#000'; ctx.fillRect(ex-12,ey-16,24,3);\n    ctx.fillStyle=ec; ctx.fillRect(ex-12,ey-16,24*Math.max(0,e.hp/e.maxHp),3);\n  }\n  for(const a of (S.allies||[])){\n    const ax=a.x-cx, ay=a.y-cy;\n    ctx.save(); ctx.translate(ax,ay); ctx.rotate(a.ang);\n    ctx.fillStyle=SPCOL[a.sp]; ctx.strokeStyle='#dfe8ff';\n    drawHull(SPCOL[a.sp]);\n    ctx.restore();\n  }\n  for(const b of S.bullets){\n    ctx.fillStyle=b.enemy?'#ff6a6a':'#ffe38a';\n    ctx.beginPath(); ctx.arc(b.x-cx,b.y-cy,b.enemy?3:2.5,0,6.283); ctx.fill();\n  }\n  for(const f of (S.fx||[])){\n    ctx.globalAlpha=Math.max(0,f.t*2); ctx.strokeStyle=f.col; ctx.lineWidth=2;\n    ctx.beginPath(); ctx.arc(f.x-cx,f.y-cy,(0.5-f.t)*60,0,6.283); ctx.stroke();\n  }\n  ctx.globalAlpha=1; ctx.lineWidth=1;\n  const sh=S.ship, px=sh.x-cx, py=sh.y-cy;\n  ctx.save(); ctx.translate(px,py); ctx.rotate(sh.ang);\n  if(S.keys.up && S.fuel>0){ ctx.fillStyle='#ff9a3a'; ctx.beginPath(); ctx.moveTo(-8,-4); ctx.lineTo(-18-Math.random()*6,0); ctx.lineTo(-8,4); ctx.fill(); }\n  if((S.shield||0)>0){ ctx.strokeStyle='rgba(122,224,240,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,20,0,6.283); ctx.stroke(); ctx.lineWidth=1; }\n  if(S.hurt>0){ ctx.strokeStyle='rgba(255,80,80,.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,16,0,6.283); ctx.stroke(); ctx.lineWidth=1; }\n  drawHull('#f0d28a');\n  ctx.restore();\n  const ni=nearSystem();\n  if(ni>=0){ ctx.strokeStyle='#8bff8b'; ctx.beginPath(); ctx.arc(S.systems[ni].x-cx,S.systems[ni].y-cy,22,0,6.283); ctx.stroke(); promptText('[E] entrar no sistema',px,py-30); }\n  drawEdges(cx,cy);\n  drawMinimap(cx,cy);\n}\n// Indicadores nas bordas: base, pedidos de socorro e naves hostis fora da tela.\nfunction edgeTargets(){\n  const T=[], home=S.systems[0];\n  T.push({x:home.x,y:home.y,col:'#8bff8b'});\n  for(const s of S.systems) for(const p of s.planets) if(p.mis&&p.mis.urgent&&!owned(p)) T.push({x:s.x,y:s.y,col:'#ffb06a'});\n  for(const e of S.enemies) if(e.sp<0||isHostile(e.sp)) T.push({x:e.x,y:e.y,col:'#e05a5a'});\n  return T;\n}\nfunction drawEdges(cx,cy){\n  ctx.setTransform(1,0,0,1,0,0);\n  const m=24, mx=W/2, my=H/2, Zc=OPT.zoom||1;\n  for(const t of edgeTargets()){\n    const sx=(t.x-cx-W/2)*Zc+W/2, sy=(t.y-cy-H/2)*Zc+H/2;\n    if(sx>=0&&sy>=0&&sx<=W&&sy<=H) continue;\n    const ang=Math.atan2(sy-my,sx-mx), dx=Math.cos(ang), dy=Math.sin(ang);\n    const k=Math.min(Math.abs(dx)>1e-6?(W/2-m)/Math.abs(dx):1e9, Math.abs(dy)>1e-6?(H/2-m)/Math.abs(dy):1e9);\n    ctx.save(); ctx.translate(mx+dx*k,my+dy*k); ctx.rotate(ang);\n    ctx.fillStyle=t.col; ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-6,-6); ctx.lineTo(-6,6); ctx.closePath(); ctx.fill();\n    ctx.restore();\n  }\n}\n// Filtros do minimapa (tecla G): todos, guerra, colônias, missões.\nconst MAP_FILTERS=['todos','guerra','colônias','missões'];\nfunction mapMatch(s){\n  const f=MAP_FILTERS[S.mapF||0];\n  if(f==='todos') return true;\n  if(f==='guerra') return s.planets.some(p=>p.hab&&S.war[p.sp]);\n  if(f==='colônias') return s.planets.some(owned);\n  return s.planets.some(p=>p.mis&&!owned(p));\n}\nfunction drawMinimap(cx,cy){\n  ctx.setTransform(1,0,0,1,0,0);\n  const MS=180, MH=Math.round(MS*WORLD.h/WORLD.w);\n  const mx=W-MS-12, my=H-MH-12, k=MS/WORLD.w;\n  ctx.fillStyle='rgba(8,12,28,.85)'; ctx.fillRect(mx,my,MS,MH);\n  if(S.fog){\n    ctx.fillStyle='rgba(3,5,12,.92)';\n    for(let gy=0;gy<FH;gy++) for(let gx=0;gx<FW;gx++){\n      if(S.fog[gy*FW+gx]!==1) ctx.fillRect(mx+gx*FOG_CELL*k,my+gy*FOG_CELL*k,FOG_CELL*k+1,FOG_CELL*k+1);\n    }\n  }\n  ctx.strokeStyle='#2d4a8c'; ctx.strokeRect(mx,my,MS,MH);\n  for(const s of S.systems){\n    if(!mapMatch(s)||!isRev(s.x,s.y)) continue;\n    ctx.fillStyle=s.planets.some(owned)?'#f0d28a':'#8fc0ec';\n    ctx.fillRect(mx+s.x*k-2,my+s.y*k-2,4,4);\n  }\n  ctx.fillStyle='#e05a5a';\n  for(const e of S.enemies) ctx.fillRect(mx+e.x*k-1,my+e.y*k-1,2,2);\n  ctx.strokeStyle='rgba(255,255,255,.6)';\n  ctx.strokeRect(mx+cx*k,my+cy*k,W*k,H*k);\n  ctx.fillStyle='#ffffff';\n  ctx.fillRect(mx+S.ship.x*k-2,my+S.ship.y*k-2,4,4);\n}\nfunction drawSystem(){\n  const sys=S.systems[S.sys], cx=W/2, cy=H/2;\n  ctx.fillStyle='#070b18'; ctx.fillRect(0,0,W,H);\n  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,50);\n  g.addColorStop(0,'#fff3b0'); g.addColorStop(1,'rgba(255,200,80,0)');\n  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,50,0,6.283); ctx.fill();\n  ctx.fillStyle='#ffd84a'; ctx.beginPath(); ctx.arc(cx,cy,14,0,6.283); ctx.fill();\n  ctx.textAlign='center'; ctx.font='16px Georgia'; ctx.fillStyle='#dfe8ff';\n  ctx.fillText(sys.name,cx,cy+40);\n  ctx.font='12px Georgia';\n  sys.planets.forEach((p,i)=>{\n    ctx.strokeStyle='rgba(143,192,236,.25)'; ctx.beginPath(); ctx.arc(cx,cy,p.r,0,6.283); ctx.stroke();\n    const [px,py]=planetPos(p,cx,cy);\n    ctx.fillStyle=PCOL[p.type]; ctx.beginPath(); ctx.arc(px,py,12,0,6.283); ctx.fill();\n    if(owned(p)){ ctx.strokeStyle='#d4a84a'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(px,py,16,0,6.283); ctx.stroke(); ctx.lineWidth=1; }\n    if((p.terra||0)>0){ ctx.strokeStyle='#7ae07a'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(px,py,15,-1.57,-1.57+6.283*(p.terra/3)); ctx.stroke(); ctx.lineWidth=1; }\n    if(p.hab){ ctx.fillStyle=p.sp>=0?SPCOL[p.sp]:'#f0d28a'; ctx.beginPath(); ctx.arc(px+9,py-9,4,0,6.283); ctx.fill(); }\n    if(S.sel && S.sel.sys===S.sys && S.sel.p===i){ ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,22,0,6.283); ctx.stroke(); }\n    ctx.fillStyle='#dfe8ff'; ctx.fillText('Planeta '+p.n+(p.base?' (base)':''),px,py+32);\n  });\n  promptText('[E] sair do sistema',W/2,64);\n  ctx.textAlign='left';\n}\nfunction draw(){\n  const k=OPT.shake?(S.shake||0):0;\n  const Z=S.sys===null?(OPT.zoom||1):1;\n  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#050812'; ctx.fillRect(0,0,W,H);\n  ctx.setTransform(Z,0,0,Z,W/2*(1-Z)+rnd(-k,k),H/2*(1-Z)+rnd(-k,k));\n  if(S.sys===null) drawGalaxy(); else drawSystem();\n  ctx.setTransform(1,0,0,1,0,0);\n  drawTooltip();\n}\n\n// ---------- Painéis ----------\n// Indicadores quadrados à direita: habilidades (cor = pronto, carregando ou ativo) e status da nave.\nconst GICON={\n  shield:'<path d=\"M8 1 L14 3 V8 Q14 13 8 15 Q2 13 2 8 V3 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>',\n  emp:'<circle cx=\"8\" cy=\"8\" r=\"5.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><circle cx=\"8\" cy=\"8\" r=\"2\" fill=\"currentColor\"/>',\n  hull:'<rect x=\"3\" y=\"3\" width=\"10\" height=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><rect x=\"6.5\" y=\"6.5\" width=\"3\" height=\"3\" fill=\"currentColor\"/>',\n  fuel:'<polygon points=\"8,1.5 13.5,9 8,14.5 2.5,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>',\n  cargo:'<rect x=\"2\" y=\"5\" width=\"12\" height=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><rect x=\"6\" y=\"2\" width=\"4\" height=\"3\" fill=\"currentColor\"/>'\n};\nconst GCOL={ready:'#3fae63',charging:'#c99a3a',active:'#3fb8d6',ok:'#3fae63',mid:'#c99a3a',low:'#c2463f'};\nfunction gtile(name,icon,pct,col,label,border){\n  return `<div class=\"gtile\" style=\"border-color:${border||col}\">\n    <div class=\"gfill\" style=\"height:${Math.max(0,Math.min(100,pct))}%;background:${col}\"><\/div>\n    <div class=\"gname\">${name}<\/div>\n    <div class=\"glab\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 16 16\" style=\"color:#f6e7b8\">${GICON[icon]}<\/svg><b>${label}<\/b><\/div><\/div>`;\n}\nfunction renderGauges(){\n  const el=document.getElementById('gauges');\n  if(!el) return;\n  if(!S){ el.innerHTML=''; return; }\n  const sCd=S.shieldCd||0, eCd=S.empCd||0, sh=S.shield||0;\n  const shieldTile = sh>0 ? gtile('Escudo Q','shield',sh/4*100,GCOL.active,sh.toFixed(1)+'s')\n    : sCd>0 ? gtile('Escudo Q','shield',(1-sCd/20)*100,GCOL.charging,Math.ceil(sCd)+'s')\n    : gtile('Escudo Q','shield',100,GCOL.ready,'pronto');\n  const empTile = eCd>0 ? gtile('EMP R','emp',(1-eCd/25)*100,GCOL.charging,Math.ceil(eCd)+'s')\n    : gtile('EMP R','emp',100,GCOL.ready,'pronto');\n  const hp=Math.max(0,S.hp), hpMax=maxHp(), hpP=hp/hpMax*100;\n  const fP=S.fuel/FUEL_MAX*100, cP=cargoSum()/CARGO_CAP*100;\n  const lvl=p=>p<30?GCOL.low:p<60?GCOL.mid:GCOL.ok;\n  el.innerHTML=shieldTile+empTile\n    +gtile('Casco','hull',hpP,lvl(hpP),Math.floor(hp)+'/'+hpMax)\n    +gtile('Combustível','fuel',fP,lvl(fP),Math.floor(S.fuel)+'/'+FUEL_MAX)\n    +gtile('Carga','cargo',cP,GCOL.active,Math.floor(cargoSum())+'/'+CARGO_CAP);\n}\nfunction renderHud(){\n  const r=S.res;\n  document.getElementById('hud').innerHTML=`<b>ATLAS · GALÁXIA<\/b>\n    <span>Créditos <b>${Math.floor(r.creditos)}<\/b><\/span>\n    <span>Matéria <b>${Math.floor(r.materia)}<\/b><\/span><span>Energia <b>${Math.floor(r.energia)}<\/b><\/span>\n    <span>Pesquisa <b>${Math.floor(r.pesquisa)}<\/b><\/span>\n    ${hostileTxt()}\n    ${threatTxt()}\n    ${escortTxt()}\n    <span style=\"margin-left:auto\">${S.paused||S.decision?'PAUSADO · ':''}${S.sys===null?'Espaço profundo':'Sistema: '+S.systems[S.sys].name}<\/span>`;\n}\nfunction threatTxt(){\n  const n=playerPlanets().filter(p=>!p.base&&p.hab&&S.war[p.sp]).length;\n  return n?`<span style=\"color:#ffb06a\"><b>[AMEAÇA] ${n} planeta(s) sob guerra · próximo ataque em ${Math.ceil(Math.max(0,S.raidT===undefined?90:S.raidT))}s<\/b><\/span>`:'';\n}\nfunction hostileTxt(){\n  const hs=SPECIES.slice(0,S.cfg.nations).filter((n,i)=>isHostile(i));\n  return hs.length?`<span style=\"color:#ff7a6a\"><b>[HOSTIL] ${hs.join(', ')}<\/b><\/span>`:'';\n}\nfunction planetPanelHtml(si,pi){\n  const p=S.systems[si].planets[pi];\n  let h=`<div><b>${planetName(si,pi)}<\/b> · ${PTYPES[p.type]}${p.base?' · Base':''}<\/div>`;\n  if(p.hab) h+= p.sp>=0 ? `<div>Povo ${SPECIES[p.sp]} · população ${Math.floor(p.pop)} · ${relName(S.rel[p.sp])}<\/div>` : `<div>Colônia sua · população ${Math.floor(p.pop)}<\/div>`;\n  else h+=`<div>Inabitado<\/div>`;\n  if(!owned(p)) h+=`<div>Influência: ${infTier(p.inf)} (${Math.floor(p.inf)}%)<\/div>`;\n  if(owned(p)){\n    if(p.base){\n      h+=`<div class=\"stitle\">Estoque da base<\/div>\n        <div>Matéria ${Math.floor(S.res.materia)} · Ferro ${Math.floor(S.res.ferro)} · Cristal ${Math.floor(S.res.cristal)}<\/div>\n        <button class=\"btn\" onclick=\"unloadCargo(${si},${pi});renderPanel()\" ${cargoSum()>0?'':'disabled'}>Entregar carga à base<\/button>\n        ${upgradeHtml()}`;\n    } else {\n      h+=`<div class=\"stitle\">Depósito do planeta (${Math.floor(depotSum(p))}/${DEPOT_CAP})<\/div>\n        <div>Matéria ${Math.floor(p.depot.materia||0)} · Ferro ${Math.floor(p.depot.ferro||0)} · Cristal ${Math.floor(p.depot.cristal||0)}<\/div>\n        <button class=\"btn\" onclick=\"loadDepot(${si},${pi});renderPanel()\" ${depotSum(p)>0?'':'disabled'}>Carregar da depósito para a nave<\/button>\n        <button class=\"btn\" onclick=\"unloadCargo(${si},${pi});renderPanel()\" ${cargoSum()>0?'':'disabled'}>Guardar carga no depósito<\/button>`;\n    }\n    h+=`<div>Nível ${p.lvl} · Defesa ${defense(p).toFixed(1)} · Terraformação ${p.terra||0}/3<\/div>`;\n    if(needsTerra(p)) h+=`<div class=\"hint\">Complete as 3 etapas de terraformação para liberar construções, evolução, depósito e loja.<\/div>`;\n    h+=`<button class=\"btn\" onclick=\"refuel(${si},${pi});renderPanel()\">Reabastecer · ${Math.ceil(20*fuelUnit(p))} créditos (20 unidades)<\/button>`;\n    if(!p.base){\n      for(const k in BLD){\n        h+=`<button class=\"btn\" onclick=\"build(${si},${pi},'${k}');renderPanel()\" ${canPay(BLD[k].cost)?'':'disabled'}>${BLD[k].n} · ${costTxt(BLD[k].cost)}<br><small>${BLD[k].desc} · tem ${p.bld[k]||0}<\/small><\/button>`;\n      }\n      const ec={materia:30*p.lvl};\n      h+=`<button class=\"btn\" onclick=\"evolve(${si},${pi});renderPanel()\" ${canPay(ec)?'':'disabled'}>Evoluir para nível ${p.lvl+1} · ${costTxt(ec)}<\/button>`;\n      h+=terraHtml(p,si,pi);\n    }\n  } else if(!p.hab){\n    h+=terraHtml(p,si,pi);\n    h+=`<button class=\"btn\" onclick=\"colonize(${si},${pi});renderPanel()\" ${(canPay(colCost())&&(p.terra||0)>=3)?'':'disabled'}>Colonizar (após 3 etapas) · ${costTxt(colCost())}<\/button>`;\n  }\n  if(!owned(p) && p.mis){\n    const m=p.mis, r=Math.round(misReward(p));\n    h+=`<div class=\"stitle\">${m.urgent?'Pedido de socorro · '+Math.ceil(m.left)+' s':'Missão do planeta'}<\/div>\n      <div>Entregar ${m.qty} de ${RES_NAME[m.item]} · +${m.cred} créditos · +${r} influência<\/div>\n      <button class=\"btn\" onclick=\"completeMission(${si},${pi});renderPanel()\" ${S.cargo[m.item]>=m.qty?'':'disabled'}>Cumprir missão<\/button>`;\n  }\n  if(!owned(p) && p.hab && S.war[p.sp]){\n    h+=`<button class=\"btn\" onclick=\"invade(${si},${pi});renderPanel()\" ${canPay({creditos:150,materia:20})?'':'disabled'}>Invadir · 150 créditos, 20 matéria · chance ${Math.round(invadeChance(p)*100)}%<\/button>`;\n  }\n  if(p.hab){\n    if(owned(p)&&p.sp>=0) h+=alliHtml(si,pi);\n    if(p.sp>=0) h+=diploHtml(p.sp);\n    h+=`<div class=\"stitle\">Loja<\/div>`;\n    if(!S.shop) h+=`<button class=\"btn\" onclick=\"S.shop=true;renderPanel()\">Abrir loja<\/button>`;\n    else {\n      for(const item of ['ferro','cristal','materia']){\n        const q=Math.floor(S.cargo[item]);\n        h+=`<button class=\"btn\" onclick=\"sellItem(${si},${pi},'${item}');renderPanel()\" ${q>0?'':'disabled'}>Vender ${RES_NAME[item]} (${q}) · ${sellPrice(item,p)} cada<\/button>`;\n      }\n      h+=`<button class=\"btn\" onclick=\"S.shop=false;renderPanel()\">Fechar loja<\/button>`;\n    }\n  }\n  return h;\n}\n// Painel aparece só com um planeta selecionado; fecha pelo X no canto.\nfunction renderPanel(){\n  const el=document.getElementById('panel');\n  if(!S || S.over || S.decision || S.sys===null || !S.sel){ el.style.display='none'; return; }\n  el.style.display='block';\n  el.innerHTML=`<button class=\"xbtn\" style=\"position:absolute;right:8px;top:8px\" onclick=\"S.sel=null;renderPanel()\">X<\/button>\n    <h3 style=\"padding-right:30px\">${S.systems[S.sys].name}<\/h3>`+planetPanelHtml(S.sel.sys,S.sel.p);\n}\nfunction renderStats(){\n  const el=document.getElementById('stats');\n  if(!S.stats || S.over || S.decision){ el.style.display='none'; return; }\n  el.style.display='block';\n  const own=playerPlanets(), hab=own.filter(p=>p.hab).length;\n  const sp=SPECIES.slice(0,S.cfg.nations).map((n,i)=>{\n    const c=S.systems.reduce((a,s)=>a+s.planets.filter(p=>p.hab&&p.sp===i).length,0);\n    return n+': '+c;\n  }).join('<br>');\n  el.innerHTML=`<h3>Império<\/h3>\n    ${Object.keys(RES_NAME).map(k=>`<div>${RES_NAME[k]}: <b>${Math.floor(S.res[k]||0)}<\/b><\/div>`).join('')}\n    <div>Carga: <b>${Math.floor(cargoSum())}/${CARGO_CAP}<\/b><\/div>\n    <div>Combustível: <b>${Math.floor(S.fuel)}/${FUEL_MAX}<\/b><\/div>\n    <div>Casco da nave: <b>${Math.max(0,Math.floor(S.hp))}<\/b><\/div>\n    <div class=\"hint\">Planetas: ${own.length} · Habitados: ${hab}<\/div>\n    <div class=\"hint\">Sistemas conquistados: ${conqueredCount()} de ${S.cfg.goal} para vencer<\/div>\n    <div class=\"stitle\">Povos (planetas)<\/div>${sp}\n    <div class=\"stitle\">Relações<\/div>${relHtml()}\n    ${techHtml()}`;\n}\nconst TAG_ICON={\n  ECONOMIA:'<circle cx=\"7\" cy=\"7\" r=\"5\" fill=\"#f0d28a\"/>',\n  ALERTA:'<polygon points=\"7,1 13,13 1,13\" fill=\"#ff9a3a\"/>',\n  COMBATE:'<rect x=\"6\" y=\"1\" width=\"2\" height=\"12\" fill=\"#e05a5a\"/><rect x=\"1\" y=\"6\" width=\"12\" height=\"2\" fill=\"#e05a5a\"/>',\n  DIPLO:'<circle cx=\"5\" cy=\"7\" r=\"4\" fill=\"#7ae0c0\"/><circle cx=\"9\" cy=\"7\" r=\"4\" fill=\"#7aa8e0\" opacity=\".8\"/>',\n  SISTEMA:'<polygon points=\"7,1 9,6 13,7 9,8 7,13 5,8 1,7 5,6\" fill=\"#dfe8ff\"/>',\n  MINERACAO:'<polygon points=\"4,2 10,2 13,7 10,12 4,12 1,7\" fill=\"#9aa0a6\"/>',\n  MISSAO:'<rect x=\"2\" y=\"2\" width=\"10\" height=\"10\" fill=\"none\" stroke=\"#d4a84a\" stroke-width=\"2\"/><rect x=\"5\" y=\"5\" width=\"4\" height=\"4\" fill=\"#d4a84a\"/>',\n  EXPLORAR:'<polygon points=\"7,1 13,7 7,13 1,7\" fill=\"none\" stroke=\"#c08aff\" stroke-width=\"2\"/>',\n  GERAL:'<circle cx=\"7\" cy=\"7\" r=\"2.5\" fill=\"#8fc0ec\"/>'\n};\nfunction tagIcon(t){ return `<svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" style=\"vertical-align:-2px;margin-right:4px\">${TAG_ICON[t]||TAG_ICON.GERAL}<\/svg>`; }\nfunction renderMsg(){\n  document.getElementById('log').innerHTML=S.log.slice(-5).map(l=>`<div>${tagIcon(l.tag)}<span class=\"tg\">[${l.tag}]<\/span>${l.text}<\/div>`).join('');\n}\nfunction helpHtml(){\n  const row=(k,d)=>`<div class=\"krow\"><span class=\"key\">${k}<\/span><span>${d}<\/span><\/div>`;\n  return `<div class=\"hhead\"><h3>Controles<\/h3><button class=\"xbtn\" onclick=\"S.help=false;renderUI()\">X<\/button><\/div>\n    <div class=\"hsec\">Nave<\/div>\n    ${row('W A S D / setas','pilotar')}${row('S','frear')}${row('F','atirar')}${row('M','minerar meteoro próximo')}\n    ${row('Q','escudo de energia (4 s)')}${row('R','pulso EMP (desativa naves próximas)')}\n    <div class=\"hsec\">Sistemas e mapa<\/div>\n    ${row('E','entrar ou sair do sistema')}${row('G','filtro do minimapa')}\n    <div class=\"hsec\">Jogo<\/div>\n    ${row('Espaço','pausar')}${row('Tab','império, pesquisa e relações')}${row('V','som ligado/desligado')}${row('Esc','menu: salvar, carregar, opções')}${row('H','esta ajuda')}\n    <div class=\"hint\" style=\"margin-top:12px\">Objetivo: conquistar o número de sistemas escolhido na criação.<\/div>`;\n}\nfunction renderHelp(){\n  const el=document.getElementById('help');\n  if(!S.help){ el.style.display='none'; return; }\n  el.style.display='flex';\n  document.getElementById('helpbox').innerHTML=helpHtml();\n}\nfunction renderDecision(){\n  const el=document.getElementById('decision');\n  if(!S || !S.decision){ el.style.display='none'; return; }\n  el.style.display='flex';\n  const d=S.decision;\n  document.getElementById('decbox').innerHTML=`<h2 style=\"margin:0 0 10px;color:#f0d28a\">${d.title}<\/h2><p>${d.text}<\/p>`+\n    d.opts.map((o,i)=>`<button class=\"btn\" onclick=\"chooseDecision(${i})\">${o.label}<\/button>`).join('');\n}\nfunction renderOver(){\n  const o=document.getElementById('over');\n  if(S.over==='win'){\n    o.style.display='flex';\n    document.getElementById('overbox').innerHTML=`<h2 style=\"color:#f0d28a;margin:0 0 10px\">Vitória galáctica<\/h2>\n      <p>Você conquistou ${S.cfg.goal} sistemas.<\/p>\n      <button class=\"btn\" onclick=\"S.over=null;renderUI()\">Continuar explorando<\/button>\n      <button class=\"btn\" onclick=\"S.over=null;showCreate()\">Nova campanha<\/button>`;\n  } else o.style.display='none';\n}\nfunction renderUI(){\n  renderHud(); renderGauges(); renderStats(); renderPanel(); renderOver(); renderMsg(); renderHelp(); renderDecision();\n  document.getElementById('pausetxt').style.display=(S&&S.paused&&!S.menu)?'block':'none';\n  applyAudio();\n}\n\n// ---------- Salvamento ----------\nconst SAVE_KEY='atlas_galaxia_v2_save';\n// Menu in-game: três espaços de save, opções e volta. Pausa o jogo enquanto aberto.\nconst OPT={shake:true, scale:1};\n// Tamanho da interface (1x, 2x, 3x): aplica zoom só nos painéis, não no mapa.\nconst UI_IDS=['hud','stats','panel','log','help','decision','create','over','menu','pausetxt','gauges'];\nfunction applyUIScale(){ for(const id of UI_IDS){ const el=document.getElementById(id); if(el) el.style.zoom=OPT.scale; } }\nfunction setUIScale(v){ OPT.scale=v; applyUIScale(); renderMenu(); }\n// Visível na tela considerando o zoom (coordenadas antes do zoom).\nfunction inView(sx,sy,m){\n  const Z=OPT.zoom||1;\n  return sx>=W/2-W/(2*Z)-m && sx<=W/2+W/(2*Z)+m && sy>=H/2-H/(2*Z)-m && sy<=H/2+H/(2*Z)+m;\n}\nfunction promptText(t,x,y){\n  ctx.save(); ctx.font='bold 13px Georgia'; ctx.textAlign='center';\n  const w=ctx.measureText(t).width+20;\n  ctx.fillStyle='rgba(8,12,28,.85)'; ctx.strokeStyle='#d4a84a'; ctx.lineWidth=1;\n  ctx.fillRect(x-w/2,y-16,w,22); ctx.strokeRect(x-w/2,y-16,w,22);\n  ctx.fillStyle='#f0d28a'; ctx.fillText(t,x,y);\n  ctx.restore();\n}\nlet MENU_MODE='main';\n// Saves: no máximo 3; ao salvar com a lista cheia, o mais antigo é removido.\nconst SAVES_KEY='atlas_galaxia_v2_saves', MAX_SAVES=3;\nfunction listSaves(){ try{ return JSON.parse(localStorage.getItem(SAVES_KEY)||'[]'); }catch(e){ return []; } }\nfunction writeSaves(a){ localStorage.setItem(SAVES_KEY,JSON.stringify(a)); }\nfunction saveGameNow(){\n  if(!S) return;\n  try{\n    const a=listSaves();\n    while(a.length>=MAX_SAVES){ const old=a.shift(); msg('Save mais antigo ('+old.meta.name+') removido.','SISTEMA'); }\n    const meta={name:S.cfg.name, base:S.cfg.base, t:Math.floor(S.t), credits:Math.floor(S.res.creditos), when:new Date().toLocaleString('pt-BR')};\n    a.push({id:String(Date.now()),meta,state:S});\n    writeSaves(a);\n    msg('Jogo salvo.','SISTEMA');\n  }catch(e){ msg('Não foi possível salvar (espaço cheio?).','SISTEMA'); }\n  renderMenu();\n}\nfunction loadSave(id){\n  const s=listSaves().find(x=>x.id===id); if(!s) return;\n  setWorld(s.state.worldW||3000, s.state.worldH||2000);\n  S=s.state; S.menu=false; applyUpgrades();\n  document.getElementById('create').style.display='none';\n  document.getElementById('menu').style.display='none';\n  msg('Jogo carregado.','SISTEMA');\n}\nfunction openMenu(mode){\n  MENU_MODE=mode||'main';\n  if(S) S.menu=true;\n  document.getElementById('menu').style.display='flex';\n  renderMenu();\n}\nfunction closeMenu(){\n  if(S) S.menu=false;\n  document.getElementById('menu').style.display='none';\n}\nfunction toggleMenu(){ if(!S) return; if(S.menu) closeMenu(); else openMenu('main'); }\nfunction renderMenu(){\n  const el=document.getElementById('menubox');\n  if(MENU_MODE==='options'){\n    el.innerHTML=`<h2>Opções<\/h2>\n      <button class=\"btn\" onclick=\"toggleMute();renderMenu()\">Som: ${S&&S.muted?'desligado':'ligado'} (tecla V)<\/button>\n      <button class=\"btn\" onclick=\"OPT.shake=!OPT.shake;renderMenu()\">Tremor de tela: ${OPT.shake?'ligado':'desligado'}<\/button>\n      <div class=\"hint\">Tamanho da interface<\/div>\n      <div style=\"display:flex;gap:8px\">${[1,1.5,2].map(v=>`<button class=\"btn${OPT.scale===v?' sel':''}\" style=\"text-align:center\" onclick=\"setUIScale(${v})\">${v}x<\/button>`).join('')}<\/div>\n      <button class=\"btn\" onclick=\"MENU_MODE='main';renderMenu()\">Voltar<\/button>`;\n    return;\n  }\n  let h=`<h2>${S?'Menu':'Carregar jogo'}<\/h2>`;\n  if(S) h+=`<button class=\"btn\" onclick=\"closeMenu()\">Voltar ao jogo (Esc)<\/button>`;\n  const saves=listSaves();\n  h+=`<button class=\"btn\" onclick=\"saveGameNow()\" ${S?'':'disabled'}>Salvar jogo atual<\/button>`;\n  h+=`<div class=\"stitle\">Jogos salvos (${saves.length}/${MAX_SAVES})<\/div>`;\n  if(!saves.length) h+=`<div class=\"hint\">Nenhum jogo salvo.<\/div>`;\n  for(const s of saves.slice().reverse()){\n    h+=`<div class=\"btn\" style=\"cursor:default;display:flex;justify-content:space-between;align-items:center;gap:8px\">\n      <span>${s.meta.name} · ${s.meta.base} · ${s.meta.t} s · ${s.meta.credits} créditos<br><small>${s.meta.when}<\/small><\/span>\n      <button class=\"btn\" style=\"width:auto;margin:0\" onclick=\"loadSave('${s.id}')\">Carregar<\/button><\/div>`;\n  }\n  h+=`<button class=\"btn\" onclick=\"MENU_MODE='options';renderMenu()\">Opções<\/button>`;\n  if(S) h+=`\n    <button class=\"btn\" onclick=\"S.menu=true;document.getElementById('menu').style.display='none';showCreate()\">Sair para a tela inicial<\/button>`;\n  el.innerHTML=h;\n}\n// Áudio: a trilha também pausa quando o jogo está pausado ou o menu aberto.\nfunction applyAudio(){\n  if(!AMB||!AC||!S) return;\n  const on=!S.muted&&!S.paused&&!S.menu&&!S.over;\n  const war=(S.war||[]).some(Boolean);\n  AMB.g.gain.setTargetAtTime(on?(war?0.045:0.03):0,AC.currentTime,0.3);\n  AMB.o2.frequency.setTargetAtTime(war?92:82.5,AC.currentTime,2);\n}\n\n// ---------- Entrada ----------\naddEventListener('keydown',e=>{\n  if(!S || document.getElementById('create').style.display==='flex') return;\n  const k=e.key.toLowerCase();\n  if(S.menu){ if(k==='escape') closeMenu(); return; }\n  if(S.decision) return;\n  if(KEYMAP[k]){ S.keys[KEYMAP[k]]=true; e.preventDefault(); }\n  if(k==='f') fire();\n  if(k==='q') activateShield();\n  if(k==='v') toggleMute();\n  if(k==='g'){ S.mapF=((S.mapF||0)+1)%4; msg('Minimapa: '+MAP_FILTERS[S.mapF]+'.','GERAL'); }\n  if(k==='r') activateEmp();\n  if(k==='m') toggleMine();\n  if(k==='e'){ if(S.sys===null){ const ni=nearSystem(); if(ni>=0) enterSys(ni); } else leaveSys(); }\n  if(k==='tab'){ e.preventDefault(); S.stats=!S.stats; }\n  if(k===' '){ e.preventDefault(); S.paused=!S.paused; }\n  if(k==='escape'){ toggleMenu(); }\n  if(k==='h'){ S.help=!S.help; }\n  if(k==='n'){ if(confirm('Começar uma nova campanha? O jogo salvo não é apagado.')) showCreate(); }\n  renderUI();\n});\naddEventListener('keyup',e=>{\n  if(!S) return;\n  const k=e.key.toLowerCase();\n  if(KEYMAP[k]) S.keys[KEYMAP[k]]=false;\n});\ncv.addEventListener('click',e=>{\n  if(!S || S.sys===null || S.over || S.decision) return;\n  const sys=S.systems[S.sys], mx=e.clientX, my=e.clientY;\n  let hit=null;\n  sys.planets.forEach((p,i)=>{ const [px,py]=planetPos(p,W/2,H/2); if(dist(px,py,mx,my)<18) hit=i; });\n  S.sel = hit===null?null:{sys:S.sys,p:hit};\n  renderPanel();\n});\n\n// Zoom da galáxia com a roda do mouse (0,5x a 2,5x), centrado na nave.\ncv.addEventListener('mousemove',e=>{ MOUSE.x=e.clientX; MOUSE.y=e.clientY; });\ncv.addEventListener('mouseleave',()=>{ MOUSE.x=-1; MOUSE.y=-1; });\ncv.addEventListener('wheel',e=>{\n  if(!S) return;\n  e.preventDefault();\n  OPT.zoom=Math.max(0.5,Math.min(2.5,(OPT.zoom||1)*(e.deltaY<0?1.1:0.9)));\n},{passive:false});\n\n// ---------- Loop ----------\nlet last=performance.now();\nfunction frame(now){\n  const dt=Math.min(0.05,(now-last)/1000); last=now;\n  if(S && !S.paused && !S.over && !S.decision && !S.menu) update(dt);\n  if(S) draw();\n  requestAnimationFrame(frame);\n}\nshowCreate();\napplyUIScale();\nsetInterval(()=>{ if(S) renderUI(); },250);\nrequestAnimationFrame(frame);\n<\/script>\n\n<script>\n(function(){\n  var st=document.createElement('style'); st.textContent='#menu,#create,#contbtn{display:none!important}'; document.head.appendChild(st);\n  window.addEventListener('keydown',function(e){\n    if(e.key==='Escape'){ e.stopImmediatePropagation(); e.preventDefault(); parent.postMessage({atlasEsc:1},'*'); }\n  },true);\n  window.__atlas={\n    snap:function(){ return (typeof S!=='undefined'&&S)? JSON.stringify(S) : null; },\n    load:function(str){\n      var s=JSON.parse(str);\n      setWorld(s.worldW||3000, s.worldH||2000);\n      document.getElementById('create').style.display='none'; document.getElementById('menu').style.display='none';\n      S=s; S.menu=false; S.paused=false; S.decision=null; S.keys={}; S.over=null; S.shop=false;\n      applyUpgrades();\n      if(typeof startAmbient==='function') startAmbient();\n    },\n    pause:function(on){ if(typeof S!=='undefined'&&S) S.paused=!!on; },\n    scale:function(v){ document.body.style.zoom=v; },\n    audio:function(o){}\n  };\n  var P=window.ATLAS_PROFILE, L=window.ATLAS_LOAD, won=false;\n  if(L){ window.__atlas.load(L); }\n  else {\n    var s=P.cfg.s3;\n    document.getElementById('cr_name').value=P.leader;\n    document.getElementById('cr_base').value=P.planet;\n    var pick=function(name,val){ var r=document.querySelector('input[name='+name+'][value=\"'+val+'\"]'); if(r) r.checked=true; };\n    pick('size',s.size); pick('nations',s.nations); pick('goal',s.goal); pick('diff',s.diff);\n    startGame();\n  }\n  setInterval(function(){\n    try{\n      if(!won && typeof S!=='undefined' && S && S.won){\n        won=true; parent.postMessage({atlasWon:1},'*');\n      }\n    }catch(e){}\n  },500);\n})();\n<\/script>\n<\/body>\n<\/html>\n"];</script>
