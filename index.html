function snapshot(){ return JSON.stringify(S); }
function autosave(){
  const a=getAuto();
  const slot={name:'Automático '+(a.idx+1)+' · turno '+S.turn,turn:S.turn,date:stamp(),data:snapshot()};
  a.slots[a.idx]=slot;
  a.idx=(a.idx+1)%3;
  try{ setAuto(a); }catch(e){ log('Sem espaço para salvar automático.'); }
}
function manualSave(name){
  name=(name||'').trim().slice(0,40);
  if(!name){ log('Dê um nome ao salvamento.'); return; }
  const list=getSaves();
  list.push({id:Date.now(),name,turn:S.turn,date:stamp(),data:snapshot()});
  try{ setSaves(list); log('Jogo salvo como "'+name+'".'); }
  catch(e){ log('Sem espaço para salvar. Exclua saves antigos.'); }
}

  screen='game'; modal=null;

  document.getElementById('game').style.visibility='visible';
  document.getElementById('hud').style.display='flex';
  document.getElementById('bottom').style.display='block';

function loadSave(data){
  try{

// ---------- Desenho ----------
function resize(){ cv.width=cv.parentElement.clientWidth; cv.height=cv.parentElement.clientHeight; }
function centerCam(){ const c=capital(); cam.x=c.x*T-cv.width/Z/2+T/2; cam.y=c.y*T-cv.height/Z/2+T/2; clampCam(); }
function clampCam(){
  cam.x=Math.max(-200,Math.min(N*T-cv.width/Z+200,cam.x));
  cam.y=Math.max(-200,Math.min(N*T-cv.height/Z+200,cam.y));
}
function drawRoad(sx,sy,x,y){
  const ROAD='#9a8060', EDGE='#4a3a26';
  ctx.fillStyle=ROAD;
  ctx.fillRect(sx+7,sy+7,10,10);
  const arms=[[0,-1],[1,0],[0,1],[-1,0]];
  arms.forEach(([dx,dy])=>{
    if(!roadish(x+dx,y+dy)) return;
    if(dx===0&&dy===-1) ctx.fillRect(sx+7,sy,10,8);
    if(dx===1&&dy===0)  ctx.fillRect(sx+16,sy+7,8,10);
    if(dx===0&&dy===1)  ctx.fillRect(sx+7,sy+16,10,8);
    if(dx===-1&&dy===0) ctx.fillRect(sx,sy+7,8,10);
  });
  ctx.fillStyle=EDGE;
  arms.forEach(([dx,dy])=>{
    if(roadish(x+dx,y+dy)) return;
    if(dx===0&&dy===-1) ctx.fillRect(sx+7,sy+7,10,1);
    if(dx===1&&dy===0)  ctx.fillRect(sx+16,sy+7,1,10);
    if(dx===0&&dy===1)  ctx.fillRect(sx+7,sy+16,10,1);
    if(dx===-1&&dy===0) ctx.fillRect(sx+7,sy+7,1,10);
  });
}
function drawGroup(sx,sy,g){
  const n=groupCount(g), pid=gPid(g), sel=S.selGroup===g.id||(S.multi||[]).includes(g.id);
  const dom=Object.keys(g.units).sort((p,q)=>g.units[q]-g.units[p])[0];
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(sx+T/2+1,sy+T/2+1,10,0,7); ctx.fill();
  ctx.fillStyle='#1d1812'; ctx.beginPath(); ctx.arc(sx+T/2,sy+T/2,10,0,7); ctx.fill();
  ctx.strokeStyle=pcolor(pid); ctx.lineWidth=3; ctx.stroke();
  if(sel){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(sx+T/2,sy+T/2,13,0,7); ctx.stroke(); }
  if(dom) drawIcon(ctx,UNITS[dom].icon,'#f4ecd0',sx+T/2-6,sy+T/2-6,1.5);
  ctx.font='bold 9px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeText(String(n),sx+T-1,sy+T-1);
  ctx.fillStyle='#ffffff'; ctx.fillText(String(n),sx+T-1,sy+T-1);
  const mx=groupHpMax(g), hp=g.hp==null?mx:g.hp;
  if(hp<mx){ const f=Math.max(0,hp/mx); ctx.fillStyle='#000'; ctx.fillRect(sx+3,sy+T-4,T-6,3); ctx.fillStyle=f>0.5?'#5fbf4a':f>0.25?'#e0b84a':'#d24a3a'; ctx.fillRect(sx+3,sy+T-4,(T-6)*f,3); }
  ctx.textAlign='start';
}
function drawTile(x,y){
  const tile=S.grid[y][x], sx=x*T-cam.x, sy=y*T-cam.y;
  if(!seen(x,y)){ ctx.fillStyle='#000'; ctx.fillRect(sx,sy,T,T); return; }
  ctx.fillStyle=TILE_BASE[tile.t]; ctx.fillRect(sx,sy,T,T);
  const tp=TERR?TERR[y*N+x]:0;
  if(tp){
    ctx.globalAlpha=0.16; ctx.fillStyle=pcolor(tp-1); ctx.fillRect(sx,sy,T,T); ctx.globalAlpha=1;
    const own=(X,Y)=>(X<0||Y<0||X>=N||Y>=N)?0:TERR[Y*N+X];
    ctx.fillStyle=pcolor(tp-1);
    if(own(x,y-1)!==tp) ctx.fillRect(sx,sy,T,2);
    if(own(x,y+1)!==tp) ctx.fillRect(sx,sy+T-2,T,2);
    if(own(x-1,y)!==tp) ctx.fillRect(sx,sy,2,T);
    if(own(x+1,y)!==tp) ctx.fillRect(sx+T-2,sy,2,T);
  }
  if(VALIDB && VALIDB[y*N+x]){ ctx.fillStyle='rgba(120,230,120,.22)'; ctx.fillRect(sx,sy,T,T); }
  const r=h2(x,y);
  if(tile.t==='planicie'&&r>0.6){ ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(sx+4,sy+6,3,3); }
  if(tile.t==='floresta'){ ctx.fillStyle='#1d3d1c'; ctx.beginPath(); ctx.arc(sx+8,sy+9,5,0,7); ctx.arc(sx+16,sy+15,5,0,7); ctx.fill(); }
  if(tile.t==='fruta'){ ctx.fillStyle='#d24a3a'; ctx.fillRect(sx+6,sy+7,3,3); ctx.fillRect(sx+14,sy+14,3,3); ctx.fillRect(sx+12,sy+6,2,2); }
  if(tile.t==='animais'){ ctx.fillStyle='#4a3a1a'; ctx.fillRect(sx+7,sy+8,4,3); ctx.fillRect(sx+15,sy+14,3,2); }
  if(tile.t==='pedra'){ ctx.fillStyle='#8a8e94'; ctx.fillRect(sx+4,sy+5,8,6); ctx.fillStyle='#4a4d52'; ctx.fillRect(sx+4,sy+11,8,2); }
  if(tile.t==='minerio'){ ctx.fillStyle='#d8843a'; ctx.fillRect(sx+6,sy+7,3,3); ctx.fillRect(sx+14,sy+13,3,3); }
  if(tile.t==='carvao'){ ctx.fillStyle='#111'; ctx.fillRect(sx+6,sy+7,4,3); ctx.fillRect(sx+14,sy+13,4,3); }
  if(tile.t==='petroleo'){ ctx.fillStyle='#0a0a0a'; ctx.fillRect(sx+5,sy+6,6,4); ctx.fillRect(sx+13,sy+14,5,3); ctx.fillStyle='#5a5048'; ctx.fillRect(sx+6,sy+7,2,1); }
  if(tile.t==='rio'){ ctx.fillStyle='#5a9ad8'; ctx.fillRect(sx+4,sy+8,16,2); ctx.fillRect(sx+2,sy+16,18,2); }
  if(tile.b){
    const b=tile.b, d=DEF[b.type]||{col:'#c9a24a',icon:'fire'}, pid=b.pid||0;
    if(b.type==='ruina'){ ctx.fillStyle='#0b0b0b'; ctx.fillRect(sx+1,sy+1,T-2,T-2); ctx.fillStyle='#3a3a3a'; ctx.fillRect(sx+5,sy+6,4,3); ctx.fillRect(sx+13,sy+13,5,3); return; }
    if(b.type==='obra'){ drawObra(sx,sy,b); }
    else if(b.type==='estrada'){ drawRoad(sx,sy,x,y); const L=b.level||1; if(L>=2){ ctx.fillStyle='#3a3228'; ctx.fillRect(sx+10,sy+10,4,4); } if(L>=3){ ctx.fillRect(sx+4,sy+4,3,3); ctx.fillRect(sx+17,sy+17,3,3); } }
    else {
      let col;
      if(b.type==='base') col=pcolor(pid);
      else if(b.type==='casa') col=['','#b5493a','#c97a4a','#d8c8a0','#a8b8c8'][b.stage||1];
      else col=d.col;
      ctx.fillStyle=pcolor(pid); ctx.fillRect(sx+1,sy+1,T-2,T-2);
      ctx.fillStyle=col; ctx.fillRect(sx+3,sy+3,T-6,T-6);
      drawIcon(ctx,b.type==='base'?'fire':d.icon,'#ffffff',sx+(T-16)/2,sy+(T-16)/2,2);
      if(b.level>1){ ctx.fillStyle='#ffd84a'; ctx.fillRect(sx+T-8,sy+2,6,6); }
      if(b.type==='base'){
        const c=cityById(b.cid);
        if(c){
          const label=c.name.slice(0,14)+' · '+(c.adults+c.children);
          ctx.font='bold 10px Georgia,serif'; const bw=Math.max(T+40,ctx.measureText(label).width+22), bx=sx+T/2-bw/2, by=sy-19;
          ctx.fillStyle='#2a1d12'; ctx.fillRect(bx,by,bw,15);
          ctx.strokeStyle='#d4a84a'; ctx.lineWidth=1; ctx.strokeRect(bx+.5,by+.5,bw-1,14);
          ctx.fillStyle=pcolor(pid); ctx.fillRect(bx+1,by+1,7,13);
          ctx.fillStyle='#f3e6c4'; ctx.textAlign='left'; ctx.fillText(label,bx+12,by+11);
          ctx.fillStyle='#d4a84a'; ctx.fillRect(sx+T/2-1,by+15,2,4); ctx.textAlign='start';
        }
        if(c&&c.capital){ ctx.fillStyle='#ffd84a'; ctx.font='bold 11px sans-serif'; ctx.fillText('★',sx+2,sy+11); }
      }
      if(pid===0 && b.type!=='base' && !isConn(x,y)){ ctx.fillStyle='#ff9a3a'; ctx.fillRect(sx+2,sy+T-6,4,4); }
      if(pid===0 && d.elec && power.ratio<1){ ctx.fillStyle='#ff6b6b'; ctx.fillRect(sx+2,sy+2,4,4); }
    }
  }
  const g=groupAt(x,y);
  if(g) drawGroup(sx,sy,g);
}
function drawHpBar(x,y){
  const t=S.grid[y][x], b=t.b; if(!b||b.type==='ruina'||b.hp==null||!seen(x,y)) return;
  const mx=bMaxHp(b); if(b.hp>=mx) return;
  const f=Math.max(0,b.hp/mx), sx=x*T-cam.x, sy=y*T-cam.y;
  ctx.fillStyle='#000'; ctx.fillRect(sx+2,sy+T-5,T-4,3);
  ctx.fillStyle=f>0.5?'#5fbf4a':f>0.25?'#e0b84a':'#d24a3a'; ctx.fillRect(sx+2,sy+T-5,(T-4)*f,3);
}
function draw(){
  if(!S) return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#2b6aa8'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(Z,0,0,Z,0,0);
  const x0=Math.max(0,Math.floor(cam.x/T)), y0=Math.max(0,Math.floor(cam.y/T));
  const x1=Math.min(N-1,Math.ceil((cam.x+cv.width/Z)/T)), y1=Math.min(N-1,Math.ceil((cam.y+cv.height/Z)/T));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) drawTile(x,y);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) drawHpBar(x,y);
  const sg=groupById(S.selGroup);
  if(sg){
    ctx.strokeStyle='rgba(255,216,74,.5)'; ctx.lineWidth=1;
    ctx.strokeRect((sg.x-1)*T-cam.x, (sg.y-1)*T-cam.y, 3*T, 3*T);
  }
  if(hover && hover.x>=0 && hover.y>=0 && hover.x<N && hover.y<N){
    let ok=true;
    if(S.tool==='fundar') ok=!S.grid[hover.y][hover.x].b && farFromAllCities(hover.x,hover.y) && !groupAt(hover.x,hover.y);
    else if(S.tool) ok=!canPlace(S.tool,hover.x,hover.y);
    ctx.strokeStyle = ok?'#8bff8b':'#ff6b6b'; ctx.lineWidth=2;
    ctx.strokeRect(hover.x*T-cam.x+1,hover.y*T-cam.y+1,T-2,T-2);
  }
  if(S.sel){ ctx.strokeStyle='#ffd84a'; ctx.lineWidth=2; ctx.strokeRect(S.sel.x*T-cam.x+1,S.sel.y*T-cam.y+1,T-2,T-2); }
}

function renderBottom(){
  if(!S){ document.getElementById('tabs').innerHTML=''; document.getElementById('grid').innerHTML=''; return; }
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  for(const t of TABS){
    if(t.era && maxLevel()<t.era) continue;
    const btn=document.createElement('button');
    btn.className='tab'+(S.tab===t.id?' on':'');
    btn.appendChild(iconCanvas(t.icon,S.tab===t.id?'#ffffff':'#d8c28a',3));

  }
  const grid=document.getElementById('grid'); grid.innerHTML='';
  if(S.tab==='urbano'){
    const cur=S.cities.find(x=>x.id===S.curCity)||capital();
    const sel=document.createElement('div'); sel.id='infotxt';
    sel.innerHTML=`Cidade para casas e construções: `;
    S.cities.forEach(c=>{
      const bt=document.createElement('button'); bt.className='cbtn inl'+(c.id===cur.id?' on':'');
      bt.textContent=c.name; bt.onclick=()=>act(()=>{ S.curCity=c.id; });
      sel.appendChild(bt);
    });
    grid.appendChild(sel);
    const b=document.createElement('div');
    b.className='ic'+(canPay(DEF.casa.c)?'':' dis');
    b.appendChild(iconCanvas('house',DEF.casa.col,4)); b.append('Casa');
    const c=document.createElement('div'); c.className='cst'; c.textContent=costStr(DEF.casa.c); b.appendChild(c);
    b.onclick=()=>{ buildHouse(); renderAll(); };
    grid.appendChild(b);
  }
  if(S.tab==='cultura' && maxLevel()>=3){
    const mk=(id,label,icon,col)=>{
      const b=document.createElement('div');
      b.className='ic'+(S.religion===id?' on':(S.religion?' dis':''));
      b.appendChild(iconCanvas(icon,col,4)); b.append(label);
      b.onclick=()=>{ if(!S.religion){ chooseReligion(id); renderAll(); } };

    };
    grid.appendChild(mk('sec','Secularismo Racional','book','#5f9ad0'));
    grid.appendChild(mk('fund','Fundamentalismo Ideológico','temple','#e8d8a0'));
  }
  if(S.tab==='militar'){
    const info=document.createElement('div'); info.id='infotxt';
    const upk=groupsOf(0).reduce((s,g)=>s+Object.keys(g.units).reduce((a,t)=>a+UNITS[t].manut*g.units[t],0),0)*cityMult();
    info.innerHTML=`Limite do exército: ${armyLimit()} espaços · Em uso: ${armySpace()} · Grupos no mapa: ${groupsOf(0).length}<br>
      Manutenção: ${upk.toFixed(1)} ouro/turno · Saldo: ${Math.floor(S.res.ouro)} ouro · Moral: ${Math.floor(S.morale)}<br>
      Cada unidade aparece em um tile livre perto da capital. O alcance depende da tropa (cavalaria e infantaria andam 2; blindados e aviões 3; estrada +1). Clique num grupo, depois num tile vizinho para mover. Clique em outro grupo para juntar (máx. ${GROUP_MAX} de espaço).`;
    grid.appendChild(info);
  }
  for(const k in DEF){
    const d=DEF[k];
    if(d.cat!==S.tab || k==='casa') continue;
    const locked=!unlocked(d);
    const selected=S.tool===k;
    const b=document.createElement('div');
    b.className='ic'+(selected?' on':'')+((!canPay(d.c)||locked)?' dis':'');
    b.title=locked?lockTip(d):d.n;
    b.appendChild(iconNode(k,d.icon,d.col,4));
    b.append(locked?d.n+' (Nv.'+d.era+')':d.n);
    const c=document.createElement('div'); c.className='cst'; c.textContent=costStr(d.c); b.appendChild(c);
    b.onclick=()=>{ if(locked){ log(lockTip(d)); renderAll(); return; } S.tool=S.tool===k?null:k; renderAll(); };
    grid.appendChild(b);
  }
  if(S.tab==='militar'){
    const hint=document.createElement('div'); hint.id='infotxt';
    hint.innerHTML='As unidades são criadas pelo mapa: clique num Quartel ou numa Academia Militar e escolha <b>Criar unidades</b>. Só aparecem as unidades já desbloqueadas.';
    grid.appendChild(hint);
  }
  if(S.tool){
    const d=DEF[S.tool];
    const info=document.createElement('div'); info.id='infotxt';
    info.innerHTML=`<b>${d.n}</b> · Custo: ${costStr(d.c)}${d.cap?' · Trabalhadores: '+d.cap:''}<br><span style="color:#aaa">Clique em um tile do mapa para construir. Clique direito cancela.</span>`;
    grid.appendChild(info);
  }
}

function cbtn(label,onclick,extra,disabled){
  return `<button class="cbtn ${extra||''}" ${disabled?'disabled':''} onclick="act(()=>{${onclick}})">${label}</button>`;

function upgradeRoad(x,y){
  const b=S.grid[y][x].b; if(!b||b.type!=='estrada') return;
  const L=b.level||1; if(L>=3){ log('Estrada já está no nível máximo.'); return; }
  const cost={asfalto:5*L};
  if(!canPay(cost)){ log('Asfalto insuficiente.'); return; }
  pay(cost); b.level=L+1;
  fxAdd(x,y,'Asfaltada','#ffd84a',true);
  log('Estrada asfaltada para o Nível '+(L+1)+'.');
  invalidate(); computeNetwork();
}
function unitsInfoHtml(type){
  const ks=type==='academia'?Object.keys(UNITS).filter(k=>UNITS[k].acad>=2):Object.keys(UNITS).filter(k=>(UNITS[k].req||'quartel')===type);
  if(!ks.length) return '';

    const u=UNITS[k], need=[];

  }).join('');
}
function renderCard(){

function positionCard(){
  const card=document.getElementById('card');
  if(!S||!S.sel||card.style.display==='none') return;
  if(card.classList.contains('unit')){
    const h=card.offsetHeight, bot=document.body.classList.contains('bp-hidden')?66:212;
    card.style.left='12px';
    card.style.top=Math.max(44,window.innerHeight-bot-h-12)+'px';
    return;
  }
  const sx=(S.sel.x*T-cam.x+T/2)*Z, sy=(S.sel.y*T-cam.y)*Z;
  let left=sx-card.offsetWidth/2, top=sy-card.offsetHeight-16;
  left=Math.max(4,Math.min(window.innerWidth-card.offsetWidth-4,left));
  top=Math.max(44,top);
  card.style.left=left+'px'; card.style.top=top+'px';
}

// Recursos: quanto esta cidade contribui para o império (por turno) e o estoque geral.
function recursosHtml(c){
  const emp=k=>S.cities.reduce((s,x)=>s+((x.prod&&x.prod[k])||0),0);
  const mine=k=>(c.prod&&c.prod[k])||0;
  const keys=ALL_RES.filter(k=>Math.abs(mine(k))>0.001||Math.abs(emp(k))>0.001);
  const fmt=v=>(v>0?'+':'')+v.toFixed(1);
  let rows=keys.map(k=>{
    const v=mine(k), t=emp(k), sh=(t>0&&v>0)?Math.round(v/t*100)+'%':'—';
    return `<tr><td>${RES_NAME[k]||k}</td><td class="${v>=0?'pos':'neg'}">${fmt(v)}</td><td>${fmt(t)}</td><td>${sh}</td></tr>`;
  }).join('');
  if(!rows) rows='<tr><td colspan="4" style="color:#6b5a3a">Esta cidade ainda não produziu nada neste turno.</td></tr>';
  return `<div class="stitle">${c.name} · contribuição por turno</div>
    <table class="tbl"><tr><th>Recurso</th><th>${c.name}</th><th>Império</th><th>Parte</th></tr>${rows}</table>`;
}
// Império: saldo de cada recurso, de onde vem e quem perde, e o estoque.
function impRecursosHtml(){
  const keys=ALL_RES.filter(k=>S.res[k]>0||S.cities.some(c=>c.prod&&Math.abs(c.prod[k]||0)>0.001));
  const fmt=v=>(v>0?'+':'')+v.toFixed(1);
  const rows=keys.map(k=>{
    const tot=S.cities.reduce((s,c)=>s+((c.prod&&c.prod[k])||0),0);
    const parts=S.cities.map(c=>{const v=(c.prod&&c.prod[k])||0; return Math.abs(v)<0.001?null:`<span class="${v>=0?'pos':'neg'}">${c.name} ${fmt(v)}</span>`;}).filter(Boolean).join(' · ')||'—';
    return `<tr><td><b>${RES_NAME[k]||k}</b></td><td class="${tot>=0?'pos':'neg'}">${fmt(tot)}</td><td style="font-size:11px;line-height:1.5">${parts}</td><td>${Math.floor(S.res[k])}</td></tr>`;
  }).join('');
  return `<div class="stitle">Império · saldo por turno e estoque</div>
    <table class="tbl"><tr><th>Recurso</th><th>Saldo</th><th>De onde vem / quem perde</th><th>Estoque</th></tr>${rows||'<tr><td colspan="4">Nada ainda.</td></tr>'}</table>
    <div class="pcard" style="margin-top:8px"><div class="krow"><span>Moral</span><b>${Math.floor(S.morale)}</b></div></div>`;
}
// População do império: felicidade média (soma ÷ número de cidades) e o que puxa para baixo.
function civStats(pid){
  const cities=pid===0?S.cities:(S.ai[pid-1]?S.ai[pid-1].cities:[]);
  const res=pid===0?S.res:(S.ai[pid-1]?S.ai[pid-1].res:{});
  const hap=cities.length?Math.round(cities.reduce((s,c)=>s+c.happy,0)/cities.length):0;
  return {pop:cities.reduce((s,c)=>s+c.adults+c.children,0),cities:cities.length,hap,army:armyCount(pid),ouro:Math.floor(res.ouro||0),comida:Math.floor(res.food||0)};
}
// Demografia (estilo Civ 5): uma barra por povo para cada métrica, na cor do povo.
function demoHtml(){
  const pids=[0].concat(S.ai.map((p,i)=>i+1).filter(q=>!S.ai[q-1].dead));
  const st={}; for(const q of pids) st[q]=civStats(q);
  const M=[['Pessoas','pop'],['Cidades','cities'],['Felicidade média','hap'],['Exército','army'],['Ouro','ouro'],['Comida','comida']];
  return `<div class="stitle">Demografia · comparação entre os povos</div>`+M.map(([lab,k])=>{
    const mx=Math.max(1,...pids.map(q=>st[q][k]));
    return `<div class="dmrow"><div class="dmlbl">${lab}</div><div class="dmbars">${pids.map(q=>`<div class="dmb"><span class="dmn">${pname(q)}</span><span class="dmt"><i style="width:${Math.round(st[q][k]/mx*100)}%;background:${pcolor(q)}"></i></span><b>${st[q][k]}</b></div>`).join('')}</div></div>`;
  }).join('');
}
function compareHtml(){
  const pids=[0].concat(S.ai.map((p,i)=>i+1).filter(q=>!S.ai[q-1].dead));
  const st={}; for(const q of pids) st[q]=civStats(q);
  const M=[['Pessoas','pop'],['Cidades','cities'],['Felicidade média','hap'],['Exército','army'],['Ouro','ouro'],['Comida','comida']];
  const rows=M.map(([lab,k])=>{
    const vals=pids.map(q=>[st[q][k],q]);
    const mine=st[0][k];
    const rank=1+vals.filter(v=>v[0]>mine).length;
    const best=vals.reduce((a,b)=>b[0]>a[0]?b:a), worst=vals.reduce((a,b)=>b[0]<a[0]?b:a);
    const avg=Math.round(vals.reduce((s,v)=>s+v[0],0)/vals.length);
    return `<tr><td><b>${lab}</b></td><td>${rank}º</td><td><b>${mine}</b></td><td>${pname(best[1])}<br><span class="pos">${best[0]}</span></td><td>${avg}</td><td>${pname(worst[1])}<br><span class="neg">${worst[0]}</span></td></tr>`;
  }).join('');
  return `<div class="stitle">Comparação entre os povos</div><table class="tbl"><tr><th>Métrica</th><th>Posição</th><th>Você</th><th>Melhor</th><th>Média</th><th>Pior</th></tr>${rows}</table>`;
}

// Fog of war: só aparece o que está a até 4 tiles de uma construção ou unidade sua.
function computeVis(){
  if(!S) return;
  VIS=new Uint8Array(N*N);
  const mark=(x,y)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const X=x+dx,Y=y+dy; if(X>=0&&Y>=0&&X<N&&Y<N) VIS[Y*N+X]=1; } };
  for(const o of buildingsList()) if((o.b.pid||0)===0) mark(o.x,o.y);
  for(const g of S.groups) if(gPid(g)===0) mark(g.x,g.y);
  TERR=new Uint8Array(N*N);
  for(const o of buildingsList()){
    const c=cityById(o.b.cid); if(!c) continue;
    const pid=o.b.pid||0, r=terrR(c);
    for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
      const X=o.x+dx,Y=o.y+dy;
      if(X>=0&&Y>=0&&X<N&&Y<N && dist(X,Y,c.x,c.y)<=r) TERR[Y*N+X]=pid+1;
    }
  }
  VALIDB=null;
  if(S.tool && S.tool!=='fundar'){
    const NEAR=new Uint8Array(N*N);
    for(const o of buildingsList()) if((o.b.pid||0)===0)
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
        const X=o.x+dx, Y=o.y+dy; if(X>=0&&Y>=0&&X<N&&Y<N) NEAR[Y*N+X]=1;
      }
    VALIDB=new Uint8Array(N*N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const i=y*N+x;
      if(TERR[i]===1 && NEAR[i] && !S.grid[y][x].b && S.grid[y][x].t!=='rio' && !groupAt(x,y) && seen(x,y) && !canPlace(S.tool,x,y)) VALIDB[i]=1;
    }
  }
}

let boxCur=null;
function moveMulti(tx,ty){
  if(!canEnter(tx,ty)){ log('O terreno ou uma construção bloqueia o destino.'); return; }
  const gs=S.multi.map(id=>groupById(id)).filter(Boolean);
  let andaram=0;
  for(const g of gs){
    if(g.movedTurn===S.turn) continue;
    const n=moveRange(g);
    let andou=false;
    for(let k=0;k<n;k++){
      if(dist(g.x,g.y,tx,ty)===0) break;
      let best=null, bd=dist(g.x,g.y,tx,ty);
      for(const [dx,dy] of DIRS8){
        const nx=g.x+dx, ny=g.y+dy;
        if(nx<0||ny<0||nx>=N||ny>=N) continue;
        const d=dist(nx,ny,tx,ty);
        if(d<bd && canEnter(nx,ny) && !groupAt(nx,ny)){ bd=d; best=[nx,ny]; }
      }
      if(!best) break;
      g.x=best[0]; g.y=best[1]; andou=true;
    }
    if(andou){ g.movedTurn=S.turn; andaram++; }
  }
  log(andaram+' de '+gs.length+' grupos andaram.');
}
// Caminho mais curto até o tile sob o mouse (sem passar por outros grupos).
function findPath(g,tx,ty){
  const key=(x,y)=>y*N+x, prev=new Map(), q=[[g.x,g.y]];
  prev.set(key(g.x,g.y),null);
  let qi=0;
  while(qi<q.length){
    const [x,y]=q[qi++];
    if(x===tx&&y===ty) break;
    for(const [dx,dy] of DIRS8){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=N||ny>=N||dist(nx,ny,g.x,g.y)>25) continue;
      const k=key(nx,ny);
      if(prev.has(k)||!canEnter(nx,ny)) continue;
      if(groupAt(nx,ny)&&!(nx===tx&&ny===ty)) continue;
      prev.set(k,[x,y]); q.push([nx,ny]);
    }
  }
  if(!prev.has(key(tx,ty))) return null;
  const path=[]; let cur=[tx,ty];
  while(cur){ path.push(cur); cur=prev.get(key(cur[0],cur[1])); }
  return path.reverse();
}
function drawObra(sx,sy,b){
  ctx.fillStyle='#2a1d12'; ctx.fillRect(sx+1,sy+1,T-2,T-2);
  ctx.save(); ctx.beginPath(); ctx.rect(sx+1,sy+1,T-2,T-2); ctx.clip();
  ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=1;
  for(let i=-T;i<T*2;i+=5){ ctx.beginPath(); ctx.moveTo(sx+i,sy+T); ctx.lineTo(sx+i+T,sy); ctx.stroke(); }
  ctx.restore();
  const d=DEF[b.of]; ctx.globalAlpha=0.7;
  if(d) drawIcon(ctx,d.icon,'#f0d28a',sx+T/2-6,sy+T/2-7,1.5);
  ctx.globalAlpha=1;
  const f=Math.min(1,(b.prog||0)/(b.need||1));
  ctx.fillStyle='#000'; ctx.fillRect(sx+3,sy+T-6,T-6,4);
  ctx.fillStyle='#d4a84a'; ctx.fillRect(sx+3,sy+T-6,(T-6)*f,4);
}
function drawRoute(){
  if(!S||!S.moveMode||!S.selGroup||!hover) return;
  const g=groupById(S.selGroup); if(!g||gPid(g)!==0) return;
  if(dist(g.x,g.y,hover.x,hover.y)===0) return;
  const path=findPath(g,hover.x,hover.y); if(!path) return;
  const steps=path.length-1, turns=Math.max(1,Math.ceil(steps/moveRange(g)));
  ctx.fillStyle='rgba(255,216,74,.75)';
  for(let i=1;i<path.length;i++){ const [x,y]=path[i]; ctx.beginPath(); ctx.arc(x*T-cam.x+T/2,y*T-cam.y+T/2,3,0,7); ctx.fill(); }
  const [hx,hy]=path[path.length-1];
  const lx=hx*T-cam.x+T/2+8, ly=hy*T-cam.y-18;
  ctx.fillStyle='rgba(20,20,18,.88)'; ctx.fillRect(lx,ly,120,18);
  ctx.fillStyle='#ffd84a'; ctx.font='bold 11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(steps+' tile'+(steps>1?'s':'')+' · '+turns+' turno'+(turns>1?'s':''),lx+5,ly+9);
  ctx.textBaseline='alphabetic';
}
let FX=[];
function fxAdd(x,y,text,col,big,dy){ FX.push({x,y,text,col,big:!!big,dy:dy||0,t:performance.now()}); if(FX.length>60) FX.shift(); }
function drawFx(){
  if(!FX.length) return;
  const now=performance.now();
  FX=FX.filter(f=>now-f.t<1400);
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 12px sans-serif';
  for(const f of FX){
    const a=(now-f.t)/1400;
    const cx=f.x*T-cam.x+T/2, cy=f.y*T-cam.y+T/2;
    ctx.globalAlpha=1-a;
    if(f.big){ ctx.strokeStyle=f.col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,6+a*22,0,7); ctx.stroke(); }
    const ty=cy-f.dy-a*26-8;
    ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeText(f.text,cx,ty);
    ctx.fillStyle=f.col; ctx.fillText(f.text,cx,ty);
  }
  ctx.globalAlpha=1; ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}
function drawBox(){
  if(!boxCur||!down||!down.shift||!moved) return;
  const s=tileAt(down.x,down.y);
  const x0=Math.min(s.x,boxCur.x), x1=Math.max(s.x,boxCur.x), y0=Math.min(s.y,boxCur.y), y1=Math.max(s.y,boxCur.y);
  ctx.strokeStyle='#ffd84a'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
  ctx.strokeRect(x0*T-cam.x+1, y0*T-cam.y+1, (x1-x0+1)*T-2, (y1-y0+1)*T-2);
  ctx.setLineDash([]);
}
function release(cx,cy,target){
  if(screen!=='game'){ down=null; return; }
  if(down && down.shift){
    S.multi=S.multi||[];
    if(moved){
      const s=tileAt(down.x,down.y), e2=tileAt(cx,cy);
      const x0=Math.min(s.x,e2.x), x1=Math.max(s.x,e2.x), y0=Math.min(s.y,e2.y), y1=Math.max(s.y,e2.y);
      S.multi=S.groups.filter(g=>gPid(g)===0 && g.x>=x0 && g.x<=x1 && g.y>=y0 && g.y<=y1).map(g=>g.id);
      log(S.multi.length+' grupos selecionados.');
    } else if(target===cv){
      const p=tileAt(cx,cy); const g=groupAt(p.x,p.y);
      if(g && gPid(g)===0) S.multi = S.multi.includes(g.id) ? S.multi.filter(i=>i!==g.id) : [...S.multi,g.id];
    }
    down=null; boxCur=null; cardDirty=true; renderAll(); return;
  }
  if(down && !moved && target===cv && !S.over && !modal){
    const p=tileAt(cx,cy);
    if(p.x>=0&&p.y>=0&&p.x<N&&p.y<N){
      if(S.tool){ place(S.tool,p.x,p.y); }
      else {
        const here=groupAt(p.x,p.y);
        const sel=groupById(S.selGroup);
        if(S.multi&&S.multi.length&&!here&&!sel){ moveMulti(p.x,p.y); S.sel={x:p.x,y:p.y}; }
        else if(sel && here && here.id!==sel.id && gPid(here)===0 && gPid(sel)===0){
          mergeGroups(sel.id,here.id);
          S.sel={x:p.x,y:p.y};
        } else if(sel && here && gPid(here)!==0){
          S.selGroup=sel.id; moveSelected(p.x,p.y);
          S.sel={x:p.x,y:p.y};
        } else if(sel && S.moveMode && !here){
          moveSelected(p.x,p.y);
          S.sel={x:p.x,y:p.y};
        } else if(here && gPid(here)===0){
          S.selGroup = (S.selGroup===here.id)?null:here.id;
          S.sel={x:p.x,y:p.y};
        } else {
          const b=S.grid[p.y][p.x].b;
          S.sel = (b||here) ? {x:p.x,y:p.y} : null;
        }
        cardDirty=true;
      }
      renderAll();
    }
  }
  down=null;
}
window.addEventListener('mouseup',e=>release(e.clientX,e.clientY,e.target));
let pinchS=null;
cv.addEventListener('touchstart',e=>{
  if(screen!=='game'||modal) return; e.preventDefault();
  if(e.touches.length===1){ const t=e.touches[0]; down={x:t.clientX,y:t.clientY,cx:cam.x,cy:cam.y}; moved=false; pinchS=null; }
  else if(e.touches.length===2){ const a=e.touches[0], b=e.touches[1]; pinchS={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:Z}; moved=true; }
},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(screen!=='game'||modal) return; e.preventDefault();
  if(e.touches.length===2 && pinchS){
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    Z=Math.max(0.5,Math.min(2.5,pinchS.z*d/pinchS.d)); clampCam();
  } else if(e.touches.length===1 && down){
    const t=e.touches[0], dx=t.clientX-down.x, dy=t.clientY-down.y;
    if(Math.abs(dx)+Math.abs(dy)>8) moved=true;
    if(moved){ cam.x=down.cx-dx/Z; cam.y=down.cy-dy/Z; clampCam(); }
  }
},{passive:false});
cv.addEventListener('touchend',e=>{
  if(screen!=='game'){ down=null; return; } e.preventDefault();
  if(e.touches.length>0) return;
  if(down && !moved && !pinchS){ const t=e.changedTouches[0]; release(t.clientX,t.clientY,cv); }
  down=null; pinchS=null; moved=false;
},{passive:false});
cv.addEventListener('contextmenu',e=>{ e.preventDefault(); if(S){ S.tool=null; S.multi=[]; renderAll(); } });
window.addEventListener('keydown',e=>{
  if(screen!=='game'){ return; }
  if(e.key==='Escape'){
    if(S.multi&&S.multi.length){ S.multi=[]; renderAll(); return; }
    if(modal==='pause') closePause();
    else if(modal) { modal=null; renderAll(); }
    else openPause();
    return;
  }
  if(modal) return;
  const step=40;
  if(e.key==='ArrowLeft') cam.x-=step;
  else if(e.key==='ArrowRight') cam.x+=step;
  else if(e.key==='ArrowUp') cam.y-=step;
  else if(e.key==='ArrowDown') cam.y+=step;
  else if(e.key===' '){ if(S.speed>0) { S.prevSpeed=S.speed; S.speed=0; } else S.speed=S.prevSpeed||1; renderAll(); }
  else if(e.key==='Tab'){ e.preventDefault(); toggleBottom(); }
  else if(e.key==='p'||e.key==='P'){ modal='producao'; renderAll(); }
  else if(e.key==='t'||e.key==='T'){ toggleArv(); renderAll(); }
  else if(e.key==='q'||e.key==='Q'){ S.tool=null; renderAll(); }
  else if(e.key==='+'){ tick(); }
  else if(e.key==='1'||e.key==='2'||e.key==='3'){ if(S.mode!=='turnos'){ S.speed=+e.key; S.prevSpeed=S.speed; renderAll(); } }
  clampCam();
});
cv.addEventListener('wheel',e=>{
  if(screen!=='game'||modal) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const wx=mx/Z+cam.x, wy=my/Z+cam.y;
  Z=Math.max(0.5,Math.min(2.5,Z*(e.deltaY<0?1.1:1/1.1)));
  cam.x=wx-mx/Z; cam.y=wy-my/Z; clampCam();
},{passive:false});
window.addEventListener('resize',()=>{ resize(); clampCam(); renderAll(); });

let frameN=0;
function frame(){ draw(); drawBox(); drawRoute(); drawFx(); renderTileInfo(); positionCard(); if((frameN++)%8===0) drawMini(); requestAnimationFrame(frame); }

loadOpts();
applyScale();
showTitle();
resize();
loop();
frame();
</script>
</body>
