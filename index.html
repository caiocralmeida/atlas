<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14100a;font-family:Georgia,'Times New Roman',serif}
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(#3b5a3a,#162418);z-index:40;padding:12px}
#screen.on{display:flex}
#sbox{background:rgba(243,230,196,.97);color:#222;border:4px solid #6b4a2a;border-radius:10px;padding:22px 26px;width:580px;max-width:100%;max-height:94vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#sbox h1{margin:0 0 4px;text-align:center;color:#4a2e12;font-size:34px;letter-spacing:2px}
#sbox h2{margin:16px 0 6px;color:#4a2e12;font-size:17px;border-bottom:2px solid #a08a50;padding-bottom:3px}
#sbox .sub{text-align:center;color:#6b5a3a;margin-bottom:14px}
#sbox .row{margin:10px 0}
#sbox .lbl{font-weight:bold;color:#4a2e12;margin:8px 0 4px}
#sbox .hint{font-size:12px;color:#6b5a3a;margin-top:6px}
#sbox input[type=text]{width:100%;padding:7px;border:1px solid #a08a50;border-radius:4px;font-family:inherit;font-size:14px;background:#fff8e6}
#sbox input[type=range]{width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 10px;background:#e4d3a6;border:2px solid #a08a50;border-radius:5px;cursor:pointer;font-size:13px;color:#3a2a10}
.opt.on{background:#c9a24a;border-color:#4a2e12;font-weight:bold}
.opt small{display:block;font-weight:normal;color:#6b5a3a;font-size:11px;margin-top:2px}
.sw{display:inline-block;width:32px;height:32px;border-radius:5px;border:3px solid #6b4a2a;cursor:pointer;margin:2px}
.sw.on{box-shadow:0 0 0 3px #f0d28a,0 0 0 4px #4a2e12}
.card{background:#ead9ac;border:2px solid #a08a50;border-radius:8px;padding:10px 12px;margin:10px 0}
.card p{margin:4px 0 8px;font-size:13px;color:#4a3a1a}
.cbtn{display:block;width:100%;margin:6px 0 0;padding:8px 10px;background:#5a4a2a;color:#ffe9b0;border:1px solid #2b2010;border-radius:5px;font-size:14px;cursor:pointer;text-align:center;font-family:inherit}
.cbtn:hover{background:#7a6a3a}
.cbtn:disabled{background:#8a8170;color:#c9c0a8;cursor:not-allowed}
.cbtn.sec2{background:#8a3a2a}.cbtn.sec2:hover{background:#a84a3a}
.cbtn.good{background:#2f6a3a}.cbtn.good:hover{background:#3f8a4a}
.cbtn.inl{display:inline-block;width:auto;margin:0 4px 0 0;padding:4px 10px;font-size:12px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ead9ac;border:1px solid #a08a50;border-radius:5px;padding:6px 8px;margin:4px 0;font-size:13px}
#bar{position:fixed;top:0;left:0;right:0;height:30px;background:#14100a;display:none;align-items:center;gap:10px;padding:0 8px;font-size:13px;color:#f1e4c0;z-index:5;border-bottom:3px solid var(--nation,#6b4a2a);white-space:nowrap;overflow:hidden}
#bar b{color:#f0d28a}
#bar .sp{background:#1f3b1f;color:#ffd84a;border:1px solid #0b1a0b;padding:3px 9px;cursor:pointer;font-size:12px;border-radius:4px;font-family:inherit}
#bar .spacer{flex:1}
#stage{position:fixed;top:30px;left:0;right:0;bottom:0;display:none}
#stage iframe{width:100%;height:100%;border:0;display:block;background:#000}
</style>
</head>
<body>

<div id="screen"><div id="sbox"></div></div>

<div id="bar">
  <b id="bar_nation"></b><span id="bar_stage"></span>
  <span class="spacer"></span>
  <button class="sp" onclick="openMenu()">Menu</button>
  <button class="sp" id="bar_next" onclick="nextStage()">Próxima etapa ›</button>
</div>
<div id="stage"></div>

<script>
const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const js=v=>JSON.stringify(v).replace(/</g,'\\u003c');
const getP=(o,p)=>p.split('.').reduce((a,k)=>a[k],o);
const setP=(o,p,v)=>{ const ks=p.split('.'), last=ks.pop(); ks.reduce((a,k)=>a[k],o)[last]=v; };
function stamp(){ const d=new Date(); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

const COLORS=['#c9a24a','#3a7ac0','#4a9a4a','#b04a3a','#7a4ab0','#2a2a2a'];
const STAGES=[
  {n:'Sobrevivência', info:'Uma cidade e seus arredores. Colha madeira, pedra e comida, sustente a população e erga casas até a Prefeitura Central.', win:'Vitória: Prefeitura Central construída e cidade de nível 2.'},
  {n:'Império planetário', info:'O planeta inteiro, com nações rivais. Expanda, pesquise e conquiste.', win:'Vitória: destruir todas as capitais rivais.'},
  {n:'Espaço', info:'Um setor galáctico com sistemas e povos. Conquiste sistemas e influencie os povos.', win:'Vitória: conquistar o número de sistemas escolhido.'}
];
const KEYS=[['atlas_mundo_save'],['atlas_saves','atlas_auto'],['atlas_galaxia_v2_saves']];
const DIFF_INFO={
  'Fácil':'Recursos abundantes, poucas ameaças e IAs pacifistas. Para aprender.',
  'Normal':'Equilíbrio entre recursos, ameaças e IAs normais.',
  'Difícil':'Recursos escassos, mais ameaças, IAs elevadas e mapas maiores.',
  'Extrema':'Tudo no limite: recursos mínimos, IAs agressivas e mapas gigantes.'
};
const DIFFS={
  'Fácil':  {s1:{res:2,host:0,water:1}, s2:{sizeIdx:0,preset:'leve',    ias:'auto',aiDiff:'pacifista',mode:'tempo'}, s3:{size:'pequena',nations:3,goal:4,diff:'facil'}},
  'Normal': {s1:{res:1,host:1,water:1}, s2:{sizeIdx:1,preset:'normal',  ias:'auto',aiDiff:'normal',    mode:'tempo'}, s3:{size:'media',   nations:5,goal:6,diff:'normal'}},
  'Difícil':{s1:{res:0,host:2,water:1}, s2:{sizeIdx:2,preset:'elevado', ias:'auto',aiDiff:'normal',    mode:'tempo'}, s3:{size:'grande',  nations:5,goal:8,diff:'dificil'}},
  'Extrema':{s1:{res:0,host:2,water:0}, s2:{sizeIdx:3,preset:'elevado', ias:6,     aiDiff:'agressiva', mode:'tempo'}, s3:{size:'enorme',  nations:5,goal:8,diff:'dificil'}}
};
const SIZES2=[{n:'Pequeno',ai:2},{n:'Médio',ai:4},{n:'Grande',ai:6},{n:'Gigante',ai:8}];
const PRESET_NAMES={leve:'Leve',normal:'Normal',elevado:'Elevado',criativo:'Criativo'};

let P=null, D=null, STAGE=-1, WON=false, PAUSED=false, CUR_BACK='showTitle()';

// ---------- Opções (mesma chave e formato do Atlas v48) ----------
let OPTS=loadOpts();
function loadOpts(){
  const base={music:true,musicVol:0.6,sound:true,sfxVol:0.6,scale:1};
  try{ return Object.assign(base, JSON.parse(localStorage.getItem('atlas_opts')||'{}')); }catch(e){ return base; }
}
function applyOpts(){
  $('screen').style.zoom=OPTS.scale; $('bar').style.zoom=OPTS.scale;
  hook('scale',OPTS.scale); hook('audio',OPTS);
}
function saveOptsNow(){ try{ localStorage.setItem('atlas_opts',JSON.stringify(OPTS)); }catch(e){} applyOpts(); }
function setOpt(k,v,rerender){
  OPTS[k]=v; saveOptsNow();
  if(rerender) openOpts(CUR_BACK);
}
function openOpts(back){
  CUR_BACK=back;
  const tog=(k,label,val)=>`<div class="opt ${OPTS[k]===val?'on':''}" onclick="setOpt('${k}',${val},true)">${label}</div>`;
  panel(`<h1>Opções</h1><div class="sub">Som e tela</div>
    <h2>Música</h2>
    <div class="opts">${tog('music','Ligada',true)}${tog('music','Desligada',false)}</div>
    <div class="lbl">Volume da música</div>
    <input type="range" min="0" max="1" step="0.05" value="${OPTS.musicVol}" oninput="setOpt('musicVol',+this.value,false)">
    <h2>Efeitos</h2>
    <div class="opts">${tog('sound','Ligados',true)}${tog('sound','Desligados',false)}</div>
    <div class="lbl">Volume dos efeitos</div>
    <input type="range" min="0" max="1" step="0.05" value="${OPTS.sfxVol}" oninput="setOpt('sfxVol',+this.value,false)">
    <h2>Escala da tela</h2>
    <div class="opts">${[1,1.15,1.3].map(v=>`<div class="opt ${OPTS.scale===v?'on':''}" onclick="setOpt('scale',${v},true)">${Math.round(v*100)}%</div>`).join('')}</div>
    <div class="hint">Áudio e escala valem na hora. Em alguns estágios, o áudio só muda ao iniciar a próxima partida.</div>
    <button class="cbtn" onclick="${back}">Voltar</button>`);
}

// ---------- Painel ----------
function panel(html){ $('sbox').innerHTML=html; $('screen').classList.add('on'); }
function hidePanel(){ $('screen').classList.remove('on'); }

// ---------- Ponte com o estágio em execução ----------
function frameEl(){ return $('stage').querySelector('iframe'); }
function hook(fn,...a){
  try{
    const f=frameEl(), h=f&&f.contentWindow&&f.contentWindow.__atlas;
    if(h&&typeof h[fn]==='function') return h[fn](...a);
  }catch(e){}
  return undefined;
}
function focusFrame(){ try{ const f=frameEl(); if(f) f.contentWindow.focus(); }catch(e){} }
function setPause(on){ if(PAUSED===on) return; PAUSED=on; hook('pause',on); }

// ---------- Salvamentos (formato único, igual ao do estágio 2) ----------
const EMPTY_SAVES={manual:[],auto:{idx:0,slots:[null,null,null]}};
function getSaves(){ try{ return Object.assign(clone(EMPTY_SAVES), JSON.parse(localStorage.getItem('atlas_u_saves'))); }catch(e){ return clone(EMPTY_SAVES); } }
function setSaves(s){ localStorage.setItem('atlas_u_saves',JSON.stringify(s)); }
function makeEntry(name){ return {name, stage:STAGE, date:stamp(), at:Date.now(), profile:clone(P), data:hook('snap')}; }
function latestEntry(){
  const s=getSaves(); const all=s.manual.concat(s.auto.slots.filter(Boolean));
  all.sort((a,b)=>b.at-a.at); return all[0]||null;
}
function saveManual(){
  if(STAGE<0||!P){ return; }
  const name=(($('sv_name')&&$('sv_name').value)||'Salvamento').trim().slice(0,40)||'Salvamento';
  const e=makeEntry(name);
  if(!e.data){ openSaves('save',CUR_BACK,'Esta partida ainda não pode ser salva.'); return; }
  const s=getSaves(); s.manual.unshift(e); s.manual=s.manual.slice(0,10);
  try{ setSaves(s); openSaves('save',CUR_BACK,'Jogo salvo.'); }
  catch(err){ openSaves('save',CUR_BACK,'Sem espaço para salvar. Exclua saves antigos.'); }
}
function autoSave(){
  if(STAGE<0||!P||WON) return;
  const e=makeEntry('');
  if(!e.data) return;
  const s=getSaves(); const i=s.auto.idx;
  e.name='Automático '+(i+1)+' · '+STAGES[STAGE].n;
  s.auto.slots[i]=e; s.auto.idx=(i+1)%3;
  try{ setSaves(s); }catch(err){}
}
function deleteManual(idx){
  const s=getSaves(); s.manual.splice(idx,1); setSaves(s);
  openSaves(CUR_SAVE_MODE,CUR_BACK,'Salvamento excluído.');
}
let CUR_SAVE_MODE='load';
function openSaves(mode,back,note){
  CUR_SAVE_MODE=mode; CUR_BACK=back;
  const s=getSaves();
  const manualRows=s.manual.length? s.manual.map((e,i)=>`<div class="slot"><div><b>${esc(e.name)}</b><br><small>${STAGES[e.stage].n} · ${e.date}</small></div><div>${mode==='load'?`<button class="cbtn inl" onclick="loadKind('manual',${i})">Carregar</button>`:''}<button class="cbtn inl sec2" id="del_${i}" onclick="confirmTwice('del_${i}',()=>deleteManual(${i}),'Clique de novo para excluir')">Excluir</button></div></div>`).join('')
    : '<div class="hint">Nenhum salvamento manual.</div>';
  const autoRows=s.auto.slots.map((e,i)=>e? `<div class="slot"><div><b>${esc(e.name)}</b><br><small>${e.date}</small></div><div>${mode==='load'?`<button class="cbtn inl" onclick="loadKind('auto',${i})">Carregar</button>`:''}</div></div>`
    : `<div class="slot"><div><small>Automático ${i+1}: vazio</small></div></div>`).join('');
  panel(`<h1>${mode==='save'?'Salvar jogo':'Carregar jogo'}</h1>
    ${note?`<div class="hint" style="text-align:center;color:#4a2e12">${esc(note)}</div>`:''}
    ${mode==='save'?`<div class="row"><div class="lbl">Nome do salvamento</div><input type="text" id="sv_name" maxlength="40" value="${esc(STAGES[STAGE].n+' · '+stamp())}"></div>
      <button class="cbtn good" onclick="saveManual()">Salvar aqui</button>`:''}
    <h2>Salvamentos</h2>${manualRows}
    <h2>Automáticos</h2>${autoRows}
    <div class="hint">Os automáticos são gravados a cada 2 minutos, em rodízio de 3 slots.</div>
    <button class="cbtn" onclick="${back}">Voltar</button>`);
}
function loadKind(kind,idx){
  const s=getSaves();
  const e= kind==='manual' ? s.manual[idx] : s.auto.slots[idx];
  loadEntry(e);
}
function loadEntry(e){
  if(!e) return;
  P=clone(e.profile);
  try{ localStorage.setItem('atlas_u_profile',JSON.stringify(P)); }catch(err){}
  if(e.stage===STAGE && frameEl()){
    PAUSED=false;
    hook('load',e.data);
    WON=false; hidePanel(); hook('pause',false); focusFrame();
  } else {
    launch(e.stage, e.data);
  }
}
function continueLatest(){ loadEntry(latestEntry()); }
setInterval(autoSave,120000);

// ---------- Menus ----------
function showTitle(){
  stopGame();
  const last=latestEntry();
  panel(`<h1>ATLAS</h1><div class="sub">O despertar das civilizações</div>
    <div class="row"><button class="cbtn" onclick="openCreate()">Novo jogo</button></div>
    <div class="row"><button class="cbtn" ${last?'':'disabled'} onclick="continueLatest()">Continuar</button></div>
    <div class="row"><button class="cbtn" onclick="openSaves('load','showTitle()')">Carregar</button></div>
    <div class="row"><button class="cbtn" onclick="openOpts('showTitle()')">Opções</button></div>
    <div class="row"><button class="cbtn sec2" onclick="$('sbox').insertAdjacentHTML('beforeend','<div class=hint>Feche a aba do navegador para sair.</div>')">Sair</button></div>`);
}
function openMenu(){
  if(STAGE<0) return;
  setPause(true);
  panel(`<h1>Menu</h1><div class="sub">Etapa ${STAGE+1}: ${STAGES[STAGE].n} · ${esc(P.leader)} · ${esc(P.nation)}</div>
    <div class="row"><button class="cbtn" onclick="closeMenu()">Continuar jogando</button></div>
    <div class="row"><button class="cbtn" onclick="openSaves('save','openMenu()')">Salvar jogo</button></div>
    <div class="row"><button class="cbtn" onclick="openSaves('load','openMenu()')">Carregar</button></div>
    <div class="row"><button class="cbtn" onclick="openOpts('openMenu()')">Opções</button></div>
    ${STAGE<STAGES.length-1?`<div class="row"><button class="cbtn good" onclick="nextStage()">Passar para a próxima etapa</button></div>`:''}
    <div class="row"><button class="cbtn sec2" id="mi_btn" onclick="confirmTwice('mi_btn',()=>showTitle(),'Clique de novo para voltar ao menu inicial (o que não foi salvo será perdido)')">Menu inicial</button></div>`);
}
// Confirmação em dois cliques: diálogos do navegador (confirm/alert) podem ser bloqueados no preview.
let PENDING=null;
function confirmTwice(id,action,question){
  const btn=$(id);
  if(PENDING===id){ PENDING=null; action(); return; }
  PENDING=id;
  if(btn){ btn.textContent=question; btn.style.background='#c04a2a'; }
}
function closeMenu(){ hidePanel(); setPause(false); }
function showWin(){
  setPause(true);
  const last=STAGE===STAGES.length-1;
  panel(`<h1>${last?'FIM DA CAMPANHA':'ESTÁGIO CONCLUÍDO'}</h1>
    <div class="sub">${last?'Seu império conquistou o espaço.':'Você venceu a etapa '+(STAGE+1)+'. Pode seguir jogando ou passar para a próxima.'}</div>
    ${last?'':`<div class="row"><button class="cbtn good" onclick="nextStage()">Passar para a próxima etapa</button></div>`}
    <div class="row"><button class="cbtn" onclick="closeMenu()">Continuar jogando</button></div>
    <div class="row"><button class="cbtn" onclick="openMenu()">Menu</button></div>`);
}

// ---------- Criação de campanha ----------
const DEFAULT_DRAFT=()=>({leader:'Líder',nation:'Minha Tribo',planet:'Lar',color:COLORS[0],diff:'Normal',cfg:clone(DIFFS['Normal'])});
function openCreate(){
  let pr=null; try{ pr=JSON.parse(localStorage.getItem('atlas_u_profile')); }catch(e){}
  D = pr ? {leader:pr.leader,nation:pr.nation,planet:pr.planet,color:pr.color,diff:pr.diff,cfg:clone(pr.cfg)} : DEFAULT_DRAFT();
  renderCreate();
}
function readDraft(){
  if($('c_leader')){ D.leader=$('c_leader').value; D.nation=$('c_nation').value; D.planet=$('c_planet').value; }
}
function renderCreate(){
  const O=(path,val,label,desc)=>`<div class="opt ${String(getP(D,path))===String(val)?'on':''}" data-path="${path}" data-v='${JSON.stringify(val)}'>${label}${desc?`<small>${desc}</small>`:''}</div>`;
  panel(`<h1>Nova campanha</h1>
    <div class="sub">Defina o líder, o império e as regras de cada etapa</div>
    <div class="row"><div class="lbl">Líder</div><input type="text" id="c_leader" maxlength="20" value="${esc(D.leader)}"></div>
    <div class="row"><div class="lbl">Civilização</div><input type="text" id="c_nation" maxlength="24" value="${esc(D.nation)}"></div>
    <div class="row"><div class="lbl">Planeta natal</div><input type="text" id="c_planet" maxlength="24" value="${esc(D.planet)}"></div>
    <div class="row"><div class="lbl">Cor do império</div>${COLORS.map(c=>`<span class="sw ${c===D.color?'on':''}" style="background:${c}" data-color="${c}"></span>`).join('')}</div>

    <h2>Dificuldade</h2>
    <div class="opts">${Object.keys(DIFFS).map(k=>`<div class="opt ${D.diff===k?'on':''}" data-diff="${k}">${k}<small>${DIFF_INFO[k]}</small></div>`).join('')}</div>
    <div class="hint">Escolher uma dificuldade preenche todas as etapas. Depois você ajusta cada uma abaixo.</div>

    <h2>Etapa 1 · Sobrevivência</h2>
    <div class="card"><p>${STAGES[0].info}</p><p><b>${STAGES[0].win}</b></p>
      <div class="lbl">Recursos</div><div class="opts">${O('cfg.s1.res',2,'Abundantes')}${O('cfg.s1.res',1,'Normais')}${O('cfg.s1.res',0,'Escassos')}</div>
      <div class="lbl">Ameaças</div><div class="opts">${O('cfg.s1.host',0,'Poucas')}${O('cfg.s1.host',1,'Normais')}${O('cfg.s1.host',2,'Muitas')}</div>
      <div class="lbl">Água no mapa</div><div class="opts">${O('cfg.s1.water',0,'Pouca')}${O('cfg.s1.water',1,'Média')}${O('cfg.s1.water',2,'Muita')}</div>
    </div>

    <h2>Etapa 2 · Império planetário</h2>
    <div class="card"><p>${STAGES[1].info}</p><p><b>${STAGES[1].win}</b></p>
      <div class="lbl">Tamanho do planeta</div><div class="opts">${SIZES2.map((s,i)=>O('cfg.s2.sizeIdx',i,s.n,s.ai+' IAs')).join('')}</div>
      <div class="lbl">Predefinição de regras</div><div class="opts">${Object.keys(PRESET_NAMES).map(p=>O('cfg.s2.preset',p,PRESET_NAMES[p])).join('')}</div>
      <div class="lbl">Número de IAs</div><div class="opts">${O('cfg.s2.ias','auto','Automático')}${[2,4,6].map(n=>O('cfg.s2.ias',n,String(n))).join('')}</div>
      <div class="lbl">Comportamento das IAs</div><div class="opts">${O('cfg.s2.aiDiff','pacifista','Pacifistas')}${O('cfg.s2.aiDiff','normal','Normais')}${O('cfg.s2.aiDiff','agressiva','Agressivas')}</div>
      <div class="lbl">Modo de tempo</div><div class="opts">${O('cfg.s2.mode','tempo','Tempo real')}${O('cfg.s2.mode','turnos','Por turnos')}</div>
    </div>

    <h2>Etapa 3 · Espaço</h2>
    <div class="card"><p>${STAGES[2].info}</p><p><b>${STAGES[2].win}</b></p>
      <div class="lbl">Tamanho da galáxia</div><div class="opts">${O('cfg.s3.size','pequena','Pequena','8 sistemas')}${O('cfg.s3.size','media','Média','12 sistemas')}${O('cfg.s3.size','grande','Grande','16 sistemas')}${O('cfg.s3.size','enorme','Enorme','24 sistemas')}</div>
      <div class="lbl">Povos na galáxia</div><div class="opts">${O('cfg.s3.nations',3,'3 povos')}${O('cfg.s3.nations',5,'5 povos')}</div>
      <div class="lbl">Sistemas para vencer</div><div class="opts">${O('cfg.s3.goal',4,'4')}${O('cfg.s3.goal',6,'6')}${O('cfg.s3.goal',8,'8')}</div>
      <div class="lbl">Dificuldade</div><div class="opts">${O('cfg.s3.diff','facil','Fácil')}${O('cfg.s3.diff','normal','Normal')}${O('cfg.s3.diff','dificil','Difícil')}</div>
    </div>

    <div class="row" style="display:flex;gap:8px;margin-top:16px">
      <button class="cbtn" style="flex:1" onclick="showTitle()">Voltar</button>
      <button class="cbtn good" style="flex:1" onclick="startCampaign()">Começar</button>
    </div>`);
}
$('sbox').addEventListener('click',e=>{
  if(!D) return;
  const sw=e.target.closest('[data-color]');
  if(sw){ readDraft(); D.color=sw.dataset.color; renderCreate(); return; }
  const dd=e.target.closest('[data-diff]');
  if(dd){ readDraft(); D.diff=dd.dataset.diff; D.cfg=clone(DIFFS[D.diff]); renderCreate(); return; }
  const o=e.target.closest('[data-path]');
  if(o){ readDraft(); setP(D,o.dataset.path,JSON.parse(o.dataset.v)); renderCreate(); }
});
function startCampaign(){
  readDraft();
  P={
    leader:(D.leader||'').trim().slice(0,20)||'Líder',
    nation:(D.nation||'').trim().slice(0,24)||'Minha Tribo',
    planet:(D.planet||'').trim().slice(0,24)||'Lar',
    color:D.color, diff:D.diff, cfg:clone(D.cfg)
  };
  try{ localStorage.setItem('atlas_u_profile',JSON.stringify(P)); }catch(e){}
  launch(0,null);
}

// ---------- Estágios ----------
function launch(i,data){
  STAGE=i; WON=false; PAUSED=false; hidePanel();
  const st=$('stage'); st.innerHTML='';
  const f=document.createElement('iframe');
  f.title=STAGES[i].n;
  const pre='<script>window.ATLAS_PROFILE='+js(P)+';window.ATLAS_LOAD='+js(data||null)+';<\/script>';
  const src=STAGE_SRC[i];
  f.srcdoc=/<head[^>]*>/i.test(src)? src.replace(/<head[^>]*>/i,m=>m+pre) : pre+src;
  f.onload=()=>{ applyOpts(); focusFrame(); };
  st.appendChild(f);
  st.style.display='block';
  $('bar').style.display='flex';
  $('bar').style.setProperty('--nation',P.color);
  $('bar_nation').textContent=P.nation;
  $('bar_stage').textContent='Etapa '+(i+1)+' · '+STAGES[i].n+' · '+P.leader+' · '+P.diff;
  $('bar_next').style.display = i===STAGES.length-1 ? 'none' : 'inline-block';
}
function stopGame(){
  $('stage').innerHTML=''; $('stage').style.display='none';
  $('bar').style.display='none';
  STAGE=-1; WON=false; PAUSED=false;
}
function nextStage(){
  if(STAGE<0||STAGE>=STAGES.length-1) return;
  // Descarta os salvos internos do estágio que termina; o próximo começa limpo.
  KEYS[STAGE].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  launch(STAGE+1,null);
}
function escPressed(){
  if(STAGE<0) return;
  if($('screen').classList.contains('on')) closeMenu(); else openMenu();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') escPressed(); });
window.addEventListener('message',e=>{
  const f=frameEl();
  if(f && e.source===f.contentWindow && e.data && e.data.atlasEsc){ escPressed(); return; }
  if(!f || e.source!==f.contentWindow || !e.data || !e.data.atlasWon || WON) return;
  WON=true;
  showWin();
});

showTitle();
</script>

============================================\nfunction hash2(x,y,s){\n  let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,982451653)|0;\n  h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16;\n  return (h>>>0)/4294967296;\n}\nfunction vnoise(x,y,s){\n  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;\n  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);\n  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);\n  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;\n}\nfunction fbm(x,y,s){\n  let v=0,a=0.5,f=1;\n  for(let i=0;i<3;i++){ v+=a*vnoise(x*f,y*f,s+i*7); f*=2; a*=0.5; }\n  return v/0.875;\n}\nfunction biomeAt(x,y){\n  const dx=(x-MW/2)/(MW/2), dy=(y-MH/2)/(MH/2), d=Math.min(1.4,Math.hypot(dx,dy));\n  const e=fbm(x*0.05,y*0.05,11+WSEED)-d*d*0.35;\n  const m=fbm(x*0.06,y*0.06,47+WSEED);\n  if(e<WATER_T) return 'agua';\n  if(e<WATER_T+0.04) return 'praia';\n  if(e>0.74) return 'neve';\n  if(e>0.64) return 'montanha';\n  if(m<0.33) return 'deserto';\n  if(m>0.66&&e<0.45) return 'pantano';\n  if(m>0.62) return 'selva';\n  if(m>0.46) return 'floresta';\n  return 'planicie';\n}\nfunction cheb(a,b,c,d){ return Math.max(Math.abs(a-c),Math.abs(b-d)); }\nfunction inB(x,y){ return x>=0&&y>=0&&x<MW&&y<MH; }\nfunction walk(x,y){ if(!inB(x,y)) return false; const c=map[y][x]; return c.bio!=='agua'&&!c.n&&!c.bld; }\nfunction genMap(){\n  rnd=mulberry32(WSEED);\n  map=[];\n  for(let y=0;y<MH;y++){ const row=[]; for(let x=0;x<MW;x++) row.push({bio:biomeAt(x,y),n:null,bld:null}); map.push(row); }\n  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){\n    const c=map[y][x]; if(c.bio==='agua') continue;\n    const r=rnd(); let acc=0;\n    for(const k in NODES){\n      const nd=NODES[k];\n      if(!nd.b.includes(c.bio)) continue;\n      acc+=nd.p*RES_MULT;\n      if(r<acc){ c.n={k,hp:nd.hp}; break; }\n    }\n  }\n  S.animals=[]; S.mobs=[]; S.villagers=[];\n  for(let i=0;i<46;i++) spawnAnimal(false);\n  // Ponto inicial: tile livre perto do centro\n  let sp=null;\n  for(let r=0;r<20&&!sp;r++) for(let dy=-r;dy<=r&&!sp;dy++) for(let dx=-r;dx<=r&&!sp;dx++){\n    const x=MW/2+dx, y=MH/2+dy;\n    if(walk(x,y)&&map[y][x].bio!=='montanha'&&map[y][x].bio!=='neve') sp={x,y};\n  }\n  S.player.x=sp.x; S.player.y=sp.y; S.vx=sp.x; S.vy=sp.y;\n  rnd=Math.random;\n}\nfunction spawnAnimal(force){\n  for(let i=0;i<200;i++){\n    const x=Math.floor(Math.random()*MW), y=Math.floor(Math.random()*MH);\n    if(!walk(x,y)||occupiedAt(x,y)) continue;\n    const bio=map[y][x].bio;\n    const keys=Object.keys(ANIMALS).filter(k=>ANIMALS[k].b.includes(bio));\n    if(!keys.length) continue;\n    if(!force&&cheb(x,y,S.player.x,S.player.y)<8) continue;\n    const k=keys[Math.floor(Math.random()*keys.length)];\n    S.animals.push({k,x,y,hp:ANIMALS[k].hp,mt:Math.random()*1.5,flee:0,hit:0,id:S.uid++});\n    return true;\n  }\n  return false;\n}\nfunction spawnMob(){\n  const lvl=cityLevel();\n  const pool=Object.keys(MOBS).filter(k=>MOBS[k].lvl<=lvl);\n  const k=pool[Math.floor(Math.random()*pool.length)];\n  for(let i=0;i<120;i++){\n    const x=Math.floor(Math.random()*MW), y=Math.floor(Math.random()*MH);\n    const d=cheb(x,y,S.player.x,S.player.y);\n    if(d<10||d>16||!walk(x,y)||occupiedAt(x,y)) continue;\n    S.mobs.push({k,x,y,hp:MOBS[k].hp,mt:0,cd:0,hit:0,id:S.uid++});\n    return;\n  }\n}\n\n// =====================================================================\n// OCUPACAO E CAMINHOS\n// =====================================================================\nlet OCC=new Set();\nfunction rebuildOcc(){\n  OCC=new Set();\n  OCC.add(S.player.x+','+S.player.y);\n  for(const a of S.animals) OCC.add(a.x+','+a.y);\n  for(const m of S.mobs) OCC.add(m.x+','+m.y);\n  for(const v of S.villagers) OCC.add(v.x+','+v.y);\n}\nfunction occupiedAt(x,y){ return OCC.has(x+','+y); }\nfunction bfs(sx,sy,goal,limit,self){\n  if(goal(sx,sy)) return [];\n  const prev=new Map(), q=[[sx,sy]]; prev.set(sx+','+sy,null);\n  let found=null, n=0;\n  for(let i=0;i<q.length&&!found;i++){\n    if(++n>(limit||6000)) break;\n    const [x,y]=q[i];\n    for(const [dx,dy] of DIRS){\n      const nx=x+dx, ny=y+dy, k=nx+','+ny;\n      if(prev.has(k)||!walk(nx,ny)) continue;\n      if(OCC.has(k)&&!(self&&self.x===nx&&self.y===ny)) continue;\n      prev.set(k,[x,y]);\n      if(goal(nx,ny)){ found=[nx,ny]; break; }\n      q.push([nx,ny]);\n    }\n  }\n  if(!found) return null;\n  const path=[]; let cur=found;\n  while(cur){ path.push(cur); cur=prev.get(cur[0]+','+cur[1]); }\n  return path.reverse().slice(1);\n}\nfunction walkTo(x,y){\n  if(!walk(x,y)){ msg('Não dá para ir até lá.'); return; }\n  const p=bfs(S.player.x,S.player.y,(X,Y)=>X===x&&Y===y,8000);\n  if(!p){ msg('Caminho bloqueado.'); return; }\n  S.job=null; S.path=p;\n}\nfunction setJob(t){\n  const goal=(X,Y)=>cheb(X,Y,t.x,t.y)===1&&walk(X,Y);\n  if(cheb(S.player.x,S.player.y,t.x,t.y)===1){ S.path=[]; S.job={t,timer:0,kind:t.kind,ref:t.ref}; return; }\n  const p=bfs(S.player.x,S.player.y,goal,8000);\n  if(!p){ msg('Não há caminho até lá.'); return; }\n  S.path=p; S.job={t,timer:0,kind:t.kind,ref:t.ref};\n}\n\n// =====================================================================\n// INVENTARIO, FERRAMENTAS E CONSTRUCOES\n// =====================================================================\nfunction have(k){ return S.inv[k]||0; }\nfunction bcount(k){ let n=0; for(const b of S.blds) if(b.k===k) n++; return n; }\nfunction cap(){ return 99+40*bcount('bau'); }\nfunction canPay(cost){ for(const k in cost) if(have(k)<cost[k]) return false; return true; }\nfunction pay(cost){ for(const k in cost) S.inv[k]-=cost[k]; }\nfunction giveItem(k,n){\n  if(n<=0) return 0;\n  const before=have(k); S.inv[k]=Math.min(cap(),before+n);\n  const got=S.inv[k]-before; S.stats.coletados+=got; return got;\n}\nfunction bestOwned(obj){ let best=null,bv=0; for(const k in obj) if(have(k)>0&&obj[k]>bv){bv=obj[k];best=k;} return best; }\nfunction weaponKey(){ return bestOwned(WEAPON); }\nfunction armorVal(){ let a=0; for(const k in ARMOR) if(have(k)>0) a=Math.max(a,ARMOR[k]); if(have('escudo')>0) a+=2; return a; }\nfunction pickTier(){ let t=0; for(const k in PICK) if(have(k)>0) t=Math.max(t,PICK[k]); return t; }\nfunction axeTier(){ let t=0; for(const k in AXE) if(have(k)>0) t=Math.max(t,AXE[k]); return t; }\nfunction cityLevel(){\n  const n=S.villagers.length, pref=bcount('prefeitura');\n  if(n>=30&&pref>=2) return 4;\n  if(n>=16&&pref>=1) return 3;\n  if(n>=8) return 2;\n  if(n>=3) return 1;\n  return 0;\n}\nfunction stationNear(st){\n  if(!st) return true;\n  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){\n    const X=S.player.x+dx, Y=S.player.y+dy; if(!inB(X,Y)) continue;\n    if(map[Y][X].bld&&map[Y][X].bld.k===st) return true;\n  }\n  return false;\n}\nfunction stationUnlocked(st){ const d=BUILD[st]; return !d||d.lvl<=cityLevel(); }\nfunction craft(r){\n  if(!stationNear(r.st)){ msg('Precisa de '+STATION_NAME[r.st]+' por perto.'); return; }\n  if(!canPay(r.cost)){ msg('Faltam materiais.'); return; }\n  pay(r.cost); giveItem(r.o,1); S.stats.crafted++;\n  sfx('craft');\n  fxPart(S.player.x+0.5,S.player.y+0.2,'#ffffff',8,2,0.3);\n  fxPart(S.player.x+0.5,S.player.y+0.2,'#ffd84a',12,2.2,0.4);\n  fxText(S.player.x,S.player.y-0.6,'+1 '+ITEMS[r.o],'#f0d28a',true);\n  fxPart(S.player.x+0.5,S.player.y+0.2,'#f0d28a',10,1.5,0.2);\n  renderPopup();\n}\nfunction validSpot(k,x,y){\n  if(!inB(x,y)) return 'Fora do mapa.';\n  const c=map[y][x], d=BUILD[k];\n  if(c.bio==='agua'||c.n||c.bld) return 'Tile ocupado.';\n  if(occupiedAt(x,y)) return 'Há alguém aqui.';\n  if(cheb(x,y,S.player.x,S.player.y)>4) return 'Muito longe.';\n  if(!isBuildUnlocked(k)) return 'Ainda não desbloqueado. Construa a mesa necessária.';\n  if(d.lvl>cityLevel()) return 'Requer cidade nível '+LVL_NAME[d.lvl]+'.';\n  if(d.water){ let ok=false; for(const [dx,dy] of DIRS){ const X=x+dx,Y=y+dy; if(inB(X,Y)&&map[Y][X].bio==='agua') ok=true; } if(!ok) return 'Precisa de água ao lado.'; }\n  if(d.need){ let ok=false; for(let dy=-4;dy<=4&&!ok;dy++) for(let dx=-4;dx<=4&&!ok;dx++){ const X=x+dx,Y=y+dy; if(inB(X,Y)&&d.need.includes(map[Y][X].bio)) ok=true; } if(!ok) return 'Precisa de '+d.need.join(' ou ')+' por perto.'; }\n  if(!canPay(d.cost)) return 'Faltam materiais.';\n  return null;\n}\nfunction placeBuild(x,y){\n  const k=S.selBuild; if(!k) return;\n  const err=validSpot(k,x,y);\n  if(err){ msg(err); return; }\n  pay(BUILD[k].cost);\n  const role=BUILD[k].role;\n  map[y][x].bld={k,p:0,tm:0,hp:50};\n  if(k==='cabana') map[y][x].bld.k='cabana';\n  scanB();\n  S.stats.built++;\n  fxPart(x+0.5,y+0.5,'#b59a6a',14,2,0.5);\n  fxText(x+0.5,y+0.1,'Construído','#f0d28a',true);\n  msg(BUILD[k].n+' pronta.');\n  sfx('build'); setTimeout(()=>sfx('built'),220);\n  fxPart(x+0.5,y+0.5,'#ffe9a0',10,2.4,0.3);\n  const nu=unlockList(k);\n  if(nu.length) msg('Desbloqueado: '+nu.join(', ')+'.');\n  S.selBuild=null;\n  S.buildFlash=0.5;\n}\nfunction upgradeHouse(x,y){\n  const b=map[y][x].bld; if(!b||!HOUSE_UP[b.k]) return;\n  const up=HOUSE_UP[b.k];\n  if(!canPay(up.cost)){ msg('Faltam materiais para '+up.n+'.'); return; }\n  pay(up.cost); b.k=up.to; scanB();\n  sfx('upgrade');\n  fxPart(x+0.5,y+0.5,'#f0d28a',14,2,0.5);\n  fxText(x+0.5,y+0.1,up.n,'#f0d28a',true);\n  msg('Melhorado para '+up.n+'.');\n  renderPopup();\n}\nfunction demolish(x,y){\n  const b=map[y][x].bld; if(!b) return;\n  const cost=BUILD[b.k]?BUILD[b.k].cost:(HOUSE_UP_COST(b.k)||{});\n  for(const k in cost) giveItem(k,Math.floor(cost[k]*0.5));\n  map[y][x].bld=null; scanB();\n  S.villagers.forEach(v=>{ if(v.job&&v.job.x===x&&v.job.y===y){ v.job=null; v.working=false; } });\n  msg('Construção demolida. Metade do material voltou.');\n  S.selBld=null; closePopup();\n}\nfunction HOUSE_UP_COST(k){\n  // soma do que foi gasto ao chegar nesse estagio\n  const sum={cabana_m:{madeira:8,fibra:4},casa_m:{madeira:23,fibra:4,pedra:4},casa_pedra_m:{madeira:23,fibra:4,pedra:18,tijolo:4},sobrado_m:{madeira:23,fibra:4,pedra:18,tijolo:14,ferro:4},mansao:{madeira:23,fibra:4,pedra:48,tijolo:44,ferro:16,ouro:6},cabana:{madeira:8,fibra:4},casa:{madeira:23,fibra:4,pedra:4},casa_pedra:{madeira:23,fibra:4,pedra:18,tijolo:4},sobrado:{madeira:23,fibra:4,pedra:18,tijolo:14,ferro:4},prefeitura:{madeira:23,fibra:4,pedra:18,tijolo:34,ferro:14,ouro:4}};\n  return sum[k];\n}\nfunction scanB(){\n  S.blds=[];\n  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) if(map[y][x].bld) S.blds.push({x,y,k:map[y][x].bld.k});\n}\n// Estoque da cidade (depósito), separado do inventário do jogador\nfunction haveCity(k){ return S.city[k]||0; }\nfunction cityCap(){ let c=0; for(const b of S.blds) if(DEPO_CAP[b.k]) c+=DEPO_CAP[b.k]; return c; }\nfunction canPayCity(cost){ for(const k in cost) if(haveCity(k)<cost[k]) return false; return true; }\nfunction payCity(cost){ for(const k in cost) S.city[k]=haveCity(k)-cost[k]; }\nfunction giveCity(k,n){\n  const cc=cityCap(); if(!cc||n<=0) return 0;\n  const before=haveCity(k); S.city[k]=Math.min(cc,before+n); return S.city[k]-before;\n}\nfunction depositItem(k){\n  const room=cityCap()-haveCity(k);\n  if(room<=0){ msg('O depósito está cheio para '+ITEMS[k]+'.'); return; }\n  const q=Math.min(have(k),room); if(q<=0) return;\n  S.inv[k]-=q; S.city[k]=haveCity(k)+q; sfx('deposit'); msg('Guardado: '+q+' '+ITEMS[k]+'.'); renderPopup();\n}\nfunction withdrawItem(k){\n  const room=cap()-have(k);\n  const q=Math.min(haveCity(k),room);\n  if(q<=0){ msg(room<=0?'Seu inventário está cheio.':'Não há '+ITEMS[k]+' no depósito.'); return; }\n  S.city[k]-=q; S.inv[k]=have(k)+q; sfx('withdraw'); msg('Pegou: '+q+' '+ITEMS[k]+'.'); renderPopup();\n}\nfunction upgradeDeposit(x,y){\n  const b=map[y][x].bld; if(!b||!DEPO_UP[b.k]) return;\n  const up=DEPO_UP[b.k];\n  if(!canPay(up.cost)){ msg('Faltam materiais para '+up.n+'.'); return; }\n  pay(up.cost); b.k=up.to; scanB(); sfx('upgrade'); fxPart(x+0.5,y+0.5,'#f0d28a',14,2,0.5);\n  msg(up.n+' pronto. Cabe mais.'); renderPopup();\n}\nfunction eatItem(k){\n  if(have(k)<=0) return;\n  if(S.fome>=100){ msg('Você não está com fome.'); return; }\n  S.inv[k]--; S.fome=Math.min(100,S.fome+FOOD[k]); sfx('eat');\n  fxPart(S.player.x+0.5,S.player.y+0.3,'#ff8a6a',8,1.2,0.5);\n  fxPart(S.player.x+0.5,S.player.y+0.3,'#7aff8a',5,1,0.5);\n  fxText(S.player.x,S.player.y-0.6,'+'+FOOD[k]+' fome','#ff9a7a',false);\n  S.eatFlash=0.4;\n}\nfunction eat(){ const k=bestOwned(FOOD); if(!k){ msg('Nada para comer.'); return; } eatItem(k); }\nfunction nearWater(){\n  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){\n    const X=S.player.x+dx, Y=S.player.y+dy; if(!inB(X,Y)) continue;\n    if(map[Y][X].bio==='agua'||(map[Y][X].bld&&map[Y][X].bld.k==='poco')) return true;\n  }\n  return false;\n}\nfunction drink(){\n  if(!nearWater()){ msg('Não há água por perto.'); return; }\n  if(S.sede>=100){ msg('Você não está com sede.'); return; }\n  S.sede=Math.min(100,S.sede+30); sfx('drink');\n  fxPart(S.player.x+0.5,S.player.y+0.3,'#5aa0ff',10,1.2,0.6);\n  fxText(S.player.x,S.player.y-0.6,'+sede','#7ab8ff',false);\n}\n// Consome comida de qualquer tipo (usado por moradores e pelo botao de chamar)\nfunction takeFood(n){\n  let total=0; for(const k in FOOD) total+=haveCity(k);\n  if(total<n) return false;\n  let left=n;\n  for(const k in FOOD){ while(left>0&&haveCity(k)>0){ S.city[k]--; left--; } if(left<=0) break; }\n  return true;\n}\nfunction foodTotal(){ let t=0; for(const k in FOOD) t+=haveCity(k); return t; }\n\n// =====================================================================\n// MORADORES\n// =====================================================================\nfunction homeCapTotal(){ let c=0; for(const b of S.blds) if(HOUSE_CAP[b.k]) c+=HOUSE_CAP[b.k]; return c; }\nfunction homeFree(){ return homeCapTotal()-S.villagers.filter(v=>v.home).length; }\nfunction spawnVillager(text){\n  for(let i=0;i<300;i++){\n    const side=Math.floor(Math.random()*4);\n    let x,y;\n    if(side===0){ x=Math.floor(Math.random()*MW); y=0; }\n    else if(side===1){ x=MW-1; y=Math.floor(Math.random()*MH); }\n    else if(side===2){ x=Math.floor(Math.random()*MW); y=MH-1; }\n    else { x=0; y=Math.floor(Math.random()*MH); }\n    if(!walk(x,y)||occupiedAt(x,y)) continue;\n    S.villagers.push({\n      id:S.uid++, name:NAMES[Math.floor(Math.random()*NAMES.length)], x, y,\n      skin:SKINS[Math.floor(Math.random()*SKINS.length)], hair:HAIRS[Math.floor(Math.random()*HAIRS.length)], shirt:SHIRTS[Math.floor(Math.random()*SHIRTS.length)],\n      home:null, job:null, working:false, path:[], mt:0, wt:Math.random()*3, pt:0, eatT:40, hungry:0, homeless:0, anim:0\n    });\n    if(text) msg(text);\n    sfx('villager');\n    return true;\n  }\n  return false;\n}\nfunction chamarMorador(){\n  if(homeFree()<=0){ msg('Não há casa livre. Construa ou melhore uma casa.'); return; }\n  if(!takeFood(8)){ msg('Faltam 8 de comida para chamar um morador.'); return; }\n  if(!spawnVillager('Um morador chegou e vai morar com você.')) { giveItem('pao',0); msg('Ninguém quis vir agora.'); }\n  renderPopup();\n}\nfunction assignHomes(){\n  const occ={};\n  for(const v of S.villagers){\n    if(v.home){ const b=map[v.home.y][v.home.x].bld; if(!b||!HOUSE_CAP[b.k]) v.home=null; }\n    if(v.home){ const key=v.home.x+','+v.home.y; occ[key]=(occ[key]||0)+1; }\n  }\n  for(const v of S.villagers){\n    if(v.home) continue;\n    let best=null,bd=1e9;\n    for(const b of S.blds){\n      if(!HOUSE_CAP[b.k]) continue;\n      const key=b.x+','+b.y, used=occ[key]||0;\n      if(used>=HOUSE_CAP[b.k]) continue;\n      const d=cheb(b.x,b.y,v.x,v.y);\n      if(d<bd){ bd=d; best={x:b.x,y:b.y}; }\n    }\n    if(best){ v.home=best; occ[best.x+','+best.y]=(occ[best.x+','+best.y]||0)+1; }\n  }\n}\nfunction assignJobs(){\n  const cnt={};\n  for(const v of S.villagers){\n    if(v.job){ const b=map[v.job.y][v.job.x].bld; if(!b||BUILD[b.k].role!=='prod') v.job=null; }\n    if(v.job) cnt[v.job.x+','+v.job.y]=(cnt[v.job.x+','+v.job.y]||0)+1;\n  }\n  for(const v of S.villagers){\n    if(v.job) continue;\n    let best=null,bd=1e9;\n    for(const b of S.blds){\n      const d=BUILD[b.k];\n      if(d.role!=='prod') continue;\n      const key=b.x+','+b.y;\n      if((cnt[key]||0)>=d.slots) continue;\n      const dist=cheb(b.x,b.y,v.x,v.y);\n      if(dist<bd){ bd=dist; best={x:b.x,y:b.y}; }\n    }\n    if(best){ v.job=best; v.working=false; cnt[best.x+','+best.y]=(cnt[best.x+','+best.y]||0)+1; }\n  }\n}\nfunction villagerTick(v,dt){\n  v.anim+=dt;\n  // Comida\n  v.eatT-=dt;\n  if(v.eatT<=0){\n    v.eatT=40;\n    if(takeFood(1)) v.hungry=0; else v.hungry++;\n    if(v.hungry>=3){ v.dead=true; msg(v.name+' foi embora por falta de comida.'); }\n  }\n  // Sem casa ha muito tempo vai embora\n  if(!v.home){ v.homeless+=dt; if(v.homeless>70){ v.dead=true; msg(v.name+' foi embora sem casa.'); } }\n  else v.homeless=0;\n  // Movimento\n  v.mt+=dt;\n  if(v.path.length&&v.mt>=0.28){\n    v.mt=0;\n    const [nx,ny]=v.path[0];\n    if(walk(nx,ny)&&!(OCC.has(nx+','+ny)&&!(S.player.x===nx&&S.player.y===ny&&false))){\n      OCC.delete(v.x+','+v.y); v.path.shift(); v.x=nx; v.y=ny; OCC.add(nx+','+ny);\n    } else v.path=[];\n  }\n  if(v.job){\n    const b=map[v.job.y][v.job.x].bld;\n    if(!b){ v.job=null; v.working=false; return; }\n    if(cheb(v.x,v.y,v.job.x,v.job.y)===1){ v.working=true; v.path=[]; }\n    else {\n      v.working=false;\n      v.pt-=dt;\n      if(!v.path.length&&v.pt<=0){\n        v.pt=2;\n        const jx=v.job.x, jy=v.job.y;\n        const p=bfs(v.x,v.y,(X,Y)=>cheb(X,Y,jx,jy)===1&&walk(X,Y),1500,v);\n        if(p) v.path=p;\n      }\n    }\n    return;\n  }\n  // Sem trabalho: volta para casa a noite, senao passeia\n  if(v.home&&S.night&&cheb(v.x,v.y,v.home.x,v.home.y)>1){\n    v.pt-=dt;\n    if(!v.path.length&&v.pt<=0){\n      v.pt=3;\n      const hx=v.home.x, hy=v.home.y;\n      const p=bfs(v.x,v.y,(X,Y)=>cheb(X,Y,hx,hy)===1&&walk(X,Y),1500,v);\n      if(p) v.path=p;\n    }\n    return;\n  }\n  v.wt-=dt;\n  if(v.wt<=0&&!v.path.length){\n    v.wt=4+Math.random()*4;\n    const cx0=v.home?v.home.x:v.x, cy0=v.home?v.home.y:v.y, rad=v.home?3:4;\n    const tx=cx0+Math.floor(Math.random()*(rad*2+1))-rad, ty=cy0+Math.floor(Math.random()*(rad*2+1))-rad;\n    if(walk(tx,ty)&&!OCC.has(tx+','+ty)){\n      const p=bfs(v.x,v.y,(X,Y)=>X===tx&&Y===ty,300,v);\n      if(p) v.path=p;\n    }\n  }\n}\n\n// =====================================================================\n// PRODUCAO E CIDADE\n// =====================================================================\nfunction productionTick(dt){\n  const work={};\n  for(const v of S.villagers) if(v.job&&v.working){ const k=v.job.x+','+v.job.y; work[k]=(work[k]||0)+1; }\n  for(const b of S.blds){\n    const d=BUILD[b.k]; if(!d||d.role!=='prod') continue;\n    const w=work[b.x+','+b.y]||0; if(!w) continue;\n    const cell=map[b.y][b.x].bld;\n    cell.p=(cell.p||0)+dt*w;\n    if(cell.p<d.t) continue;\n    if(!cityCap()){ S.stall='deposito'; continue; }\n    if(d.inp&&!canPayCity(d.inp)){ S.stall=d.inp; continue; }\n    cell.p=0;\n    if(d.inp) payCity(d.inp);\n    let outK=null;\n    if(d.outs){\n      let r=Math.random(), acc=0;\n      for(const [k,p] of d.outs){ acc+=p; if(r<acc){ outK=k; break; } }\n      if(!outK) outK=d.outs[0][0];\n      giveCity(outK,1);\n    } else {\n      for(const k in d.out){ giveCity(k,d.out[k]); outK=k; }\n    }\n    if(outK) fxText(b.x+0.5,b.y,'+1 '+ITEMS[outK],'#d8f0a0',false);\n  }\n}\nfunction altarHappy(){ return bcount('altar')*1; } // altar nivel 1 = +1\nfunction cityTick(dt){\n  // Felicidade\n  const food=foodTotal();\n  let target=50;\n  target+= food>=30?12:(food>=10?0:-15);\n  target+= homeFree()>=0&&homeCapTotal()>0?5:-5;\n  target+= bcount('muralha')>0?3:0;\n  target+= bcount('fogueira')>0?4:0;\n  target+= altarHappy();\n  target+= Math.min(10,cityLevel()*3);\n  const hungry=S.villagers.filter(v=>v.hungry>0).length;\n  target-= hungry*3;\n  target=Math.max(0,Math.min(100,target));\n  S.happyTarget=target;\n  S.happy+=(target-S.happy)*Math.min(1,dt*0.2);\n  // Imigracao\n  S.immT-=dt;\n  if(S.immT<=0){\n    S.immT=45;\n    if(S.happy>=55&&food>=25&&homeFree()>0) spawnVillager('Um viajante chegou e quer morar aqui.');\n  }\n  // Nivel da cidade\n  S.cityT-=dt;\n  if(S.cityT<=0){\n    S.cityT=3;\n    const lvl=cityLevel();\n    if(lvl!==S.lastLvl){ if(S.lastLvl!=null){ msg('A cidade agora é: '+LVL_NAME[lvl]+'.'); sfx('level'); } S.lastLvl=lvl; }\n  }\n}\nfunction nextLevelText(){\n  const L=cityLevel(), n=S.villagers.length, pref=bcount('prefeitura');\n  if(L===0) return 'Próximo: Vila (3 moradores).';\n  if(L===1) return 'Próximo: Povoado (8 moradores).';\n  if(L===2) return pref<1?'Próximo: Cidade (16 moradores e 1 prefeitura).':'Próximo: Cidade (16 moradores).';\n  if(L===3) return 'Próximo: Metrópole (30 moradores e 2 prefeituras). Faltam '+Math.max(0,30-n)+' moradores.';\n  return 'Nível máximo.';\n}\n\n// =====================================================================\n// EFEITOS\n// =====================================================================\nfunction msg(t){ if(/Faltam|Precisa|Não há|cheio|Ainda não|Não dá|Muito|Fora do|ocupado|Nada para|Não há/.test(t)) sfx('error'); else sfx('msg'); S.log.unshift(t); S.log=S.log.slice(0,30); S.toast={t,life:2.6}; }\n// ----- Sons (sintetizados com Web Audio, sem arquivos) -----\nlet AC=null;\nfunction audioCtx(){\n  try{\n    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();\n    if(AC.state==='suspended') AC.resume();\n    return AC;\n  }catch(e){ return null; }\n}\nfunction tone(f,dur,type,vol,slide,delay){\n  const c=audioCtx(); if(!c) return;\n  const t=c.currentTime+(delay||0);\n  const o=c.createOscillator(), g=c.createGain();\n  o.type=type||'square'; o.frequency.setValueAtTime(f,t);\n  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);\n  g.gain.setValueAtTime(vol||0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);\n  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);\n}\nfunction noise(dur,vol,delay){\n  const c=audioCtx(); if(!c) return;\n  const t=c.currentTime+(delay||0);\n  const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);\n  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);\n  const src=c.createBufferSource(), g=c.createGain();\n  src.buffer=buf; g.gain.setValueAtTime(vol||0.1,t);\n  src.connect(g); g.connect(c.destination); src.start(t);\n}\nlet SFX_ON=true;\nconst SFX={\n  click:()=>tone(880,0.04,'square',0.04),\n  craft:()=>{ tone(523,0.08,'triangle',0.12); tone(784,0.1,'triangle',0.12,null,0.08); tone(1046,0.16,'triangle',0.12,null,0.16); },\n  build:()=>{ noise(0.25,0.14); tone(160,0.2,'sawtooth',0.07,80); },\n  built:()=>{ tone(392,0.1,'triangle',0.15); tone(523,0.1,'triangle',0.15,null,0.1); tone(659,0.1,'triangle',0.15,null,0.2); tone(784,0.3,'triangle',0.15,null,0.3); },\n  upgrade:()=>{ tone(300,0.4,'sawtooth',0.07,900); tone(600,0.2,'triangle',0.1,null,0.3); },\n  eat:()=>{ for(let i=0;i<3;i++) noise(0.06,0.09,i*0.12); },\n  drink:()=>{ tone(600,0.15,'sine',0.12,300); tone(500,0.15,'sine',0.1,250,0.15); },\n  deposit:()=>{ tone(220,0.1,'square',0.07,110); noise(0.08,0.06,0.05); },\n  withdraw:()=>{ tone(330,0.1,'square',0.07,660); },\n  hit:()=>{ noise(0.08,0.15); tone(200,0.06,'square',0.06,100); },\n  breakNode:()=>{ noise(0.3,0.2); tone(120,0.25,'square',0.08,60); },\n  hurt:()=>{ tone(180,0.25,'sawtooth',0.12,60); },\n  die:()=>{ tone(300,0.6,'sawtooth',0.12,50); },\n  fish:()=>{ tone(700,0.15,'sine',0.1,1000); },\n  villager:()=>{ tone(440,0.12,'triangle',0.1); tone(554,0.15,'triangle',0.1,null,0.12); },\n  level:()=>{ [523,659,784,1046].forEach((f,i)=>tone(f,0.18,'triangle',0.13,null,i*0.12)); },\n  error:()=>{ tone(150,0.15,'square',0.08); },\n  msg:()=>{ tone(660,0.05,'sine',0.04); }\n};\nfunction sfx(n){ if(!OPTS.sound) return; const f=SFX[n]; if(f){ try{ f(); }catch(e){} } }\nfunction fxText(x,y,text,col,big){ S.texts.push({x,y,text,col,life:1,big:!!big}); }\nfunction fxPart(x,y,col,n,spread,g){\n  for(let i=0;i<n;i++){\n    const a=Math.random()*Math.PI*2, sp=(0.3+Math.random())*spread;\n    S.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.8,life:0.5+Math.random()*0.5,max:1,col,s:2+Math.random()*2.5,g:g||0.8});\n  }\n}\nfunction fxDmg(x,y,n,col){ fxText(x,y-0.3,'-'+n,col||'#ff6a5a',true); }\nfunction hurtPlayer(n){\n  const d=Math.max(1,n-armorVal());\n  S.hp-=d; S.flash=0.35; S.hitT=0.35; sfx('hurt');\n  fxText(S.player.x,S.player.y-0.3,'-'+d,'#ff4a3a',true);\n  fxPart(S.player.x+0.5,S.player.y+0.5,'#c03a2a',8,2,1);\n  if(S.hp<=0){ S.hp=0; die(); }\n}\n\n// =====================================================================\n// ACOES SOBRE ALVOS\n// =====================================================================\nfunction act(j){\n  const t=j.t, ref=j.ref;\n  if(t.kind==='node'){\n    const c=map[t.y][t.x]; if(!c.n){ S.job=null; return; }\n    const nd=NODES[c.n.k];\n    if(nd.pick&&pickTier()<nd.pick){ msg('Precisa de picareta mais forte para '+nd.n.toLowerCase()+'.'); S.job=null; return; }\n    let power=1+(nd.axe?axeTier():pickTier());\n    if(c.n.k==='arbusto'||c.n.k==='cacto'||c.n.k==='junco') power=2;\n    c.n.hp-=power; S.swing=0.3;\n    const col={arvore:'#8a5a2a',palmeira:'#8a5a2a',bambu:'#6aa84a',cacto:'#4a8a3a',junco:'#8aa050',arbusto:'#d03040',argila:'#a0704a',pedra:'#b0b6bc',carvao:'#333',gelo:'#bfe4f6',enxofre:'#e8d040',ferro:'#e8a060',ouro:'#ffd84a',cristal:'#c8a0ff'}[c.n.k]||'#aaa';\n    fxPart(t.x+0.5,t.y+0.5,col,6,1.5,1.2);\n    sfx('hit');\n    fxDmg(t.x+0.5,t.y+0.5,power,'#ffffff');\n    if(c.n.hp<=0){\n      sfx('breakNode');\n      const out={};\n      for(const k in nd.drop){ const [a,b]=nd.drop[k]; const q=a+Math.floor(Math.random()*(b-a+1)); if(q>0){ giveItem(k,q); out[k]=q; } }\n      for(const k in out) fxText(t.x+0.5,t.y+0.1,'+'+out[k]+' '+ITEMS[k],'#f0d28a',false);\n      fxPart(t.x+0.5,t.y+0.5,col,14,2.2,1);\n      if(nd.regrow) S.regrow.push({x:t.x,y:t.y,k:c.n.k,at:S.time+nd.regrow});\n      c.n=null; S.stats.nodes++; S.job=null;\n      msg(nd.n+' coletado.');\n    }\n    j.timer=0.4; return;\n  }\n  if(t.kind==='animal'){\n    const a=ref; if(!S.animals.includes(a)){ S.job=null; return; }\n    const wk=weaponKey(); const dmg=wk?WEAPON[wk]:2;\n    a.hp-=dmg; a.flee=3; a.hit=0.25; S.swing=0.3;\n    fxDmg(a.x+0.5,a.y+0.2,dmg,'#ffffff'); sfx('hit');\n    fxPart(a.x+0.5,a.y+0.5,'#c03a2a',6,1.5,1);\n    if(a.hp<=0){\n      const d=ANIMALS[a.k].drop;\n      for(const k in d){ const [x1,x2]=d[k]; const q=x1+Math.floor(Math.random()*(x2-x1+1)); if(q>0){ giveItem(k,q); fxText(a.x+0.5,a.y,'+'+q+' '+ITEMS[k],'#f0d28a',false); } }\n      S.animals=S.animals.filter(z=>z!==a); S.stats.animals++; S.job=null;\n      fxPart(a.x+0.5,a.y+0.5,'#c03a2a',12,2,1);\n      msg(ANIMALS[a.k].n+' abatido.');\n    }\n    j.timer=0.6; return;\n  }\n  if(t.kind==='mob'){\n    const m=ref; if(!S.mobs.includes(m)){ S.job=null; return; }\n    const wk=weaponKey(); const dmg=wk?WEAPON[wk]:2;\n    m.hp-=dmg; m.hit=0.25; S.swing=0.3;\n    fxDmg(m.x+0.5,m.y+0.2,dmg,'#ffffff'); sfx('hit');\n    fxPart(m.x+0.5,m.y+0.5,'#ffb0a0',6,1.5,1);\n    if(m.hp<=0){\n      const d=MOBS[m.k].drop;\n      for(const k in d){ const [x1,x2]=d[k]; const q=x1+Math.floor(Math.random()*(x2-x1+1)); if(q>0){ giveItem(k,q); fxText(m.x+0.5,m.y,'+'+q+' '+ITEMS[k],'#f0d28a',false); } }\n      S.mobs=S.mobs.filter(z=>z!==m); S.stats.kills++; S.job=null;\n      fxPart(m.x+0.5,m.y+0.5,'#8a2a2a',14,2.2,1);\n      msg(MOBS[m.k].n+' derrotado.');\n    }\n    j.timer=0.6; return;\n  }\n  if(t.kind==='water'){\n    if(have('vara')>0){\n      if(S.catchT>0) return;\n      const ok=Math.random()<0.55;\n      S.catchT=2.2;\n      if(ok){ giveItem('peixe',1); sfx('fish'); fxText(t.x+0.5,t.y,'+1 Peixe','#8fb0c8',false); msg('Você pescou um peixe.'); }\n      else msg('Nada mordeu a isca.');\n      fxPart(t.x+0.5,t.y+0.5,'#8fd0ff',6,1,0.5);\n      j.timer=2.2; S.job=j; // continua pescando ate parar\n      return;\n    }\n    drink(); S.job=null; return;\n  }\n}\n\n// =====================================================================\n// LOOP DE SIMULACAO\n// =====================================================================\nfunction near(x,y,r,k){\n  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){\n    const X=x+dx,Y=y+dy; if(inB(X,Y)&&map[Y][X].bld&&map[Y][X].bld.k===k) return true;\n  }\n  return false;\n}\nfunction update(dt){\n  if(!S||S.dead) return;\n  S.time+=dt;\n  S.t+=dt/DAY;\n  if(S.t>=1){ S.t-=1; S.day++; S.stats.days=S.day; msg('Dia '+S.day+'.'); }\n  const night=S.t>=0.6;\n  if(night!==S.night){\n    S.night=night;\n    if(night) msg('A noite cai. Cuidado com as criaturas.');\n    else { S.mobs=S.mobs.filter(m=>m.k==='golem'&&Math.random()<0.2); msg('Amanhece.'); }\n  }\n  S.dark+=((night?1:0)-S.dark)*Math.min(1,dt*1.5);\n\n  // Necessidades do jogador e efeitos do bioma\n  const bio=map[S.player.y][S.player.x].bio;\n  const nearCab=near(S.player.x,S.player.y,2,'cabana')||near(S.player.x,S.player.y,2,'casa')||near(S.player.x,S.player.y,2,'casa_pedra')||near(S.player.x,S.player.y,2,'sobrado');\n  S.fome=Math.max(0,S.fome-0.3*dt);\n  S.sede=Math.max(0,S.sede-(0.45+(bio==='deserto'?0.6:0))*dt);\n  S.energia=Math.max(0,S.energia-((night&&!nearCab)?0.25:0.1)*dt-(bio==='neve'?0.1*dt:0));\n  if(nearCab) S.energia=Math.min(100,S.energia+5*dt);\n  if(S.fome<=0||S.sede<=0) S.hp-=1.5*dt;\n  else if(S.fome>40&&S.sede>40&&S.hp<100) S.hp=Math.min(100,S.hp+0.8*dt);\n  if(bio==='neve'&&!have('armadura_couro')&&!have('armadura_ferro')) S.hp-=0.3*dt;\n  if(S.energia<=0) S.hp-=0.8*dt;\n  if(S.hp<=0){ S.hp=0; die(); return; }\n\n  // Ocupacao, listas e tabelas\n  rebuildOcc();\n  S.scanT-=dt; if(S.scanT<=0){ S.scanT=1; scanB(); assignHomes(); assignJobs(); }\n\n  // Spawns\n  if(night){ S.spawnT-=dt; if(S.spawnT<=0){ S.spawnT=2.5; if(S.mobs.length<(5+cityLevel()*3)*HOST_MULT) spawnMob(); } }\n  S.animalT-=dt; if(S.animalT<=0){ S.animalT=15; if(S.animals.length<46) spawnAnimal(false); }\n  for(let i=S.regrow.length-1;i>=0;i--){\n    const r=S.regrow[i];\n    if(S.time>=r.at){ const c=map[r.y][r.x]; if(!c.n&&!c.bld) c.n={k:r.k,hp:NODES[r.k].hp}; S.regrow.splice(i,1); }\n  }\n\n  // Animais\n  for(const a of S.animals){\n    a.hit=Math.max(0,a.hit-dt); a.mt+=dt;\n    if(a.flee>0){ a.flee-=dt; if(a.mt>=0.25){ a.mt=0; stepAway(a); } }\n    else if(a.mt>=1.8){\n      a.mt=0;\n      if(Math.random()<0.6){ const d=DIRS[Math.floor(Math.random()*4)]; const nx=a.x+d[0], ny=a.y+d[1]; if(walk(nx,ny)&&!occupiedAt(nx,ny)&&map[ny][nx].bio!=='montanha'){ OCC.delete(a.x+','+a.y); a.x=nx; a.y=ny; OCC.add(nx+','+ny); } }\n    }\n  }\n\n  // Inimigos\n  for(const m of S.mobs){\n    const md=MOBS[m.k];\n    m.cd=Math.max(0,m.cd-dt); m.hit=Math.max(0,m.hit-dt); m.mt+=dt;\n    const dd=cheb(m.x,m.y,S.player.x,S.player.y);\n    if(m.mt>=md.spd){\n      m.mt=0;\n      if(dd<=9) stepToward(m,S.player.x,S.player.y);\n      else if(Math.random()<0.4){ const d=DIRS[Math.floor(Math.random()*4)]; if(walk(m.x+d[0],m.y+d[1])&&!occupiedAt(m.x+d[0],m.y+d[1])){ m.x+=d[0]; m.y+=d[1]; } }\n    }\n    if(m.cd<=0&&dd===1){\n      const prot=near(S.player.x,S.player.y,2,'cabana')||near(S.player.x,S.player.y,1,'fogueira');\n      hurtPlayer(Math.ceil(md.dmg*(prot?0.5:1)));\n      m.cd=1.1;\n    } else if(m.cd<=0){\n      // Ataca um morador vizinho\n      const v=S.villagers.find(z=>cheb(z.x,z.y,m.x,m.y)===1);\n      if(v&&Math.random()<0.5){ v.dead=true; m.cd=1.4; msg(v.name+' foi atacado por '+md.n+' e não sobreviveu.'); fxPart(v.x+0.5,v.y+0.5,'#8a2a2a',10,2,1); }\n    }\n  }\n  S.villagers=S.villagers.filter(v=>!v.dead);\n  S.mobs=S.mobs.filter(m=>m.hp>0);\n\n  // Moradores\n  for(const v of S.villagers) villagerTick(v,dt);\n\n  // Torres\n  S.towerT-=dt;\n  if(S.towerT<=0){\n    S.towerT=1.2;\n    for(const b of S.blds){\n      if(b.k!=='torre') continue;\n      let best=null,bd=99;\n      for(const m of S.mobs){ const d=cheb(m.x,m.y,b.x,b.y); if(d<=3&&d<bd){bd=d;best=m;} }\n      if(best){\n        best.hp-=6; best.hit=0.25; fxDmg(best.x+0.5,best.y+0.2,6,'#ffd0a0');\n        fxPart(best.x+0.5,best.y+0.5,'#ffe070',5,1.5,0.5);\n        if(best.hp<=0){ S.mobs=S.mobs.filter(z=>z!==best); S.stats.kills++; msg(MOBS[best.k].n+' destruído pela torre.'); }\n      }\n    }\n  }\n\n  productionTick(dt);\n  cityTick(dt);\n\n  // Jogador: caminho e tarefa\n  if(S.path.length){\n    S.moveT+=dt;\n    const thr=(bio==='pantano')?0.22:0.13;\n    if(S.moveT>=thr){\n      S.moveT=0;\n      const [nx,ny]=S.path[0];\n      if(walk(nx,ny)&&!occupiedAt(nx,ny)){ S.path.shift(); S.player.x=nx; S.player.y=ny; }\n      else S.path=[];\n    }\n  }\n  if(S.job){\n    const j=S.job, t=j.t;\n    let valid=true;\n    if(t.kind==='node') valid=!!map[t.y][t.x].n;\n    else if(t.kind==='animal'){ valid=S.animals.includes(t.ref); if(valid){t.x=t.ref.x;t.y=t.ref.y;} }\n    else if(t.kind==='mob'){ valid=S.mobs.includes(t.ref); if(valid){t.x=t.ref.x;t.y=t.ref.y;} }\n    if(!valid){ S.job=null; S.path=[]; }\n    else if(cheb(S.player.x,S.player.y,t.x,t.y)===1){\n      S.path=[];\n      if(t.kind==='water'){\n        S.catchT=Math.max(0,S.catchT-dt);\n        if(S.catchT<=0 && have('vara')>0){ act(j); }\n        else if(have('vara')<=0){ act(j); }\n      } else {\n        j.timer-=dt;\n        if(j.timer<=0) act(j);\n      }\n    } else if(!S.path.length){\n      const goal=(X,Y)=>cheb(X,Y,t.x,t.y)===1&&walk(X,Y);\n      const p=bfs(S.player.x,S.player.y,goal,8000,S.player);\n      if(p) S.path=p; else { msg('Caminho bloqueado.'); S.job=null; }\n    }\n  }\n  S.catchT=Math.max(0,S.catchT-dt);\n\n  // Visual\n  S.swing=Math.max(0,S.swing-dt);\n  S.flash=Math.max(0,S.flash-dt);\n  S.hitT=Math.max(0,S.hitT-dt);\n  S.eatFlash=Math.max(0,S.eatFlash-dt);\n  S.anim+=dt*(S.path.length?9:2);\n  for(const p of S.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt*2; p.life-=dt; }\n  S.parts=S.parts.filter(p=>p.life>0);\n  for(const t of S.texts) t.life-=dt*0.9;\n  S.texts=S.texts.filter(t=>t.life>0);\n  if(S.toast){ S.toast.life-=dt; if(S.toast.life<=0) S.toast=null; }\n}\nfunction stepToward(m,tx,ty){\n  let best=null,bd=cheb(m.x,m.y,tx,ty);\n  for(const [dx,dy] of DIRS){\n    const nx=m.x+dx, ny=m.y+dy;\n    if(!walk(nx,ny)||occupiedAt(nx,ny)) continue;\n    const d=cheb(nx,ny,tx,ty);\n    if(d<bd){ bd=d; best=[nx,ny]; }\n  }\n  if(best){ m.x=best[0]; m.y=best[1]; }\n}\nfunction stepAway(a){\n  let best=null,bd=cheb(a.x,a.y,S.player.x,S.player.y);\n  for(const [dx,dy] of DIRS){\n    const nx=a.x+dx, ny=a.y+dy;\n    if(!walk(nx,ny)||occupiedAt(nx,ny)||map[ny][nx].bio==='montanha') continue;\n    const d=cheb(nx,ny,S.player.x,S.player.y);\n    if(d>bd){ bd=d; best=[nx,ny]; }\n  }\n  if(best){ a.x=best[0]; a.y=best[1]; }\n}\nfunction die(){ sfx('die'); S.dead=true; openPopup('morte'); }\nfunction _unused(){}\n\n// =====================================================================\n// DESENHO\n// =====================================================================\n// ----- Opcoes, dicas, botao de beber e menu inicial -----\nlet mouse={x:0,y:0};\nlet OPTS={hud:1,tips:true,sound:true};\ntry{ Object.assign(OPTS,JSON.parse(localStorage.getItem('atlas_opts')||'{}')); }catch(e){}\nfunction applyOpts(){\n  for(const id of ['bars','clock','hotbar','toast']) document.getElementById(id).style.zoom=OPTS.hud;\n  localStorage.setItem('atlas_opts',JSON.stringify(OPTS));\n}\nfunction positionDrink(){\n  const el=document.getElementById('drinkbtn');\n  if(!S||S.popup||S.paused||S.dead){ el.style.display='none'; return; }\n  let f=null;\n  for(let dy=-1;dy<=1&&!f;dy++) for(let dx=-1;dx<=1&&!f;dx++){\n    const X=S.player.x+dx, Y=S.player.y+dy; if(!inB(X,Y)) continue;\n    const c=map[Y][X];\n    if(c.bio==='agua'||(c.bld&&c.bld.k==='poco')) f={x:X,y:Y};\n  }\n  if(!f){ el.style.display='none'; return; }\n  const sx=f.x*TS-camX+TS/2, sy=f.y*TS-camY;\n  el.style.display='block';\n  el.style.left=(sx-el.offsetWidth/2)+'px'; el.style.top=(sy-44)+'px';\n}\nfunction updateTip(){\n  const el=document.getElementById('tip');\n  if(!S||!hoverT||!OPTS.tips||S.popup||S.paused||S.dead){ el.style.display='none'; return; }\n  const x=hoverT.x, y=hoverT.y;\n  const bar=(lbl,val,max,col)=>{\n    const p=Math.max(0,Math.min(100,val/max*100));\n    return `<div style=\"display:flex;gap:6px;align-items:center;margin-top:3px\"><span style=\"width:40px\">${lbl}<\/span><div style=\"flex:1;height:7px;background:#120c06;border-radius:3px;overflow:hidden\"><i style=\"display:block;height:100%;width:${p}%;background:${col}\"><\/i><\/div><\/div>`;\n  };\n  const m=S.mobs.find(q=>q.x===x&&q.y===y);\n  const a=S.animals.find(q=>q.x===x&&q.y===y);\n  const v=S.villagers.find(q=>q.x===x&&q.y===y);\n  let html=null;\n  if(m) html=`<b>${MOBS[m.k].n}<\/b>`+bar('Vida',m.hp,MOBS[m.k].hp,'#c04a3a');\n  else if(a) html=`<b>${ANIMALS[a.k].n}<\/b>`+bar('Vida',a.hp,ANIMALS[a.k].hp,'#c04a3a');\n  else if(v) html=`<b>${v.name}<\/b> <span style=\"opacity:.7\">morador<\/span>`+bar('Fome',Math.max(0,100-v.hungry*33),100,'#c8a040');\n  if(!html){ el.style.display='none'; return; }\n  el.innerHTML=html; el.style.display='block';\n  el.style.left=(mouse.x+16)+'px'; el.style.top=(mouse.y+16)+'px';\n}\nfunction showMenu(){\n  document.getElementById('mainmenu').style.display='flex';\n  document.getElementById('create').style.display='none';\n  document.getElementById('wcreate').style.display='none';\n  S=null;\n}\nfunction renderMenuOpts(){\n  document.getElementById('optsbox').innerHTML=\n    `<div class=\"lab2\">Tamanho do HUD<\/div>`+[0.9,1,1.2].map(v=>`<span class=\"sw2 ${OPTS.hud===v?'on':''}\" data-sc=\"${v}\">${Math.round(v*100)}%<\/span>`).join('')+\n    `<div class=\"lab2\">Dicas ao passar o mouse<\/div><span class=\"sw2 ${OPTS.tips?'on':''}\" data-tip=\"1\">Ligadas<\/span><span class=\"sw2 ${!OPTS.tips?'on':''}\" data-tip=\"0\">Desligadas<\/span>`+\n    `<div class=\"lab2\">Sons<\/div><span class=\"sw2 ${OPTS.sound?'on':''}\" data-snd=\"1\">Ligados<\/span><span class=\"sw2 ${!OPTS.sound?'on':''}\" data-snd=\"0\">Desligados<\/span>`;\n}\nfunction menuAct(a){\n  if(a==='novo'){ document.getElementById('mainmenu').style.display='none'; showCreate(); }\n  else if(a==='carregar'){\n    if(!localStorage.getItem('atlas_mundo_save')){ alert('Nenhum jogo salvo ainda.'); return; }\n    document.getElementById('mainmenu').style.display='none'; loadGame();\n  }\n  else if(a==='opcoes'){ const b=document.getElementById('optsbox'); b.style.display=b.style.display==='block'?'none':'block'; renderMenuOpts(); }\n  else if(a==='sair'){ alert('Feche a aba do navegador para sair.'); }\n}\ndocument.getElementById('mainmenu').addEventListener('click',e=>{\n  const b=e.target.closest('[data-m]'); if(b){ menuAct(b.dataset.m); return; }\n  const o=e.target.closest('[data-sc],[data-tip],[data-snd]');\n  if(o){\n    if(o.dataset.sc) OPTS.hud=+o.dataset.sc;\n    if(o.dataset.tip) OPTS.tips=o.dataset.tip==='1';\n    if(o.dataset.snd) OPTS.sound=o.dataset.snd==='1';\n    applyOpts(); renderMenuOpts();\n  }\n});\ndocument.getElementById('drinkbtn').onclick=()=>{ drink(); };\ndocument.getElementById('wback').onclick=()=>showMenu();\ndocument.getElementById('cback').onclick=()=>showCreate();\nfunction resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }\nfunction hpBar(sx,sy,hp,max){\n  const f=Math.max(0,hp/max);\n  cx.fillStyle='#000'; cx.fillRect(sx+2,sy-2,TS-4,4);\n  cx.fillStyle=f>0.5?'#5fbf4a':f>0.25?'#e0b84a':'#d24a3a'; cx.fillRect(sx+2,sy-2,(TS-4)*f,4);\n}\nfunction drawBiomeTile(c,bio,sx,sy,h,tm,x,y){\n  if(bio==='agua'){\n    cx.fillStyle='#2f6fb0'; cx.fillRect(sx,sy,TS,TS);\n    cx.fillStyle='rgba(180,220,255,.22)';\n    cx.fillRect(sx+4+Math.sin(tm*2+x)*2,sy+10,12,2); cx.fillRect(sx+18+Math.cos(tm*2+y)*2,sy+26,9,2);\n  } else if(bio==='praia'){\n    cx.fillStyle='#d8c08a'; cx.fillRect(sx,sy,TS,TS); cx.fillStyle='rgba(120,90,40,.2)'; cx.fillRect(sx+(h%28),sy+(h%19)+6,2,2);\n  } else if(bio==='deserto'){\n    cx.fillStyle='#d9b460'; cx.fillRect(sx,sy,TS,TS); cx.fillStyle='rgba(160,110,40,.25)'; cx.fillRect(sx+4,sy+(h%30),TS-8,2);\n  } else if(bio==='neve'){\n    cx.fillStyle='#eef4fa'; cx.fillRect(sx,sy,TS,TS); cx.fillStyle='rgba(120,150,190,.2)'; cx.fillRect(sx+(h%30),sy+(h%25)+4,3,2);\n  } else if(bio==='montanha'){\n    cx.fillStyle=(h%3===0)?'#7a7f88':'#72777f'; cx.fillRect(sx,sy,TS,TS); cx.fillStyle='rgba(0,0,0,.15)'; cx.fillRect(sx+(h%26),sy+(h%20)+8,6,3);\n  } else if(bio==='pantano'){\n    cx.fillStyle='#5a6a3a'; cx.fillRect(sx,sy,TS,TS); cx.fillStyle='rgba(60,110,140,.35)'; cx.fillRect(sx+(h%22)+4,sy+(h%17)+8,10,4);\n  } else if(bio==='selva'){\n    cx.fillStyle=(h%2)?'#2f8a4a':'#2a8044'; cx.fillRect(sx,sy,TS,TS); cx.fillStyle='rgba(20,80,30,.35)'; cx.fillRect(sx+(h%24)+4,sy+(h%19)+6,3,5);\n  } else if(bio==='floresta'){\n    cx.fillStyle=(h%2)?'#3f7a34':'#3a7430'; cx.fillRect(sx,sy,TS,TS); cx.fillStyle='rgba(20,50,20,.3)'; cx.fillRect(sx+(h%24)+4,sy+(h%19)+6,3,4);\n  } else {\n    cx.fillStyle=(h%3===0)?'#6f9a3e':((h%3===1)?'#73a041':'#6a9438'); cx.fillRect(sx,sy,TS,TS);\n    if(h%5===0){ cx.fillStyle='rgba(30,60,20,.3)'; cx.fillRect(sx+(h%22)+4,sy+(h%17)+6,2,4); }\n  }\n}\nfunction drawWorld(){\n  const W=cv.width, H=cv.height;\n  camX=Math.round(S.vx*TS+TS/2-W/2); camY=Math.round(S.vy*TS+TS/2-H/2);\n  const x0=Math.max(0,Math.floor(camX/TS)-1), y0=Math.max(0,Math.floor(camY/TS)-1);\n  const x1=Math.min(MW-1,Math.ceil((camX+W)/TS)+1), y1=Math.min(MH-1,Math.ceil((camY+H)/TS)+1);\n  cx.fillStyle='#000'; cx.fillRect(0,0,W,H);\n  const tm=S.time;\n  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){\n    const c=map[y][x], sx=x*TS-camX, sy=y*TS-camY, h=((x*73856093)^(y*19349663))&255;\n    drawBiomeTile(c,c.bio,sx,sy,h,tm,x,y);\n    if(c.n) drawIco(cx,c.n.k,sx+3,sy+3,TS-6);\n    if(c.bld){\n      cx.fillStyle='rgba(0,0,0,.25)'; cx.fillRect(sx+2,sy+TS-4,TS-4,3);\n      drawIco(cx,c.bld.k,sx+2,sy+2,TS-4);\n    }\n  }\n  // Caminho\n  cx.fillStyle='rgba(255,230,120,.7)';\n  for(const [x,y] of S.path) cx.fillRect(x*TS-camX+TS/2-2,y*TS-camY+TS/2-2,4,4);\n  // Animais\n  for(const a of S.animals){\n    if(a.x<x0||a.x>x1||a.y<y0||a.y>y1) continue;\n    const sx=a.x*TS-camX, sy=a.y*TS-camY;\n    drawIco(cx,a.k,sx+3,sy+3,TS-6);\n    if(a.hit>0) hpBar(sx,sy,a.hp,ANIMALS[a.k].hp);\n  }\n  // Moradores\n  for(const v of S.villagers){\n    if(v.x<x0||v.x>x1||v.y<y0||v.y>y1) continue;\n    const sx=v.x*TS-camX, sy=v.y*TS-camY;\n    drawPlayer(cx,sx-2,sy-6,TS*0.9,{skin:v.skin,hair:v.hair,shirt:v.shirt},v.anim,null,0);\n  }\n  // Inimigos\n  for(const m of S.mobs){\n    if(m.x<x0||m.x>x1||m.y<y0||m.y>y1) continue;\n    const sx=m.x*TS-camX, sy=m.y*TS-camY;\n    if(m.hit>0){ cx.fillStyle='rgba(255,60,40,.35)'; cx.fillRect(sx,sy,TS,TS); }\n    drawIco(cx,m.k,sx+2,sy+2,TS-4);\n    if(m.hit>0) hpBar(sx,sy,m.hp,MOBS[m.k].hp);\n  }\n  // Brilho de fogueiras e fornos\n  for(const b of S.blds){\n    if(b.x<x0||b.x>x1||b.y<y0||b.y>y1) continue;\n    if(b.k==='fogueira'||b.k==='forno'||b.k==='forja'||b.k==='torre'){\n      const sx=b.x*TS-camX+TS/2, sy=b.y*TS-camY+TS/2;\n      const g=cx.createRadialGradient(sx,sy,2,sx,sy,S.dark*80+14);\n      g.addColorStop(0,'rgba(255,170,80,'+(0.35*S.dark+0.05)+')'); g.addColorStop(1,'rgba(255,170,80,0)');\n      cx.fillStyle=g; cx.fillRect(sx-100,sy-100,200,200);\n    }\n  }\n  // Ghost de construcao e hover\n  if(S.selBuild&&hoverT&&inB(hoverT.x,hoverT.y)){\n    const err=validSpot(S.selBuild,hoverT.x,hoverT.y);\n    const sx=hoverT.x*TS-camX, sy=hoverT.y*TS-camY;\n    cx.globalAlpha=0.55; drawIco(cx,S.selBuild,sx+2,sy+2,TS-4); cx.globalAlpha=1;\n    cx.strokeStyle=err?'#ff6b6b':'#8bff8b'; cx.lineWidth=2; cx.strokeRect(sx+1,sy+1,TS-2,TS-2);\n  } else if(hoverT&&inB(hoverT.x,hoverT.y)&&!S.popup){\n    const sx=hoverT.x*TS-camX, sy=hoverT.y*TS-camY;\n    cx.strokeStyle='rgba(255,240,180,.7)'; cx.lineWidth=1.5; cx.strokeRect(sx+1,sy+1,TS-2,TS-2);\n  }\n  // Jogador\n  const px=S.vx*TS-camX, py=S.vy*TS-camY;\n  drawPlayer(cx,px-4,py-8+(S.hitT>0?Math.sin(S.hitT*40)*2:0),TS+8,{skin:SKINS[S.look.skin],hair:HAIRS[S.look.hair],shirt:SHIRTS[S.look.shirt]},S.anim,weaponKey(),S.swing);\n  // Particulas\n  for(const p of S.parts){\n    cx.globalAlpha=Math.max(0,p.life/p.max); cx.fillStyle=p.col;\n    cx.fillRect(p.x*TS-camX-p.s/2,p.y*TS-camY-p.s/2,p.s,p.s);\n  }\n  cx.globalAlpha=1;\n  // Textos\n  cx.textAlign='center'; cx.textBaseline='middle';\n  for(const t of S.texts){\n    const sx=t.x*TS-camX+TS/2, sy=t.y*TS-camY-(1-t.life)*26;\n    cx.font=(t.big?'bold 14px ':'12px ')+'Georgia,serif';\n    cx.globalAlpha=Math.min(1,t.life*1.5);\n    cx.strokeStyle='#000'; cx.lineWidth=3; cx.strokeText(t.text,sx,sy);\n    cx.fillStyle=t.col; cx.fillText(t.text,sx,sy);\n  }\n  cx.globalAlpha=1; cx.textAlign='start'; cx.textBaseline='alphabetic';\n  // Noite\n  if(S.dark>0.01){ cx.fillStyle='rgba(6,6,30,'+(0.55*S.dark)+')'; cx.fillRect(0,0,W,H); }\n  document.getElementById('flash').style.background='rgba(190,0,0,'+(Math.max(0,S.flash)*0.6)+')';\n}\nfunction mapXY(clientX,clientY){ return {x:Math.floor((clientX+camX)/TS), y:Math.floor((clientY+camY)/TS)}; }\n\n// =====================================================================\n// HUD E POPUPS\n// =====================================================================\nfunction renderHud(){\n  const bars=[['vida',S.hp,'#c04a3a'],['carne',S.fome,'#c8a040'],['beber',S.sede,'#3a8ac0'],['energia',S.energia,'#d4c040']];\n  document.getElementById('bars').innerHTML=bars.map(([ic,v,col])=>\n    `<div class=\"bar\">${iconImg(ic,18)}<div class=\"track\"><i style=\"width:${Math.max(0,Math.min(100,v))}%;background:${col}\"><\/i><\/div><\/div>`).join('');\n  const L=cityLevel();\n  document.getElementById('clock').innerHTML=\n    `<div>${iconImg(S.night?'lua':'sol',16)} Dia ${S.day}<\/div><div class=\"sub\">${LVL_NAME[L]} · ${S.villagers.length} moradores<\/div>`;\n  const tEl=document.getElementById('toast');\n  if(S.toast){ tEl.textContent=S.toast.t; tEl.style.opacity=Math.min(1,S.toast.life); }\n  else tEl.style.opacity=0;\n}\nfunction buildHotbar(){\n  const slots=[['criar','Criar','C'],['construir','Construir','B'],['inv','Inventário','I'],['cidade','Cidade','G'],['status','Status','T']];\n  document.getElementById('hotbar').innerHTML=slots.map(([ic,l,k])=>\n    `<div class=\"slot\" data-act=\"${ic}\">${iconImg(ic,26)}<span>${l}<\/span><kbd>${k}<\/kbd><\/div>`).join('');\n}\nfunction openPopup(name){ S.popup=name; renderPopup(); }\nfunction closePopup(){ if(S.popup==='morte') return; S.popup=null; S.selBld=null; document.getElementById('pop').style.display='none'; }\nfunction togglePopup(n){ if(S.popup===n) closePopup(); else { S.popup=n; renderPopup(); } }\nfunction renderPopup(){\n  const pop=document.getElementById('pop'), body=document.getElementById('popbody');\n  if(!S||!S.popup){ pop.style.display='none'; return; }\n  pop.style.display='flex';\n  const p=S.popup, title=document.getElementById('poptitle');\n  if(p==='criar'){\n    title.textContent='Criar';\n    let h='', cat='';\n    for(const r of RECIPES){\n      if(!isRecipeUnlocked(r)) continue;\n      if(r.cat!==cat){ cat=r.cat; h+=`<div class=\"cat\">${cat}<\/div>`; }\n      const stOk=stationNear(r.st);\n      const can=canPay(r.cost)&&stOk;\n      const costs=Object.entries(r.cost).map(([k,v])=>`<span class=\"chip ${have(k)>=v?'ok':'no'}\">${v} ${ITEMS[k]}<\/span>`).join('');\n      const st=r.st?`<span class=\"chip ${stOk?'ok':'no'}\">${STATION_NAME[r.st]}<\/span>`:'';\n      h+=`<div class=\"rc\">${iconImg(r.o,32)}<div class=\"nm\"><b>${r.n}<\/b><div>${costs}${st}<\/div><\/div><button class=\"btn\" data-craft=\"${r.o}\" ${can?'':'disabled'}>Criar<\/button><\/div>`;\n    }\n    body.innerHTML=h;\n  } else if(p==='construir'){\n    title.textContent='Construir';\n    const roles=[['house','Moradia'],['prod','Produção'],['station','Mesas'],['store','Armazenamento'],['def','Defesa'],['util','Utilidades']];\n    let h='';\n    for(const [rk,rn] of er()&&have(k)>0)]:'nenhuma'}<\/div>`;\n    body.innerHTML=h;\n  } else if(p==='cidade'){\n    title.textContent='Cidade · '+LVL_NAME[cityLevel()];\n    const free=homeFree(), capT=homeCapTotal();\n    const food=foodTotal();\n    let h=`<div class=\"kv\"><span>Moradores<\/span><b>${S.villagers.length} / ${capT} de capacidade<\/b><\/div>`;\n    h+=`<div class=\"kv\"><span>Felicidade<\/span><b>${Math.round(S.happy)}<\/b><\/div><div class=\"ibar\"><i style=\"width:${Math.round(S.happy)}%;background:#d4a84a\"><\/i><\/div>`;\n    h+=`<div class=\"kv\"><span>Comida em estoque<\/span><b>${food}<\/b><\/div>`;\n    h+=`<div class=\"note\">${nextLevelText()}<\/div>`;\n    h+=`<div style=\"margin:8px 0\"><button class=\"btn\" data-call=\"1\" ${(free>0&&food>=8)?'':'disabled'}>Chamar morador (8 comida)<\/button> <span class=\"note\">${free>0?free+' casa(s) livre(s)':'Sem casa livre'}<\/span><\/div>`;\n    h+=`<div class=\"cat\">Empregos<\/div>`;\n    const prods=S.blds.filter(b=>BUILD[b.k].role==='prod');\n    if(!prods.length) h+='<div class=\"note\">Nenhum prédio de produção ainda.<\/div>';\n    for(const b of prods){\n      const d=BUILD[b.k];\n      const w=S.villagers.filter(v=>v.job&&v.job.x===b.x&&v.job.y===b.y).length;\n      const outs=d.outs?d.outs.map(([k])=>ITEMS[k]).join(', '):Object.keys(d.out).map(k=>ITEMS[k]).join(', ');\n      h+=`<div class=\"kv\"><span>${d.n}<\/span><b>${w} / ${d.slots}<\/b><\/div><div class=\"note\">Produz: ${outs}${d.inp?' · precisa de '+Object.keys(d.inp).map(k=>ITEMS[k]).join(', '):''}<\/div>`;\n    }\n    h+=`<div class=\"cat\">Moradores<\/div>`;\n    if(!S.villagers.length) h+='<div class=\"note\">Ninguém ainda. Construa uma cabana e chame alguém.<\/div>';\n    else h+='<div class=\"note\">'+S.villagers.map(v=>v.name+(v.job?'':' (sem trabalho)')+(v.hungry>0?' (com fome)':'')).join(' · ')+'<\/div>';\n    h+=`<div class=\"cat\">Mesas liberadas<\/div><div class=\"note\">${Object.keys(BUILD).filter(k=>BUILD[k].role==='station').map(k=>(BUILD[k].lvl<=cityLevel()?'':'[bloq] ')+BUILD[k].n).join(' · ')}<\/div>`;\n    body.innerHTML=h;\n  } else if(p==='predio'){\n    const pos=S.selBld; const b=pos?map[pos.y][pos.x].bld:null;\n    if(!b){ closePopup(); return; }\n    const d=BUILD[b.k];\n    const isHouse=!!HOUSE_CAP[b.k];\n    title.textContent=d?d.n:(b.k==='cabana'?'Cabana':b.k);\n    let h=`<div class=\"note\">${d?d.desc:''}<\/div>`;\n    if(PHOUSE[b.k]) h+=`<div class=\"kv\" style=\"margin-top:6px\"><span>Dono<\/span><b>Jogador<\/b><\/div>`;\n    if(HOUSE_CAP[b.k]){\n      const occ=S.villagers.filter(v=>v.home&&v.home.x===pos.x&&v.home.y===pos.y).length;\n      h+=`<div class=\"kv\" style=\"margin-top:6px\"><span>Dono<\/span><b>Moradores<\/b><\/div><div class=\"kv\"><span>Moradores<\/span><b>${occ} / ${HOUSE_CAP[b.k]}<\/b><\/div>`;\n    }\n    const up=HOUSE_UP[b.k];\n    if(up){\n        const costs=Object.entries(up.cost).map(([k,v])=>`<span class=\"chip ${have(k)>=v?'ok':'no'}\">${v} ${ITEMS[k]}<\/span>`).join('');\n        h+=`<div class=\"cat\">Melhorar<\/div><div>${costs}<\/div><button class=\"btn\" data-up=\"1\" ${canPay(up.cost)?'':'disabled'}>Melhorar para ${up.n}<\/button>`;\n      }\n    if(d&&d.role==='prod'){\n      const w=S.villagers.filter(v=>v.job&&v.job.x===pos.x&&v.job.y===pos.y).length;\n      h+=`<div class=\"kv\" style=\"margin-top:6px\"><span>Trabalhadores<\/span><b>${w} / ${d.slots}<\/b><\/div>`;\n      h+=`<div class=\"note\">Moradores escolhem o trabalho sozinhos, perto de casa.<\/div>`;\n    }\n    h+=`<div style=\"margin-top:10px\"><button class=\"btn warn\" data-dem=\"1\">Demolir (devolve metade)<\/button><\/div>`;\n    body.innerHTML=h;\n  } else if(p==='deposito'){\n    title.textContent='Depósito';\n    const pos=S.selBld, b=pos?map[pos.y][pos.x].bld:null;\n    if(!b||!DEPO_CAP[b.k]){ closePopup(); return; }\n    const capNow=cityCap();\n    let h=`<div class=\"kv\"><span>Capacidade por item<\/span><b>${capNow}<\/b><\/div>`;\n    const up=DEPO_UP[b.k];\n    if(up) h+=`<div class=\"note\">Melhorar para ${up.n}: ${Object.entries(up.cost).map(([k,v])=>v+' '+ITEMS[k]).join(', ')}<\/div><button class=\"btn\" data-depup=\"1\" ${canPay(up.cost)?'':'disabled'}>Melhorar<\/button>`;\n    h+=`<div class=\"cat\">Seu inventário (clique para guardar)<\/div><div class=\"grid\">`;\n    const mine=Object.keys(ITEMS).filter(k=>have(k)>0);\n    if(!mine.length) h+='<div class=\"note\">Nada com você.<\/div>';\n    for(const k of mine) h+=`<div class=\"card\" data-dep=\"${k}\">${iconImg(k,36)}<div>${ITEMS[k]}<\/div><small>${have(k)}<\/small><\/div>`;\n    h+=`<\/div><div class=\"cat\">Estoque da cidade (clique para pegar)<\/div><div class=\"grid\">`;\n    const stock=Object.keys(ITEMS).filter(k=>haveCity(k)>0);\n    if(!stock.length) h+='<div class=\"note\">Vazio.<\/div>';\n    for(const k of stock) h+=`<div class=\"card\" data-undep=\"${k}\">${iconImg(k,36)}<div>${ITEMS[k]}<\/div><small>${haveCity(k)} / ${capNow}<\/small><\/div>`;\n    body.innerHTML=h+'<\/div>';\n  } else if(p==='status'){\n    title.textContent='Status';\n    body.innerHTML=`<div class=\"grid\" style=\"grid-template-columns:repeat(3,1fr)\">\n      <div class=\"card\" style=\"cursor:default\"><b>${S.day}<\/b><small>Dias<\/small><\/div>\n      <div class=\"card\" style=\"cursor:default\"><b>${S.stats.kills}<\/b><small>Inimigos<\/small><\/div>\n      <div class=\"card\" style=\"cursor:default\"><b>${S.stats.animals}<\/b><small>Animais<\/small><\/div>\n      <div class=\"card\" style=\"cursor:default\"><b>${S.stats.built}<\/b><small>Construções<\/small><\/div>\n      <div class=\"card\" style=\"cursor:default\"><b>${S.stats.crafted}<\/b><small>Itens criados<\/small><\/div>\n      <div class=\"card\" style=\"cursor:default\"><b>${LVL_NAME[cityLevel()]}<\/b><small>Cidade<\/small><\/div><\/div>\n      <div class=\"cat\">Controles<\/div>\n      <div class=\"note\">Clique esquerdo: atacar, coletar, interagir, abrir prédio. Clique direito: andar. Na água com vara: pescar. Teclas: C criar, B .vy=S.player.y;\n  buildHotbar(); renderPause(); msg('Jogo carregado.');\n}\nfunction pauseAct(a){\n  if(a==='cont') togglePause();\n  else if(a==='save'){ saveGame(); }\n  else if(a==='load'){ loadGame(); }\n  else if(a==='menu'){ document.getElementById('pausem').style.display='none'; showMenu(); }\n}\ndocument.getElementById('pausem').addEventListener('click',e=>{\n  const b=e.target.closest('[data-pa]'); if(b) pauseAct(b.dataset.pa);\n});\ndocument.getElementById('gobtn').onclick=()=>{\n  CR.name=(document.getElementById('cname').value||'Sobrevivente').trim().slice(0,16)||'Sobrevivente';\n  newGame();\n};\nfunction newGame(){\n  document.getElementById('create').style.display='none';\n  document.getElementById('wcreate').style.display='none';\n  MW=MH=WCFG.size; WATER_T=0.22+WCFG.water*0.08; RES_MULT=[0.5,1,2][WCFG.res]; HOST_MULT=[0.5,1,2][WCFG.host];\n  WSEED=WCFG.seed.trim()!==''?seedNum(WCFG.seed.trim()):Math.floor(Math.random()*1000000);\n  const cxp=MW/2, cyp=MH/2;\n  S={\n    name:CR.name, look:{skin:CR.skin,hair:CR.hair,shirt:CR.shirt},\n    player:{x:cxp,y:cyp}, vx:cxp, vy:cyp,\n    hp:100, fome:100, sede:100, energia:100,\n    inv:{}, city:{}, foodSel:null, built:{}, blds:[],\n    day:1, t:0.15, night:false, dark:0, time:0,\n    mobs:[], animals:[], villagers:[], path:[], job:null, moveT:0,\n    selBuild:null, selBld:null, popup:null,\n    happy:55, happyTarget:55, immT:30, cityT:0, lastLvl:null, scanT:0,\n    spawnT:6, animalT:10, towerT:0, regrow:[], parts:[], texts:[], toast:null, log:[], uid:1, dead:false,\n    catchT:0, stall:null, swing:0, flash:0, hitT:0, eatFlash:0, anim:0, buildFlash:0,\n    stats:{kills:0,animals:0,built:0,crafted:0,coletados:0,nodes:0,days:1}\n  };\n  genMap();\n  scanB();\n  msg('Você chegou sem nada. Derrube árvores com as mãos e faça um machado de madeira.');\n  msg('Construa uma bancada para liberar mais itens e construções.');\n  buildHotbar();\n  resize();\n}\n\n// ======================================================
