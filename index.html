.style.zoom=opts.scale; }\n}\n\n// ---------- Áudio (sintetizado com Web Audio) ----------\nlet AC=null, mGain=null, sGain=null, tenseGain=null, relaxGain=null, chordOscs=[], tenseOsc=null, lfoOsc=null, chordTimer=null, chordIdx=0, tenseLevel=0;\nconst CHORDS=[[261.6,329.6,392.0],[220.0,261.6,329.6],[174.6,220.0,261.6],[196.0,246.9,293.7]];\nfunction ensureAudio(){\n  if(AC) { if(AC.state==='suspended') AC.resume(); return; }\n  const Ctx=window.AudioContext||window.webkitAudioContext;\n  if(!Ctx) return;\n  AC=new Ctx();\n  mGain=AC.createGain(); mGain.gain.value=opts.music?opts.musicVol*0.5:0; mGain.connect(AC.destination);\n  sGain=AC.createGain(); sGain.gain.value=opts.sound?opts.sfxVol:0; sGain.connect(AC.destination);\n  // Música relaxante: acordes suaves em loop.\n  relaxGain=AC.createGain(); relaxGain.gain.value=1; relaxGain.connect(mGain);\n  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.connect(relaxGain);\n  for(let i=0;i<3;i++){\n    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=CHORDS[0][i];\n    const g=AC.createGain(); g.gain.value=0; o.connect(g); g.connect(lp); o.start();\n    chordOscs.push(o);\n  }\n  // Música tensa: pulso grave com filtro modulado, só ouvido em guerra.\n  tenseGain=AC.createGain(); tenseGain.gain.value=0; tenseGain.connect(mGain);\n  const tlp=AC.createBiquadFilter(); tlp.type='lowpass'; tlp.frequency.value=400; tlp.Q.value=6; tlp.connect(tenseGain);\n  tenseOsc=AC.createOscillator(); tenseOsc.type='sawtooth'; tenseOsc.frequency.value=55; tenseOsc.connect(tlp); tenseOsc.start();\n  lfoOsc=AC.createOscillator(); lfoOsc.frequency.value=2.2; const lg=AC.createGain(); lg.gain.value=300;\n  lfoOsc.connect(lg); lg.connect(tlp.frequency); lfoOsc.start();\n  chordTimer=setInterval(()=>{\n    if(!AC) return;\n    chordIdx=(chordIdx+1)%CHORDS.length;\n    CHORDS[chordIdx].forEach((f,i)=>chordOscs[i].frequency.setTargetAtTime(f,AC.currentTime,0.8));\n  },4000);\n  setInterval(playMelody, nction showMsg(){ document.getElementById('msg').innerHTML=(S?S.log.slice(-4):[]).map(s=>`<div>${s}<\/div>`).join(''); }\nfunction rnd(){ return Math.random(); }\nfunction pick(a){ return a[Math.floor(Math.random()*a.length)]; }\nfunction maxLvOf(b){ const d=DEF[b.type]; return (d&&d.maxLv)||3; }\nfunction drawIcon(c,name,color,ox,oy,px){\n  const map=ICONS[name];\n  for(let r=0;r<8;r++) for(let q=0;q<8;q++){\n    const ch=map[r][q]; if(ch==='.') continue;\n    c.fillStyle = ch==='x'?color:(PAL[ch]||'#f0f');\n    c.fillRect(ox+q*px,oy+r*px,px,px);\n  }\n}\nfunction iconCanvas(name,color,px){\n  const c=document.createElement('canvas'); c.width=8*px; c.height=8*px;\n  drawIcon(c.getContext('2d'),name,color,0,0,px); return c;\n}\nfunction yearStr(turn){\n  const segs=[[75,40],[135,25],[175,20],[250,4],[300,3],[385,2]];\n  let y=-4000,t=0;\n  for(const [end,per] of segs){\n    if(turn<=end){ y+=(turn-t)*per; return fmtY(y); }\n    y+=(end-t)*per; t=end;\n  }\n  y+=(turn-t); return fmtY(y);\n}\nfunction fmtY(y){ y=Math.floor(y); return y<0?(-y)+' a.C.':y+' d.C.'; }\n\nfunction invalidate(){ BL=null; }\nfunction buildingsList(){\n  if(BL) return BL;\n  const L=[];\n  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const b=S.grid[y][x].b; if(b) L.push({b,x,y}); }\n  BL=L; return L;\n}\n\n// ---------- Início de partida ----------\nfunction newGame(o){\n  const C=Object.assign({},PRESETS.normal,o.cfg||{});\n  applyCosts(C);\n  N=o.size;\n  const g=[];\n  for(let y=0;y<N;y++){ g.push([]); for(let x=0;x<N;x++){\n    const r=h2(x,y); let t='planicie';\n    const a1=0.12*C.nat,a2=0.17*C.nat,a3=0.21*C.nat,a4=0.25*C.nat,a5=a4+0.03*C.ore,a6=a5+0.03*C.ore,a7=a6+0.02*C.ore;\n    if(r<a1) t='floresta'; else if(r<a2) t='fruta'; else if(r<a3) t='animais'; else if(r<a4) t='pedra'; else if(r<a5) t='minerio'; else if(r<a6) t='carvao'; else if(r<a7) t='petroleo';\n    g[y].push({t,b:null});\n  }}\n  const rx=Math.round(N*0.65);\n  if(C.rio) for(let y=0;y<N;y++) g[y][rx].t='rio';\n  const bx=Ma d===0?S.cities:S.ai[pid-1].cities; }\nfunction allCities(){ return S.cities.concat(...S.ai.map(p=>p.cities)); }\nfunction cityById(id){ return allCities().find(c=>c.id===id); }\nfunction cityOwner(c){ return c.pid||0; }\nfunction capital(){ return S.cities.find(c=>c.capital)||S.cities[0]; }\nfunction nearestCity(x,y,list){\n  let best=null,bd=1e9;\n  for(const c of (list||S.cities)){ const d=Math.max(Math.abs(x-c.x),Math.abs(y-c.y)); if(d<bd){bd=d;best=c;} }\n  return best;\n}\nfunction cityBuildings(cid){ return buildingsList().filter(o=>o.b.cid===cid); }\nfunction countType(t,cid){ return buildingsList().filter(o=>o.b.type===t && (o.b.pid||0)===0 && (cid===undefined||o.b.cid===cid)).length; }\nfunction houses(cid){ return countType('casa',cid); }\nfunction totalPop(cid){ const cs=cid?[cityById(cid)]:S.cities; return cs.reduce((s,c)=>s+c.adults+c.children,0); }\nfunction capPop(cid){ return houses(cid)*4; }\nfunction maxHouses(c){ return HOUSE_MAX_LVL[c.level-1]; }\nfunction terrR(c){ return 4+(c.level||1); }\nfunction inBase(x,y,c){ return dist(x,y,c.x,c.y)<=terrR(c); }\nfunction nearBuild(x,y,pid){ pid=pid||0; for(const o of buildingsList()) if((o.b.pid||0)===pid && dist(x,y,o.x,o.y)<=2) return true; return false; }\nfunction dist(a,b,c,d){ return Math.max(Math.abs(a-c),Math.abs(b-d)); }\nfunction countTerrain(x,y,r,t){\n  let n=0;\n  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){\n    const X=x+dx,Y=y+dy;\n    if(X>=0&&Y>=0&&X<N&&Y<N&&S.grid[Y][X].t===t) n++;\n  }\n  return n;\n}\nfunction depleteOne(x,y,r,t,to){\n  for(let i=0;i<20;i++){\n    const X=x+Math.floor(Math.random()*(2*r+1))-r, Y=y+Math.floor(Math.random()*(2*r+1))-r;\n    if(X>=0&&Y>=0&&X<N&&Y<N&&S.grid[Y][X].t===t){ S.grid[Y][X].t=to; return; }\n  }\n}\n\n// ---------- Rede de estradas ----------\nfunction computeNetwork(){\n  conn=new Map();\n  let nid=0;\n  const comp=new Map();\n  for(const c of S.cities){\n    const k=key(c.x,c.y);\n    if(comp.has(k)){ c.net=comp.get(k); continue; }\n    const id=nid++;\n    comp.set(k,id);\n    const q=[[c.x,c.y]];\n    while(q.length){\n      const [x,y]=q.shift();\n      for(const [dx,dy] of DIRS){\n        const nx=x+dx, ny=y+dy;\n        if(nx<0||ny<0||nx>=N||ny>=N) continue;\n        const nk=key(nx,ny); if(comp.has(nk)) continue;\n        const t=S.grid[ny][nx].b;\n        if(t && (t.type==='estrada'||t.type==='base') && (t.pid||0)===0){ comp.set(nk,id); q.push([nx,ny]); }\n      }\n    }\n    c.net=id;\n  }\n  for(const [k,v] of comp) conn.set(k,v);\n  for(const o of buildingsList()){\n    if(o.b.type==='estrada'||o.b.type==='base') continue;\n    if((o.b.pid||0)!==0) continue;\n    for(const [dx,dy] of DIRS){\n      const nk=key(o.x+dx,o.y+dy);\n      if(comp.has(nk)){ conn.set(key(o.x,o.y),comp.get(nk)); break; }\n    }\n  }\n}\nfunction isConn(x,y){ return conn.has(key(x,y)); }\nfunction netOf(x,y){ return conn.get(key(x,y)); }\nfunction netCount(net,type){ return buildingsList().filter(o=>o.b.type===type && (o.b.pid||0)===0 && netOf(o.x,o.y)===net).length; }\nfunction roadish(x,y){ return x>=0&&y>=0&&x<N&&y<N&&!!S.grid[y][x].b; }\n\n// ---------- Contato e relações ----------\nfunction relKey(a,b){ return a<b?a+'|'+b:b+'|'+a; }\nfunction relGet(a,b){\n  const k=relKey(a,b);\n  if(!S.rel[k]) S.rel[k]={conf:0,war:false,pacto:false,pactTurn:-99,comercio:false,alianca:false,traitorUntil:-1};\n  return S.rel[k];\n}\nfunction livingPids(){ return [0].concat(S.ai.filter(p=>!p.dead).map(p=>p.pid)); }\nfunction computeContacts(){\n  contacts=new Set(Object.keys(S.metMap||{}));\n  // Povos se conhecem ao avistar construções ou unidades (dentro do alcance de visão).\n  if(VIS){\n    for(const o of buildingsList()){ const p=o.b.pid||0; if(p!==0 && seen(o.x,o.y)){ S.metMap=S.metMap||{}; S.metMap[relKey(0,p)]=1; contacts.add(relKey(0,p)); } }\n    for(const g of S.groups){ const p=gPid(g); if(p!==0 && seen(g.x,g.y)){ S.metMap=S.metMap||{}; S.metMap[relKey(0,p)]=1; contacts.add(relKey(0,p)); } }\n  }\n  const pids=livingPids();\n  for(let i=0;i<pids.length;i++) for(let j=i+1;j<pids.length;j++){\n    const A=peopleCities(pids[i]), B=peopleCities(pids[j]);\n    let hit=false;\n    for(const a of A){ for(const b of B){ if(dist(a.x,a.y,b.x,b.y)<=CONTACT_DIST){ hit=true; break; } } if(hit) break; }\n    if(hit) contacts.add(relKey(pids[i],pids[j]));\n  }\n}\nfunction contactOf(a,b){ return a!==b && contacts.has(relKey(a,b)); }\n\n// ---------- Unidades e grupos ----------\nfunction gPid(g){ return g.pid||0; }\nfunction groupsOf(pid){ return S.groups.filter(g=>gPid(g)===pid); }\nfunction groupSpace(g){ return Object.keys(g.units).reduce((s,t)=>s+UNITS[t].space*g.units[t],0); }\nfunction groupCount(g){ return Object.keys(g.units).reduce((s,t)=>s+g.units[t],0); }\n// Fração de vida do grupo (mínimo 5%): grupo ferido combate com menos força.\nfunction groupFrac(g){ return g.hp==null?1:Math.max(0.05,g.hp/groupHpMax(g)); }\nfunction groupPower(g){ return Object.keys(g.units).reduce((s,t)=>s+UNITS[t].atk*g.units[t],0)*groupFrac(g); }\nfunction groupDef(g){ return Object.keys(g.units).reduce((s,t)=>s+(UNITS[t].def||0)*g.units[t],0)*groupFrac(g); }\n// Dano potencial contra construções (sem multiplicador de ataque).\nfunction groupSiege(g){ return Object.keys(g.units).reduce((s,t)=>s+(BLD_DMG[t]||1)*g.units[t],0)*groupFrac(g); }\nfunction groupAt(x,y){ return S.groups.find(g=>g.x===x&&g.y===y); }\nfunction groupById(id){ return S.groups.find(g=>g.id===id); }\nfunction armyCount(pid){ return groupsOf(pid).reduce((s,g)=>s+groupCount(g),0); }\nfunction armyPower(pid){ return groupsOf(pid).reduce((s,g)=>s+groupPower(g),0); }\nfunction scaleGroup(g,frac){\n  for(const t of Object.keys(g.units)){ g.units[t]=Math.max(0,Math.round(g.units[t]*frac)); if(g.units[t]<=0) delete g.units[t]; }\n  if(g.hp!=null) g.hp=Math.min(g.hp,groupHpMax(g));\n}\nfunction pruneGroups(){ S.groups=S.groups.filter(g=>groupCount(g)>0 && (g.hp==null||g.hp>0)); }\nfunction loseArmy(pid,frac){\n  if(pid===0) frac*=cf('loss');\n  for(const g of groupsOf(pid)) scaleGroup(g,1-frac);\n  pruneGroups();\n}\nfunction ringAround(c,r){\n  const out=[];\n  for(let dx=-r;dx<=r;dx++) out.push({x:c.x+dx,y:c.y-r});\n  for(let dy=-r+1;dy<=r;dy++) out.push({x:c.x+r,y:c.y+dy});\n  for(let dx=r-1;dx>=-r;dx--) out.push({x:c.x+dx,y:c.y+r});\n  for(let dy=r-1;dy>=-r+1;dy--) out.push({x:c.x-r,y:c.y+dy});\n  return out.filter(p=>p.x>=0&&p.y>=0&&p.x<N&&p.y<N);\n}\nfunction freeTileNear(c){\n  for(let r=1;r<=5;r++) for(const p of ringAround(c,r)){\n    const tile=S.grid[p.y][p.x];\n    if(!tile.b && tile.t!=='rio' && !groupAt(p.x,p.y)) return p;\n  }\n  return null;\n}\nfunction spawnUnit(type,pid){\n  pid=pid||0;\n  const c=pid===0?capital():cityById(S.ai[pid-1].cities[0].id);\n  const p=freeTileNear(c); if(!p) return false;\n  S.groups.push({id:S.gid++,pid,x:p.x,y:p.y,units:{[type]:1},movedTurn:-1});\n  return true;\n}\nfunction mergeGroups(srcId,dstId){\n  const a=groupById(srcId), b=groupById(dstId);\n  if(!a||!b||a===b) return;\n  if(groupSpace(a)+groupSpace(b)>GROUP_MAX){ log('Grupo passaria de '+GROUP_MAX+' de espaço.'); return; }\n  for(const t of Object.keys(a.units)) b.units[t]=(b.units[t]||0)+a.units[t];\n  S.groups=S.groups.filter(g=>g.id!==srcId);\n  log('Grupos unidos ('+groupSpace(b)+'/'+GROUP_MAX+' de espaço).');\n  S.selGroup=dstId;\n}\nfunction battle(a,b){\n  const pa=groupPower(a)+groupDef(a)*0.5, pb=groupPower(b)+groupDef(b)*0.5;\n  sfx('attack');\n  const hi=Math.max(pa,pb,1), lo=Math.min(pa,pb);\n  // Lei de Lanchester: o vencedor sai com a raiz da força que sobra.\n  const left=Math.max(0.1,Math.sqrt(Math.max(0,1-(lo/hi)**2)));\n  const [w,l]=pa>=pb?[a,b]:[b,a];\n  scaleGroup(w,left); damageGroup(w,0.15);\n  S.groups=S.groups.filter(g=>g!==l);\n  log(pname(gPid(w))+' venceu uma batalha.');\n  return w;\n}\nfunction bMaxHp(b){\n  const d=DEF[b.type]||{};\n  const base=b.type==='base'?120:(d.hp||40);\n  return Math.round(base*(1+0.5*((b.level||1)-1))*((b.pid||0)===0?cf('bld'):1));\n}\nfunction ensureHp(b){ if(b.hp==null) b.hp=bMaxHp(b); }\nfunction groupHpMax(g){ return Math.max(10,groupSpace(g)*10); }\nfunction damageGroup(g,frac){ if(gPid(g)===0) frac*=cf('loss'); if(g.hp==null) g.hp=groupHpMax(g); const lost=groupHpMax(g)*frac; g.hp=Math.max(0,g.hp-lost); fxAdd(g.x,g.y,'-'+Math.round(lost),'#ff6a5a'); }\nfunction inOwnTerritory(x,y,pid){ return peopleCities(pid).some(c=>Math.max(Math.abs(c.x-x),Math.abs(c.y-y))<=8); }\nfunction healTick(){\n  for(const o of buildingsList()){\n    const b=o.b; if(b.type==='ruina'||b.hp==null) continue;\n    const mx=bMaxHp(b); if(b.hp>=mx) continue;\n    if(inOwnTerritory(o.x,o.y,b.pid||0)) b.hp=Math.min(mx,b.hp+mx*0.08);\n  }\n  for(const g of S.groups){\n    const mx=groupHpMax(g), cur=g.hp==null?mx:g.hp; if(cur>=mx) continue;\n    if(inOwnTerritory(g.x,g.y,gPid(g))) g.hp=Math.min(mx,cur+mx*0.1);\n  }\n}\nfunction ruinTile(x,y,attackerPid){\n  const t=S.grid[y][x], b=t.b; if(!b||b.type==='ruina') return;\n  const d=DEF[b.type];\n  if(d && d.c && attackerPid===0){\n    const loot={}; for(const k in d.c) loot[k]=Math.floor(d.c[k]*0.3);\n    for(const k in loot) S.res[k]=(S.res[k]||0)+loot[k];\n    log('Saque: '+d.n+' rendeu '+costStr(loot)+'.');\n    fxAdd(x,y,'Saque +'+Object.values(loot).reduce((a,v)=>a+v,0),'#ffd84a',false,14);\n  }\n  t.b={type:'ruina',orig:b.type,cid:b.cid,pid:b.pid||0};\n  fxAdd(x,y,'Destruída','#ff5a4a',true);\n  invalidate(); computeNetwork();\n}\nfunction damageCity(c,dmg,attackerPid){\n  const list=cityBuildings(c.id).filter(o=>o.b.type!=='ruina'&&o.b.type!=='base'&&o.b.type!=='estrada');\n  list.sort((a,b)=>(b.b.type==='muralha')-(a.b.type==='muralha'));\n  for(const o of list){\n    if(dmg<=0) break;\n    const b=o.b; ensureHp(b);\n    const take=Math.min(b.hp,dmg); b.hp-=take; dmg-=take; fxAdd(o.x,o.y,'-'+Math.round(take),'#ffb05a');\n    if(b.hp<=0){ log(DEF[b.type].n+' de '+c.name+' foi destruída.'); ruinTile(o.x,o.y,attackerPid); }\n  }\n}\nfunction enemyAt(x,y){\n  const eg=groupAt(x,y); if(eg && gPid(eg)!==0) return {pid:gPid(eg),kind:'move'};\n  const b=S.grid[y][x].b;\n  if(b && (b.pid||0)!==0 && b.type!=='estrada' && b.type!=='ruina') return {pid:b.pid,kind:'bld'};\n  return null;\n}\nfunction canEnter(x,y){\n  const t=S.grid[y][x];\n  if(t.t==='rio') return false;\n  return !t.b || t.b.type==='estrada' || t.b.type==='ruina';\n}\nfunction defensePower(c){\n  const owner=cityOwner(c);\n  let wall=0;\n  for(const o of cityBuildings(c.id)){\n    const b=o.b; if(b.type==='ruina'||b.type==='estrada') continue;\n    const hp=b.hp==null?bMaxHp(b):b.hp;\n    wall+= b.type==='muralha'? hp/25 : hp/120;\n  }\n  return armyCount(owner)*2.5 + c.level*4 + (c.capital?4:0) + wall;\n}\nfunction attackGroupOnCity(g,c){\n  const owner=cityOwner(c), r=relGet(gPid(g),owner);\n  const atk=groupPower(g), def=defensePower(c);\n  g.movedTurn=S.turn;\n  sfx('attack');\n  if(atk>def){\n    scaleGroup(g,0.8); loseArmy(owner,0.3); r.conf-=40;\n    destroyCity(c,'por '+pname(gPid(g)),gPid(g));\n    pruneGroups();\n    return true;\n  }\n  damageCity(c,atk*0.6,gPid(g));\n  damageGroup(g,0.2);\n  scaleGroup(g,0.6); loseArmy(owner,0.1); pruneGroups();\n  log(pname(gPid(g))+' foi repelido em '+c.name+'.');\n  fxAdd(g.x,g.y,'Repelido','#ff8a5a',true);\n  return false;\n}\nfunction attackBuilding(g,x,y){\n  const b=S.grid[y][x].b;\n  if(!b || (b.pid||0)===0 || dist(g.x,g.y,x,y)!==1){ log('Precisa estar encostado no alvo.'); return; }\n  if(b.type==='base'){ const c=cityById(b.cid); if(c) attackGroupOnCity(g,c); return; }\n  if(g.movedTurn===S.turn){ log('Este grupo já agiu neste turno.'); return; }\n  ensureHp(b);\n  const dmgB=groupSiege(g)*2; b.hp-=dmgB; fxAdd(x,y,'-'+Math.round(dmgB),'#ffb05a');\n  g.movedTurn=S.turn; scaleGroup(g,0.85); damageGroup(g,0.05); pruneGroups(); sfx('attack');\n  if(b.hp<=0){ log((DEF[b.type]?DEF[b.type].n:'Construção')+' de '+pname(b.pid)+' foi destruída.'); ruinTile(x,y,0); }\n  else log('Construção de '+pname(b.pid)+' sofreu dano.');\n}\nfunction reconstruir(x,y){\n  const t=S.grid[y][x], b=t.b;\n  if(!b || b.type!=='ruina' || b.orig==='base' || (b.pid||0)!==0) return;\n  const od=DEF[b.orig]; if(!od) return;\n  if(groupAt(x,y)){ log('Há tropas neste tile.'); return; }\n  const c2={}; for(const k in od.c) c2[k]=od.c[k]*2;\n  if(!canPay(c2)){ log('Recursos insuficientes para reconstruir.'); return; }\n  pay(c2);\n  t.b={type:b.orig,level:1,workers:0,cid:b.cid,pid:0,hp:bMaxHp({type:b.orig,level:1})};\n  log(od.n+' reconstruída pelo dobro do custo.');\n  invalidate(); computeNetwork();\n}\nfunction runPending(){\n  const pm=pendingMove; pendingMove=null; modal=null;\n  const g=pm && groupById(pm.gid);\n  if(g){\n    if(pm.declare) declareWar(0,pm.pid);\n    if(pm.kind==='bld') attackBuilding(g,pm.x,pm.y); else moveNow(g,pm.x,pm.y);\n  }\n  renderAll();\n}\nfunction moveNow(g,x,y){\n  const res=tryStep(g,x,y);\n  if(res==='longe') log('Só dá para andar 1 tile por turno.');\n  else if(res==='ja') log('Este grupo já se moveu neste turno.');\n  else if(res==='bloqueado') log('O terreno ou uma construção bloqueia o caminho.');\n  else if(res==='ocupado') log('Já há suas unidades neste tile.');\n  else if(res==='paz') log('Vocês não estão em guerra. Não é possível entrar no tile.');\n  S.sel={x:g.x,y:g.y};\n}\nfunction moveSelected(x,y){\n  const g=groupById(S.selGroup); if(!g) return;\n  const en=enemyAt(x,y);\n  if(en && dist(g.x,g.y,x,y)===1){\n    const war=relGet(0,en.pid).war;\n    const isB=en.kind==='bld';\n    pendingMove={gid:g.id,x,y,kind:en.kind,pid:en.pid,declare:!war,\n      title: war?(isB?'Atacar construção?':'Atacar?'):'Declarar guerra?',\n      text: (isB?'Construção de ':'Grupo de ')+pname(en.pid)+(war?'.':'. Vocês não estão em guerra; confirmar declara guerra.'),\n      ok: war?'Atacar':'Declarar guerra e atacar'};\n    modal='confirm'; renderAll(); return;\n  }\n  orderMove(g,x,y);\n}\n// Alcance de movimento: tropas avançadas andam mais; estrada dá +1.\nfunction moveRangeFor(types,x,y){\n  let r=1;\n  if(types.some(t=>UNITS[t].acad>=3)) r=2;\n  if(types.some(t=>UNITS[t].acad>=4)) r=3;\n  const b=S.grid[y][x].b;\n  if(b && b.type==='estrada') r+=(b.level||1)+(hasTech('estp')?1:0);\n  return r;\n}\nfunction moveRange(g){ return moveRangeFor(Object.keys(g.units),g.x,g.y); }\n// Simula a rota: em que turno chega e onde cada turno termina.\nfunction routeInfo(g,path){\n  const types=Object.keys(g.units), rangeAt=(x,y)=>moveRangeFor(types,x,y);\n  const moved=g.movedTurn===S.turn;\n  let turn=moved?0:1, budget=moved?0:rangeAt(g.x,g.y), px=g.x, py=g.y;\n  const marks=[];\n  for(let i=1;i<path.length;i++){\n    while(budget<=0){ turn++; budget=rangeAt(px,py); }\n    budget--; px=path[i][0]; py=path[i][1];\n    if(budget===0 && i<path.length-1) marks.push({x:px,y:py,n:turn});\n  }\n  return {turns:turn, marks, tiles:path.length-1};\n}\n// Anda pela rota com o orçamento de movimento dado; para se o caminho ficar bloqueado.\nfunction walkRoute(g,budget){\n  if(!g.route||!g.route.length){ delete g.route; return 0; }\n  let used=0;\n  while(used<budget && g.route.length){\n    const [x,y]=g.route[0];\n    if(dist(g.x,g.y,x,y)!==1 || !canEnter(x,y) || groupAt(x,y) || enemyAt(x,y)){\n      g.route=[]; log('O caminho de '+DEF_UNIT_NAME(g)+' foi bloqueado.'); break;\n    }\n    g.x=x; g.y=y; g.route.shift(); used++;\n  }\n  if(used) g.movedTurn=S.turn;\n  if(!g.route.length) delete g.route;\n  return used;\n}\nfunction DEF_UNIT_NAME(g){ const t=Object.keys(g.units)[0]; return UNITS[t]?UNITS[t].n:'o grupo'; }\n// Clique num destino: traça a rota, anda o que der neste turno e deixa o resto para os próximos.\nfunction orderMove(g,x,y){\n  if(dist(g.x,g.y,x,y)===0) return;\n  const path=findPath(g,x,y);\n  if(!path){ log('Sem caminho até lá.'); return; }\n  g.route=path.slice(1);\n  const info=routeInfo(g,path);\n  walkRoute(g,g.movedTurn===S.turn?0:moveRange(g));\n  S.sel={x:g.x,y:g.y};\n  log('Rota traçada: chega em '+info.turns+' turno'+(info.turns>1?'s':'')+'.');\n}\n// A cada turno, as rotas pendentes avançam.\nfunction routesTick(){\n  for(const g of S.groups){\n    if(gPid(g)!==0 || !g.route || !g.route.length) continue;\n    walkRoute(g,moveRange(g));\n    if(!g.route) log(DEF_UNIT_NAME(g)+' chegou ao destino.');\n  }\n}\nfunction tryStep(g,x,y){\n  if(dist(g.x,g.y,x,y)>moveRange(g)||dist(g.x,g.y,x,y)<1) return 'longe';\n  if(g.movedTurn===S.turn) return 'ja';\n  if(!canEnter(x,y)) return 'bloqueado';\n  const other=groupAt(x,y);\n  if(other){\n    if(gPid(other)===gPid(g)) return 'ocupado';\n    const r=relGet(gPid(g),gPid(other));\n    if(!r.war) return 'paz';\n    const w=battle(g,other);\n    g.movedTurn=S.turn;\n    if(w===g){ g.x=x; g.y=y; }\n    pruneGroups();\n    return 'batalha';\n  }\n  g.x=x; g.y=y; g.movedTurn=S.turn;\n  return 'ok';\n}\nfunction attackWithSelected(cid){\n  const g=groupById(S.selGroup); const c=cityById(cid);\n  if(!g||!c){ log('Selecione um grupo para atacar.'); return; }\n  if(dist(g.x,g.y,c.x,c.y)>1){ log('O grupo precisa estar encostado na cidade para atacar.'); return; }\n  const r=relGet(0,cityOwner(c));\n  if(!r.war){ log('Sem guerra com '+pname(cityOwner(c))+'.'); return; }\n  attackGroupOnCity(g,c);\n  S.selGroup=null;\n}\nfunction armySpace(){\n  let s=0;\n  for(const g of groupsOf(0)) s+=groupSpace(g);\n  for(const q of S.queue) s+=UNITS[q.type].space;\n  return s;\n}\n\n// ---------- IAs: exército, movimento e decisões ----------\nfunction aiGroupsTurn(){\n  for(const p of S.ai){\n    if(p.dead) continue;\n    const cap=p.cities.find(c=>c.capital)||p.cities[0];\n    for(const g of groupsOf(p.pid).slice()){\n      if(!S.groups.includes(g)) continue;\n      if(g.movedTurn===S.turn) continue;\n      let target=null, best=1e9;\n      for(const q of livingPids()){\n        if(q===p.pid||!relGet(p.pid,q).war) continue;\n        for(const c of peopleCities(q)){\n          const d=dist(g.x,g.y,c.x,c.y);\n          if(d<best && d<=15){ best=d; target={kind:'city',c}; }\n        }\n      }\n      if(!target){\n        for(const eg of S.groups){\n          if(gPid(eg)===p.pid) continue;\n          if(!relGet(p.pid,gPid(eg)).war) continue;\n          const d=dist(g.x,g.y,eg.x,eg.y);\n          if(d<best && d<=6){ best=d; target={kind:'group',eg}; }\n        }\n      }\n      if(target && target.kind==='city' && dist(g.x,g.y,target.c.x,target.c.y)<=1){\n        attackGroupOnCity(g,target.c);\n        continue;\n      }\n      if(target && target.kind==='group' && dist(g.x,g.y,target.eg.x,target.eg.y)<=1){\n        tryStep(g,target.eg.x,target.eg.y);\n        continue;\n      }\n      let gx=cap.x, gy=cap.y;\n      if(target){ gx = target.kind==='city'?target.c.x:target.eg.x; gy = target.kind==='city'?target.c.y:target.eg.y; }\n      else if(dist(g.x,g.y,cap.x,cap.y)<=3) continue;\n      let bestStep=null, bestD=dist(g.x,g.y,gx,gy);\n      for(const [dx,dy] of DIRS8){\n        const nx=g.x+dx, ny=g.y+dy;\n        if(nx<0||ny<0||nx>=N||ny>=N) continue;\n        const d=dist(nx,ny,gx,gy);\n        if(d<bestD){ bestD=d; bestStep=[nx,ny]; }\n      }\n      if(bestStep) tryStep(g,bestStep[0],bestStep[1]);\n    }\n  }\n  pruneGroups();\n}\nfunction aiTrain(p){\n  if(p.dead) return;\n  if(S.turn-p.lastTrain<3) return;\n  p.lastTrain=S.turn;\n  const cap=p.cities.find(c=>c.capital)||p.cities[0];\n  const level=cap.level;\n  const limit=p.cities.length*4+4;\n  if(armyCount(p.pid)>=limit) return;\n  const type = level>=3?'infantaria':level>=2?pick(['lanceiro','arqueiro']):'cacador';\n  const cost=UNITS[type].manut*2*cf('ucost');\n  if(p.res.ouro<cost) return;\n  const fc=freeTileNear(cap); if(!fc) return;\n  p.res.ouro-=cost;\n  S.groups.push({id:S.gid++,pid:p.pid,x:fc.x,y:fc.y,units:{[type]:1},movedTurn:-1});\n}\nfunction aiUpkeep(p){\n  let up=0;\n  for(const g of groupsOf(p.pid)) for(const t of Object.keys(g.units)) up+=UNITS[t].manut*g.units[t];\n  p.res.ouro-=up*0.5;\n  if(p.res.ouro<0) p.res.ouro=0;\n}\n\n// ---------- Construção do jogador ----------\nfunction canPay(c){ for(const k in c) if((S.res[k]||0)<c[k]) return false; return true; }\nfunction pay(c){ for(const k in c) S.res[k]-=c[k]; }\nfunction costStr(c){ return Object.entries(c).map(([k,v])=>v+' '+(RES_NAME[k]||k)).join(', '); }\nfunction maxLevel(){ return Math.max(...S.cities.map(c=>c.level)); }\nfunction unlocked(d){ return (!d.era || maxLevel()>=d.era) && (!d.tech || hasTech(d.tech)); }\n// Texto da dica de item bloqueado: diz como desbloquear.\nfunction lockTip(d){\n  if(d.tech&&!hasTech(d.tech)) return d.n+' precisa da tecnologia '+((TECHS.find(t=>t.id===d.tech)||{n:d.tech}).n)+'.';\n  const r=BASE_REQ[d.era];\n  return d.n+' está bloqueado. Para desbloquear, eleve a base ao Nível '+d.era+': '+(r?r.score+' pontos de construção conectados à base e '+costStr(r.cost)+'.':'')+' Construções conectadas por estrada e melhoradas valem mais pontos.';\n}\nfunction unitUnlocked(u){ return acadLevel()>=u.acad && countType(u.req||'quartel')>=1; }\n\nfunction nextRingTile(c){\n  for(let r=1;r<=8;r++) for(const p of ringAround(c,r)){\n    const tile=S.grid[p.y][p.x];\n    if(!tile.b && tile.t!=='rio') return p;\n  }\n  return null;\n}\nfunction canPlace(type,x,y){\n  const tile=S.grid[y][x], d=DEF[type];\n  if(!seen(x,y)) return 'Área não explorada.';\n  if(tile.b) return 'Tile ocupado.';\n  if(groupAt(x,y)) return 'Há unidades neste tile.';\n  if(tile.t==='rio') return 'Não construa no rio.';\n  const c=nearestCity(x,y,S.cities);\n  if(!inBase(x,y,c)) return 'Fora do território da cidade (cresce com o nível da base).';\n  if(!nearBuild(x,y)) return 'Construa a até 2 tiles de outra construção sua.';\n  if(!unlocked(d)) return 'Requer Base Nível '+d.era+'.';\n  if(d.need){\n    const n = d.need==='rio' ? countTerrain(x,y,1,'rio') : countTerrain(x,y,d.r,d.need);\n    if(n<1) return `Precisa de ${d.need==='rio'?'rio ao lado':d.need+' por perto'}.`;\n  }\n  if(d.unique && countType(type)>=1) return 'Só um(a) '+d.n+' no império.';\n  if(type==='templo' && countType('templo')>=1) return 'Só um Templo no império.';\n  if(type==='usina' && countType('usina')>=2) return 'No máximo 2 usinas.';\n  if(!canPay(d.c)) return 'Recursos insuficientes.';\n  return null;\n}\n// Tempo de construção pelo custo total: 1 turno a cada 25 de custo, entre 2 e 12.\nfunction buildTurns(k){\n  const v=Object.values(DEF[k].c||{}).reduce((a,b)=>a+b,0);\n  return Math.max(2,Math.min(12,Math.ceil(v/25)));\n}\nfunction advanceObras(){\n  for(const o of buildingsList()){\n    const b=o.b; if(b.type!=='obra'||(b.pid||0)!==0) continue;\n    b.prog=(b.prog||0)+1;\n    if(b.prog>=b.need){\n      const k=b.of, c=cityById(b.cid), nome=(c||{name:'?'}).name;\n      S.grid[o.y][o.x].b={type:k,cid:b.cid,pid:0,level:1,workers:0};\n      log(DEF[k].n+' concluída em '+nome+'.');\n      hist(DEF[k].n+' concluída em '+nome+'.');\n      fxAdd(o.x,o.y,'Concluída','#7aff8a',true);\n    }\n  }\n  invalidate(); computeNetwork();\n}\n// Manutenção: cada casa custa ouro por turno, cada rua também (mais se asfaltada).\nfunction maintain(){\n  let casas=0, ruas=0, predios=0;\n  for(const o of buildingsList()){\n    if((o.b.pid||0)!==0) continue;\n    if(o.b.type==='casa') casas++;\n    else if(o.b.type==='estrada') ruas+=(o.b.level||1);\n    else if(o.b.type!=='base'&&o.b.type!=='ruina'&&o.b.type!=='obra') predios+=(o.b.level||1);\n  }\n  const custo=(casas*0.15+ruas*0.04*(hasTech('urb')?0.5:1)+predios*0.06)*cf('maint');\n  if(custo>0){ S.res.ouro-=custo; led('ouro','manutencao',-custo); }\n  if(S.res.ouro<0) log('Ouro negativo: manutenção de casas e ruas está acima da arrecadação.');\n}\nfunction cancelObra(x,y){\n  const b=S.grid[y][x].b; if(!b||b.type!=='obra') return;\n  const d=DEF[b.of];\n  if(d) for(const k in d.c) S.res[k]=(S.res[k]||0)+Math.floor(d.c[k]*0.5);\n  S.grid[y][x].b=null; S.sel=null;\n  invalidate(); computeNetwork(); log('Obra cancelada: metade do custo devolvida.');\n}\nfunction place(type,x,y){\n  if(type==='fundar'){ foundCity(x,y); return; }\n  const err=canPlace(type,x,y);\n  if(err){ log(err); return; }\n  pay(DEF[type].c);\n  const cid=nearestCity(x,y,S.cities).id;\n  S.grid[y][x].b={type:'obra',of:type,prog:0,need:buildTurns(type),cid,pid:0,level:1,workers:0};\n  invalidate();\n  log('Obra iniciada: '+DEF[type].n+' ('+S.grid[y][x].b.need+' turnos).');\n  fxAdd(x,y,'Obra','#f0d28a',false);\n  sfx('build');\n  S.tool=null;\n  computeNetwork();\n}\nfunction farFromAllCities(x,y){\n  for(const c of allCities()) if(dist(x,y,c.x,c.y)<FOUND_MIN_DIST) return false;\n  return true;\n}\nfunction foundCity(x,y){\n  const cap=capital();\n  if(cap.level<2){ log('Fundar cidade exige a capital no Nível 2.'); return; }\n  const tile=S.grid[y][x];\n  if(tile.b||tile.t==='rio'||groupAt(x,y)){ log('Escolha um tile livre.'); return; }\n  if(!farFromAllCities(x,y)){ log('Muito perto de outra cidade (mínimo '+FOUND_MIN_DIST+' tiles).'); return; }\n  if(!canPay(DEF.fundar.c)){ log('Recursos insuficientes para fundar cidade.'); return; }\n  if(cap.adults<FOUND_POP+1){ log('A capital precisa de pelo menos '+(FOUND_POP+1)+' adultos.'); return; }\n  pay(DEF.fundar.c);\n  cap.adults-=FOUND_POP;\n  const id=S.nextId++;\n  const c={id,pid:0,name:'Cidade '+id,x,y,level:1,capital:false,adults:FOUND_POP,children:0,happy:50,tax:'padrao',starve:0};\n  S.cities.push(c);\n  tile.b={type:'base',cid:id,pid:0,level:1,workers:0};\n  const r=nextRingTile(c); if(r) S.grid[r.y][r.x].b={type:'casa',cid:id,pid:0,level:1,stage:1,workers:0};\n  invalidate();\n  S.tool=null; S.curCity=id;\n  log(c.name+' fundada com '+FOUND_POP+' pessoas.');\n  hist('Fundou '+c.name+' com '+FOUND_POP+' pessoas.');\n  sfx('build');\n  computeNetwork(); computeContacts();\n}\nfunction buildHouse(){\n  const c=S.cities.find(x=>x.id===S.curCity)||capital();\n  if(!canPay(DEF.casa.c)){ log('Madeira insuficiente para casa.'); return; }\n  const p=nextRingTile(c);\n  if(!p){ log(c.name+': sem espaço para casas perto da base.'); return; }\n  pay(DEF.casa.c);\n  S.grid[p.y][p.x].b={type:'casa',cid:c.id,pid:0,level:1,stage:1,workers:0};\n  invalidate();\n  sfx('build');\n  log('Casa construída em '+c.name+'.');\n  computeNetwork();\n}\nconst STAGE_NAME=['','Cabana','Casa de Madeira','Casa de Pedra','Sobrado'];\nfunction evolveHouse(x,y){\n  const b=S.grid[y][x].b; if(!b||b.type!=='casa') return;\n  const c=cityById(b.cid);\n  const next=b.stage+1; if(next>4) return;\n  if(c.level<next){ log('A cidade precisa estar no Nível '+next+'.'); return; }\n  const cost = next===2?{wood:20}:next===3?{stone:30}:{tabua:20,lapida:20};\n  if(!canPay(cost)){ log('Recursos insuficientes para evoluir a casa.'); return; }\n  pay(cost); b.stage=next; log('Casa evoluiu para o estágio '+next+'.');\n}\nfunction upgrade(x,y){\n  const b=S.grid[y][x].b; if(!b||b.type==='base'||b.type==='casa'||b.type==='estrada'||b.level>=maxLvOf(b)) return;\n  const c={}; for(const k in DEF[b.type].c) c[k]=DEF[b.type].c[k]*b.level*2;\n  if(!canPay(c)){ log('Recursos insuficientes para melhorar.'); return; }\n  pay(c); b.level++; log(DEF[b.type].n+' melhorada para Nível '+b.level+'.');\n}\nfunction demolish(x,y){\n  const tile=S.grid[y][x], b=tile.b; if(!b||b.type==='base') return;\n  // Demolir pede um segundo clique no mesmo botão para confirmar.\n  if(!(S.demoArm && S.demoArm.x===x && S.demoArm.y===y)){ S.demoArm={x,y}; log('Clique de novo em Confirmar demolição.'); return; }\n  S.demoArm=null;\n  if((b.pid||0)!==0) return;\n  const c=DEF[b.type]?DEF[b.type].c:{};\n  for(const k in c) S.res[k]+=Math.floor(c[k]*0.3);\n  tile.b=null; S.sel=null; invalidate(); log('Construção demolida. Parte do material voltou.');\n  hist('Demoliu '+((DEF[b.type]&&DEF[b.type].n)||'uma construção')+'.');\n  computeNetwork();\n}\nfunction chooseReligion(r){\n  if(S.religion){ log('A religião já foi escolhida.'); return; }\n  S.religion=r; log(r==='sec'?'A tribo escolheu o Secularismo Racional.':'A tribo escolheu o Fundamentalismo Ideológico.');\n  hist('Escolheu '+(r==='sec'?'Secularismo Racional':'Fundamentalismo Ideológico')+'.');\n}\n\n// ---------- Gerenciamento de cidades ----------\nfunction setTax(cid,k){\n  const c=cityById(cid);\n  if(c.level<3){ log('Impostos só podem ser alterados no Nível 3.'); return; }\n  c.tax=k; log(c.name+': impostos '+TAX[k].n+'.');\n  hist(c.name+': impostos definidos como '+TAX[k].n+'.');\n}\nfunction toggleRename(cid){\n  if(!S.renaming){ S.renaming=true; log('Digite o novo nome e clique em Confirmar.'); return; }\n  const el=document.getElementById('cname');\n  const val=el?el.value:'';\n  S.renaming=false;\n  renameCity(cid,val);\n}\nfunction renameCity(cid,name){\n  const c=cityById(cid);\n  if(relWarAny()){ log('Não é possível renomear cidades em guerra.'); return; }\n  name=(name||'').trim().slice(0,24);\n  if(!name){ log('O nome não pode ficar vazio.'); return; }\n  c.name=name; log('A cidade agora se chama '+name+'.');\n}\nfunction setCapital(cid){\n  if(relWarAny()){ log('Não é possível mudar a capital em guerra.'); return; }\n  S.cities.forEach(c=>c.capital=(c.id===cid));\n  log(cityById(cid).name+' é agora a capital.');\n}\nfunction relWarAny(){ return Object.entries(S.rel).some(([k,r])=>r.war && k.split('|').includes('0')); }\nfunction cityScore(c){\n  return cityBuildings(c.id).filter(o=>o.b.type!=='base'&&o.b.type!=='casa'&&o.b.type!=='estrada'&&(o.b.pid||0)===0&&inBase(o.x,o.y,c)&&isConn(o.x,o.y)).reduce((s,o)=>s+o.b.level,0);\n}\nfunction evolveCity(cid){\n  const c=cityById(cid);\n  const next=c.level+1; if(next>10) return;\n  const r=BASE_REQ[next];\n  if(cityScore(c)<r.score){ log(c.name+': faltam pontos de construção conectados para o Nível '+next+'.'); return; }\n  if(!canPay(r.cost)){ log('Recursos insuficientes para evoluir a cidade.'); return; }\n  pay(r.cost); c.level=next; log(c.name+' evoluiu para o Nível '+next+'.');\n  hist(c.name+' subiu para o Nível '+next+'.');\n}\n\n// Trabalhadores: a cada turno, as construções com prioridade (★) são preenchidas primeiro;\n// só depois as demais. Quem está num trabalho sem prioridade é realocado se houver vaga prioritária.\nfunction assignWorkers(){\n  for(const c of S.cities){\n    const list=cityBuildings(c.id).filter(o=>(o.b.pid||0)===0 && DEF[o.b.type] && DEF[o.b.type].cap);\n    for(const o of list) o.b.workers=0;\n    const ordered=[...list.filter(o=>o.b.prio), ...list.filter(o=>!o.b.prio)];\n    let idle=c.adults;\n    for(const o of ordered){\n      if(idle<=0) break;\n      const take=Math.min(DEF[o.b.type].cap, idle);\n      o.b.workers=take; idle-=take;\n    }\n  }\n}\nfunction togglePrio(x,y){\n  const b=S.grid[y][x].b;\n  if(b && DEF[b.type] && DEF[b.type].cap) b.prio=!b.prio;\n}\n\n// ---------- Eventos ----------\nfunction inScope(ev,x,y,cityId){\n  if(ev.scope==='global') return true;\n  if(ev.scope==='regional') return dist(x,y,ev.cx,ev.cy)<=10;\n  return ev.cityId===cityId;\n}\nfunction evMul(b,x,y,kind){\n  let m=1;\n  for(const ev of S.active){\n    if(!inScope(ev,x,y,b.cid)) continue;\n    const d=DEF[b.type]||{};\n    if(ev.id==='seca' && kind==='food'){ const merc=Math.min(3,countType('mercado')); m*=Math.min(1,0.7+0.1*merc); }\n    if(ev.id==='migracao' && b.type==='caca') m*=0.4;\n    if(ev.id==='tempestade' && ev.cityId===b.cid) m*=0.5;\n    if(ev.id==='revolta' && ev.cityId===b.cid) m*=(countType('policia',b.cid)?0.85:0.7);\n    if(ev.id==='festival' && ev.cityId===b.cid && kind==='food') m*=1.2;\n    if(ev.id==='greve' && ev.cityId===b.cid && (d.cat==='industria'||d.cat==='recursos')) m*=0.5;\n  }\n  return m;\n}\nfunction hasHospitalNear(c){ return countType('hospital',c.id)>0; }\nfunction evApplyInstant(p){\n  const ev=EVENTS.find(e=>e.id===p.id);\n  const target=cityById(p.cityId)||capital();\n  const cx=p.cx!==undefined?p.cx:target.x, cy=p.cy!==undefined?p.cy:target.y;\n  if(ev.id==='enchente'){\n    const rivers=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(S.grid[y][x].t==='rio') rivers.push([x,y]);\n    const cand=[];\n    for(const o of buildingsList()){\n      if((o.b.pid||0)!==0||o.b.type==='base'||o.b.type==='estrada') continue;\n      if(rivers.some(([rx,ry])=>dist(o.x,o.y,rx,ry)<=2)) cand.push(o);\n    }\n    if(!cand.length){ log('Enchente: o rio não atingiu nenhuma construção.'); return; }\n    const o=pick(cand); S.grid[o.y][o.x].b=null; invalidate(); log('Enchente destruiu '+(DEF[o.b.type]||{n:'uma construção'}).n+'.');\n    computeNetwork();\n  }\n  if(ev.id==='deposito'){\n    let placed=0;\n    for(let i=0;i<60&&placed<5;i++){\n      const x=target.x+Math.floor(Math.random()*9)-4, y=target.y+Math.floor(Math.random()*9)-4;\n      if(x<0||y<0||x>=N||y>=N) continue;\n      const t=S.grid[y][x]; if(t.b||t.t!=='planicie') continue;\n      t.t='minerio'; placed++;\n    }\n    log('Descoberta de minério perto de '+target.name+'.');\n  }\n  if(ev.id==='incendio'){\n    const bombeiros=countType('bombeiro');\n    let burned=0;\n    for(let y=cy-5;y<=cy+5;y++) for(let x=cx-5;x<=cx+5;x++){\n      if(x<0||y<0||x>=N||y>=N) continue;\n      if(S.grid[y][x].t==='floresta'){ S.grid[y][x].t='planicie'; burned++; }\n    }\n    for(const o of buildingsList()){\n      if(dist(o.x,o.y,cx,cy)>2||o.b.type==='base'||(o.b.pid||0)!==0) continue;\n      if(rnd()<(bombeiros?0.1:0.3)) S.grid[o.y][o.x].b=null;\n    }\n    invalidate();\n    log('Incêndio florestal: '+burned+' tiles de floresta queimaram.');\n    computeNetwork();\n  }\n  if(ev.id==='incendio_fab'){\n    const inds=buildingsList().filter(o=>(o.b.pid||0)===0&&DEF[o.b.type]&&DEF[o.b.type].cat==='industria'&&o.b.level<=1);\n    if(!inds.length){ log('Incêndio em fábrica: nenhuma construção industrial de nível baixo.'); return; }\n    if(countType('bombeiro')&&rnd()<0.5){ log('Os bombeiros apagaram o incêndio na fábrica.'); return; }\n    const o=pick(inds); S.grid[o.y][o.x].b=null; invalidate(); log('Incêndio destruiu '+DEF[o.b.type].n+'.');\n    computeNetwork();\n  }\n  if(ev.id==='terremoto'){\n    const cand=buildingsList().filter(o=>(o.b.pid||0)===0&&o.b.type!=='base'&&dist(o.x,o.y,cx,cy)<=8);\n    let n=0;\n    while(cand.length&&n<3){ const i=Math.floor(Math.random()*cand.length); const o=cand.splice(i,1)[0]; S.grid[o.y][o.x].b=null; n++; }\n    invalidate();\n    log('Terremoto: '+n+' construções foram destruídas.');\n    computeNetwork();\n  }\n}\nfunction scheduleEvent(){\n  const lvl=maxLevel();\n  const pool=EVENTS.filter(e=>e.lvl<=lvl);\n  const ev=pick(pool);\n  const cityC=pick(S.cities);\n  const p={id:ev.id,at:S.turn+1,cityId:cityC.id,cx:cityC.x,cy:cityC.y};\n  if(ev.id==='incendio'||ev.id==='epidemia'||ev.id==='terremoto'){ p.cx=cityC.x+Math.floor(Math.random()*7)-3; p.cy=cityC.y+Math.floor(Math.random()*7)-3; }\n  S.pending=p;\n  log('Aviso: '+ev.n+' pode acontecer no próximo turno.');\n  sfx('alert');\n}\nfunction applyPending(){\n  const p=S.pending; if(!p || p.at>S.turn) return;\n  S.pending=null;\n  const ev=EVENTS.find(e=>e.id===p.id);\n  S.evHistory.push({turn:S.turn,id:ev.id});\n  hist('Evento: '+ev.n+'.');\n  if(ev.dur===0){ evApplyInstant(p); return; }\n  const a={id:ev.id,n:ev.n,start:S.turn,end:S.turn+ev.dur,scope:ev.scope,cityId:p.cityId,cx:p.cx,cy:p.cy};\n  S.active.push(a);\n  log('Evento: '+ev.n+'. '+ev.desc);\n  if(ev.id==='incendio') evApplyInstant(p);\n}\nfunction eventsTick(){\n  S.active=S.active.filter(e=>e.end>S.turn);\n  if(!S.pending && S.turn%EV_EVERY===0 && rnd()<EV_CHANCE && S.turn>=5) scheduleEvent();\n  applyPending();\n  for(const e of S.active){\n    if(e.id==='peste'){\n      const c=cityById(e.cityId); if(c && c.adults>0 && rnd()<(hasHospitalNear(c)?0.02:0.05)){ c.adults--; log('A peste matou um adulto em '+c.name+'.'); }\n    }\n    if(e.id==='epidemia'){\n      for(const c of S.cities){\n        if(dist(c.x,c.y,e.cx,e.cy)>10||c.adults<=0) continue;\n        if(rnd()<(hasHospitalNear(c)?0.02:0.06)){ c.adults--; log('A epidemia matou um adulto em '+c.name+'.'); }\n      }\n    }\n  }\n}\n\n// ---------- Economia ----------\nfunction foodMult(){ return 1+0.2*Math.min(2,countType('mercado')); }\n\nfunction computePower(){\n  let supply=0;\n  const acidente=S.active.some(e=>e.id==='acidente');\n  const crise=S.active.some(e=>e.id==='crise_energia');\n  for(const o of buildingsList()){\n    const d=DEF[o.b.type]; if(!d||!d.power||o.b.workers<=0) continue;\n    const f=o.b.workers/d.cap;\n    if(S.res.carvao>=d.inp.carvao*f){ S.res.carvao-=d.inp.carvao*f; supply+=d.power*f*(acidente?0.5:1)*(crise?0.7:1); }\n  }\n  let demand=0;\n  for(const o of buildingsList()){ const d=DEF[o.b.type]; if(d&&d.elec) demand+=1; }\n  power={supply:Math.round(supply),demand,ratio: demand===0?1:Math.min(1,supply/demand)};\n}\n\nfunction addCityProd(cid,r,amt){ const c=cityById(cid); if(!c) return; c.prod=c.prod||{}; c.prod[r]=(c.prod[r]||0)+amt; }\nfunction produce(){\n  computePower();\n  for(const c of S.cities) c.prod={};\n  const roadLv={}; for(const o of buildingsList()) if(o.b.type==='estrada') roadLv[o.b.cid]=(roadLv[o.b.cid]||0)+(o.b.level||1);\n  const boom=S.active.some(e=>e.id==='boom');\n  for(const o of buildingsList()){\n    if((o.b.pid||0)!==0) continue;\n    const d=DEF[o.b.type]; if(!d||!d.cap) continue;\n    let f=o.b.workers/d.cap; if(S.mutirao>S.turn) f*=2; if(f<=0) continue;\n    if(d.power) continue;\n    const mult=1+0.5*(o.b.level-1);\n    let eff=f*mult;\n    if(!isConn(o.x,o.y)) eff*=0.5;\n    else eff*=1+Math.min(0.10,0.01*(roadLv[o.b.cid]||0));\n    if(d.elec) eff*=power.ratio;\n    eff*=evMul(o.b,o.x,o.y,d.out&&d.out.food?'food':'other');\n    eff*=cityMood(o.b.cid);\n    if(d.inp){\n      let ratio=1;\n      for(const r in d.inp){ const need=d.inp[r]*f; if(need>0) ratio=Math.min(ratio,S.res[r]/need); }\n      ratio=Math.max(0,Math.min(1,ratio));\n      if(ratio<=0) continue;\n      for(const r in d.inp){ S.res[r]-=d.inp[r]*f*ratio; led(r,o.b.type,-d.inp[r]*f*ratio); addCityProd(o.b.cid,r,-d.inp[r]*f*ratio); }\n      eff*=ratio;\n    }\n    if(d.need){\n      const n=d.need==='rio'?countTerrain(o.x,o.y,1,'rio'):countTerrain(o.x,o.y,d.r,d.need);\n      if(n<=0) continue;\n      eff*=Math.min(1,n/4);\n      if(o.b.type==='caca' && Math.random()<0.03) depleteOne(o.x,o.y,d.r,'animais','planicie');\n      if(o.b.type==='mina' && Math.random()<0.01) depleteOne(o.x,o.y,d.r,'minerio','planicie');\n      if(o.b.type==='mina_carvao' && Math.random()<0.01) depleteOne(o.x,o.y,d.r,'carvao','planicie');\n      if(o.b.type==='poco' && Math.random()<0.01) depleteOne(o.x,o.y,d.r,'petroleo','planicie');\n    }\n    if(d.out){\n      for(const r in d.out){\n        let amt=d.out[r]*eff*cf('gain');\n        if(r==='food') amt*=foodMult();\n        if(r==='food' && hasTech('agri')) amt*=1.1;\n        if(r==='science' && boom) amt*=1.25;\n        S.res[r]=(S.res[r]||0)+amt; led(r,o.b.type,amt); addCityProd(o.b.cid,r,amt);\n        S.gained=S.gained||{}; S.gained[r]=(S.gained[r]||0)+amt;\n      }\n    }\n    if(o.b.type==='escola' && S.religion==='sec'){ S.res.science+=2*eff; led('science',o.b.type,2*eff); addCityProd(o.b.cid,'science',2*eff); }\n    for(const tb of TECH_BONUS){\n      if(o.b.type===tb.type && hasTech(tb.tech)){ const q=tb.amt*eff; S.res[tb.res]=(S.res[tb.res]||0)+q; led(tb.res,o.b.type,q); addCityProd(o.b.cid,tb.res,q); }\n    }\n  }\n}\n\nfunction consumption(){ return S.cities.reduce((s,c)=>s+c.adults*0.25+c.children*0.125,0); }\nfunction consume(){\n  S.res.food-=consumption(); led('food','pop',-consumption());\n  if(S.res.food<0){\n    S.res.food=0;\n    for(const c of S.cities) c.starve=(c.starve||0)+1;\n    const worst=S.cities.reduce((a,b)=>((a.starve||0)>=(b.starve||0)?a:b));\n    if(worst.starve%5===0 && worst.adults>0){ worst.adults--; log('A fome matou um adulto em '+worst.name+'.'); }\n  } else S.cities.forEach(c=>c.starve=0);\n}\nfunction births(){\n  for(const c of S.cities){\n    if((S.turn%3===0 || S.turn<(c.buffEnd||0)) && S.res.food>40 && c.happy>=60 && c.adults+c.children<capPop(c.id)){ c.children++; log('Nasceu uma criança em '+c.name+'.'); }\n    // Criança vira adulto a cada 12 turnos; se não houver nenhum adulto, a primeira criança amadurece na hora (senão a cidade trava).\n    if(c.children>0 && (c.adults===0 || S.turn%12===0)){ c.children--; c.adults++; log('Uma criança de '+c.name+' virou adulta.'); }\n  }\n}\n\nfunction acadLevel(){ let m=0; for(const o of buildingsList()) if((o.b.pid||0)===0 && o.b.type==='academia') m=Math.max(m,o.b.level); return m; }\nfunction armyLimit(){ return Math.min(1000,(capital().level+acadLevel())*100); }\nfunction cityMult(){ return [1,1.2,1.5,1.8][capital().level-1]; }\nfunction recruit(type,fast){\n  // (a checagem de desbloqueio fica em unitUnlocked)\n  const u=UNITS[type];\n  if(countType('quartel')<1 && !u.req){ log('Construa um Quartel primeiro.'); return; }\n  if(u.req && countType(u.req)<1){ log('Construa '+DEF[u.req].n+' primeiro.'); return; }\n  if(acadLevel()<u.acad){ log('Academia Militar Nível '+u.acad+' necessária.'); return; }\n  const c=capital();\n  if(c.adults<=0){ log('Sem adultos disponíveis na capital.'); return; }\n  if(armySpace()+u.space>armyLimit()){ log('Limite do exército atingido ('+armyLimit()+').'); return; }\n  const cost=u.manut*(fast?4:2)*cf('ucost');\n  if(S.res.ouro<cost){ log('Ouro insuficiente.'); return; }\n  S.res.ouro-=cost; c.adults--;\n  S.queue.push({type,left:fast?1:2});\n  log(u.n+' em treinamento'+(fast?' (rápido).':'.'));\n}\nfunction militaryTick(){\n  const colapso=S.active.some(e=>e.id==='colapso');\n  for(const c of S.cities){\n    const tx=TAX[c.tax];\n    const tax=(c.adults*tx.a+c.children*tx.c)*(1+0.15*(c.level-1))*(colapso?0.8:1);\n    S.res.ouro+=tax; led('ouro','impostos',tax);\n  }\n  let upkeep=0;\n  for(const g of groupsOf(0)) for(const t of Object.keys(g.units)) upkeep+=UNITS[t].manut*g.units[t];\n  S.res.ouro-=upkeep*cityMult(); led('ouro','exercito',-upkeep*cityMult());\n  if(S.res.ouro<0){ S.morale=Math.max(0,S.morale-10); }\n  else S.morale=Math.min(100,S.morale+5);\n  if(S.morale<10){\n    let deserters=0;\n    for(const g of groupsOf(0)){\n      for(const t of Object.keys(g.units)){\n        let lost=0;\n        for(let i=0;i<g.units[t];i++) if(Math.random()<0.5) lost++;\n        g.units[t]-=lost; deserters+=lost;\n        if(g.units[t]<=0) delete g.units[t];\n      }\n    }\n    pruneGroups();\n    if(deserters){ capital().adults+=deserters; log(deserters+' unidade(s) debandou(aram).'); }\n  }\n  const rest=[];\n  for(const q of S.queue){\n    q.left--;\n    if(q.left<=0){\n      if(spawnUnit(q.type,0)) log(UNITS[q.type].n+' pronto no mapa.');\n      else { q.left=0; rest.push(q); }\n    }\n    else rest.push(q);\n  }\n  S.queue=rest;\n}\n\nfunction enemyNear(c,r){\n  return S.groups.some(g=>(g.pid||0)!==(c.pid||0) && Math.abs(g.x-c.x)<=r && Math.abs(g.y-c.y)<=r);\n}\nfunction cityMood(cid){\n  const c=S.cities.find(x=>x.id===cid); if(!c) return 1;\n  let m=1;\n  if(S.turn<(c.buffEnd||0)) m*=1.15;\n  if(c.happy<40) m*=0.9;\n  return m;\n}\nfunction happinessAll(){\n  for(const c of S.cities){\n    const pop=c.adults+c.children, cap=capPop(c.id);\n    const over=Math.max(0,pop-cap);\n    const F=[['Base',45],['Impostos '+TAX[c.tax].n.toLowerCase(),TAX[c.tax].h]];\n    if(S.active.some(e=>e.id==='festival'&&e.cityId===c.id)) F.push(['Festival',10]);\n    for(const o of cityBuildings(c.id)){\n      const b=o.b;\n      if(b.type==='altar') F.push(['Altar',5*b.level]);\n      for(const th of TECH_HAPPY_B) if(b.type===th.type && hasTech(th.tech)) F.push([th.n,th.amt]);\n      if(b.type==='escola') F.push(['Escola',3*b.level]);\n      if(b.type==='templo'){\n        if(S.religion==='fund') F.push(['Templo (fundamentalismo)',10*b.level+10]);\n        else if(S.religion!=='sec') F.push(['Templo',10*b.level]);\n      }\n      if(b.type==='hospital') F.push(['Hospital',4*b.level]);\n      if(b.type==='estadio') F.push(['Estádio',10]);\n      if(b.type==='monumento') F.push(['Monumento',8*b.level]);\n      if(b.type==='forum') F.push(['Fórum',6]);\n      if(b.type==='casa') F.push(['Casas evoluídas',(b.stage-1)*2]);\n    }\n    for(const g of TECH_HAPPY_G) if(hasTech(g.tech)) F.push([g.n,g.amt]);\n    if(hasTech('culto') && countType('templo',c.id)>0) F.push(['Culto',5]);\n    if(houses(c.id)>0){\n      if(netCount(c.net,'bombeiro')===0) F.push(['Sem bombeiros',-5]);\n      if(netCount(c.net,'policia')===0) F.push(['Sem polícia',-5]);\n    }\n    if(S.res.food<=0) F.push(['Fome (sem comida)',-20]);\n    if(over>0) F.push(['Casas lotadas',-Math.min(10,over*2)]);\n    if(S.religion==='fund' && countType('templo',c.id)===0) F.push(['Fundamentalismo sem templo',-5]);\n    const pen=Math.min(15,Math.floor(Math.max(0,pop-8)/3));\n    if(pen) F.push(['População grande',-pen]);\n    if(S.res.food<30) F.push(['Comida baixa',-5]);\n    if(c.starve>0) F.push(['Passando fome',-8]);\n    if(enemyNear(c,6)) F.push(['Inimigos por perto',-10]);\n    const agg=[];\n    for(const [l,v] of F){ const e=agg.find(x=>x[0]===l); if(e) e[1]+=v; else agg.push([l,v]); }\n    c.happyFactors=agg;\n    const t=agg.reduce((s,x)=>s+x[1],0);\n    if(c.happy===undefined) c.happy=50;\n    c.happyTarget=Math.max(0,Math.min(100,Math.round(t)));\n    const d=c.happyTarget-c.happy;\n    c.happy+= d>0 ? Math.min(2,d) : Math.max(-4,d);\n    if(pop>cap*0.9 && pop>10 && rnd()<0.25) c.happy-=1;\n    c.happy=Math.max(0,Math.min(100,Math.round(c.happy)));\n    if(c.happy<50) c.buffEnd=0;\n    if(c.happy>=75 && S.turn>=(c.buffCd||0)){\n      c.buffEnd=S.turn+8; c.buffCd=S.turn+20;\n      log(c.name+': povo animado, produção e crescimento +15% por 8 turnos.');\n      hist(c.name+': povo animado, bônus de produção por 8 turnos.');\n    }\n  }\n}\n\n// ---------- Destruição de cidades ----------\nfunction destroyCity(c,reason,attackerPid){\n  const owner=cityOwner(c);\n  ruinTile(c.x,c.y,attackerPid);\n  for(let y=Math.max(0,c.y-8);y<=Math.min(N-1,c.y+8);y++)\n    for(let x=Math.max(0,c.x-8);x<=Math.min(N-1,c.x+8);x++){\n      const b=S.grid[y][x].b; if(b && b.cid===c.id) ruinTile(x,y,attackerPid);\n    }\n  invalidate();\n  if(owner===0) S.cities=S.cities.filter(x=>x.id!==c.id);\n  else { const p=S.ai[owner-1]; p.cities=p.cities.filter(x=>x.id!==c.id); }\n  log(c.name+' foi destruída'+(reason?' '+reason:'')+'.');\n  if(owner===0) hist('Perdeu '+c.name+(reason?' ('+reason+')':'')+'.');\n  sfx('alert');\n  if(c.capital){\n    if(owner===0){ S.over='defeat'; log('Sua capital foi destruída.'); }\n    else eliminate(owner);\n  } else if(owner===0 && S.cities.length===0){ S.over='defeat'; }\n  computeNetwork(); computeContacts();\n}\nfunction eliminate(pid){\n  const p=S.ai[pid-1];\n  if(p.dead) return;\n  p.dead=true;\n  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const b=S.grid[y][x].b; if(b && b.pid===pid) S.grid[y][x].b=null; }\n  S.groups=S.groups.filter(g=>gPid(g)!==pid);\n  p.cities=[];\n  invalidate();\n  log(p.name+' foi derrotada.');\n}\n\n// ---------- Guerra e acordos ----------\nfunction declareWar(a,b){\n  const r=relGet(a,b);\n  if(r.war) return;\n  r.war=true; r.pacto=false; r.comercio=false; r.alianca=false; r.conf=Math.min(r.conf,-30);\n  log(pname(a)+' declarou guerra a '+pname(b)+'.');\n  if(a===0||b===0) hist('Declarou guerra a '+pname(a===0?b:a)+'.');\n  sfx('alert');\n}\nfunction makePeace(a,b){\n  const r=relGet(a,b);\n  r.war=false; r.conf=Math.max(r.conf,-20);\n  log(pname(a)+' e '+pname(b)+' firmaram a paz.');\n  if(a===0||b===0) hist('Fez paz com '+pname(a===0?b:a)+'.');\n}\nfunction wouldAccept(aiPid,fromPid,type){\n  const r=relGet(aiPid,fromPid);\n  if(r.traitorUntil>S.turn) return false;\n  if(type==='pacto') return r.conf>=0 && !r.war;\n  if(type==='comercio') return r.pacto && r.conf>=25 && !r.war;\n  if(type==='alianca') return r.comercio && r.conf>=60 && !r.war;\n  if(type==='paz') return r.war && r.conf>-30;\n  return false;\n}\nfunction applyDeal(a,b,type){\n  if(a===0||b===0 && type!=='paz') hist('Acordo com '+pname(a===0?b:a)+': '+({pacto:'pacto de não-agressão',comercio:'comércio',alianca:'aliança'}[type]||type)+'.');\n  const r=relGet(a,b);\n  if(type==='pacto'){ r.pacto=true; r.pactTurn=S.turn; log(pname(a)+' e '+pname(b)+' assinaram pacto de não-agressão.'); }\n  if(type==='comercio'){ r.comercio=true; log(pname(a)+' e '+pname(b)+' fecharam comércio.'); }\n  if(type==='alianca'){ r.alianca=true; log(pname(a)+' e '+pname(b)+' formaram aliança.'); }\n  if(type==='paz'){ makePeace(a,b); }\n}\nfunction breakPact(pid){\n  const r=relGet(0,pid);\n  if(!r.pacto){ log('Não há pacto para quebrar.'); return; }\n  const recent = S.turn - r.pactTurn <= 10;\n  r.pacto=false; r.comercio=false; r.alianca=false;\n  if(recent){ r.conf-=50; r.traitorUntil=S.turn+20; log('Pacto quebrado logo após assinado: '+pname(pid)+' marcou sua tribo como traidora.'); }\n  else { r.conf-=30; log('Pacto com '+pname(pid)+' quebrado.'); }\n  hist('Quebrou o pacto com '+pname(pid)+'.');\n}\nfunction proposeToAI(pid,type){\n  if(!wouldAccept(pid,0,type)){ log(pname(pid)+' recusou a proposta de '+type+'.'); return; }\n  applyDeal(0,pid,type);\n}\nfunction sendInbox(from,type){\n  S.inbox.push({from,type,turn:S.turn});\n  log(pname(from)+' propõe '+type+' a você. Veja a diplomacia.');\n}\nfunction acceptInbox(i){\n  const it=S.inbox[i]; if(!it) return;\n  if(!wouldAccept(it.from,0,it.type)){ log('A proposta não é mais válida.'); }\n  else applyDeal(0,it.from,it.type);\n  S.inbox.splice(i,1);\n}\nfunction rejectInbox(i){ S.inbox.splice(i,1); }\n\n// ---------- IA: economia, expansão e decisões ----------\nfunction aiEconomyTickOld(p){\n  const r=p.res;\n  for(const c of p.cities){\n    r.food+=1.5*c.level; r.wood+=1.0*c.level; r.stone+=0.8*c.level; r.metal+=0.3*c.level; r.ouro+=c.adults*0.3;\n  }\n  const adults=p.cities.reduce((s,c)=>s+c.adults,0);\n  r.food-=adults*0.25;\n  if(r.food<0){ r.food=0; if(adults>0 && S.turn%6===0){ const c=p.cities.find(x=>x.adults>0); if(c) c.adults--; } }\n  if(S.turn%6===0) for(const c of p.cities){ if(r.food>15 && c.adults<8+c.level*6) c.adults++; }\n  if(S.turn%30===0) for(const c of p.cities){ if(c.level<3 && c.adults>=8 && r.wood>=40 && r.stone>=40){ r.wood-=40; r.stone-=40; c.level++; log(c.name+' evoluiu para o Nível '+c.level+'.'); break; } }\n  aiUpkeep(p);\n}\nfunction aiTryFound(p){\n  if(p.cities.length>=4) return;\n  if(p.res.wood<60||p.res.stone<30) return;\n  const cap=p.cities.find(c=>c.capital)||p.cities[0];\n  const cand=p.cities.filter(c=>c.adults>=FOUND_POP+2);\n  if(!cand.length) return;\n  for(let i=0;i<40;i++){\n    const x=cap.x+Math.floor(Math.random()*25)-12, y=cap.y+Math.floor(Math.random()*25)-12;\n    if(x<1||y<1||x>=N-1||y>=N-1) continue;\n    const tile=S.grid[y][x];\n    if(tile.b||tile.t==='rio') continue;\n    if(!farFromAllCities(x,y)) continue;\n    const from=cand[0];\n    p.res.wood-=60; p.res.stone-=30;\n    from.adults-=FOUND_POP;\n    const id=S.nextId++;\n    const nc={id,pid:p.pid,name:p.name.split(' ')[0]+' '+id,x,y,level:1,capital:false,adults:FOUND_POP,children:0,happy:50,tax:'padrao',starve:0};\n    p.cities.push(nc);\n    tile.b={type:'base',cid:id,pid:p.pid,level:1,workers:0};\n    invalidate();\n    log(p.name+' fundou '+nc.name+'.');\n    return;\n  }\n}\nfunction aiDecide(p){\n  for(const q of livingPids()){\n    if(q===p.pid || !contactOf(p.pid,q)) continue;\n    const r=relGet(p.pid,q);\n    if(r.war){\n      if(p.diff!=='pacifista' && r.conf>-30 && rnd()<0.25){ makePeace(p.pid,q); continue; }\n      continue;\n    }\n    if(p.diff==='agressiva' && r.conf<-20 && armyCount(p.pid)>=6 && rnd()<0.4){ declareWar(p.pid,q); continue; }\n    if(p.diff==='normal' && r.conf<=-50 && armyCount(p.pid)>=8){ declareWar(p.pid,q); continue; }\n    if(r.pacto && p.diff==='agressiva' && r.conf<-30 && S.turn-r.pactTurn>10){ r.pacto=false; r.comercio=false; r.conf-=20; log(pname(p.pid)+' quebrou o pacto com '+pname(q)+'.'); continue; }\n    if(!r.pacto && r.conf>=0 && rnd()<0.4){\n      if(q===0) sendInbox(p.pid,'pacto');\n      else if(wouldAccept(q,p.pid,'pacto')) applyDeal(p.pid,q,'pacto');\n    } else if(r.pacto && !r.comercio && r.conf>=25 && rnd()<0.3){\n      if(q===0) sendInbox(p.pid,'comercio');\n      else if(wouldAccept(q,p.pid,'comercio')) applyDeal(p.pid,q,'comercio');\n    } else if(r.comercio && !r.alianca && r.conf>=60 && rnd()<0.2){\n      if(q===0) sendInbox(p.pid,'alianca');\n      else if(wouldAccept(q,p.pid,'alianca')) applyDeal(p.pid,q,'alianca');\n    }\n  }\n}\n// ---------- IA: economia e construção ----------\nconst AI_STAGES=[\n  {t:0,list:['casa','coleta','caca','lenhador','pedreira','altar','pesca']},\n  {t:120,list:['escola','mercado','bombeiro','policia','serraria','marmoraria','mina','quartel','academia','templo']},\n  {t:250,list:['fabrica','mina_carvao','usina','universidade','hospital','fundicao']},\n  {t:400,list:['poco','refinaria','estadio','basearea','quartel_moderno']}\n];\nfunction shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\nfunction aiCount(c,type){ return buildingsList().filter(o=>o.b.cid===c.id && (type===undefined || o.b.type===type)).length; }\nfunction aiCityScore(c){\n  return buildingsList().filter(o=>o.b.cid===c.id && (o.b.pid||0)===c.pid && o.b.type!=='base' && o.b.type!=='casa' && o.b.type!=='estrada' && o.b.type!=='ruina' && inBase(o.x,o.y,c)).reduce((s,o)=>s+(o.b.level||1),0);\n}\nfunction aiCanPay(p,c){ for(const k in c) if((p.res[k]||0)<c[k]) return false; return true; }\nfunction aiPay(p,c){ for(const k in c) p.res[k]-=c[k]; }\nfunction aiBuildable(p){\n  const lvl=Math.max(...p.cities.map(c=>c.level));\n  const out=[];\n  for(const st of AI_STAGES){\n    if(S.turn<st.t) continue;\n    for(const k of st.list){ const d=DEF[k]; if(!d) continue; if(d.era && d.era>lvl) continue; out.push(k); }\n  }\n  return out;\n}\nfunction aiSpot(c,k){\n  const d=DEF[k];\n  for(let r=1;r<=6;r++){\n    for(const p of shuffleArr(ringAround(c,r))){\n      const t=S.grid[p.y][p.x];\n      if(t.b||t.t==='rio'||groupAt(p.x,p.y)) continue;\n      if(!inBase(p.x,p.y,c)||!nearBuild(p.x,p.y,c.pid)) continue;\n      if(d.need){ const n=d.need==='rio'?countTerrain(p.x,p.y,1,'rio'):countTerrain(p.x,p.y,d.r,d.need); if(n<1) continue; }\n      return p;\n    }\n  }\n  return null;\n}\nfunction aiEconomyTick(p){\n  const r=p.res, before={}; for(const k in r) before[k]=r[k]||0;\n  aiEconomyTickRaw(p);\n  const m=cf('aiGain'); if(m===1) return;\n  for(const k in r){ const d=(r[k]||0)-before[k]; if(d>0) r[k]=before[k]+d*m; }\n}\nfunction aiEconomyTickRaw(p){\n  const r=p.res;\n  const adultsSum=p.cities.reduce((s,c)=>s+c.adults,0);\n  for(const c of p.cities){\n    r.food+=1.5+c.level*0.8; r.wood+=0.5+c.level*0.8; r.stone+=0.3+c.level*0.6; r.metal+=c.level*0.3;\n    r.ouro+=c.adults*0.3;\n    r.tabua=(r.tabua||0)+0.4*c.level; r.lapida=(r.lapida||0)+0.3*c.level; r.aco=(r.aco||0)+0.2*c.level;\n    r.carvao=(r.carvao||0)+0.2*c.level; r.bens=(r.bens||0)+0.2*c.level;\n  }\n  for(const o of buildingsList()){\n    if((o.b.pid||0)!==p.pid) continue;\n    const d=DEF[o.b.type]; if(!d||!d.out) continue;\n    for(const k in d.out) r[k]=(r[k]||0)+d.out[k]*0.25*(o.b.level||1);\n  }\n  r.food-=adultsSum*0.25;\n  if(r.food<0) r.food=0;\n  if(S.turn%6===0) for(const c of p.cities){\n    const cap=Math.max(4,aiCount(c,'casa')*4);\n    if(r.food>15 && c.adults+c.children<cap) c.adults++;\n  }\n  aiUpkeep(p);\n}\nfunction aiBuildTick(p){\n  if(p.dead||!p.cities.length) return;\n  for(const c of p.cities){\n    if(c.level<10){\n      const next=c.level+1, rq=BASE_REQ[next];\n      if(aiCityScore(c)>=rq.score && aiCanPay(p,rq.cost)){ aiPay(p,rq.cost); c.level=next; log(c.name+' evoluiu para o Nível '+next+'.'); }\n    }\n  }\n  if(S.turn%2===0){\n    for(const o of buildingsList()){\n      const b=o.b; if(b.type!=='casa'||(b.pid||0)!==p.pid) continue;\n      const c=p.cities.find(x=>x.id===b.cid); if(!c) continue;\n      if((b.stage||1)>=Math.min(c.level,4)) continue;\n      const next=(b.stage||1)+1, cost=next===2?{wood:20}:next===3?{stone:30}:{tabua:20,lapida:20};\n      if(aiCanPay(p,cost)){ aiPay(p,cost); b.stage=next; break; }\n    }\n  }\n  const every=p.diff==='agressiva'?3:p.diff==='normal'?4:6;\n  if(S.turn%every!==0) return;\n  const city=p.cities.slice().sort((a,b)=>aiCount(a)-aiCount(b))[0];\n  let kinds;\n  if(rnd()<0.5) kinds=['casa'];\n  else kinds=shuffleArr(aiBuildable(p).filter(k=>k!=='casa'));\n  for(const k of kinds.slice(0,6)){\n    const d=DEF[k]; if(!d||!aiCanPay(p,d.c)) continue;\n    const spot=aiSpot(city,k); if(!spot) continue;\n    aiPay(p,d.c);\n    S.grid[spot.y][spot.x].b={type:k,cid:city.id,pid:p.pid,level:1,workers:0,stage:1};\n    invalidate();\n    return;\n  }\n}\nfunction aiTick(){\n  for(const p of S.ai){\n    if(p.dead) continue;\n    aiEconomyTick(p);\n    aiBuildTick(p);\n    if(S.turn%5===0) aiTryFound(p);\n    aiTrain(p);\n    if(S.turn-p.lastDec>=DIFF_INTERVAL[p.diff]){ p.lastDec=S.turn; aiDecide(p); }\n  }\n  aiGroupsTurn();\n}\n\nfunction diplomacyTick(){\n  for(const k in S.rel){\n    const r=S.rel[k];\n    if(r.war) r.conf=Math.max(-100,r.conf-0.5);\n    else if(r.conf>0) r.conf=Math.max(0,r.conf-0.2);\n    else if(r.conf<0) r.conf=Math.min(0,r.conf+0.2);\n    if(r.comercio) r.conf=Math.min(100,r.conf+0.3);\n  }\n  for(const k in S.rel){\n    const r=S.rel[k];\n    if(r.comercio && k.split('|').includes('0')){\n      const colapso=S.active.some(e=>e.id==='colapso');\n      S.res.ouro+=5*(colapso?0.8:1);\n    }\n  }\n  S.inbox=S.inbox.filter(i=>S.turn-i.turn<=5);\n}\nfunction checkEnd(){\n  if(S.over==='defeat') return;\n  const aiAlive=S.ai.some(p=>!p.dead);\n  if(!S.victoryShown && !aiAlive && S.cities.length>0){ S.over='victory'; S.victoryShown=true; }\n}\n\nfunction tick(){\n  if(!S || S.over==='defeat') return;\n  S.turn++;\n  const pr={...S.res}; S.prevRes=pr; S.ledger={};\n  invalidate();\n  healTick();\n  computeNetwork();\n  eventsTick();\n  advanceObras(); researchTick(); assignWorkers(); produce(); consume(); maintain(); births(); militaryTick(); happinessAll(); computeAlerts();\n  routesTick();\n  diplomacyTick();\n  aiTick();\n  S.delta={}; for(const k in S.res) S.delta[k]=(S.res[k]||0)-(pr[k]||0);\n  popMilestones();\n  computeContacts(); checkEnd();\n  if(opts.autosave) autosave();\n  updateMusic(false);\n  renderAll();\n}\nfunction loop(){\n  if(S && screen==='game' && S.speed>0 && !S.over && !modal) tick();\n  setTimeout(loop,(S&&S.speed===1)?1400:1000/Math.max(1,S?S.speed:1));\n}\n\n// ---------- Salvamentos ----------\nfunction getSaves(){ try{ return JSON.parse(localStorage.getItem('atlas_saves')||'[]'); }catch(e){ return []; } }\nfunction setSaves(a){ localStorage.setItem('atlas_saves',JSON.stringify(a)); }\nfunction getAuto(){ try{ return JSON.parse(localStorage.getItem('atlas_auto')||'null')||{idx:0,slots:[null,null,null]}; }catch(e){ return {idx:0,slots:[null,null,null]}; } }\nfunction setAuto(a){ localStorage.setItem('atlas_auto',JSON.stringify(a)); }\nfunction stamp(){ const d=new Date(); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }\nfunction snapshot(){ return JSON.stringify(S); }\nfunction autosave(){\n  const a=getAuto();\n  const slot={name:'Automático '+(a.idx+1)+' · turno '+S.turn,turn:S.turn,date:stamp(),data:snapshot()};\n  a.slots[a.idx]=slot;\n  a.idx=(a.idx+1)%3;\n  try{ setAuto(a); }catch(e){ log('Sem espaço para salvar automático.'); }\n}\nfunction manualSave(name){\n  name=(name||'').trim().slice(0,40);\n  if(!name){ log('Dê um nome ao salvamento.'); return; }\n  const list=getSaves();\n  list.push({id:Date.now(),name,turn:S.turn,date:stamp(),data:snapshot()});\n  try{ setSaves(list); log('Jogo salvo como \"'+name+'\".'); }\n  catch(e){ log('Sem espaço para salvar. Exclua saves antigos.'); }\n}\nfunction enterGame(){\n  screen='game'; modal=null;\n  document.getElementById('screen').style.display='none';\n  document.getElementById('game').style.visibility='visible';\n  document.getElementById('hud').style.display='flex';\n  document.getElementById('bottom').style.display='block';\n}\nfunction loadSave(data){\n  try{\n    S=JSON.parse(data); applyCosts(Object.assign({},PRESETS.normal,S.cfg||{}));\n    N=S.N;\n    invalidate();\n    computeNetwork(); computeContacts();\n    enterGame();\n    S.speed=S.mode==='turnos'?0:(S.speed||1);\n    resize(); centerCam(); log('Jogo carregado.'); renderAll();\n  }catch(e){ alert('Não foi possível carregar este save.'); }\n}\nfunction deleteSave(kind,idx){\n  if(kind==='manual'){ const l=getSaves(); l.splice(idx,1); setSaves(l); }\n  else { const a=getAuto(); a.slots[idx]=null; setAuto(a); }\n  renderModal();\n}\n\n// ---------- Telas ----------\nfunction showScreenBox(html){\n  document.getElementById('screenbox').innerHTML=html;\n  document.getElementById('screen').style.display='flex';\n  document.getElementById('game').style.visibility='hidden';\n  document.getElementById('hud').style.display='none';\n  document.getElementById('bottom').style.display='none';\n  applyScale();\n}\nfunction showTitle(){\n  screen='title'; modal=null;\n  showScreenBox(`\n    <h1>ATLAS<\/h1>\n    <div class=\"sub\">O despertar das civilizações<\/div>\n    <div class=\"row\"><button class=\"cbtn\" onclick=\"showCreate()\">Novo jogo<\/button><\/div>\n    <div class=\"row\"><button class=\"cbtn\" onclick=\"modal='saves';renderModal()\">Carregar<\/button><\/div>\n    <div class=\"row\"><button class=\"cbtn\" onclick=\"modal='opts';renderModal()\">Opções<\/button><\/div>\n    <div class=\"row\"><button class=\"cbtn sec2\" onclick=\"alert('Feche a aba do navegador para sair.')\">Sair<\/button><\/div>`);\n  renderModal();\n  updateMusic(false);\n}\nfunction fmtV(k,v){\n  if(k==='ias') return v==null?'auto':String(v);\n  if(k==='rio') return v?'sim':'não';\n  return Number(v).toFixed(2).replace(/\\.?0+$/,'')+'×';\n}\nconst SLIDERS=[\n  {g:'Recursos',items:[['gain','Produção dos prédios',0.25,3,0.05],['start','Estoque inicial',0.5,4,0.1]]},\n  {g:'Mapa',items:[['ore','Minérios e carvão',0.3,2,0.05],['nat','Natureza (floresta, caça, pedra)',0.5,2,0.05]]},\n  {g:'Construções',items:[['cost','Custo de construção',0.25,3,0.05],['maint','Manutenção de casas e ruas',0,3,0.05],['bld','Vida das construções',0.5,3,0.05]]},\n  {g:'Unidades',items:[['ucost','Custo de recrutamento',0.25,3,0.05],['loss','Perdas das suas tropas',0.1,3,0.05]]},\n  {g:'IAs',items:[['aiGain','Produção das IAs',0.25,3,0.05]]}\n];\nfunction setPreset(p){ creation.cfg=Object.assign({},PRESETS[p]); creation.preset=p; creation.diff=PRESETS[p].aiDiff; showCreate(); }\nfunction setCfg(k,v){\n  creation.cfg[k]=parseFloat(v); creation.preset=null;\n  const el=document.getElementById('v_'+k); if(el) el.textContent=fmtV(k,creation.cfg[k]);\n  document.querySelectorAll('.pre').forEach(b=>b.classList.toggle('on',b.dataset.p===creation.preset));\n}\nfunction setRio(v){ creation.cfg.rio=v; creation.preset=null; showCreate(); }\nfunction setIas(v){ creation.cfg.ias=v==='auto'?null:parseInt(v,10); creation.preset=null; showCreate(); }\nfunction showCreate(){\n  screen='create'; modal=null;\n  const c=creation, C=c.cfg;\n  const opt=(key,val,label,cur)=>`<div class=\"opt ${cur===val?'on':''}\" onclick=\"setCreate('${key}','${val}')\">${label}<\/div>`;\n  const sl=SLIDERS.map(gr=>`<div class=\"cgrp\">${gr.g}<\/div>`+gr.items.map(([k,lab,mn,mx,st])=>\n    `<div class=\"slid\"><span>${lab}<\/span><input type=\"range\" min=\"${mn}\" max=\"${mx}\" step=\"${st}\" value=\"${C[k]}\" oninput=\"setCfg('${k}',this.value)\"><b id=\"v_${k}\">${fmtV(k,C[k])}<\/b><\/div>`).join('')).join('');\n  const iasSel=`<select onchange=\"setIas(this.value)\">\n      <option value=\"auto\"${C.ias==null?' selected':''}>Automático (pelo tamanho)<\/option>\n      ${[1,2,3,4,5,6,7].map(n=>`<option value=\"${n}\"${C.ias===n?' selected':''}>${n}<\/option>`).join('')}<\/select>`;\n  showScreenBox(`\n    <h1>Nova tribo<\/h1>\n    <div class=\"sub\">Defina sua civilização<\/div>\n    <div class=\"row\"><div class=\"lbl\">Nome da tribo<\/div><input type=\"text\" id=\"cr_name\" maxlength=\"24\" value=\"${c.tribe.replace(/\"/g,'&quot;')}\" oninput=\"creation.tribe=this.value\"><\/div>\n    <div class=\"row\"><div class=\"lbl\">Emblema<\/div><div class=\"opts\">\n      ${EMBLEMS.map(e=>`<div class=\"opt emb ${c.emblem===e?'on':''}\" onclick=\"setCreate('emblem','${e}')\">${e}<\/div>`).join('')}\n    <\/div><\/div>\n    <div class=\"row\"><div class=\"lbl\">Tamanho do mundo<\/div><div class=\"opts\">\n      ${SIZES.map((s,i)=>`<div class=\"opt ${c.sizeIdx===i?'on':''}\" onclick=\"setCreate('sizeIdx',${i})\">${s.n} (${s.size}x${s.size}, ${s.ai} IAs)<\/div>`).join('')}\n    <\/div><\/div>\n    <div class=\"row\"><div class=\"lbl\">Modo de partida<\/div><div class=\"pres\">\n      ${Object.keys(PRESETS).map(p=>`<button class=\"pre ${c.preset===p?'on':''}\" data-p=\"${p}\" onclick=\"setPreset('${p}')\">${PRESET_NAMES[p]}<\/button>`).join('')}\n    <\/div><div class=\"ustat\">Predefinições ajustam tudo abaixo. Mexer num controle vira \"Personalizado\".<\/div><\/div>\n    <div class=\"row\"><div class=\"lbl\">Dificuldade das IAs<\/div><div class=\"opts\">\n      ${opt('diff','pacifista','Pacifista',c.diff)}${opt('diff','normal','Normal',c.diff)}${opt('diff','agressiva','Agressiva',c.diff)}\n    <\/div><\/div>\n    <div class=\"row\"><div class=\"lbl\">Personalizar<\/div>\n      ${sl}\n      <div class=\"cgrp\">Mapa e IAs<\/div>\n      <div class=\"slid\"><span>Rio no mapa<\/span><label><input type=\"checkbox\" ${C.rio?'checked':''} onchange=\"setRio(this.checked)\"> ${C.rio?'sim':'não'}<\/label><span><\/span><\/div>\n      <div class=\"slid\"><span>Número de IAs<\/span>${iasSel}<span><\/span><\/div>\n    <\/div>\n    <div class=\"row\"><div class=\"lbl\">Modo de jogo<\/div><div class=\"opts\">\n      ${opt('mode','tempo','Tempo real',c.mode)}${opt('mode','turnos','Por turnos',c.mode)}\n    <\/div><\/div>\n    <div class=\"row\" style=\"display:flex;gap:8px;justify-content:space-between;margin-top:18px\">\n      <button class=\"cbtn\" style=\"width:auto;padding:8px 18px\" onclick=\"showTitle()\">Voltar<\/button>\n      <button class=\"cbtn good\" style=\"width:auto;padding:8px 18px\" onclick=\"startFromCreate()\">Começar<\/button>\n    <\/div>`);\n}\nfunction setCreate(k,v){\n  if(k==='sizeIdx') creation.sizeIdx=v; else creation[k]=v;\n  showCreate();\n}\nfunction startFromCreate(){\n  const c=creation;\n  if(!c.tribe.trim()) c.tribe='Minha tribo';\n  const sz=SIZES[c.sizeIdx];\n  document.getElementById('screen').style.display='none';\n  document.getElementById('game').style.visibility='visible';\n  document.getElementById('hud').style.display='flex';\n  document.getElementById('bottom').style.display='block';\n  newGame({tribe:c.tribe.trim(),emblem:c.emblem,size:sz.size,diff:c.diff,mode:c.mode,cfg:c.cfg});\n  if(sz.size>80) log('Mundos grandes podem rodar mais devagar.');\n}\n// Menu de pausa (botão \"Menu\" ou Esc). A pausa de velocidade é o \"||\".\nfunction openPause(){\n  if(!S) return;\n  if(S.speed>0) S.prevSpeed=S.speed;\n  S.speed=0; modal='pause'; renderAll();\n}\nfunction closePause(){\n  modal=null;\n  S.speed=S.mode==='turnos'?0:(S.prevSpeed||1);\n  renderAll();\n}\nfunction setScale(v){ opts.scale=v; saveOpts(); applyScale(); renderModal(); }\nconst FLOW_NAME={pop:'Consumo da população',impostos:'Impostos',exercito:'Manutenção do exército'};\nfunction iconImg(icon,col){ return `<img src=\"${iconCanvas(icon,col,2).toDataURL()}\" width=\"16\" height=\"16\" style=\"vertical-align:middle;image-rendering:pixelated\">`; }\nfunction srcInfo(src){\n  if(DEF[src]) return {n:DEF[src].n, img:iconImg(DEF[src].icon,DEF[src].col)};\n  const ic={pop:['food','#5fbf4a'],impostos:['coin','#e0b84a'],exercito:['sword','#8a8a9a']}[src]||['gear','#999999'];\n  return {n:FLOW_NAME[src]||src, img:iconImg(ic[0],ic[1])};\n}\nconst ALL_RES=['food','wood','stone','metal','carvao','tabua','lapida','aco','bens','science','ouro','petroleo','asfalto','combustivel'];\nfunction resBlock(k){\n  const L=(S.ledger&&S.ledger[k])||{};\n  const rows=Object.entries(L).filter(([,v])=>Math.abs(v)>0.05).sort((a,b)=>b[1]-a[1]);\n  const net=rows.reduce((s,[,v])=>s+v,0);\n  const sgn=v=>(v>=0?'+':'')+v.toFixed(1);\n  let h=`<div class=\"resbox\"><div class=\"rhead\">${shapeSvg(k)}<span>${RES_NAME[k]||k}<\/span><span class=\"rv\">${Math.floor(S.res[k]||0)}<\/span><span class=\"${net>=0?'pos':'neg'}\">${rows.length?sgn(net):'0'}<\/span><\/div>`;\n  for(const [src,v] of rows){ const i=srcInfo(src); h+=`<div class=\"rsrc\">${i.img}<span>${i.n}<\/span><span class=\"v ${v>=0?'pos':'neg'}\">${sgn(v)}<\/span><\/div>`; }\n  return h+`<\/div>`;\n}\nfunction trajHtml(){\n  const H=(S.hist||[]).slice().reverse().slice(0,30);\n  if(!H.length) return '<div style=\"color:#6b5a3a\">Nada relevante ainda.<\/div>';\n  return H.map(e=>`<div class=\"tl\"><span class=\"tn\">Turno ${e.turn}<\/span>${e.t}<\/div>`).join('');\n}\nfunction renderModal(){\n  const pop=document.getElementById('pop');\n  if(!modal){ pop.style.display='none'; return; }\n  const back = screen==='game' ? `modal='pause';renderModal()` : `modal=null;showTitle()`;\n  if(modal==='pause'){\n    pop.innerHTML=`<h3>Menu<\/h3>\n      <button class=\"cbtn good\" onclick=\"closePause()\">Continuar<\/button>\n      <button class=\"cbtn\" onclick=\"modal='saves';renderModal()\">Salvos<\/button>\n      <button class=\"cbtn\" onclick=\"modal='opts';renderModal()\">Opções<\/button>\n      <button class=\"cbtn sec2\" onclick=\"modal=null;showTitle()\">Voltar ao menu inicial<\/button>`;\n  } else if(modal==='saves'){\n    const a=getAuto(), list=getSaves();\n    let h=`<h3>Salvos<\/h3>`;\n    if(screen==='game') h+=`<div class=\"stitle\">Salvar agora<\/div><div class=\"saveform\"><input type=\"text\" id=\"sv_name2\" maxlength=\"40\" placeholder=\"Nome do salvamento\"><button class=\"cbtn inl good\" onclick=\"act(()=>manualSave(document.getElementById('sv_name2').value));renderModal()\">Salvar<\/button><\/div>`;\n    h+=`<div class=\"stitle\">Manuais<\/div>`;\n    if(!list.length) h+=`<div style=\"color:#6b5a3a\">Nenhum salvamento manual.<\/div>`;\n    else {\n      h+=`<table class=\"tbl\"><tr><th>Nome<\/th><th>Turno<\/th><th>Data<\/th><th><\/th><\/tr>`;\n      list.forEach((s,i)=>{ h+=`<tr><td><b>${s.name}<\/b><\/td><td>${s.turn}<\/td><td style=\"font-size:11px\">${s.date}<\/td><td style=\"white-space:nowrap\"><button class=\"cbtn inl\" onclick=\"loadSave(getSaves()[${i}].data)\">Carregar<\/button><button class=\"cbtn inl sec2\" onclick=\"deleteSave('manual',${i})\">Excluir<\/button><\/td><\/tr>`; });\n      h+=`<\/table>`;\n    }\n    h+=`<div class=\"stitle\">Automáticos (3, em rotação)<\/div><table class=\"tbl\"><tr><th>Slot<\/th><th>Turno<\/th><th>Data<\/th><th><\/th><\/tr>`;\n    a.slots.forEach((s,i)=>{\n      if(s) h+=`<tr><td>${s.name}<\/td><td>${s.turn}<\/td><td style=\"font-size:11px\">${s.date}<\/td><td style=\"white-space:nowrap\"><button class=\"cbtn inl\" onclick=\"loadSave(getAuto().slots[${i}].data)\">Carregar<\/button><button class=\"cbtn inl sec2\" onclick=\"deleteSave('auto',${i})\">Excluir<\/button><\/td><\/tr>`;\n      else h+=`<tr><td colspan=\"4\" style=\"color:#6b5a3a\">Slot ${i+1} vazio<\/td><\/tr>`;\n    });\n    h+=`<\/table><button class=\"cbtn\" onclick=\"${back}\">Voltar<\/button>`;\n    pop.innerHTML=h;\n  } else if(modal==='stats'){\n    const tab=S.statsTab||'demo';\n    const isImp=S.statsCity===undefined||S.statsCity==='imp'||!S.cities.some(x=>x.id===S.statsCity);\n    const c=isImp?null:S.cities.find(x=>x.id===S.statsCity);\n    const tabs=[['demo','Demografia','flag'],['recursos','Recursos','coin'],['populacao','População','house'],['trajetoria','Trajetória','book']];\n    const cityBtns=`<button class=\"cban${isImp?' on':''}\" style=\"--pc:#c9a24a\" onclick=\"S.statsCity='imp';renderModal()\"><span>Império<\/span><\/button>`\n      +S.cities.map(x=>`<button class=\"cban${!isImp&&x.id===c.id?' on':''}\" style=\"--pc:${pcolor(0)}\" onclick=\"S.statsCity=${x.id};renderModal()\"><span>${x.capital?'★ ' escrição.<\/div><\/div>';\n      if(sel){\n        const s=stOf(sel);\n        det=`<div class=\"tdet\">\n          <div class=\"tdetT\">${sel.n} <span class=\"ustat\">· ${curTree.n} · ${sel.type==='manual'?'':''}<\/span><\/div>\n          <div>${sel.desc}<\/div>\n          <div class=\"ustat\">Custo: ${techCost(sel)} ciência · ${s==='known'?'Concluída':s==='cur'?'Pesquisando':s==='av'?'Disponível':'Bloqueada: falta '+sel.req.filter(r=>!T.known.includes(r)).map(r=>TECHS.find(t=>t.id===r).n).join(', ')}<\/div>\n          ${s==='av'||s==='cur'?`<button class=\"cbtn inl\" onclick=\"act(()=>researchSet('${sel.id}'))\">Pesquisar<\/button>`:''}\n          ${sel.id==='ferr'&&s==='known'?`<button class=\"cbtn inl\" ${S.res.ouro>=20?'':'disabled'} onclick=\"act(()=>activateMutirao())\">Ativar Mutirão (20 ouro)<\/button>`:''}\n        <\/div>`;\n      }\n      pop.innerHTML=`<h3>${curTree.n}<\/h3>\n        <div class=\"thead\"><button class=\"cbtn inl\" onclick=\"S.arvSel=null;S.techSel=null;renderModal()\">← Árvores<\/button><\/div>\n        ${hdr}\n        <div class=\"tgrid\"><div class=\"tbox ${curTree.id}\"><div class=\"tcanvas\" style=\"width:${width}px;height:${height}px\">\n          <svg width=\"${width}\" height=\"${height}\" class=\"tsvg\">${lines}<\/svg>${html}<\/div><\/div><\/div>\n        ${det}`;\n    }\n  } else if(modal==='help'){\n    pop.innerHTML=`<h3>Ajuda<\/h3>\n      <div class=\"stitle\">Atalhos<\/div>\n      <div class=\"kgrid\">\n        <div><kbd>Espaço<\/kbd> pausar / continuar<\/div><div><kbd>1<\/kbd> <kbd>2<\/kbd> <kbd>3<\/kbd> velocidade<\/div>\n        <div><kbd>+<\/kbd> passar um turno<\/div><div><kbd>Tab<\/kbd> mostrar / recolher construções<\/div>\n        <div><kbd>Q<\/kbd> cancelar construção<\/div><div><kbd>Esc<\/kbd> fechar tudo<\/div>\n        <div><kbd>Setas<\/kbd> mover a câmera<\/div><div>Roda do mouse: zoom<\/div>\n        <div>Arrastar: mover o mapa<\/div><div>Clique direito: cancelar<\/div>\n      <\/div>\n      <div class=\"stitl
